async function openVehicleReceipt(leadId, leadNo, vehicleSendTo, vehicleNo) {
  activeLeadId = leadId;
  activeLeadNo = leadNo;
  activePlantReceipt = null;
  document.getElementById('plantModalSub').textContent = leadNo + (vehicleNo ? ' • ' + vehicleNo : '');
  ['prReceivedFrom','prDroppingPerson','prRstNo','prRstDate','prWeight','prRemarks'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('prBridgeSlipPhoto').value = '';
  document.getElementById('prVehiclePhoto').value = '';
  document.getElementById('prBridgeSlipExisting').style.display = 'none';
  document.getElementById('prVehiclePhotoExisting').style.display = 'none';
  // Pre-fill Vehicle Dropping Person with whatever was picked as "Vehicle
  // Send to" at Logistics dispatch time (submitLogisticsSend(),
  // JS-Operations.html) — same person/carrier, no need to type it twice.
  // Still freely editable here in case it changed hands in transit.
  if (vehicleSendTo) document.getElementById('prDroppingPerson').value = vehicleSendTo;
  openModal('plantModal');

  // Fix (Ramvir, Sept 2026 — "form edit karte hai to upload option dobara
  // mangta hai, re-upload ka option honi chahiye"): this form is reachable
  // for a lead that ALREADY has a saved rewire_vehicle_receipt row (via the
  // "Fill a Vehicle Not Yet Listed" RST button, regardless of whether rst_no
  // is already filled) but used to always open blank and, on save,
  // unconditionally wrote bridge_slip_photo_url/vehicle_photo_url as
  // whatever uploadFile() returned — null when no new file was picked —
  // silently wiping both previously uploaded photos on every re-save.
  // Fetching and pre-filling the existing row here, and having
  // submitVehicleReceipt() below only overwrite each photo when a NEW file
  // is actually chosen, fixes both: nothing is lost by re-saving, and the
  // text fields aren't blanked out either.
  const { data: existing } = await sb.from('rewire_vehicle_receipt').select('*').eq('lead_id', leadId).maybeSingle();
  if (!existing || activeLeadId !== leadId) return; // modal closed / a different lead opened before this resolved
  activePlantReceipt = existing;
  if (existing.received_from) document.getElementById('prReceivedFrom').value = existing.received_from;
  if (existing.vehicle_dropping_person) document.getElementById('prDroppingPerson').value = existing.vehicle_dropping_person;
  if (existing.rst_no) document.getElementById('prRstNo').value = existing.rst_no;
  if (existing.rst_receipt_date) document.getElementById('prRstDate').value = existing.rst_receipt_date;
  if (existing.weight_kg != null) document.getElementById('prWeight').value = existing.weight_kg;
  if (existing.remarks) document.getElementById('prRemarks').value = existing.remarks;
  if (isRealFileUrl(existing.bridge_slip_photo_url)) document.getElementById('prBridgeSlipExisting').style.display = '';
  if (isRealFileUrl(existing.vehicle_photo_url)) document.getElementById('prVehiclePhotoExisting').style.display = '';
}

async function submitVehicleReceipt() {
  if (!activeLeadId) { notify('No lead selected', { icon: 'error' }); return; }

  let receivedFrom = document.getElementById('prReceivedFrom').value.trim();
  let droppingPerson = document.getElementById('prDroppingPerson').value.trim();
  if (receivedFrom && !isValidMasterValue('location', receivedFrom)) {
    notify('"' + receivedFrom + '" is not in the Location master list. Ask Admin to add it in Settings → Master Data, or pick an existing option.', { icon: 'error', title: 'Invalid Location' });
    return;
  }
  if (receivedFrom) receivedFrom = normalizeMasterValue('location', receivedFrom);
  if (droppingPerson && !isValidMasterValue('vehicle_dropping_person', droppingPerson)) {
    notify('"' + droppingPerson + '" is not in the Vehicle Dropping Person master list. Ask Admin to add it in Settings → Master Data, or pick an existing option.', { icon: 'error', title: 'Invalid Vehicle Dropping Person' });
    return;
  }
  if (droppingPerson) droppingPerson = normalizeMasterValue('vehicle_dropping_person', droppingPerson);

  const folder = getVehicleFolderName();
  const bridgeFile = document.getElementById('prBridgeSlipPhoto');
  const vehicleFile = document.getElementById('prVehiclePhoto');
  const [bridgeUploadUrl, vehicleUploadUrl] = await Promise.all([
    bridgeFile && bridgeFile.files.length ? uploadFile(bridgeFile.files[0], folder, 'Bridge_Slip') : Promise.resolve(null),
    vehicleFile && vehicleFile.files.length ? uploadFile(vehicleFile.files[0], folder, 'Vehicle_Photo') : Promise.resolve(null),
  ]);
  // Only overwrite each photo when a NEW file was actually picked this time
  // — otherwise keep whatever was already saved (see the fix comment in
  // openVehicleReceipt() above).
  const bridgeUrl = bridgeUploadUrl || (activePlantReceipt ? activePlantReceipt.bridge_slip_photo_url : null);
  const vehicleUrl = vehicleUploadUrl || (activePlantReceipt ? activePlantReceipt.vehicle_photo_url : null);

  // Saves independently of the Accessories Check step — see comment in
  // confirmPlantAccessoriesCheck() above.
  const { error } = await sb.from('rewire_vehicle_receipt').upsert({
    lead_id: activeLeadId,
    received_from: receivedFrom || null,
    vehicle_dropping_person: droppingPerson || null,
    rst_no: document.getElementById('prRstNo').value.trim(),
    rst_receipt_date: document.getElementById('prRstDate').value || null,
    weight_kg: document.getElementById('prWeight').value || null,
    bridge_slip_photo_url: bridgeUrl,
    vehicle_photo_url: vehicleUrl,
    remarks: document.getElementById('prRemarks').value.trim(),
    filled_by: currentProfile.id,
    filled_on: new Date().toISOString(),
  }, { onConflict: 'lead_id' });
  if (error) { notify('Error saving receipt: ' + error.message, { icon: 'error' }); return; }
  notify('RST / Vehicle Receipt Details saved.');
  closeModal('plantModal');
  await renderReceivedPlantSection();
}


// ------------------------------------------------------------
// CRANE CHARGES — leads where Crane Status (from Delivery) is
// Yes or Towing. Manager enters the actual amount per vehicle, plus
// From/To Location and Crane Vendor — all three master-backed strict
// searchable fields (see renderMasterSearchField / isValidMasterValue
// in JS-Core.html) so a Manager can't type in a one-off location or
// vendor name that never shows up consistently in reports.
// ------------------------------------------------------------
async function renderCraneChargesSection() {
  initTableFilterBar('crane', renderCraneChargesSection);
  const cf = tableFilterState.crane || {};
  const buildCraneQuery = () => {
    let q = sb.from('rewire_master_data')
      .select(`id, lead_no, customer_name, phone, val_vehicle_type, val_vehicle_number, val_make,
        val_model_variant, ud_vehicle_parking, ud_vehicle_sub_parking, ud_crane_status, crane_charge_amount, crane_from_location,
        crane_to_location, crane_vendor_name, created_at, pn_total_offer_price, ud_total_offer_price, rewire_partners(partner_name),
        pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(name),
        manager:rewire_user_profiles!rewire_master_data_manager_id_fkey(name)`)
      .in('ud_crane_status', ['Yes', 'Towing'])
      .order('created_at', { ascending: false });
    if (cf.pe) q = q.eq('pe_id', cf.pe);
    if (cf.manager) q = q.eq('manager_id', cf.manager);
    if (cf.from) q = q.gte('created_at', istDayStart(cf.from));
    if (cf.to) q = q.lte('created_at', istDayEnd(cf.to));
    return q;
  };
  // Every crane/towing vehicle ever — accumulates indefinitely, paginated
  // defensively.
  const data = await fetchAllRows((from, to) => buildCraneQuery().range(from, to))
    .catch(err => { console.error(err); return []; });

  document.getElementById('countCrane').textContent = (data || []).length + ' vehicles';
  document.getElementById('badgeCrane').textContent = (data || []).filter(l => !l.crane_charge_amount).length;

  const isManager = currentProfile && currentProfile.role === 'Manager';
  const isAdmin = currentProfile && currentProfile.role === 'Admin';
  document.getElementById('tbodyCrane').innerHTML = (data && data.length) ? data.map(l => {
    // Once an amount has been entered, only Admin can change it — Manager
    // gets one shot at filling it in the first time.
    const rowEditable = isAdmin || (isManager && !l.crane_charge_amount);
    return `<tr>
    <td><span class="lid">${l.lead_no}</span></td>
    <td style="font-weight:500;">${l.customer_name}</td>
    <td>${l.phone}</td>
    <td>${l.ud_vehicle_parking || '—'}</td>
    <td>${l.ud_vehicle_sub_parking || '—'}</td>
    <td>${l.val_vehicle_type || '—'}</td>
    <td>${l.val_vehicle_number || '—'}</td>
    <td>${l.val_make || '—'}</td>
    <td>${l.val_model_variant || '—'}</td>
    <td>${l.rewire_partners ? l.rewire_partners.partner_name : '—'}</td>
    <td>${l.pe ? l.pe.name : '—'}</td>
    <td>${l.manager ? l.manager.name : '—'}</td>
    <td>${(l.ud_total_offer_price || l.pn_total_offer_price) ? '₹' + (l.ud_total_offer_price || l.pn_total_offer_price) : '—'}</td>
    <td>${l.ud_vehicle_parking || '—'}</td>
    <td><span class="badge ${l.ud_crane_status === 'Towing' ? 'badge-na' : 'badge-l'}">${l.ud_crane_status}</span></td>
    <td>${rowEditable
      ? `<input type="number" min="0" onwheel="this.blur()" value="${l.crane_charge_amount || ''}" id="craneAmt_${l.id}" placeholder="Enter amount" style="width:110px;border:0.5px solid var(--color-border-secondary);border-radius:5px;padding:4px 7px;font-size:12px;" />`
      : (l.crane_charge_amount ? '₹' + l.crane_charge_amount + ' <span class="sub">(locked)</span>' : '<span class="sub">Not entered</span>')}</td>
    <td>${rowEditable
      ? renderMasterSearchField('craneFrom_' + l.id, 'location', l.crane_from_location, 'Search…', '120px')
      : (l.crane_from_location || '—')}</td>
    <td>${rowEditable
      ? renderMasterSearchField('craneTo_' + l.id, 'location', l.crane_to_location, 'Search…', '120px')
      : (l.crane_to_location || '—')}</td>
    <td>${rowEditable
      ? renderMasterSearchField('craneVendor_' + l.id, 'crane_vendor', l.crane_vendor_name, 'Search…', '130px')
      : (l.crane_vendor_name || '—')}</td>
    <td>${l.created_at ? new Date(l.created_at).toLocaleDateString() : '—'}</td>
    <td>${rowEditable ? `<button class="ab ab-form" onclick="saveCraneCharge('${l.id}')"><i class="ti ti-device-floppy" style="font-size:11px;" aria-hidden="true"></i> Save</button>` : '—'}</td>
  </tr>`;
  }).join('') : '<tr><td colspan="21" style="text-align:center;color:var(--color-text-tertiary);padding:24px;">No vehicles with Crane/Towing charges yet.</td></tr>';
}

async function saveCraneCharge(leadId) {
  const amount = document.getElementById('craneAmt_' + leadId).value;
  if (!amount) { notify('Enter an amount first.', { icon: 'error' }); return; }
  let fromLoc = document.getElementById('craneFrom_' + leadId).value.trim() || null;
  let toLoc = document.getElementById('craneTo_' + leadId).value.trim() || null;
  let vendorName = document.getElementById('craneVendor_' + leadId).value.trim() || null;
  if (fromLoc && !isValidMasterValue('location', fromLoc)) { notify('"' + fromLoc + '" is not in the Location master list. Ask Admin to add it first.', { icon: 'error' }); return; }
  if (toLoc && !isValidMasterValue('location', toLoc)) { notify('"' + toLoc + '" is not in the Location master list. Ask Admin to add it first.', { icon: 'error' }); return; }
  if (vendorName && !isValidMasterValue('crane_vendor', vendorName)) { notify('"' + vendorName + '" is not a registered Crane Vendor. Use "Add Crane Vendor" first.', { icon: 'error' }); return; }
  if (fromLoc) fromLoc = normalizeMasterValue('location', fromLoc);
  if (toLoc) toLoc = normalizeMasterValue('location', toLoc);
  if (vendorName) vendorName = normalizeMasterValue('crane_vendor', vendorName);
  const { error } = await sb.from('rewire_master_data').update({
    crane_charge_amount: amount, crane_charge_filled_by: currentProfile.id, crane_charge_filled_on: new Date().toISOString(),
    crane_from_location: fromLoc, crane_to_location: toLoc, crane_vendor_name: vendorName,
  }).eq('id', leadId);
  if (error) { notify('Error saving amount: ' + error.message, { icon: 'error' }); return; }
  notify('Crane charge saved.');
  await renderCraneChargesSection();
}

// Guard against the DOMContentLoaded event having already fired by the
// time this (last) inline script executes — a real risk in Apps
// Script's IFRAME_SANDBOX delivery, where the whole page arrives via a
// document.write() call rather than a normal streamed page load. If we
// only ever add the listener, a late registration means it silently
// never fires and initAuth() (and therefore the entire app) never starts.
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initAuth);
} else {
  initAuth();
}

// Table sort/pagination/search wiring runs independently of initAuth() —
// it only needs the static table skeletons already in Sections.html, not
// a signed-in session or any data having loaded. Kept separate on purpose:
// initAuth() is a long chain of awaited calls with nothing catching
// errors, so if any one of them throws, everything after it (including a
// call placed at the end of initAuth) would silently never run. This
// can't be skipped that way.
if (typeof wireTableEnhancements === 'function') {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', wireTableEnhancements);
  } else {
    wireTableEnhancements();
  }
}


// ------------------------------------------------------------
// Vehicle Disposal: search in ANY sub-tab jumps to the sub-tab that really holds the vehicle (Ramvir, Oct 2026).
// If the current tab has no match, look the vehicle up in the DB, switch to its tab and re-run the search there.
// ------------------------------------------------------------
const DISPOSAL_TAB_SECTIONS = ['vehicle-disposal', 'vehicle-disposal-allocated', 'vehicle-disposal-reserved', 'vehicle-disposal-scrapped'];
let _disposalXTimer = null, _disposalXBusy = false;
document.addEventListener('input', ev => {
  const inp = ev.target;
  if (!inp || inp.tagName !== 'INPUT' || !inp.closest || inp.dataset.disposalXsearch === 'skip') return;
  const sec = inp.closest('[id^="section-vehicle-disposal"]');
  if (!sec || !/^Search/i.test(inp.placeholder || '') || (inp.type && inp.type !== 'text' && inp.type !== 'search')) return;
  clearTimeout(_disposalXTimer);
  _disposalXTimer = setTimeout(() => disposalCrossTabSearch(sec, inp.value), 700);
});
async function disposalCrossTabSearch(sec, raw) {
  const term = (raw || '').trim().replace(/[%,()]/g, '');
  if (term.length < 3 || _disposalXBusy) return;
  const rows = Array.from(sec.querySelectorAll('tbody tr')).filter(r => !r.querySelector('td[colspan]'));
  if (rows.some(r => r.dataset.twFiltered !== '1' && r.dataset.twColFiltered !== '1')) return;   // current tab already has a match
  _disposalXBusy = true;
  try {
    const { data, error } = await sb.from('rewire_master_data')
      .select('lead_no, val_vehicle_number, ud_vehicle_parking, scrap_allocated_contractor_id, overall_status')
      .or(`val_vehicle_number.ilike.%${term}%,lead_no.ilike.%${term}%,customer_name.ilike.%${term}%`).limit(5);
    if (error || !data || !data.length) return;
    const l = data[0];
    const park = l.ud_vehicle_parking || '';
    let target = null;
    if (park === 'Reserved') target = 'vehicle-disposal-reserved';
    else if (park === 'Scrapped' || park === 'Scrapped - Provisionally') target = 'vehicle-disposal-scrapped';
    else if (l.scrap_allocated_contractor_id) target = 'vehicle-disposal-allocated';
    else if (park === 'Jaipur Plant' && l.overall_status !== 'Closed Lost') target = 'vehicle-disposal';
    if (!target) { notify((l.val_vehicle_number || l.lead_no) + ' is not in Vehicle Disposal (location: ' + (park || 'not set') + ').', { icon: 'info' }); return; }
    if (target === sec.id.replace('section-', '')) return;
    showSection(target);
    // wait for the target tab to render its rows, then type the term into ITS search box
    for (let i = 0; i < 25; i++) {
      await new Promise(r => setTimeout(r, 250));
      const ts = document.getElementById('section-' + target);
      const tb = ts && ts.querySelector('tbody');
      if (tb && tb.querySelector('tr') && !tb.querySelector('td[colspan]')) {
        const box = ts.querySelector('input[placeholder^="Search"]');
        if (box) { box.dataset.disposalXsearch = 'skip'; box.value = raw; box.dispatchEvent(new Event('input', { bubbles: true })); setTimeout(() => { delete box.dataset.disposalXsearch; }, 50); }
        break;
      }
    }
  } finally { _disposalXBusy = false; }
}
