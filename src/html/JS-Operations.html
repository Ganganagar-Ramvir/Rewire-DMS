    o => (o.lead && o.lead.pe) ? o.lead.pe.id : null,
    o => (o.lead && o.lead.manager) ? o.lead.manager.id : null,
    o => o.created_at ? o.created_at.slice(0, 10) : null);

  document.getElementById('badgeOminiPay').textContent = (data || []).length;
  document.getElementById('tbodyOminiPay').innerHTML = (filteredOp && filteredOp.length) ? filteredOp.map(o => `<tr>
    <td>${o.lead ? `<span class="lid" style="cursor:pointer;text-decoration:underline;" onclick="viewLeadDetails('${o.lead.id}')">${o.lead.lead_no}</span>` : '—'}</td>
    <td style="font-weight:500;">${o.lead ? o.lead.customer_name : '—'}</td>
    <td>${o.lead ? o.lead.phone : '—'}</td>
    <td>${o.lead ? o.lead.ud_vehicle_parking || '—' : '—'}</td>
    <td>${o.lead ? o.lead.ud_vehicle_sub_parking || '—' : '—'}</td>
    <td>${o.lead ? o.lead.val_vehicle_type || '—' : '—'}</td>
    <td>${o.lead ? o.lead.val_vehicle_number || '—' : '—'}</td>
    <td>${o.lead ? o.lead.val_make || '—' : '—'}</td>
    <td>${o.lead ? o.lead.val_model_variant || '—' : '—'}</td>
    <td>${o.lead && o.lead.rewire_partners ? o.lead.rewire_partners.partner_name : '—'}</td>
    <td>${o.lead && o.lead.pe ? o.lead.pe.name : '—'}</td>
    <td>${o.lead && o.lead.manager ? o.lead.manager.name : '—'}</td>
    <td>${o.lead ? o.lead.pn_payment_type || '—' : '—'}</td>
    <td>${o.lead && (o.lead.ud_total_offer_price || o.lead.pn_total_offer_price) ? '₹' + (o.lead.ud_total_offer_price || o.lead.pn_total_offer_price) : '—'}</td>
    <td><span class="badge badge-na">${o.status}</span></td>
    <td>${o.created_at ? new Date(o.created_at).toLocaleDateString() : '—'}</td>
    <td><button class="ab ab-form" style="background:#7c3aed;color:#fff;" onclick="openOminiPay('${o.id}','${o.lead_id}','${o.lead ? o.lead.lead_no : ''}')"><i class="ti ti-credit-card" style="font-size:11px;" aria-hidden="true"></i> Pay</button></td>

let activeOminiPayId = null;
function openOminiPay(opId, leadId, leadNo) {
  activeOminiPayId = opId;
  activeLeadId = leadId;
  document.getElementById('ominiPayModalSub').textContent = leadNo;
  // Whoever is actually processing this payment picks their own name here —
  // it doesn't have to be the logged-in user (e.g. one person shares a
  // login, or is entering a payment a colleague physically made). Only
  // Manager/Head/Admin/Accounts actually process Omini Pay (PE and Back
  // Office never touch this screen — PE has no ominipay access at all, and
  // Back Office's role was moved off it), so the list is limited to those,
  // not every active user.
  const OMINI_PAY_PAYER_ROLES = ['Manager', 'Head', 'Admin', 'Accounts'];
  const opByNameSel = document.getElementById('opByName');
  const payerOptions = allActiveUsers.filter(u => OMINI_PAY_PAYER_ROLES.includes(u.role));
  opByNameSel.innerHTML = '<option value="">Select who is paying</option>' +
    payerOptions.map(u => `<option value="${u.name}">${u.name}${currentProfile && u.id === currentProfile.id ? ' (You)' : ''}</option>`).join('');
  opByNameSel.value = currentProfile && OMINI_PAY_PAYER_ROLES.includes(currentProfile.role) ? currentProfile.name : '';
  document.getElementById('opTxnId').value = '';
  document.getElementById('opReferenceId').value = '';
  document.getElementById('opAmountPaid').value = '';
  openModal('ominiPayModal');
}

async function submitOminiPay() {
  const byName = document.getElementById('opByName').value.trim();
  const txnId = document.getElementById('opTxnId').value.trim();
  const refId = document.getElementById('opReferenceId').value.trim();
  const amount = document.getElementById('opAmountPaid').value;
  if (!byName || !txnId || !refId || !amount) { notify('Please fill all fields', { icon: 'error', title: 'Missing fields' }); return; }

  const { error } = await sb.from('rewire_omini_pay').update({
    omni_payments_by_name: byName,
    txn_id: txnId, reference_id: refId, amount_paid: amount,
    status: 'Paid', paid_by: currentProfile.id, paid_on: new Date().toISOString(),
  }).eq('id', activeOminiPayId);
  if (error) { notify('Error saving payment: ' + error.message, { icon: 'error' }); return; }

  notify('Omini Pay completed and moved to Archive.');
  closeModal('ominiPayModal');
  await renderOminiPaySection();
}

// ------------------------------------------------------------
// ACCESSORIES CHECK — Back Office cross-checks Valuation vs Delivery
// condition fields before Head Approval can proceed
// ------------------------------------------------------------
async function renderAccessoriesSection(page = 0) {
  initTableFilterBar('accessories', () => renderAccessoriesSection(page));
  const af = tableFilterState.accessories || {};
  const buildAccessoriesQuery = () => {
    let q = sb.from('rewire_master_data')
      .select(`id, lead_no, customer_name, phone, ud_vehicle_parking, ud_vehicle_sub_parking, val_vehicle_type, val_vehicle_number, val_make,
        val_model_variant, ma_status, pn_payment_type, accessories_check_status, created_at, rewire_partners(partner_name),
        pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(name),
        manager:rewire_user_profiles!rewire_master_data_manager_id_fkey(name)`)
      // Post Delivery + Advance Payment/Omini Pay all go through Manager
      // Approval before Accessories Check ever becomes relevant — keep
      // requiring ma_status='Approved' for those. Instant Payments SKIPS
      // Manager Approval entirely (ma_status never gets set), so requiring
      // it here would permanently hide every Instant Payments lead from
      // this tab — excluded from the ma_status check instead.
      .or('ma_status.eq.Approved,pn_payment_type.eq.Instant Payments')
      // Comparing Valuation vs Delivery condition here only makes sense once
      // the Delivery form has actually been filled — before that, every
      // Delivery-side value is genuinely empty, so the comparison shows a
      // false "Mismatch" on every single item. ud_status = 'Complete' alone
      // isn't enough to trust, though — the historical bulk import set that
      // flag on a lot of leads without any real Delivery data behind it (same
      // root cause as several other batches this session). ud_filled_on is
      // only ever set by the actual Upload Delivery submit in the app, never
      // by that import, so requiring it too is what actually proves this
      // lead's Delivery form was genuinely filled.
      .eq('ud_status', 'Complete')
      .not('ud_filled_on', 'is', null)
      // accessories_check_status is only ever written once (submitAccessoriesCheck
      // sets it to 'Confirmed') — a lead that's never been through this
      // step has it NULL, not 'Pending'. A plain .neq(...,'Confirmed')
      // never matches a NULL column in Postgres (same NULL-exclusion bug
      // class already fixed for payment_release_status elsewhere), so
      // paired with .is.null to actually catch every not-yet-confirmed lead.
      .or('accessories_check_status.neq.Confirmed,accessories_check_status.is.null')
      .order('created_at', { ascending: false });
    if (af.pe) q = q.eq('pe_id', af.pe);
    if (af.manager) q = q.eq('manager_id', af.manager);
    if (af.from) q = q.gte('created_at', istDayStart(af.from));
    if (af.to) q = q.lte('created_at', istDayEnd(af.to));
    return q;
  };
  // Paginated — the previous version requested {count:'exact'} but never
  // actually applied .range() or used the count, so it silently capped at
  // 1000 with no error and no visible sign anything was missing.
  const data = await fetchAllRows((from, to) => buildAccessoriesQuery().range(from, to))
    .catch(err => { console.error(err); return []; });
  document.getElementById('countAccessories').textContent = (data || []).length + ' pending';
  document.getElementById('badgeAccessories').textContent = (data || []).length;
  document.getElementById('tbodyAccessories').innerHTML = (data && data.length) ? data.map(l => `<tr>
    <td><span class="lid">${l.lead_no}</span></td>
    <td style="font-weight:500;">${l.customer_name}</td>
    <td>${l.phone}</td>
    <td>${l.ud_vehicle_parking || '—'}</td>
    <td>${l.ud_vehicle_sub_parking || '—'}</td>
    <td>${l.val_vehicle_type || '—'}</td>
    <td>${l.val_vehicle_number || '—'}</td>
    <td>${l.val_make || '—'}</td>
    <td>${l.val_model_variant || '—'}</td>
    <td>${l.rewire_partners ? l.rewire_partners.partner_name : '—'}</td>
    <td>${l.pe ? l.pe.name : '—'}</td>
    <td><span class="badge badge-q">${l.ma_status}</span></td>
    <td>${l.created_at ? new Date(l.created_at).toLocaleDateString() : '—'}</td>
    <td><button class="ab ab-form" style="background:#d97706;color:#fff;" onclick="openAccessoriesCheck('${l.id}','${l.lead_no}')"><i class="ti ti-list-check" style="font-size:11px;" aria-hidden="true"></i> Review</button></td>
  </tr>`).join('') : '<tr><td colspan="14" style="text-align:center;color:var(--color-text-tertiary);padding:24px;">No leads pending Accessories Check.</td></tr>';
}

// deduction here — that decision still belongs to Head Approval; this step

// (see haModal's display of accessories_manager_remarks, JS-Wiring.html).
// A Manager only sees their OWN team's leads here (manager_id filter) —

  const arf = tableFilterState.accreview || {};
  const buildQuery = () => {
    let q = sb.from('rewire_master_data')
      .select(`id, lead_no, customer_name, phone, val_vehicle_type, val_vehicle_number, val_make, val_model_variant,
        accessories_deduction_amount, accessories_deduction_reason, accessories_check_on, created_at,
        pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(name),

      .eq('accessories_manager_review_status', 'Pending')
      .order('accessories_check_on', { ascending: true });

    if (arf.from) q = q.gte('accessories_check_on', istDayStart(arf.from));
    if (arf.to) q = q.lte('accessories_check_on', istDayEnd(arf.to));
    return q;
  };
  const data = await fetchAllRows((from, to) => buildQuery().range(from, to))

  const badge = document.getElementById('badgeAccReview'); if (badge) badge.textContent = (data || []).length;
  document.getElementById('tbodyAccReview').innerHTML = (data && data.length) ? data.map(l => `<tr>
    <td><span class="lid">${l.lead_no}</span></td>
    <td style="font-weight:500;">${l.customer_name}</td>
    <td>${l.val_vehicle_number || '—'}</td>
    <td>${l.val_make || '—'} ${l.val_model_variant || ''}</td>
    <td>${l.pe ? l.pe.name : '—'}</td>
    <td style="font-weight:700;color:#dc2626;">₹${(l.accessories_deduction_amount || 0).toLocaleString('en-IN')}</td>
    <td>${l.accessories_deduction_reason || '—'}</td>
    <td>${l.accessories_check_on ? new Date(l.accessories_check_on).toLocaleDateString() : '—'}</td>
    <td><button class="ab ab-form" style="background:#d97706;color:#fff;" onclick="openAccessoriesReview('${l.id}','${l.lead_no}')"><i class="ti ti-message-2" style="font-size:11px;" aria-hidden="true"></i> Review</button></td>
  </tr>`).join('') : '<tr><td colspan="9" style="text-align:center;color:var(--color-text-tertiary);padding:24px;">No leads pending your review.</td></tr>';
}

async function openAccessoriesReview(leadId, leadNo) {
  activeLeadId = leadId;
  document.getElementById('accReviewModalSub').textContent = leadNo;
  const { data: lead, error } = await sb.from('rewire_master_data').select('*').eq('id', leadId).single();
  if (error || !lead) { notify('Could not load lead details.', { icon: 'error' }); return; }
  document.getElementById('accReviewModalSub').textContent = leadNo + (lead.val_vehicle_number ? ' · ' + lead.val_vehicle_number : '');

  // Same Valuation-vs-Delivery comparison Accessories Check itself showed,
  // so the Manager doesn't have to go dig up that screen separately to see
  // WHY a shortage/excess was flagged.
  const rows = computeAccessoryComparisons(lead).filter(r => r.kind !== 'match');
  document.getElementById('accReviewCompareBody').innerHTML = rows.length ? rows.map(({ label, valVal, udVal, kind }) => `<tr>
    <td style="font-weight:500;">${label}</td>
    <td>${valVal || '—'}</td>
    <td style="color:#dc2626;font-weight:700;">${udVal || '—'}</td>
    <td>${accessoryKindBadge(kind)}</td>
  </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--color-text-tertiary);padding:12px;">No mismatches recorded.</td></tr>';

  document.getElementById('accReviewDeductionAmount').value = lead.accessories_deduction_amount ? '₹' + lead.accessories_deduction_amount.toLocaleString('en-IN') : '—';
  document.getElementById('accReviewDeductionReason').value = lead.accessories_deduction_reason || '—';
  document.getElementById('accReviewRemarks').value = lead.accessories_manager_remarks || '';
  openModal('accReviewModal');
}

async function submitAccessoriesReview() {
  if (!activeLeadId) { notify('No lead selected', { icon: 'error' }); return; }
  const remarks = document.getElementById('accReviewRemarks').value.trim();
  if (!remarks) { notify('Please add a remark before sending to Head Approval.', { icon: 'error', title: 'Missing field' }); return; }

  const { error } = await sb.from('rewire_master_data').update({
    accessories_manager_review_status: 'Reviewed',
    accessories_manager_remarks: remarks,
    accessories_manager_reviewed_by: currentProfile.id,
    accessories_manager_reviewed_on: new Date().toISOString(),
    last_updated_by: currentProfile.id,
  }).eq('id', activeLeadId);
  if (error) { notify('Error saving review: ' + error.message, { icon: 'error' }); return; }

  notify('Sent to Head Approval with your remarks.');
  closeModal('accReviewModal');
  await renderAccessoriesReviewSection();
  await refreshLeadsTable();
}

// uploadFileToDrive() (Code.gs) stores files as normal Google Drive share
// links, e.g. https://drive.google.com/file/d/FILE_ID/view?usp=drivesdk —
// that's an HTML viewer page, not a raw image, so it can never render
// inside an <img> tag directly. This pulls the file ID out of that link
// and points at Drive's public thumbnail endpoint instead, which *does*
// serve actual image bytes for anyone-with-the-link files (exactly the
// sharing mode uploadFileToDrive sets). Non-Drive URLs pass through
// unchanged. No Supabase/schema change involved — this is purely a
// client-side URL conversion.
// Shared truthy check for every "does this lead actually have a file
// uploaded" decision in the app (Purchased's Aadhar/PAN/GST/Cheque/RC/
// Delivery/Form-2A/Authorization-Letter "View" links, Lead Details modal's
// document rows, Partner cheque photo, Accessories Check photos, etc.).
// A plain `url ? ... : '—'` check already covers null/undefined/empty
// string correctly, but old/imported data sometimes has the URL column
// filled with junk placeholder text instead of actually being empty
// (whitespace, "NA", "N/A", "-", "null") — which is truthy and would
// otherwise still show a "View" link for a document that was never really
// uploaded. This treats all of those the same as "no file".
function isRealFileUrl(url) {
  if (!url) return false;
  const v = String(url).trim().toLowerCase();
  if (!v) return false;
  return !['na', 'n/a', '-', '--', 'null', 'undefined', 'none'].includes(v);
}

function driveThumbUrl(url, size) {
  if (!url) return url;
  // NOTE: deliberately avoids a regex literal containing an escaped
  // slash character before "d" — Apps Script's IFRAME_SANDBOX bundling
  // has been observed to mangle that exact character sequence when it
  // packages the page as a JS string for the client, silently corrupting
  // everything after it in this file. indexOf()-based parsing sidesteps
  // the issue entirely.
  let id = null;
  const dIdx = url.indexOf('/d/');
  if (dIdx !== -1) {
    const rest = url.slice(dIdx + 3);
    const idMatch = rest.match(/^[a-zA-Z0-9_-]+/);
    id = idMatch ? idMatch[0] : null;
  }
  if (!id) {
    const idParamMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    id = idParamMatch ? idParamMatch[1] : null;
  }
  if (!id) return url;
  var base = 'https:' + '/' + '/drive.google.com/thumbnail';
  return base + '?id=' + id + '&sz=w' + (size || 200);
}

// If even the thumbnail endpoint can't load (private file, offline, etc.)
// swap the broken <img> for a plain "View Photo" link to the original
// Drive URL instead of leaving a broken-image icon on screen.
function photoImgFallback(imgEl, url) {
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  a.textContent = 'View Photo';
  a.className = 'sub';
  a.style.fontSize = '11px';
  a.onclick = (e) => e.stopPropagation(); // don't also trigger the parent card's onclick
  imgEl.replaceWith(a);
}

// Same id-extraction as driveThumbUrl() (see its comment on why this is
// indexOf()-based rather than a regex with an escaped slash) — turns a
// normal Drive "view" link into the uc?export=download endpoint, which
// actually triggers a save/download instead of just opening the viewer
// page again.
function driveDownloadUrl(url) {
  if (!url) return url;
  let id = null;
  const dIdx = url.indexOf('/d/');
  if (dIdx !== -1) {
    const rest = url.slice(dIdx + 3);
    const idMatch = rest.match(/^[a-zA-Z0-9_-]+/);
    id = idMatch ? idMatch[0] : null;
  }
  if (!id) {
    const idParamMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    id = idParamMatch ? idParamMatch[1] : null;
  }
  if (!id) return url;
  var base = 'https:' + '/' + '/drive.google.com/uc';
  return base + '?export=download&id=' + id;
}

// Opens a larger view of a delivery photo/document — used everywhere a
// "View" link on a photo/document appears (per-item Photo columns, the
// Documents grid, View Lead's rowLink(), Accounts' Cancelled Cheque links,
// etc.) so every one of those gets this same in-app popup instead of
// however many were previously just `<a target="_blank">` straight to the
// Drive link (Transporter Bill and the Documents Management RC link were
// the two found still doing that — fixed to call this instead). Preloads
// the big thumbnail first; if that fails, just opens the original Drive
// link in a new tab instead of showing a broken-image popup. Always
// includes a real Download link/button — the popup wasn't offering one
// before, only "view".
function viewAccessoryPhoto(url, label) {
  if (!isRealFileUrl(url)) return;
  const big = driveThumbUrl(url, 1200);
  const downloadUrl = driveDownloadUrl(url);
  const footerHtml = `<a href="${downloadUrl}" target="_blank" rel="noopener" style="color:#1d4ed8;text-decoration:underline;font-weight:600;"><i class="ti ti-download" aria-hidden="true"></i> Download</a>`;
  const preload = new Image();
  preload.onload = () => Swal.fire({ imageUrl: big, imageAlt: label, title: label, footer: footerHtml, showConfirmButton: false, showCloseButton: true, width: 'auto' });
  preload.onerror = () => Swal.fire({
    icon: 'error', title: label, text: "Couldn't load a preview of this file.",
    footer: footerHtml, showConfirmButton: false, showCloseButton: true,
  });
  preload.src = big;
}

// Live-sums the four "Deduct (₹)" inputs into the read-only Total
// Deduction field, so Back Office always sees the running total.
function calcAccessoriesDeductionTotal() {
  const ids = ['accDeduct_pnCustomer', 'accDeduct_pnBroker', 'accDeduct_pnCod', 'accDeduct_pnCash'];
  const total = ids.reduce((sum, id) => {
    const el = document.getElementById(id);
    return sum + (el ? (parseFloat(el.value) || 0) : 0);
  }, 0);
  document.getElementById('accessoriesDeductionAmount').value = total || '';
}

// Shared by the Accessories Check modal AND the Head Approval summary
// (JS-Wiring.html) so both read the exact same comparison logic instead
// of two copies drifting apart. Returns one row per checklist item with
// a resolved `kind`:
//   'shortage' — Valuation said the vehicle HAD it, Delivery says it
//                doesn't (customer received less than what was valued).
//   'excess'   — the reverse: Delivery has it but Valuation never
//                recorded it.
//   'match'    — both sides agree.
// Alloy Wheel (Yes/No at Valuation vs an exact 0–5 count at Delivery) and
// Cylinder Type (Valuation only ever records Fuel Type, not a cylinder
// presence flag — CNG at Valuation is treated as "expected a cylinder";
// CNG/LPG at Delivery is treated as "has one") both need a derived
// has-it boolean instead of a raw string compare.
function computeAccessoryComparisons(lead) {
  const items = [
    ['Spare Wheel', lead.val_spare_wheel, lead.ud_spare_wheel, lead.ud_spare_wheel_photo_url],
    ['Stereo', lead.val_stereo, lead.ud_stereo, lead.ud_stereo_photo_url],
    ['Speakers', lead.val_speakers, lead.ud_speakers, lead.ud_speakers_photo_url],
    ['Tool Kit', lead.val_tool_kit, lead.ud_tool_kit, lead.ud_tool_kit_photo_url],
    ['Battery', lead.val_battery, lead.ud_battery, lead.ud_battery_photo_url],
    ['Alloy Wheel', lead.val_alloy_wheel, lead.ud_alloy_wheel, lead.ud_alloy_wheel_photo_url],
    ['Cylinder Type', lead.val_fuel_type, lead.ud_cylinder_type, lead.ud_cylinder_photo_url],
    ['Vehicle Operational', lead.val_vehicle_operational, lead.ud_vehicle_operational, null],
    ['Vehicle Accidental', lead.val_vehicle_accidental, lead.ud_vehicle_accidental, null],
  ];
  return items.map(([label, valVal, udVal, photoUrl]) => {
    let valHas, udHas;
    if (label === 'Alloy Wheel') {
      const udCount = parseInt(udVal, 10);
      valHas = valVal === 'Yes';
      udHas = !isNaN(udCount) && udCount > 0;
    } else if (label === 'Speakers') {
      // Both Valuation and Delivery capture this as a count (0/2/4/6/8/10),
      // not Yes/No — "has speakers" means a non-zero count on each side.
      const valCount = parseInt(valVal, 10);
      const udCount = parseInt(udVal, 10);
      valHas = !isNaN(valCount) && valCount > 0;
      udHas = !isNaN(udCount) && udCount > 0;
    } else if (label === 'Cylinder Type') {
      valHas = valVal === 'CNG';
      udHas = udVal === 'CNG' || udVal === 'LPG';
    } else if (label === 'Vehicle Accidental') {
      // Inverted vs every other item here (Ramvir, Sept 2026): for a real
      // possession like Spare Wheel, "Yes" is the good/expected state, so
      // Yes-at-Valuation-but-No-at-Delivery ("lost it") is correctly a
      // Shortage. Accidental is the opposite — "Yes" is the BAD state. If
      // Valuation said No (not accidental) but Delivery says Yes (became
      // accidental in between — often just a PE mistake at Valuation
      // caught later), that's the vehicle losing value, exactly what
      // Shortage means for this workflow (it should be deduction-eligible
      // below), not "Excess". So valHas/udHas here track "not accidental"
      // (the good condition) instead of a literal Yes match.
      valHas = valVal === 'No';
      udHas = udVal === 'No';
    } else {
      valHas = valVal === 'Yes';
      udHas = udVal === 'Yes';
    }
    let kind = 'match';
    if (valHas && !udHas) kind = 'shortage';
    else if (!valHas && udHas) kind = 'excess';
    return { label, valVal, udVal, photoUrl, valHas, udHas, kind };
  });
}

// Badge markup for a comparison row's kind — Shortage in red, Excess in
// green (an unexpected extra item is a good thing, not a problem), Match
// unchanged from before.
function accessoryKindBadge(kind) {
  if (kind === 'shortage') return '<span class="badge" style="background:#fee2e2;color:#dc2626;">Shortage</span>';
  if (kind === 'excess') return '<span class="badge" style="background:#dcfce7;color:#16a34a;">Excess</span>';
  return '<span class="badge badge-q">Match</span>';
}

async function openAccessoriesCheck(leadId, leadNo) {
  activeLeadId = leadId;
  document.getElementById('accessoriesModalSub').textContent = leadNo;
  const { data: lead, error } = await sb.from('rewire_master_data').select('*').eq('id', leadId).single();
  if (error || !lead) { notify('Could not load lead details.', { icon: 'error' }); return; }
  // Vehicle No. shown alongside Lead No. (Ramvir, Sept 2026) — every
  // pipeline popup should make it obvious which vehicle this is, not just
  // which lead.
  document.getElementById('accessoriesModalSub').textContent = leadNo + (lead.val_vehicle_number ? ' · ' + lead.val_vehicle_number : '');
  if (lead.ud_status !== 'Complete' || !lead.ud_filled_on) {
    notify('Upload Delivery form is not filled for this lead yet — Accessories Check cannot be reviewed until Delivery is complete.', { icon: 'error', title: 'Delivery pending' });
    return;
  }

  const rows = computeAccessoryComparisons(lead);
  document.getElementById('accessoriesCompareBody').innerHTML = rows.map(({ label, valVal, udVal, photoUrl, kind }) => {
    const mismatch = kind !== 'match';
    const photoCell = isRealFileUrl(photoUrl)
      ? `<img src="${driveThumbUrl(photoUrl, 120)}" alt="${label}" title="Click to enlarge" style="width:44px;height:44px;object-fit:cover;border-radius:6px;cursor:pointer;border:0.5px solid var(--color-border-tertiary);" onclick="viewAccessoryPhoto('${photoUrl}','${label} — Delivery Photo')" onerror="photoImgFallback(this,'${photoUrl}')" />`
      : '<span class="sub">—</span>';
    return `<tr ${mismatch ? 'style="background:#fef2f2;"' : ''}>
      <td style="font-weight:500;">${label}</td>
      <td>${valVal || '—'}</td>
      <td style="${mismatch ? 'color:#dc2626;font-weight:700;' : ''}">${udVal || '—'}</td>
      <td>${photoCell}</td>
      <td>${accessoryKindBadge(kind)}</td>
    </tr>`;
  }).join('');

  const docs = [
    ['Inventory Slip', lead.ud_inventory_slip_url],
    ['Delivery Photo', lead.ud_delivery_photo_url],
  ].filter(([, url]) => isRealFileUrl(url));
  document.getElementById('accessoriesPhotosGrid').innerHTML = docs.length ? docs.map(([label, url]) => `
    <div style="border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:8px;text-align:center;cursor:pointer;" onclick="viewAccessoryPhoto('${url}','${label}')" title="Click to enlarge">
      <img src="${driveThumbUrl(url, 300)}" alt="${label}" style="width:100%;height:90px;object-fit:cover;border-radius:6px;" onerror="photoImgFallback(this,'${url}')" />
      <div style="font-size:11px;color:var(--color-text-secondary);margin-top:6px;">${label}</div>
    </div>`).join('') : '<div style="color:var(--color-text-tertiary);font-size:12px;grid-column:1/-1;">No documents uploaded at Delivery.</div>';

  // Price Negotiation payment split, each with its own editable "Deduct"
  // amount so Back Office can pick exactly which bucket (customer/broker/
  // COD/cash) an accessory shortfall gets recovered from.
  const pnSplit = [
    ['Customer Payment', 'pnCustomer', lead.pn_customer_payment],
    ['Broker Payment', 'pnBroker', lead.pn_broker_payment],
    ['COD Payment', 'pnCod', lead.pn_cod_payment],
    ['Cash Commission', 'pnCash', lead.pn_cash_commission],
  ];
  // Transporter Freight bucket (Ramvir, Oct 2026) — only shown when this
  // vehicle actually came in via a transporter (logistics_transporter_name
  // set). A shortage on a transporter-delivered vehicle is recovered from
  // the Transporter's freight payable, not from customer/broker/COD/cash —
  // separate Debit Register tab reads accessories_deduct_transporter.
  if (lead.logistics_transporter_name) {
    pnSplit.push([`Transporter Freight (${lead.logistics_transporter_name})`, 'pnTransporter', lead.logistics_freight_amount]);
  }
  document.getElementById('accessoriesPnSplitBody').innerHTML = pnSplit.map(([label, key, orig]) => `
    <tr>
      <td style="font-weight:500;">${label}</td>
      <td>${orig ? '₹' + orig : '—'}</td>
      <td><input type="number" id="accDeduct_${key}" min="0" onwheel="this.blur()" placeholder="0" style="width:110px;border:0.5px solid var(--color-border-secondary);border-radius:5px;padding:4px 7px;font-size:12px;" oninput="calcAccessoriesDeductionTotal()" /></td>
    </tr>`).join('');

  // Accessories Check always runs after Upload Delivery, so ud_total_offer_price
  // (the Delivery-time, final price) is the correct "Deal Total" to deduct
  // against here -- pn_total_offer_price is only a fallback for the rare
  // case Delivery hasn't actually saved a total yet.
  document.getElementById('accessoriesDealTotalAmount').value = (lead.ud_total_offer_price || lead.pn_total_offer_price) ? '₹' + (lead.ud_total_offer_price || lead.pn_total_offer_price) : '—';
  document.getElementById('accessoriesDeductionAmount').value = lead.accessories_deduction_amount || '';
  document.getElementById('accessoriesDeductionReason').value = lead.accessories_deduction_reason || '';
  document.getElementById('accessoriesRemarks').value = '';
  openModal('accessoriesModal');
}

async function submitAccessoriesCheck() {
  if (!activeLeadId) { notify('No lead selected', { icon: 'error' }); return; }

  // Roll the four per-bucket deduction inputs into one total + a reason
  // string that spells out exactly which bucket(s) were reduced — this is
  // what makes it traceable later that a deduction happened because of
  // Accessories Check, and from where.
  const buckets = [
    ['Customer Payment', 'accDeduct_pnCustomer'],
    ['Broker Payment', 'accDeduct_pnBroker'],
    ['COD Payment', 'accDeduct_pnCod'],
    ['Cash Commission', 'accDeduct_pnCash'],
    ['Transporter Freight', 'accDeduct_pnTransporter'],
  ];
  let total = 0;
  const parts = [];
  // Bucket amounts now ALSO saved individually (accessories_deduct_*,
  // Ramvir Sept 2026) — previously only the rolled-up total + this text
  // reason survived, so nothing downstream could tell WHICH bucket to
  // actually dock. sync_pending_payment_amounts() (DB trigger) reads
  // these to correct the real payable rewire_payments row once Head
  // Approval sets a final deduction — see RJ20CA5411/L7102935 (broker
  // paid the full ₹22,000 instead of the approved ₹20,000 net) and
  // L7103005 (payment row frozen at the ORIGINAL PN amount, missing a
  // later GST/amount edit) — both were the same underlying gap: the
  // deduction/edit only ever updated rewire_master_data, never the
  // actual payment row Accounts pays from.
  const bucketAmounts = { pnCustomer: 0, pnBroker: 0, pnCod: 0, pnCash: 0, pnTransporter: 0 };
  buckets.forEach(([label, id]) => {
    const el = document.getElementById(id);
    const val = el ? (parseFloat(el.value) || 0) : 0;
    const key = id.replace('accDeduct_', '');
    if (bucketAmounts.hasOwnProperty(key)) bucketAmounts[key] = val;
    if (val > 0) { total += val; parts.push(`${label}: -₹${val}`); }
  });
  const manualReason = (document.getElementById('accessoriesDeductionReason').value || '').trim();
  const composedReason = [parts.join('; '), manualReason].filter(Boolean).join(' — ');

  // current_stage only advances here for Post Delivery — Advance Payment/
  // Omini Pay/Instant Payments have Accessories Check decoupled from
  // current_stage entirely (same as Delivery, see loadQualTab's comments,
  // JS-Dashboard.html), which stays parked earlier for these while
  // Delivery/Accessories Check happen in parallel; submitUploadDelivery()
  // already respects this same isAlt guard, this was the one write site
  // that didn't. Bumping it here for Alt types would have pulled
  // current_stage away from the value every other part of the app expects
  // for them (e.g. the Payment Release tab's own current_stage===6 check).
  let leadForAcc = findLeadInAnyPage(activeLeadId);
  if (!leadForAcc || !leadForAcc.pn_payment_type) {
    const { data: freshAccLead } = await sb.from('rewire_master_data').select('pn_payment_type').eq('id', activeLeadId).single();
    leadForAcc = freshAccLead;
  }
  const isAltFlowAcc = isAltFlowPaymentType(leadForAcc && leadForAcc.pn_payment_type);
  const accPayload = {
    accessories_check_status: 'Confirmed',
    accessories_check_by: currentProfile.id,
    accessories_check_on: new Date().toISOString(),
    accessories_check_remarks: document.getElementById('accessoriesRemarks').value.trim(),
    accessories_deduction_amount: total || null,
    accessories_deduction_reason: composedReason || null,
    accessories_deduct_customer: bucketAmounts.pnCustomer || null,
    accessories_deduct_broker: bucketAmounts.pnBroker || null,
    accessories_deduct_cod: bucketAmounts.pnCod || null,
    accessories_deduct_cash: bucketAmounts.pnCash || null,
    accessories_deduct_transporter: bucketAmounts.pnTransporter || null,
    last_updated_by: currentProfile.id,
  };
  if (!isAltFlowAcc) accPayload.current_stage = 7;
  // Accessories Deduction -> Manager Review (Ramvir, Sept 2026) — a
  // deduction > 0 now has to wait for the lead's Manager to add a remark
  // (Accessories Review section) before it's eligible for Head Approval;
  // see the .or('accessories_manager_review_status...') exclusion added to
  // the Head Approval queue (loadQualTab, JS-Dashboard.html). No
  // deduction at all skips this entirely — status stays null, straight to
  // Head Approval exactly as before.
  if (total > 0) {
    accPayload.accessories_manager_review_status = 'Pending';
    accPayload.accessories_manager_remarks = null;
    accPayload.accessories_manager_reviewed_by = null;
    accPayload.accessories_manager_reviewed_on = null;
  }
  const { error } = await sb.from('rewire_master_data').update(accPayload).eq('id', activeLeadId);
  if (error) { notify('Error confirming: ' + error.message, { icon: 'error' }); return; }

  if (total > 0) {
    // Fetch the lead's Manager email fresh (not in the cached lead object
    // used to populate this modal) — fire-and-forget, same pattern as the
    // Instant Payment email elsewhere in this app. A missing manager_email
    // just skips the email silently rather than failing the whole save —
    // the lead still correctly sits in Accessories Review either way.
    const { data: accMgrLead } = await sb.from('rewire_master_data')
      .select('lead_no, customer_name, val_vehicle_number, accessories_deduction_amount, accessories_deduction_reason, manager:rewire_user_profiles!rewire_master_data_manager_id_fkey(name, manager_email)')
      .eq('id', activeLeadId).single();
    const mgrEmail = accMgrLead && accMgrLead.manager ? accMgrLead.manager.manager_email : null;
    if (mgrEmail) {
      google.script.run
        .withSuccessHandler(() => {})
        .withFailureHandler((err) => console.error('Accessories deduction review email failed: ' + err.message))
        .sendAccessoriesDeductionReviewEmail({
          managerEmail: mgrEmail,
          managerName: accMgrLead.manager.name || '',
          leadNo: accMgrLead.lead_no, customerName: accMgrLead.customer_name,
          vehicleNumber: accMgrLead.val_vehicle_number,
          deductionAmount: accMgrLead.accessories_deduction_amount,
          deductionReason: accMgrLead.accessories_deduction_reason,
        });
    }
  }

  notify(total > 0 ? 'Accessories Check confirmed — sent to Manager for review before Head Approval.' : 'Accessories Check confirmed. Lead moved to Head Approval.');
  closeModal('accessoriesModal');
  await renderAccessoriesSection();
  await refreshLeadsTable();
}

async function renderLocationTrackingSection() {
  initTableFilterBar('loctrack', renderLocationTrackingSection);

  // lead closed out (e.g. duplicate vehicle) after Upload Delivery still
  // has ud_status='Complete' + logistics_status=null, so it would otherwise
  // sit here forever asking Back Office to track a dead lead's location.
  const rawData = await fetchAllRows((from, to) => sb.from('rewire_master_data')
    .select(`id, lead_no, customer_name, city, val_vehicle_type, val_vehicle_number, val_make,
      val_model_variant, ud_vehicle_parking, ud_vehicle_sub_parking, ud_filled_on,
      pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(id,name),
      manager:rewire_user_profiles!rewire_master_data_manager_id_fkey(id,name)`)
    .eq('ud_status', 'Complete')
    .is('logistics_status', null)
    .neq('overall_status', 'Closed Lost')
    // Scrapped/Reserved/"Scrapped - Provisionally" are terminal disposal
    // outcomes (set from the Vehicle Disposal tab, or via the old bulk
    // parking-location import) — not an in-transit location to keep
    // tracking here. Those vehicles belong in Vehicle Disposal instead.
    // Also excluding "Jaipur Plant" itself — ~71 leads from the old bulk
    // import already sit at Jaipur Plant despite logistics_status still
    // being null (never actually dispatched via the live Send to Plant
    // flow); they've arrived, so there's no "current location" left to
    // update here — same as how Dashboard's Location Wise Summary already
    // treats them as landed, not in-transit.
    // (See .not(col,'in',...) gotcha note in JS-Tracking.html/

    .not('ud_vehicle_parking', 'in', '(Scrapped,Scrapped - Provisionally,Reserved,Jaipur Plant)')
    .order('ud_filled_on', { ascending: false }).range(from, to))
    .catch(err => { console.error(err); return []; });
  const data = filterRowsByTableFilter(rawData || [], 'loctrack',
    l => l.pe ? l.pe.id : null,
    l => l.manager ? l.manager.id : null,
    l => l.ud_filled_on ? l.ud_filled_on.slice(0, 10) : null);

  document.getElementById('countLoctrack').textContent = (data || []).length + ' vehicles';
  loctrackPageCache = data || [];
  document.getElementById('tbodyLoctrack').innerHTML = (data && data.length) ? data.map(l => `<tr>
    <td data-col="lead_no"><span class="lid">${l.lead_no}</span></td>
    <td data-col="customer" style="font-weight:500;">${l.customer_name}</td>
    <td data-col="vehicle_type">${l.val_vehicle_type || '—'}</td>
    <td data-col="vehicle_no">${l.val_vehicle_number || '—'}</td>
    <td data-col="make">${l.val_make || '—'}</td>
    <td data-col="model">${l.val_model_variant || '—'}</td>
    <td data-col="location">${l.ud_vehicle_parking || '—'}</td>
    <td data-col="sub_location">${l.ud_vehicle_sub_parking || '—'}</td>
    <td data-col="pe">${l.pe ? l.pe.name : '—'}</td>
    <td data-col="manager">${l.manager ? l.manager.name : '—'}</td>
    <td data-col="delivered_on">${l.ud_filled_on ? new Date(l.ud_filled_on).toLocaleDateString() : '—'}</td>
    <td><button class="btn btn-outline" style="padding:4px 10px;font-size:12px;" onclick="openLocationUpdateModal('${l.id}','${(l.lead_no || '').replace(/'/g, "\\'")}','${(l.ud_vehicle_parking || '').replace(/'/g, "\\'")}','${(l.val_vehicle_number || '').replace(/'/g, "\\'")}','${(l.ud_vehicle_sub_parking || '').replace(/'/g, "\\'")}')"><i class="ti ti-map-pin" style="font-size:12px;" aria-hidden="true"></i> Update</button></td>

async function submitLocationUpdate() {
  if (!locTrackEditingId) return;
  // Early-entry lock (Ramvir, Sept 2026) — a vehicle whose park location
  // was set via "Fill for a Vehicle Not Yet Listed" (see
  // lockEarlyPlantEntry()) can't have it manually changed here. In
  // practice this lead's row won't even appear in Location Tracking once
  // locked (that list already excludes ud_vehicle_parking='Jaipur Plant'),
  // but this guard covers any stale-cache edge case.
  const { data: lockCheck } = await sb.from('rewire_master_data').select('early_plant_entry').eq('id', locTrackEditingId).maybeSingle();
  if (lockCheck && lockCheck.early_plant_entry) {
    notify("This vehicle's park location was locked via early plant entry and can't be changed here.", { icon: 'error', title: 'Locked' });
    return;
  }
  let value = document.getElementById('locUpdateValue').value.trim();
  if (!value) { notify('Please select a location.', { icon: 'error', title: 'Missing field' }); return; }
  // "Jaipur Plant" is reached only via Logistics' own "Send to Plant" flow
  // (see data-exclude on this field, Modals-General.html) — block it here
  // too in case it's typed in manually rather than picked from the list.
  if (value.toLowerCase() === 'jaipur plant') {
    notify('"Jaipur Plant" can only be set via Logistics → Send to Plant, not here.', { icon: 'error', title: 'Not allowed here' });
    return;
  }
  if (!isValidMasterValue('location', value)) {
    notify('"' + value + '" is not in the Location master list. Ask Admin to add it in Settings → Master Data, or pick an existing option.', { icon: 'error', title: 'Invalid Location' });
    return;
  }
  // Normalize to the master list's own casing (Ramvir, Sept 2026) — this
  // is exactly the bug that let "Alwar"/"ALWAR"/"alwar" pile up as 3
  // separate values in the Location Tracking filter: the check above only
  // ever compared case-insensitively, but this line used to save
  // whatever the user actually typed.
  value = normalizeMasterValue('location', value);
  const subValue = document.getElementById('locUpdateSubValue').value || null;
  const { error } = await sb.from('rewire_master_data').update({ ud_vehicle_parking: value, ud_vehicle_sub_parking: subValue }).eq('id', locTrackEditingId);
  if (error) { notify('Error updating location: ' + error.message, { icon: 'error' }); return; }
  notify('Location updated.');

// VEHICLE DISPOSAL · MULTI-SELECT + BULK ACTIONS (Ramvir, Oct 2026) —
// "Pending Disposal me multiple select ka option do ... Allocate col table
// se remove kar do ... Contractor or Reserved tab me bhi multiple select
// karke Contractor se Reserved and Reserved se Contractor and Contractor se
// Pending Disposal and Reserved se Pending Disposal ho sakti hai". One Set
// of checked lead ids per sub-tab (keyed by table-filter prefix), shared by
// the Allocate/Reserve/Deallocate bulk actions below. The old single-row
// openAllocateModal(id,...) is gone — Allocate is bulk-only now, reached via
// the bulk bar that appears once ≥1 row is checked.
// ------------------------------------------------------------
const disposalSelection = { disposal: new Set(), disposalallocated: new Set(), disposalreserved: new Set(), rc: new Set() };

function toggleDisposalRowSelect(prefix, id, checked) {
  if (checked) disposalSelection[prefix].add(id); else disposalSelection[prefix].delete(id);
  updateDisposalBulkBar(prefix);
}
// Select-all works like Excel's: it only touches rows currently VISIBLE after
// column-header / search filters (Ramvir, Oct 2026 — filtered 471 of 515, but
// select-all used to tick all 515). Rows hidden by a filter are always
// un-selected so a bulk action can never hit a vehicle the user can't see.
function toggleSelectAllDisposalRows(prefix, masterCb) {
  document.querySelectorAll(`.${prefix}-select-cb`).forEach(cb => {
    const tr = cb.closest('tr');
    const hidden = tr && (tr.dataset.twColFiltered === '1' || tr.dataset.twFiltered === '1');
    if (hidden) { cb.checked = false; disposalSelection[prefix].delete(cb.value); return; }
    cb.checked = masterCb.checked;
    if (masterCb.checked) disposalSelection[prefix].add(cb.value); else disposalSelection[prefix].delete(cb.value);
  });
  updateDisposalBulkBar(prefix);
}
// Called whenever a table's filters change — drops any now-hidden row from
// the selection so the "N selected" count and bulk actions stay honest.
function pruneHiddenDisposalSelection(table) {
  const prefix = table && table.dataset ? table.dataset.filterPrefix : null;
  if (!prefix || !disposalSelection[prefix]) return;
  table.querySelectorAll(`.${prefix}-select-cb`).forEach(cb => {
    const tr = cb.closest('tr');
    if (tr && (tr.dataset.twColFiltered === '1' || tr.dataset.twFiltered === '1')) {
      cb.checked = false; disposalSelection[prefix].delete(cb.value);
    }
  });
  const master = document.getElementById(prefix + 'SelectAll');
  if (master) master.checked = false;
  updateDisposalBulkBar(prefix);
}
function updateDisposalBulkBar(prefix) {
  const bar = document.getElementById(prefix + 'BulkBar');
  const n = disposalSelection[prefix].size;
  if (bar) bar.style.display = n > 0 ? 'flex' : 'none';
  const countEl = document.getElementById(prefix + 'BulkCount');
  if (countEl) countEl.textContent = n + ' selected';
}
function clearDisposalSelection(prefix) {
  disposalSelection[prefix].clear();
  document.querySelectorAll(`.${prefix}-select-cb`).forEach(cb => cb.checked = false);
  const master = document.getElementById(prefix + 'SelectAll');
  if (master) master.checked = false;
  updateDisposalBulkBar(prefix);
}

// Small stock cards on the Disposal tabs (Ramvir, Oct 2026): where the Jaipur Plant stock is sitting.
// Plant / Yard-2 / Yard-3 = not yet with a Contractor; Contractor = allocated; Total = all of them.
async function renderDisposalSummaryCards() {
  const wraps = document.querySelectorAll('.disposal-summary-cards');
  if (!wraps.length) return;
  // Mirrors the four tab lists exactly (so card numbers == "N vehicles" counts on the tabs):
  //   Pending  = parking Jaipur Plant, not Closed Lost, not allocated  (split by sub-location)
  //   Contractor = allocated to a contractor (not Reserved / Scrapped)
  //   Reserved = parking Reserved
  const sel = 'id, ud_vehicle_parking, ud_vehicle_sub_parking, scrap_allocated_contractor_id, overall_status, ud_status';
  const [plantRows, allocRows, resRows] = await Promise.all([
    fetchAllRows((from, to) => sb.from('rewire_master_data').select(sel).eq('ud_vehicle_parking', 'Jaipur Plant').neq('overall_status', 'Closed Lost').is('scrap_allocated_contractor_id', null).range(from, to)).catch(() => []),
    fetchAllRows((from, to) => sb.from('rewire_master_data').select(sel).not('scrap_allocated_contractor_id', 'is', null).not('ud_vehicle_parking', 'in', '("Reserved","Scrapped","Scrapped - Provisionally")').range(from, to)).catch(() => []),
    fetchAllRows((from, to) => sb.from('rewire_master_data').select(sel).eq('ud_vehicle_parking', 'Reserved').range(from, to)).catch(() => []),
  ]);
  const c = { plant: 0, y2: 0, y3: 0 };
  plantRows.forEach(r => {
    const sub = (r.ud_vehicle_sub_parking || 'Jaipur Plant').trim();
    if (/yard-?\s*2/i.test(sub)) c.y2++; else if (/yard-?\s*3/i.test(sub)) c.y3++; else c.plant++;
  });
  const contractor = allocRows.length, reserved = resRows.length;
  const total = c.plant + c.y2 + c.y3 + contractor + reserved;
  // Dashboard > Location Wise Summary only counts Delivery Complete + Purchased vehicles.
  const notDash = plantRows.concat(allocRows, resRows).filter(r => !(r.overall_status === 'Purchased' && r.ud_status === 'Complete')).length;
  const card = (label, n, color, tip) => `<div title="${tip || ''}" style="background:#fff;border:1px solid var(--color-border-tertiary);border-radius:8px;padding:8px 12px;border-left:3px solid ${color};">
    <div style="font-size:10px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.04em;font-weight:600;">${label}</div><div style="font-size:19px;font-weight:700;color:${color};">${n}</div></div>`;
  const html = card('Jaipur Plant', c.plant, '#2563eb') + card('Yard-2', c.y2, '#7c3aed') + card('Yard-3', c.y3, '#d97706')
    + card('Contractor', contractor, '#059669') + card('Reserved', reserved, '#db2777')
    + card('Total Stock', total, '#0f172a', 'Plant + Yard-2 + Yard-3 + Contractor + Reserved')
    + card('Delivery / Approval Pending', notDash, '#94a3b8', 'Included in the cards above, but not yet Delivery Complete + Purchased, so the Dashboard does not count them');
  wraps.forEach(w => { w.innerHTML = html; });
}

async function renderVehicleDisposalSection() {
  initTableFilterBar('disposal', renderVehicleDisposalSection);
  renderDisposalSummaryCards();
  // Deliberately just ud_vehicle_parking = 'Jaipur Plant', NOT also gated
  // on logistics_status = 'Sent to Plant' — 110 of the 394 current
  // "Jaipur Plant" leads have logistics_status still null (they're from
  // the Sept 2026 bulk parking-location import, not the live Send-to-Plant
  // flow), and those are just as real/actionable for disposal as the ones
  // that did go through Logistics. Gating on logistics_status would hide
  // those 110 genuine vehicles from this tab entirely.
  // (Ramvir, Oct 2026) — ALSO now includes every lead still pending at
  // "Received at Plant" (same base set that screen/Material Entry use:
  // ud_status=Complete + logistics_status='Sent to Plant', or
  // early_plant_entry) even before its plant/RST paperwork is filled.
  // Many of these are already physically scrapped — the RST/plant-check
  // details just haven't been backfilled yet — so Ramvir wants them
  // workable in Vehicle Disposal now rather than waiting on that paperwork.
  //
  // (Ramvir, Oct 2026 — correction, then reverted) — a plant/scrap-location
  // whitelist was briefly added here, same as Material Entry/Received at
  // Plant. Reverted per explicit instruction: whatever vehicles show in
  // Received at Plant must ALSO show in Vehicle Disposal — so this stays
  // in lockstep with that tab's base set, no independent location filter.
  const rawData = await fetchAllRows((from, to) => sb.from('rewire_master_data')
    .select(`id, lead_no, customer_name, val_vehicle_type, val_vehicle_number, val_make,
      val_model_variant, ud_filled_on, ud_vehicle_parking, ud_vehicle_sub_parking, early_plant_entry, scrap_allocated_contractor_id,
      pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(id,name),
      manager:rewire_user_profiles!rewire_master_data_manager_id_fkey(id,name)`)
    // ud_status=Complete dropped from the 2nd clause so this stays in
    // lockstep with Received at Plant (Oct 2026): every 'Sent to Plant'
    // vehicle shows there AND here AND in Material Entry.
    // (Ramvir, Oct 2026 - final) ONLY vehicles whose Location is Jaipur Plant. The old
    // 'Sent to Plant' / early_plant_entry clauses pulled in vehicles still in transit or
    // sitting at Alwar / Bikaner / Delhi etc. (and with a blank Sub Location).
    .eq('ud_vehicle_parking', 'Jaipur Plant')
    .neq('overall_status', 'Closed Lost')
    // (Ramvir, Oct 2026) — explicitly exclude Reserved/Scrapped here now
    // that those are reachable via bulk actions from this tab. Without this,
    // a vehicle whose logistics_status='Sent to Plant' would keep matching
    // the .or(...) above even after being marked Reserved/Scrapped, and
    // reappear here alongside its own dedicated tab — found while building
    // the multi-select bulk-move feature below.
    .not('ud_vehicle_parking', 'in', '("Reserved","Scrapped","Scrapped - Provisionally")')
    .order('ud_filled_on', { ascending: false }).range(from, to))
    .catch(err => { console.error(err); return []; });
  // (Ramvir, Oct 2026) — once allocated to a Contractor, a vehicle moves
  // out of Pending Disposal into its own "Allocated" tab
  // (renderVehicleDisposalAllocatedSection) — it isn't Scrapped/Reserved
  // yet, so it stays visible, just on a different list.
  const notAllocated = (rawData || []).filter(l => !l.scrap_allocated_contractor_id);
  const data = filterRowsByTableFilter(notAllocated, 'disposal',
    l => l.pe ? l.pe.id : null,
    l => l.manager ? l.manager.id : null,
    l => l.ud_filled_on ? l.ud_filled_on.slice(0, 10) : null);

  // COD Date — rewire_cod_cvs is keyed by registration_number (text), not
  // a real FK, so no relational embed; fetch the COD rows for exactly the
  // vehicle numbers on screen and match client-side by registration
  // number, same pattern renderCodCvsSection() already uses.
  const regNos = [...new Set((data || []).map(l => (l.val_vehicle_number || '').toUpperCase()).filter(Boolean))];
  let codDateByReg = {};
  if (regNos.length) {
    const { data: codRows } = await fetchByIds(ch => sb.from('rewire_cod_cvs')
      .select('registration_number, cod_cvs_date').eq('upload_type', 'COD').in('registration_number', ch), regNos, 100);
    (codRows || []).forEach(r => { codDateByReg[r.registration_number.toUpperCase()] = r.cod_cvs_date; });
  }
  const now = new Date();
  await loadScrapContractors();

  document.getElementById('countDisposal').textContent = (data || []).length + ' vehicles';
  disposalPageCache = (data || []).map(l => ({ ...l, _codDate: codDateByReg[(l.val_vehicle_number || '').toUpperCase()] || null }));
  document.getElementById('tbodyDisposal').innerHTML = (data && data.length) ? data.map(l => {
    const codDate = codDateByReg[(l.val_vehicle_number || '').toUpperCase()] || null;
    const days = codDate ? Math.floor((now - new Date(codDate)) / 86400000) : null;
    // (Ramvir, Oct 2026) — ud_filled_on is genuinely NULL for a batch of
    // bulk-imported leads (e.g. the Sept 27 2026 import) — it was never
    // captured for those, not a display bug. "Delivery Days" is simply
    // blank for them until/unless that date is backfilled.
    const deliveryDays = l.ud_filled_on ? Math.floor((now - new Date(l.ud_filled_on)) / 86400000) : null;
    const checked = disposalSelection.disposal.has(l.id) ? 'checked' : '';
    return `<tr>
    <td><input type="checkbox" class="disposal-select-cb" value="${l.id}" ${checked} onchange="toggleDisposalRowSelect('disposal', this.value, this.checked)" /></td>
    <td data-col="lead_no"><span class="lid">${l.lead_no}</span></td>
    <td data-col="customer" style="font-weight:500;">${l.customer_name}</td>
    <td data-col="vehicle_type">${l.val_vehicle_type || '—'}</td>
    <td data-col="vehicle_no">${l.val_vehicle_number || '—'}</td>
    <td data-col="make">${l.val_make || '—'}</td>
    <td data-col="model">${l.val_model_variant || '—'}</td>
    <td data-col="location">${l.ud_vehicle_parking || '—'}</td>
    <td data-col="sub_location">${l.ud_vehicle_sub_parking || '—'}</td>
    <td data-col="pe">${l.pe ? l.pe.name : '—'}</td>
    <td data-col="cod_date">${codDate ? new Date(codDate).toLocaleDateString() : '—'}</td>
    <td data-col="days">${days !== null ? days + ' days' : '—'}</td>
    <td data-col="delivered_on">${l.ud_filled_on ? new Date(l.ud_filled_on).toLocaleDateString() : '—'}</td>
    <td data-col="delivery_days">${deliveryDays !== null ? deliveryDays + ' days' : '—'}</td>
    <td><button class="btn btn-outline" style="padding:4px 10px;font-size:12px;" onclick="openDisposalModal('${l.id}','${(l.lead_no || '').replace(/'/g, "\\'")}','${(l.val_vehicle_number || '').replace(/'/g, "\\'")}')"><i class="ti ti-recycle" style="font-size:12px;" aria-hidden="true"></i> Update</button></td>
  </tr>`;
  }).join('') : '<tr><td colspan="15" style="text-align:center;color:var(--color-text-tertiary);padding:24px;">No vehicles at Jaipur Plant awaiting disposal.</td></tr>';
  updateDisposalBulkBar('disposal');
  initColumnPicker('disposal', DISPOSAL_COLUMNS, 'disposalColumnPicker', 'tableDisposal');
}

    const photoFiles = Array.from(document.getElementById('disposalPhotos').files || []);
    const videoFiles = Array.from(document.getElementById('disposalVideos').files || []);
    if (photoFiles.length < DISPOSAL_PHOTO_MIN) { notify(`At least ${DISPOSAL_PHOTO_MIN} dismantle photos are required (${photoFiles.length} selected).`, { icon: 'error', title: 'Not enough photos' }); return; }
    if (photoFiles.length > DISPOSAL_PHOTO_MAX) { notify(`At most ${DISPOSAL_PHOTO_MAX} dismantle photos are allowed (${photoFiles.length} selected).`, { icon: 'error', title: 'Too many photos' }); return; }
    if (videoFiles.length < DISPOSAL_VIDEO_MIN) { notify(`At least ${DISPOSAL_VIDEO_MIN} dismantle videos are required (${videoFiles.length} selected).`, { icon: 'error', title: 'Not enough videos' }); return; }
    if (videoFiles.length > DISPOSAL_VIDEO_MAX) { notify(`At most ${DISPOSAL_VIDEO_MAX} dismantle videos are allowed (${videoFiles.length} selected).`, { icon: 'error', title: 'Too many videos' }); return; }

    const folderName = disposalEditingLeadNo || 'Unsorted';
    notify(`Uploading ${photoFiles.length} photo(s) and ${videoFiles.length} video(s) — this can take a bit for videos, please wait…`, { icon: 'info' });
    photoUrls = await Promise.all(photoFiles.map(f => uploadFile(f, folderName, 'dismantle_photo')));
    videoUrls = await Promise.all(videoFiles.map(f => uploadFile(f, folderName, 'dismantle_video')));
    if (photoUrls.some(u => !u) || videoUrls.some(u => !u)) {
      notify('One or more files failed to upload — please try again.', { icon: 'error' });
      return;
    }
  }

  const payload = {
    ud_vehicle_parking: status,
    scrap_marked_by: currentProfile.id,
    scrap_marked_on: new Date().toISOString(),
  };
  if (status === 'Scrapped') {
    payload.scrap_dismantle_photos_urls = photoUrls.join(',');
    payload.scrap_dismantle_videos_urls = videoUrls.join(',');
  }
  if (status === 'Reserved') {
    payload.scrap_reserved_reason = reservedReason;
    payload.scrap_reserved_by = currentProfile.id;
  }
  const { error } = await sb.from('rewire_master_data').update(payload).eq('id', disposalEditingId);
  if (error) { notify('Error updating vehicle status: ' + error.message, { icon: 'error' }); return; }
  notify(`Vehicle marked ${status}.`);
  closeModal('vehicleDisposalModal');
  disposalEditingId = null;
  disposalEditingLeadNo = null;
  // Update can now be fired from Pending Disposal AND the Contractor tab - refresh both lists.
  await renderVehicleDisposalSection();
  if (typeof renderVehicleDisposalAllocatedSection === 'function') await renderVehicleDisposalAllocatedSection();
}

// ------------------------------------------------------------
// RECEIVED AT PLANT — Vehicle Receipt Form for Purchased vehicles,
// preceded by a Plant Accessories Check popup (see below). Only shows
// vehicles that have actually been dispatched from Logistics (see above)
// — ud_status alone isn't enough anymore.
// ------------------------------------------------------------
// Accessories Check and RST/Vehicle Receipt Details are filled by two
// different people at the plant and no longer block each other — each
// saves straight to rewire_vehicle_receipt independently (upsert on
// lead_id), whichever one happens first creates the row.

// Same items compared in the (Manager Approval-stage) Accessories Check
// screen — [label, Valuation column, Delivery column, column to store the
// plant answer under on rewire_vehicle_receipt, answer type]. Answer type
// is 'yesno' for a plain presence check, 'count' for Speakers, which —
// same as Valuation/Delivery — is captured as an actual count (0/2/4/6/
// 8/10), or 'count15' for Alloy Wheel — a 1-5 count of alloy wheels
// actually present at the plant (was 'yesno' — a plain Yes/No didn't say
// HOW MANY of the vehicle's alloy wheels made it to the plant, which is
// what Back Office actually needs when reconciling against Valuation's
// count).
const PLANT_ACCESSORY_ITEMS = [
  ['Spare Wheel', 'val_spare_wheel', 'ud_spare_wheel', 'plant_spare_wheel', 'yesno'],
  ['Stereo', 'val_stereo', 'ud_stereo', 'plant_stereo', 'yesno'],
  ['Speakers', 'val_speakers', 'ud_speakers', 'plant_speakers', 'count'],
  ['Tool Kit', 'val_tool_kit', 'ud_tool_kit', 'plant_tool_kit', 'yesno'],
  ['Battery', 'val_battery', 'ud_battery', 'plant_battery', 'yesno'],
  ['Alloy Wheel', 'val_alloy_wheel', 'ud_alloy_wheel', 'plant_alloy_wheel', 'count15'],
  ['Cylinder Type', 'val_fuel_type', 'ud_cylinder_type', 'plant_cylinder_type', 'yesno'],
  ['Vehicle Operational', 'val_vehicle_operational', 'ud_vehicle_operational', 'plant_vehicle_operational', 'yesno'],
  ['Vehicle Accidental', 'val_vehicle_accidental', 'ud_vehicle_accidental', 'plant_vehicle_accidental', 'yesno'],
];

// Which items actually have a Delivery-time photo column to re-upload
// over (Vehicle Operational/Accidental never had a photo field at all —
// see computeAccessoryComparisons' photoUrl argument, null for both).
// Cylinder Type is the one irregular name (ud_cylinder_photo_url, not
// ud_cylinder_type_photo_url — matches the column used everywhere else,
// e.g. the Upload Delivery form's own upload field).
const PLANT_ACCESSORY_PHOTO_COL = {
  'Spare Wheel': 'ud_spare_wheel_photo_url', 'Stereo': 'ud_stereo_photo_url',
  'Speakers': 'ud_speakers_photo_url', 'Tool Kit': 'ud_tool_kit_photo_url',
  'Battery': 'ud_battery_photo_url', 'Alloy Wheel': 'ud_alloy_wheel_photo_url',
  'Cylinder Type': 'ud_cylinder_photo_url',
};

let activePlantReceipt = null; // existing rewire_vehicle_receipt row for the open plantModal, if any — see openVehicleReceipt()/submitVehicleReceipt() fix below
let activePlantReceiveMode = false; // true when opened from Pending Receipt > Receive (also asks Received Location)
async function openPlantAccessoriesCheck(leadId, leadNo, vehicleNo, receiveMode) {
  activeLeadId = leadId;
  activeLeadNo = leadNo;
  activePlantReceiveMode = !!receiveMode;
  document.getElementById('plantReceiveLocationField').style.display = receiveMode ? '' : 'none';
  document.getElementById('plantReceiveLocation').value = '';
  refreshSubLocationSelect('plantReceiveSubLocation', '');
  document.getElementById('plantAccessoriesConfirmLabel').textContent = receiveMode ? 'Confirm & Mark Received' : 'Confirm & Continue to Receipt Form';
  document.getElementById('plantAccessoriesModalSub').textContent = leadNo + (vehicleNo ? ' • ' + vehicleNo : '');
  const { data: lead, error } = await sb.from('rewire_master_data').select('*').eq('id', leadId).single();
  if (error || !lead) { notify('Could not load lead details.', { icon: 'error' }); return; }

  // If accessories were already filled once, pre-fill the saved answers
  // so this doubles as an edit screen, not just a first-fill form.
  const { data: existing } = await sb.from('rewire_vehicle_receipt').select('*').eq('lead_id', leadId).maybeSingle();

  // Reference column — what the EARLIER (Manager-Approval-stage)
  // Accessories Check already found (Match/Shortage/Excess + photo, from
  // Valuation vs Delivery), so whoever confirms "Present at Plant?" isn't
  // deciding blind — reuses the exact same comparison logic as the
  // standalone Accessories Check screen, keyed by label.
  const checkByLabel = {};
  computeAccessoryComparisons(lead).forEach(c => { checkByLabel[c.label] = c; });

  document.getElementById('plantAccessoriesBody').innerHTML = PLANT_ACCESSORY_ITEMS.map(([label, valKey, udKey, plantKey, optType]) => {
    const chk = checkByLabel[label];
    const checkCell = chk
      ? accessoryKindBadge(chk.kind) + (isRealFileUrl(chk.photoUrl) ? ` <a href="javascript:void(0)" onclick="viewAccessoryPhoto('${chk.photoUrl}','${label}')" style="color:#1d4ed8;text-decoration:underline;font-size:11px;">Photo</a>` : '')
      : '—';
    // Re-upload option (Ramvir, Sept 2026) — lets whoever's checking at the
    // plant replace the original Delivery-stage photo (e.g. it was blurry,
    // or the item's actual condition needs fresh evidence at the plant).
    // Overwrites the SAME column the Delivery photo lives in
    // (ud_<item>_photo_url on the lead itself), so every other screen that
    // shows this photo — the standalone Accessories Check, Accessories
    // Register report, View Lead — automatically shows the replacement
    // too, rather than creating a second parallel "plant photo" nobody
    // else would see. Optional — only wired up for items that actually
    // have a photo column (see PLANT_ACCESSORY_PHOTO_COL above).
    const photoCol = PLANT_ACCESSORY_PHOTO_COL[label];
    const reuploadCell = photoCol
      ? `<input type="file" accept="image/*" id="plantReupload_${plantKey}" data-photocol="${photoCol}" style="font-size:10px;max-width:130px;" title="Re-upload ${label} photo" />`
      : '<span class="sub">—</span>';
    const savedVal = existing ? existing[plantKey] : '';
    const options = optType === 'count'
      ? '<option value="">Count</option>' + ['0', '2', '4', '6', '8', '10'].map(n => `<option value="${n}" ${savedVal === n ? 'selected' : ''}>${n}</option>`).join('')
      : optType === 'count15'
      ? '<option value="">Count</option>' + ['0', '1', '2', '3', '4', '5'].map(n => `<option value="${n}" ${savedVal === n ? 'selected' : ''}>${n}</option>`).join('')
      : `<option value="">Select</option><option value="Yes" ${savedVal === 'Yes' ? 'selected' : ''}>Yes</option><option value="No" ${savedVal === 'No' ? 'selected' : ''}>No</option>`;
    return `<tr>
      <td style="font-weight:500;">${label}</td>
      <td>${lead[valKey] || '—'}</td>
      <td>${lead[udKey] || '—'}</td>
      <td>${checkCell}</td>
      <td>${reuploadCell}</td>
      <td>
        <select id="plantAcc_${plantKey}" style="border:0.5px solid var(--color-border-secondary);border-radius:5px;padding:4px 8px;font-size:12px;">
          ${options}
        </select>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('plantAccessoriesRemarks').value = (existing && existing.plant_accessories_remarks) || '';
  // Debit Amount/Reason — manually entered here when an item is found
  // short at the plant; flows through to Transporter Payments' Debit
  // Amount / Final Amount columns (see renderLogisticsPaymentsSection()).
  document.getElementById('plantDebitAmount').value = (existing && existing.plant_debit_amount) || '';
  document.getElementById('plantDebitReason').value = (existing && existing.plant_debit_reason) || '';
  document.getElementById('plantOtherDebitAmount').value = (existing && existing.plant_other_debit_amount) || '';
  document.getElementById('plantOtherDebitReason').value = (existing && existing.plant_other_debit_reason) || '';
  openModal('plantAccessoriesModal');
}

async function confirmPlantAccessoriesCheck() {
  // Receive mode: a Received Location is mandatory, validated against the
  // Location master list before anything is saved.
  let receiveLocation = null;
  if (activePlantReceiveMode) {
    receiveLocation = document.getElementById('plantReceiveLocation').value.trim();
    if (!receiveLocation) { notify('Select the Received Location.', { icon: 'error', title: 'Missing field' }); return; }
    if (!isValidMasterValue('location', receiveLocation)) {
      notify('"' + receiveLocation + '" is not in the Location master list. Ask Admin to add it in Settings → Master Data, or pick an existing option.', { icon: 'error', title: 'Invalid Location' });
      return;
    }
    receiveLocation = normalizeMasterValue('location', receiveLocation);
  }
  const values ={ lead_id: activeLeadId, accessories_filled_by: currentProfile.id, accessories_filled_on: new Date().toISOString() };
  for (const [label, , , plantKey, optType] of PLANT_ACCESSORY_ITEMS) {
    const el = document.getElementById('plantAcc_' + plantKey);
    const v = el ? el.value : '';
    if (!v) { notify(`Please select ${(optType === 'count' || optType === 'count15') ? 'a count' : 'Yes/No'} for "${label}".`, { icon: 'error', title: 'Missing field' }); return; }
    values[plantKey] = v;
  }
  values.plant_accessories_remarks = document.getElementById('plantAccessoriesRemarks').value || null;
  values.plant_debit_amount = document.getElementById('plantDebitAmount').value || null;
  values.plant_debit_reason = document.getElementById('plantDebitReason').value.trim() || null;
  values.plant_other_debit_amount = document.getElementById('plantOtherDebitAmount').value || null;
  values.plant_other_debit_reason = document.getElementById('plantOtherDebitReason').value.trim() || null;

  // Re-uploaded photos (optional, per item — see PLANT_ACCESSORY_PHOTO_COL)
  // overwrite the SAME ud_<item>_photo_url column the original Delivery
  // photo lives in, on the LEAD itself (rewire_master_data), not this
  // rewire_vehicle_receipt row — every other screen showing that photo
  // (Accessories Check, Accessories Register, View Lead) then automatically
  // reflects the replacement. Uploaded in parallel, same pattern as Upload
  // Delivery's own photo fields (JS-Pipeline.html submitUploadDelivery).
  const vFolderPlant = getVehicleFolderName();
  const photoUpdates = {};
  await Promise.all(Object.values(PLANT_ACCESSORY_PHOTO_COL).map(async (photoCol) => {
    const el = document.querySelector(`input[data-photocol="${photoCol}"]`);
    if (el && el.files && el.files.length) {
      const url = await uploadFile(el.files[0], vFolderPlant, photoCol);
      if (url) photoUpdates[photoCol] = url;
    }
  }));

  // Saves independently of the RST/Receipt step — whichever of the two
  // is filled first creates the row, the other just fills in its own
  // columns on top (onConflict: lead_id needs a unique index on that column).
  const { error } = await sb.from('rewire_vehicle_receipt').upsert(values, { onConflict: 'lead_id' });
  if (error) { notify('Error saving accessories check: ' + error.message, { icon: 'error' }); return; }
  if (Object.keys(photoUpdates).length) {
    const { error: photoErr } = await sb.from('rewire_master_data').update(photoUpdates).eq('id', activeLeadId);
    if (photoErr) notify('Accessories Check saved, but re-uploaded photo(s) failed to save: ' + photoErr.message, { icon: 'error' });
  }
  if (activePlantReceiveMode) {
    // Mark the vehicle RECEIVED: status -> Sent to Plant, received stamp,
    // and its location updated to where it was received/unloaded.
    const { data: leadRow } = await sb.from('rewire_master_data').select('logistics_manifest_id').eq('id', activeLeadId).maybeSingle();
    // Destination = Plant -> "Sent to Plant" (shows in RST Pending/Disposal/Material).
    // Destination = TLC Yard (anything but Jaipur Plant-type locations) -> status
    // cleared so the vehicle shows again in Logistics for the onward Logistic
    // Carrier leg to the plant (Ramvir, Oct 2026).
    const recvSub = document.getElementById('plantReceiveSubLocation').value || null;
    // The MANIFEST's destination decides plant-vs-onward, not the unload spot:
    // a manifest sent to Jaipur Plant stays "Sent to Plant" even when the
    // vehicle is unloaded at e.g. "Jaipur Yard-3" (Ramvir, Oct 2026 — GVUPLMAN/10/26/00134).
    let manifestTo = '';
    if (leadRow && leadRow.logistics_manifest_id) {
      const { data: mRow } = await sb.from('rewire_logistics_manifests').select('to_location').eq('id', leadRow.logistics_manifest_id).maybeSingle();
      manifestTo = (mRow && mRow.to_location) || '';
    }
    const isPlantName = v => ['Jaipur Plant', 'Jaipur'].includes(v) || /plant/i.test(v || '');
    const plantLike = manifestTo ? isPlantName(manifestTo) : isPlantName(receiveLocation);
    const { error: recvErr } = await sb.from('rewire_master_data').update({
      logistics_status: plantLike ? 'Sent to Plant' : null, logistics_received_on: new Date().toISOString(), logistics_received_by: currentProfile.id,
      logistics_unload_location: receiveLocation, ud_vehicle_parking: receiveLocation, ud_vehicle_sub_parking: recvSub,
    }).eq('id', activeLeadId);
    if (recvErr) { notify('Accessories saved, but marking Received failed: ' + recvErr.message, { icon: 'error' }); return; }
    if (leadRow && leadRow.logistics_manifest_id) {
      await sb.from('rewire_logistics_manifests').update({ unload_location: receiveLocation })
        .eq('id', leadRow.logistics_manifest_id).is('unload_location', null);
    }
    notify('Vehicle received at ' + receiveLocation + '.');
    activePlantReceiveMode = false;
    closeModal('plantAccessoriesModal');
    await renderReceivedPlantSection();
    if (plantOpenManifestId) openPlantManifestModal(plantOpenManifestId);
    return;
  }
  notify('Accessories Check saved.');
  closeModal('plantAccessoriesModal');
  await renderReceivedPlantSection();
  if (plantOpenManifestId) openPlantManifestModal(plantOpenManifestId);
}

// NOTE (Ramvir, Oct 2026) — the "Fill for a Vehicle Not Yet Listed" early-
// entry bypass (and lockEarlyPlantEntry(), which used to set
// early_plant_entry=true here) has been removed entirely — a vehicle can
// only reach Received at Plant once logistics_status='Sent to Plant' (see
// renderReceivedPlantSection below). Vehicle Disposal/Material/Documents
// still OR in `early_plant_entry = true` for any OLD leads that already
// have that flag set from before this cleanup, but nothing sets it anymore.

async function renderReceivedPlantSection() {
  initTableFilterBar('plant', renderReceivedPlantSection);
  // Every vehicle ever dispatched to plant — accumulates indefinitely,
  // paginated defensively.
  //
  // (Ramvir, Oct 2026 — reverted) — a plant/scrap-location whitelist was
  // briefly added here (matching Material Entry/Vehicle Disposal) to hide
  // vehicles Location Tracking later moved to another city. Wrong call for
  // THIS tab specifically: RST/plant-check paperwork is an administrative
  // catch-up step, independent of where the vehicle currently sits — 136
  // genuinely RST-pending vehicles (tracked to Alwar, Jodhpur, Bhilwara,
  // etc.) got hidden by that whitelist (320 pending dropped to 184), which
  // Ramvir flagged as wrong ("jinka rst fill nahi hua sare aane chahiye").
  // So this tab goes back to showing every lead in the base set with
  // either half still outstanding, with NO location filtering — unlike
  // Material Entry/Vehicle Disposal, which keep the whitelist since those
  // are physical-processing steps that genuinely require the vehicle to
  // be at the plant.
  //
  // (Ramvir, Oct 2026) — the `early_plant_entry.eq.true` bypass is REMOVED.
  // A vehicle can only land here once logistics_status='Sent to Plant' —
  // either self-carried (direct at Send to Plant) or via a Logistic
  // Carrier Manifest that's been marked Paid (see submitLogisticsSend /
  // submitMarkManifestPaid, same file) — closing the gap where a vehicle
  // without an updated delivery photo / without going through the
  // Manifest-bill workflow could still show up here early.
  const rawPurchased = await fetchAllRows((from, to) => sb.from('rewire_master_data')
    .select(`id, lead_no, customer_name, phone, ud_vehicle_parking, ud_vehicle_sub_parking, val_vehicle_type, val_vehicle_number, val_make,
      val_model_variant, created_at, logistics_vehicle_send_to, logistics_unload_location, logistics_status, logistics_received_on, overall_status,
      logistics_dispatch_date, logistics_transporter_name,
      manifest:rewire_logistics_manifests(manifest_no, transporter_name, dispatch_date, from_location), rewire_partners(partner_name),
      pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(id,name), manager:rewire_user_profiles!rewire_master_data_manager_id_fkey(id,name)`)
    // (Ramvir, Oct 2026) — the old `ud_status='Complete'` (delivery done)
    // validation is dropped HERE: that check now lives upstream in the
    // Logistics tab (only delivered vehicles can be sent).
    // Fetches BOTH dispatched states and splits client-side:
    //   Received            = 'Sent to Plant' AND logistics_received_on set
    //   Pending Receipt     = everything else dispatched ('In Transit', or
    //                         'Sent to Plant' not yet received here)
    // A vehicle moves to Received only via the Receive action (accessories
    // check + received location) — so vehicles parked at other locations
    // no longer sit in the Received list.
    .in('logistics_status', ['In Transit', 'Sent to Plant']).order('created_at', { ascending: false }).range(from, to))
    .catch(err => { console.error(err); return []; });
  const isReceivedLead = l => l.logistics_status === 'Sent to Plant' && !!l.logistics_received_on;
  const receivedBase = (rawPurchased || []).filter(isReceivedLead);
  const purchased = filterRowsByTableFilter(receivedBase, 'plant', l => l.pe ? l.pe.id : null, l => l.manager ? l.manager.id : null, l => l.created_at ? l.created_at.slice(0, 10) : null);

  // Deliberately NOT scoped with .in('lead_id', leadIds) — once `purchased`
  // grows into the hundreds/thousands, packing that many UUIDs into one
  // query's URL hits the same "TypeError: Failed to fetch" (URL too long)
  // bug already found and fixed for the missing-payment-row check
  // (JS-Tracking.html/JS-Payments.html). Paginating the whole receipts
  // table instead sidesteps it entirely, same fix pattern.
  const receipts = await fetchAllRows((from, to) => sb.from('rewire_vehicle_receipt').select('*').range(from, to))
    .catch(err => { console.error(err); return []; });
  const receiptByLead = {};
  (receipts || []).forEach(r => { receiptByLead[r.lead_id] = r; });

  // Once BOTH halves are Done for a lead, it's fully processed at the
  // plant — drop it from this working list entirely instead of leaving it
  // sitting there with two "Done" badges forever (the completed record
  // still exists in rewire_vehicle_receipt / is visible via Purchased).
  const remaining = (purchased || []).filter(l => {
    const r = receiptByLead[l.id];
    const accessoriesDone = !!(r && r.plant_spare_wheel);
    const rstDone = !!(r && r.rst_no);
    return !(accessoriesDone && rstDone);
  });

  document.getElementById('countPlant').textContent = remaining.length + ' vehicles';
  // "Pending" now means either half is still outstanding — matches the
  // two independent action columns below.
  const pendingCount = remaining.filter(l => {
    const r = receiptByLead[l.id];
    return !r || !r.plant_spare_wheel || !r.rst_no;
  }).length;
  document.getElementById('badgePlant').textContent = pendingCount;

  // ---- Mode tabs (Logistic Carrier / Crane / Driver / Towing / Self Drop) ----
  await loadPlantManifests();
  renderPlantModeRows();

  plantPageCache = (remaining || []).map(l => ({ ...l, _receipt: receiptByLead[l.id] }));
  document.getElementById('tbodyPlant').innerHTML = remaining.length ? remaining.map(l => {
    const r = receiptByLead[l.id];
    const accessoriesDone = !!(r && r.plant_spare_wheel);
    const rstDone = !!(r && r.rst_no);
    const vNoEsc = (l.val_vehicle_number || '').replace(/'/g, "\\'");
    return `<tr>
      <td data-col="lead_no"><span class="lid">${l.lead_no}</span></td>
      <td data-col="customer" style="font-weight:500;">${l.customer_name}</td>
      <td data-col="phone">${l.phone}</td>
      <td data-col="location">${l.ud_vehicle_parking || '—'}</td>
      <td data-col="sub_location">${l.ud_vehicle_sub_parking || '—'}</td>
      <td data-col="vehicle_type">${l.val_vehicle_type || '—'}</td>
      <td data-col="vehicle_no">${l.val_vehicle_number || '—'}</td>
      <td data-col="make">${l.val_make || '—'}</td>
      <td data-col="model">${l.val_model_variant || '—'}</td>
      <td data-col="partner">${l.rewire_partners ? l.rewire_partners.partner_name : '—'}</td>
      <td data-col="rst_no">${rstDone ? (r.rst_no || '—') : '—'}</td>
      <td data-col="weight">${rstDone ? (r.weight_kg || '—') : '—'}</td>
      <td data-col="received_date">${rstDone ? (r.rst_receipt_date || '—') : '—'}</td>
      <td data-col="unload_location">${l.logistics_unload_location || '—'}</td>
      <td data-col="pe">${l.pe ? l.pe.name : '—'}</td>
      <td data-col="manager">${l.manager ? l.manager.name : '—'}</td>
      <td>${accessoriesDone
        ? '<span class="badge badge-q">Done</span>'
        : `<button class="ab ab-form" onclick="openPlantAccessoriesCheck('${l.id}','${l.lead_no}','${vNoEsc}')"><i class="ti ti-list-check" style="font-size:11px;" aria-hidden="true"></i> Fill</button>`}</td>
      <td>${rstDone
        ? '<span class="badge badge-q">Done</span>'
        : `<button class="ab ab-form" onclick="openVehicleReceipt('${l.id}','${l.lead_no}','${(l.logistics_vehicle_send_to || '').replace(/'/g, "\\'")}','${vNoEsc}')"><i class="ti ti-clipboard-list" style="font-size:11px;" aria-hidden="true"></i> Fill</button>`}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="18" style="text-align:center;color:var(--color-text-tertiary);padding:24px;">No purchased vehicles yet.</td></tr>';
  initColumnPicker('plant', PLANT_COLUMNS, 'plantColumnPicker', 'tablePlant');
}
