<script>
// TRACKING: RC Tracking (Back Office) section, COD/CVS section, Settings (Users + Profile), Purchased section.
// ------------------------------------------------------------
// RC TRACKING SECTION
// ------------------------------------------------------------
let rcTrackPage = 0, rcTrackTotal = 0, rcTrackPageCache = [], rcTrackSearch = '';
let rcTrackReceivedPage = 0, rcTrackReceivedTotal = 0, rcTrackReceivedPageCache = [], rcTrackReceivedSearch = '';

// rc_status isn't just 'Pending' vs 'Received' — live data also has a
// legacy 'Received At Plant' value (50 rows, predates the current "Mark as
// Received" dropdown which only ever writes 'Received' now) that means the
// exact same thing. Filtering on rc_status === 'Received' alone left those
// rows stuck showing in the Pending tab even though they were genuinely
// received. Treat anything starting with "Received" as received, everywhere
// this is checked (Pending/Received tab split AND the status badge below).
function isRcReceived(status) {
  return !!(status && /^received/i.test(status));
}

// Shared fetch+join for RC Tracking Pending — paged=true is the on-screen
// page (PAGE_SIZE rows), paged=false is every matching row (for Download
// Excel), same split pattern as fetchPurchasedRows() below in this file.
async function fetchRcTrackingRows(paged) {
  const rf = tableFilterState.rc || {};
  const baseQuery = () => {
    let q = sb.from('rewire_master_data')
      .select(`id, lead_no, customer_name, phone, ud_vehicle_parking, ud_vehicle_sub_parking, val_vehicle_type, val_vehicle_number, val_make,
        val_model_variant, val_fuel_type, rc_status, created_at, rewire_partners(partner_name),
        rc_dispatch_mode, rc_carried_by, rc_courier_name, rc_pod_no,
        pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(name), manager:rewire_user_profiles!rewire_master_data_manager_id_fkey(name)`, { count: 'exact' })
      .eq('ud_status', 'Complete').eq('ud_rc_received_type', 'Physical RC').neq('overall_status', 'Closed Lost')
      .or('rc_status.is.null,rc_status.not.ilike.Received%')
      .order('created_at', { ascending: false });
    if (rf.pe) q = q.eq('pe_id', rf.pe);
    if (rf.manager) q = q.eq('manager_id', rf.manager);
    if (rf.from) q = q.gte('created_at', istDayStart(rf.from));
    if (rf.to) q = q.lte('created_at', istDayEnd(rf.to));
    q = withSearch(q, ['customer_name', 'lead_no', 'val_vehicle_number'], rcTrackSearch);
    return q;
  };

  let data, count;
  if (paged) {
    const { data: d, error, count: c } = await baseQuery().range(rcTrackPage * PAGE_SIZE, rcTrackPage * PAGE_SIZE + PAGE_SIZE - 1);
    if (error) { console.error(error); return { rows: [], total: 0 }; }
    data = d; count = c;
  } else {
    data = await fetchAllRows((from, to) => baseQuery().range(from, to)).catch(err => { console.error(err); return []; });
    count = data.length;
  }

  const leadIds = (data || []).map(l => l.id);
  const { data: trackingRows } = leadIds.length
    ? await fetchByIds(ch => sb.from('rewire_rc_tracking').select('*').in('lead_id', ch).order('tracked_on', { ascending: false }), leadIds)
    : { data: [] };
  if (trackingRows) trackingRows.sort((a, b) => String(b.tracked_on || '').localeCompare(String(a.tracked_on || '')));
  const latestByLead = {};
  (trackingRows || []).forEach(r => { if (!latestByLead[r.lead_id]) latestByLead[r.lead_id] = r; });

  const enriched = (data || []).map(l => {
    const dispatchDetail = (l.rc_dispatch_mode && l.rc_dispatch_mode !== 'Courier')
      ? (l.rc_carried_by ? `${l.rc_dispatch_mode} — ${l.rc_carried_by}` : l.rc_dispatch_mode)
      : (l.rc_courier_name ? `${l.rc_courier_name}${l.rc_pod_no ? ' · POD: ' + l.rc_pod_no : ''}` : '—');
    return { ...l, _dispatchDetail: dispatchDetail };
  });

  return { rows: enriched, total: paged ? (count || 0) : enriched.length };
}

const RC_COLUMNS = [
  { key: 'lead_no', label: 'Lead No.', get: l => l.lead_no || '' },
  { key: 'customer', label: 'Customer', get: l => l.customer_name || '' },
  { key: 'phone', label: 'Phone', get: l => l.phone || '' },
  { key: 'location', label: 'Location', get: l => l.ud_vehicle_parking || '' },
  { key: 'sub_location', label: 'Sub Location', get: l => l.ud_vehicle_sub_parking || '' },
  { key: 'vehicle_type', label: 'Vehicle Type', get: l => l.val_vehicle_type || '' },
  { key: 'vehicle_no', label: 'Vehicle No.', get: l => l.val_vehicle_number || '' },
  { key: 'make', label: 'Make', get: l => l.val_make || '' },
  { key: 'model', label: 'Model', get: l => l.val_model_variant || '' },
  { key: 'fuel_type', label: 'Fuel Type', get: l => l.val_fuel_type || '' },
  { key: 'partner', label: 'Partner', get: l => l.rewire_partners ? l.rewire_partners.partner_name : '' },
  { key: 'rc_status', label: 'RC Status', get: l => l.rc_status || 'Pending' },
  { key: 'dispatch_details', label: 'Dispatch Details', get: l => l._dispatchDetail || '' },
  { key: 'pe', label: 'PE', get: l => l.pe ? l.pe.name : '' },
  { key: 'manager', label: 'Manager', get: l => l.manager ? l.manager.name : '' },
  { key: 'created', label: 'Created', get: l => l.created_at ? new Date(l.created_at).toLocaleDateString() : '' },
];

async function exportRcTabExcel() {
  const { rows } = await fetchRcTrackingRows(false);
  if (!rows.length) { notify('No vehicles to export.', { icon: 'info' }); return; }
  exportTableColumnsToExcel('rc', rows, RC_COLUMNS, 'rewire-dms-rc-tracking.xlsx', 'RC Tracking');
}

async function renderRcTrackingSection(page = 0) {
  rcTrackPage = page;
  initTableFilterBar('rc', () => renderRcTrackingSection(0));
  const { rows, total } = await fetchRcTrackingRows(true);
  rcTrackPageCache = rows;
  rcTrackTotal = total;
  document.getElementById('countRc').textContent = rcTrackTotal + ' vehicles';

  const tbody = document.getElementById('tbodyRc');
  if (!rcTrackPageCache.length) {
    tbody.innerHTML = '<tr><td colspan="18" style="text-align:center;color:var(--color-text-tertiary);padding:24px;">No vehicles ready for RC Tracking yet.</td></tr>';
    renderPaginationControls('paginationRc', rcTrackPage, rcTrackTotal, (p) => renderRcTrackingSection(p));
    initColumnPicker('rc', RC_COLUMNS, 'rcColumnPicker', 'tableRc');
    return;
  }
  tbody.innerHTML = rcTrackPageCache.map(l => {
    return `<tr>
      <td><input type="checkbox" class="rc-select-cb" value="${l.id}" ${disposalSelection.rc.has(l.id) ? 'checked' : ''} onchange="toggleDisposalRowSelect('rc', this.value, this.checked)" /></td>
      <td data-col="lead_no"><span class="lid" style="cursor:pointer;" onclick="viewLeadDetails('${l.id}')" title="Click for full details">${l.lead_no}</span></td>
      <td data-col="customer" style="font-weight:500;">${l.customer_name}</td>
      <td data-col="phone">${l.phone}</td>
      <td data-col="location">${l.ud_vehicle_parking || '—'}</td>
      <td data-col="sub_location">${l.ud_vehicle_sub_parking || '—'}</td>
      <td data-col="vehicle_type">${l.val_vehicle_type || '—'}</td>
      <td data-col="vehicle_no">${l.val_vehicle_number || '—'}</td>
      <td data-col="make">${l.val_make || '—'}</td>
      <td data-col="model">${l.val_model_variant || '—'}</td>
      <td data-col="fuel_type">${l.val_fuel_type || '—'}</td>
      <td data-col="partner">${l.rewire_partners ? l.rewire_partners.partner_name : '—'}</td>
      <td data-col="rc_status"><span class="badge ${isRcReceived(l.rc_status) ? 'badge-q' : 'badge-na'}">${l.rc_status || 'Pending'}</span></td>
      <td data-col="dispatch_details">${l._dispatchDetail}</td>
      <td data-col="pe">${l.pe ? l.pe.name : '—'}</td>
      <td data-col="manager">${l.manager ? l.manager.name : '—'}</td>
      <td data-col="created">${l.created_at ? new Date(l.created_at).toLocaleDateString() : '—'}</td>
      <td><button class="ab ab-form" onclick="openStageFormRc('${l.id}','${l.lead_no}','pending')"><i class="ti ti-package" style="font-size:11px;" aria-hidden="true"></i> Update</button></td>
    </tr>`;
  }).join('');
  renderPaginationControls('paginationRc', rcTrackPage, rcTrackTotal, (p) => renderRcTrackingSection(p));
  initColumnPicker('rc', RC_COLUMNS, 'rcColumnPicker', 'tableRc');
  updateDisposalBulkBar('rc');
}

// ------------------------------------------------------------
// BULK SEND (Ramvir, Oct 2026) - tick several RCs, send them together with ONE courier / By Hand detail
// (same idea as Logistics multi-select). Selection survives page changes.
// ------------------------------------------------------------
function openRcBulkModal() {
  const ids = Array.from(disposalSelection.rc);
  if (!ids.length) { notify('Select at least one RC first.', { icon: 'info' }); return; }
  ['rcBulkStatus', 'rcBulkCourierName', 'rcBulkPodNo', 'rcBulkCourierDate', 'rcBulkCarriedBy', 'rcBulkHandDate'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  const pod = document.getElementById('rcBulkPodImage'); if (pod) pod.value = '';
  document.getElementById('rcBulkMode').value = 'Courier';
  handleRcBulkMode('Courier');
  document.getElementById('rcBulkModalSub').textContent = ids.length + ' vehicle(s) selected';
  openModal('rcBulkModal');
}
function handleRcBulkMode(v) {
  const person = (v === 'By Hand' || v === 'Driver' || v === 'Crane');
  document.getElementById('rcBulkCourierFields').style.display = person ? 'none' : 'contents';
  document.getElementById('rcBulkHandFields').style.display = person ? 'contents' : 'none';
  const lbl = document.getElementById('rcBulkCarriedByLabel');
  if (lbl) lbl.innerHTML = (v === 'Driver' ? 'Driver Name' : (v === 'Crane' ? 'Crane Company / Operator' : 'Carried By (Name)')) + ' <span class="req">*</span>';
}
async function submitRcBulkSend() {
  const ids = Array.from(disposalSelection.rc);
  if (!ids.length) { notify('Nothing selected.', { icon: 'info' }); return; }
  const status = document.getElementById('rcBulkStatus').value;
  if (!status) { notify('Select where the RCs are being sent (City Office / Plant).', { icon: 'error', title: 'Missing field' }); return; }
  const mode = document.getElementById('rcBulkMode').value || 'Courier';
  const payload = { rc_pe_status: status, rc_status: status, rc_dispatch_mode: mode, rc_dispatched_by: currentProfile.id, rc_dispatched_on: new Date().toISOString(), last_updated_by: currentProfile.id };
  if (mode !== 'Courier') {
    const carried = document.getElementById('rcBulkCarriedBy').value.trim();
    if (!carried) { notify('Enter who is carrying the RCs.', { icon: 'error', title: 'Missing field' }); return; }
    payload.rc_carried_by = carried;
    payload.rc_dispatch_date = document.getElementById('rcBulkHandDate').value || null;
    payload.rc_courier_name = null; payload.rc_pod_no = null;
  } else {
    const courier = document.getElementById('rcBulkCourierName').value.trim();
    const pod = document.getElementById('rcBulkPodNo').value.trim();
    if (!courier) { notify('Enter the courier name.', { icon: 'error', title: 'Missing field' }); return; }
    if (!pod) { notify('Enter the POD number.', { icon: 'error', title: 'Missing field' }); return; }
    payload.rc_courier_name = courier; payload.rc_pod_no = pod;
    payload.rc_dispatch_date = document.getElementById('rcBulkCourierDate').value || null;
    const img = document.getElementById('rcBulkPodImage');
    if (img && img.files.length) {
      const url = await uploadFile(img.files[0], 'RC_Bulk_' + new Date().toISOString().slice(0, 10), 'POD_Image');
      if (!url) { notify('POD image upload failed - try again.', { icon: 'error' }); return; }
      payload.rc_pod_image_url = url;
    }
    payload.rc_carried_by = null;
  }
  let failed = 0;
  for (let i = 0; i < ids.length; i += 100) {
    const { error } = await sb.from('rewire_master_data').update(payload).in('id', ids.slice(i, i + 100));
    if (error) { failed += ids.slice(i, i + 100).length; console.error(error); notify('Error sending RCs: ' + error.message, { icon: 'error' }); }
  }
  if (failed < ids.length) notify((ids.length - failed) + ' RC(s) sent.');
  closeModal('rcBulkModal');
  clearDisposalSelection('rc');
  await refreshLeadsTable();
  renderRcTrackingSection(rcTrackPage);
}

// RC Tracking page's rows aren't in naPageCache/qualPageCache/lostPageCache,
// so give it a small dedicated opener that just needs id + lead_no.
function onSearchRc(v) {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => { rcTrackSearch = v.trim(); renderRcTrackingSection(0); }, 350);
}

// RC TRACKING · RECEIVED — same source table, same eligibility filters,
// but rc_status starting with "Received" only (covers both the current
// 'Received' value and the legacy 'Received At Plant' one — see
// isRcReceived() above). Split into its own tab/section because Back Office
// was losing already-received rows inside the single combined list (they'd
// search a vehicle number and not realize it had moved past the "Pending"
// filter mentally, since there was no filter at all before).
async function renderRcTrackingReceivedSection(page = 0) {
  rcTrackReceivedPage = page;
  initTableFilterBar('rcreceived', () => renderRcTrackingReceivedSection(0));
  const rf = tableFilterState.rcreceived || {};
  let query = sb.from('rewire_master_data')
    .select(`id, lead_no, customer_name, phone, ud_vehicle_parking, ud_vehicle_sub_parking, val_vehicle_type, val_vehicle_number, val_make,
      val_model_variant, val_fuel_type, rc_status, created_at, rewire_partners(partner_name),
      rc_dispatch_mode, rc_carried_by, rc_courier_name, rc_pod_no,
      pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(name), manager:rewire_user_profiles!rewire_master_data_manager_id_fkey(name)`, { count: 'exact' })
    .eq('ud_status', 'Complete').eq('ud_rc_received_type', 'Physical RC').neq('overall_status', 'Closed Lost')
    .ilike('rc_status', 'Received%')
    .order('created_at', { ascending: false })
    .range(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE - 1);
  if (rf.pe) query = query.eq('pe_id', rf.pe);
  if (rf.manager) query = query.eq('manager_id', rf.manager);
  if (rf.from) query = query.gte('created_at', istDayStart(rf.from));
  if (rf.to) query = query.lte('created_at', istDayEnd(rf.to));
  query = withSearch(query, ['customer_name', 'lead_no', 'val_vehicle_number'], rcTrackReceivedSearch);
  const { data, error, count } = await query;
  if (error) { console.error(error); return; }
  rcTrackReceivedPageCache = data || [];
  rcTrackReceivedTotal = count || 0;
  document.getElementById('countRcReceived').textContent = rcTrackReceivedTotal + ' vehicles';

  const tbody = document.getElementById('tbodyRcReceived');
  if (!rcTrackReceivedPageCache.length) {
    tbody.innerHTML = '<tr><td colspan="16" style="text-align:center;color:var(--color-text-tertiary);padding:24px;">No RCs marked Received yet.</td></tr>';
    renderPaginationControls('paginationRcReceived', rcTrackReceivedPage, rcTrackReceivedTotal, (p) => renderRcTrackingReceivedSection(p));
    return;
  }
  // Received tab is view-only for PE — Back Office (and Admin/Manager/Head)
  // keep the Update action same as before; PE only gets read access here
  // (they still get full Pending-tab access, unchanged). Per Ramvir:
  // "Pending aur Received dono ka access Back Office ke pass rahega, PE ke
  // pass only Pending ka [full] access hoga, Received sirf view ke liye."
  const rcReceivedIsPe = currentProfile && currentProfile.role === 'PE';
  tbody.innerHTML = rcTrackReceivedPageCache.map(l => {
    const dispatchDetail = (l.rc_dispatch_mode && l.rc_dispatch_mode !== 'Courier')
      ? (l.rc_carried_by ? `${l.rc_dispatch_mode} — ${l.rc_carried_by}` : l.rc_dispatch_mode)
      : (l.rc_courier_name ? `${l.rc_courier_name}${l.rc_pod_no ? ' · POD: ' + l.rc_pod_no : ''}` : '—');
    const actionCell = rcReceivedIsPe
      ? `<span style="color:var(--color-text-tertiary);font-size:11px;"><i class="ti ti-eye" aria-hidden="true"></i> View only</span>`
      : `<button class="ab ab-form" onclick="openStageFormRc('${l.id}','${l.lead_no}','received')"><i class="ti ti-package" style="font-size:11px;" aria-hidden="true"></i> Update</button>`;
    return `<tr>
      <td><span class="lid" style="cursor:pointer;" onclick="viewLeadDetails('${l.id}')" title="Click for full details">${l.lead_no}</span></td>
      <td style="font-weight:500;">${l.customer_name}</td>
      <td>${l.phone}</td>
      <td>${l.ud_vehicle_parking || '—'}</td>
      <td>${l.ud_vehicle_sub_parking || '—'}</td>
      <td>${l.val_vehicle_type || '—'}</td>
      <td>${l.val_vehicle_number || '—'}</td>
      <td>${l.val_make || '—'}</td>
      <td>${l.val_model_variant || '—'}</td>
      <td>${l.val_fuel_type || '—'}</td>
      <td>${l.rewire_partners ? l.rewire_partners.partner_name : '—'}</td>
      <td>${dispatchDetail}</td>
      <td>${l.pe ? l.pe.name : '—'}</td>
      <td>${l.manager ? l.manager.name : '—'}</td>
      <td>${l.created_at ? new Date(l.created_at).toLocaleDateString() : '—'}</td>
      <td>${actionCell}</td>
    </tr>`;
  }).join('');
  renderPaginationControls('paginationRcReceived', rcTrackReceivedPage, rcTrackReceivedTotal, (p) => renderRcTrackingReceivedSection(p));
}

function onSearchRcReceived(v) {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => { rcTrackReceivedSearch = v.trim(); renderRcTrackingReceivedSection(0); }, 350);
}

// (Ramvir, Oct 2026) — `mode` ('pending' or 'received') now decides which
// section of the form shows, on TOP of the existing role check, not
// instead of it. Previously both rcPeSection (Send to Plant/City Office,
// courier/POD, dispatch mode) and rcBackOfficeSection (Mark as Received)
// showed together for any role that could see either — so Back Office/
// Admin got the exact same full form whether they opened it from the
// Pending tab or the Received tab, which is confusing and lets someone
// accidentally re-send or re-receive from the wrong tab. Now: opening from
// Pending shows only the send section; opening from Received shows only
// the receive section — each still gated by the role check it always had.
function openStageFormRc(leadId, leadNo, mode) {
  activeLeadId = leadId;
  activeLeadNo = leadNo;
  if (typeof clearModalFields === 'function') clearModalFields('#rcModal');
  const role = currentProfile ? currentProfile.role : '';

  // "Mark as Received" only makes sense once the RC has actually been sent
  // — a lead still 'With PE' (or rc_status not set at all) has nothing to
  // confirm receipt of. Admin always sees it (same "Admin bypasses
  // view-only gates" convention used everywhere else in this app).
  const lead = (rcTrackPageCache || []).find(l => l.id === leadId) || (rcTrackReceivedPageCache || []).find(l => l.id === leadId);
  // Vehicle No. shown alongside Lead No. (Ramvir, Sept 2026).
  const el = document.getElementById('rcModalSub');
  if (el) el.textContent = leadNo + (lead && lead.val_vehicle_number ? ' · ' + lead.val_vehicle_number : '');
  // Back Office now also gets the "PE — RC Status" (send) section — they're
  // often the ones actually dispatching the RC from City Office/Plant side
  // in practice, not just confirming final receipt (Ramvir, Sept 2026).
  // Back Office Head added to both sections (Ramvir, Sept 2026) — as a
  // fallback for when neither PE/Manager (send) nor Back Office (receive)
  // is available to do it. This was purely a client-side display gap: the
  // Access Control tab's rc-send/rc-received gates were already granted to
  // Back Office Head (so the tab itself was visible), and the DB's own
  // column-permission trigger already allows Back Office Head to write
  // every rc_* field Back Office can — only this hardcoded role list
  // (unrelated to the Access Control gate system) was missing the role,
  // hiding the actual form sections even though everything underneath was
  // already permitted.
  const canSeeSendSection = (role === 'PE' || role === 'Manager' || role === 'Admin' || role === 'Back Office' || role === 'Back Office Head');
  const canSeeReceiveSection = (role === 'Back Office' || role === 'Back Office Head' || role === 'Admin');
  document.getElementById('rcPeSection').style.display = (mode === 'pending' && canSeeSendSection) ? '' : 'none';
  document.getElementById('rcBackOfficeSection').style.display = (mode === 'received' && canSeeReceiveSection) ? '' : 'none';
  const dispatched = role === 'Admin' || !!(lead && (lead.rc_status === 'Send to City Office' || lead.rc_status === 'Send to Plant' || isRcReceived(lead.rc_status)));
  const receivedWrap = document.getElementById('rcReceivedStatusWrap');
  const notDispatchedNote = document.getElementById('rcNotDispatchedNote');
  if (receivedWrap) receivedWrap.style.display = dispatched ? '' : 'none';
  if (notDispatchedNote) notDispatchedNote.style.display = dispatched ? 'none' : '';

  openModal('rcModal');
}


// ------------------------------------------------------------
// COD / CVS SECTION
// ------------------------------------------------------------
let codRegOptions = [];
let codCvsCache = [];
let codCvsSearchTerm = '';

async function renderCodCvsSection() {
  initTableFilterBar('cod', renderCodCvsSection);
  // Both queries only ever grow (every COD/CVS entry ever, and every
  // delivered vehicle ever) — same silent-1000-row-cap pattern fixed
  // elsewhere this session, paginated via fetchAllRows.
  const rawCodCvs = await fetchAllRows((from, to) => sb.from('rewire_cod_cvs')
    .select('*').order('filled_on', { ascending: false }).range(from, to))
    .catch(err => { console.error(err); return []; });

  // rewire_cod_cvs is keyed by registration_number (text), not lead_id —
  // join to rewire_master_data by vehicle number to resolve PE/Manager for
  // the filter bar and display columns.
  const vehiclesForFilter = await fetchAllRows((from, to) => sb.from('rewire_master_data')
    .select(`val_vehicle_number, pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(id,name),
      manager:rewire_user_profiles!rewire_master_data_manager_id_fkey(id,name)`)
    .not('val_vehicle_number', 'is', null).range(from, to))
    .catch(err => { console.error(err); return []; });
  const leadByReg = {};
  (vehiclesForFilter || []).forEach(v => { if (v.val_vehicle_number) leadByReg[v.val_vehicle_number.toUpperCase()] = v; });
  (rawCodCvs || []).forEach(r => {
    const m = leadByReg[(r.registration_number || '').toUpperCase()];
    r.pe = m ? m.pe : null;
    r.manager = m ? m.manager : null;
  });

  codCvsCache = filterRowsByTableFilter(rawCodCvs || [], 'cod', r => r.pe ? r.pe.id : null, r => r.manager ? r.manager.id : null, r => r.cod_cvs_date || (r.filled_on ? r.filled_on.slice(0, 10) : null));

  const pending = codCvsCache.filter(r => !r.uploaded_in_dms_rewire).length;
  const completed = codCvsCache.filter(r => r.uploaded_in_dms_rewire).length;
  document.getElementById('countCod').textContent = `${codCvsCache.length} entries · ${pending} pending · ${completed} completed`;
  renderCodCvsTable(codCvsCache.filter(r => !codCvsSearchTerm || r.registration_number.toLowerCase().includes(codCvsSearchTerm)));

  // Load vehicle registration numbers (Purchased vehicles) for the searchable dropdown
  const vehicles = await fetchAllRows((from, to) => sb.from('rewire_master_data')
    .select('val_vehicle_number, customer_name').eq('ud_status', 'Complete').not('val_vehicle_number', 'is', null).range(from, to))
    .catch(err => { console.error(err); return []; });
  codRegOptions = (vehicles || []).filter(v => v.val_vehicle_number);
}

// Link cell for COD/CVS — file upload happens one row at a time here
// (bulk upload only ever carries text/number columns from Excel, never
// an actual file, so there's no bulk way to attach the scanned COD/CVS
// document itself). Shows "View" + a re-upload input if a link already
// exists (e.g. filled via the single-entry form), otherwise just the
// upload input.
function codLinkCell(r, urlField, uploadFn) {
  const url = r[urlField];
  const viewLink = isRealFileUrl(url) ? `<a href="javascript:void(0)" onclick="viewAccessoryPhoto('${url}','${urlField}')" style="color:#1d4ed8;font-size:11px;text-decoration:underline;">View</a><br/>` : '';

// ------------------------------------------------------------
// COD/CVS BULK UPLOAD — 3 independent Excel uploads (DMS/Rewire No., COD,
// CVS), one upload_type per file. Upserted by (registration_number,
// upload_type) — rewire_cod_cvs_reg_type_uidx — so re-uploading the same
// vehicle for the same type corrects it instead of duplicating, and the 3
// types can be uploaded in any order/at different times: whichever ones
// exist for a registration number just show up side by side (same
// cross-referencing the manual entry table already does by registration
// number — no extra "link" step needed).
// ------------------------------------------------------------
// "Regisration Number" (missing the 't') showed up in a real uploaded file
// (CD 18.xlsx) and silently killed the whole upload — bulkCell() found no
// header matching any candidate, so EVERY row got filtered out with no
// specific error pointing at the typo. Rather than only fix that one file,
// the misspelling is added as an accepted synonym everywhere Registration
// Number is looked up, since it's plausibly baked into other files from
// the same source/template.
const REG_NO_CANDIDATES = ['registration number', 'registration no', 'reg no', 'regisration number', 'regisration no'];
const COD_BULK_COLUMNS = {
  'DMS/Rewire No.': {
    note: 'Columns: Registration No, Urn Number',
    map: (row) => ({
      registration_number: bulkCell(row, REG_NO_CANDIDATES),
      uploaded_in_dms_rewire: bulkCell(row, ['urn number', 'urn no', 'dms/rewire no', 'dms rewire no', 'reference no']),
    }),
  },
  COD: {
    note: 'Columns: Registration Number, COD No, Voucher No, Amount, COD Issue Date',
    map: (row) => ({
      registration_number: bulkCell(row, REG_NO_CANDIDATES),
      cod_number: bulkCell(row, ['cod no', 'cod number']),
      cod_voucher_no: bulkCell(row, ['voucher no', 'voucher number']),
      cod_amount: bulkCell(row, ['amount']),
      cod_cvs_date: bulkDate(bulkCell(row, ['cod issue date', 'cod date', 'issue date'])),
    }),
  },
  CVS: {
    note: 'Columns: Registration Number, CVS No, CVS Issue Date',
    map: (row) => ({
      registration_number: bulkCell(row, REG_NO_CANDIDATES),
      cvs_number: bulkCell(row, ['cvs no', 'cvs number']),
      cod_cvs_date: bulkDate(bulkCell(row, ['cvs issue date', 'cvs date', 'issue date'])),
    }),
  },
};

// Case/spacing-tolerant column lookup — real-world Excel headers rarely
// match exactly, and this is the same class of friction the Vehicle
// Parking Location bulk import hit.
// Widened after a report of "No rows had a Registration Number" on a file
// whose header visually read "Registration Number" — the old normalizer
// only converted underscore/period to a space before collapsing
// whitespace, so a header using a hyphen/colon/slash ("Registration-Number",
// "Registration No:", a non-breaking space some Excel exports use, or a
// leading BOM character on the very first header cell) never matched any
// candidate at all, and EVERY row was dropped as a result — the column
// lookup, not the data, was the actual failure. bulkHeaderKey() now strips
// a leading BOM, then collapses ANY run of non-alphanumeric characters
// (underscore, period, hyphen, colon, slash, regular space, NBSP, etc.)
// to a single space before comparing — applied identically to both the
// file's header and the candidate name, so 'registration_number',
// 'Registration - Number', 'REGISTRATION NO.' and 'registration no' all
// normalize to the same key.
function bulkHeaderKey(s) {
  return String(s).replace(/^﻿/, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}
function bulkCell(row, candidateNames) {
  const keys = Object.keys(row);
  const normalizedCandidates = candidateNames.map(bulkHeaderKey);
  for (const name of normalizedCandidates) {
    const key = keys.find(k => bulkHeaderKey(k) === name);
    if (key && row[key] !== '' && row[key] !== undefined && row[key] !== null) return String(row[key]).trim();
  }
  return null;
}
// Excel date cells often arrive as serial numbers via SheetJS's default
// parse — convert those; anything already string-like is passed through
// to the date input's own parsing.
function bulkDate(val) {
  if (!val) return null;
  if (/^\d+(\.\d+)?$/.test(val)) {
    const d = new Date(Math.round((Number(val) - 25569) * 86400 * 1000));
    if (!isNaN(d)) return d.toISOString().slice(0, 10);
  }
  const d = new Date(val);
  return isNaN(d) ? val : d.toISOString().slice(0, 10);
}

let codBulkRows = null;

function resetCodCvsBulk() {
  codBulkRows = null;
  document.getElementById('codBulkType').value = '';
  document.getElementById('codBulkColsNote').textContent = '';
  const fileInput = document.getElementById('codBulkFile');
  if (fileInput) fileInput.value = '';
  document.getElementById('codBulkPreviewArea').style.display = 'none';
  const resultsArea = document.getElementById('codBulkResultsArea');
  resultsArea.style.display = 'none'; resultsArea.innerHTML = '';
}

function handleCodBulkTypeChange(v) {
  document.getElementById('codBulkColsNote').textContent = v ? COD_BULK_COLUMNS[v].note : '';
  codBulkRows = null;
  document.getElementById('codBulkPreviewArea').style.display = 'none';
}

function codCvsBulkFileSelected(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const type = document.getElementById('codBulkType').value;
  if (!type) { notify('Select an Upload Type first.', { icon: 'error' }); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (!json.length) { notify('File has no data rows.', { icon: 'error' }); return; }
      codBulkRows = json.map(r => COD_BULK_COLUMNS[type].map(r)).filter(r => r.registration_number);
      if (!codBulkRows.length) { notify('No rows had a Registration Number — check the column headers match: ' + COD_BULK_COLUMNS[type].note, { icon: 'error' }); return; }
      // Normalize like every other vehicle-number comparison in this app
      // (strip spaces/hyphens/dots, not just uppercase) — "RJ14 CA 1234" and
      // "RJ14CA1234" are the same vehicle but were previously treated as
      // different registration_number keys, which is exactly how the
      // "vehicle number where COD number should be" data-quality issue
      // (cleaned up separately) could have gone unnoticed on re-upload.
      codBulkRows.forEach(r => { r.registration_number = r.registration_number.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
      // De-dupe WITHIN this file by registration_number, keeping the LAST
      // occurrence (bottom of file = most recently entered, same
      // "last one wins" rule used for the RC bulk import). Without this, a
      // repeated registration_number in the same upload reaches Supabase's
      // upsert as two rows sharing one conflict key — Postgres rejects that
      // outright ("ON CONFLICT DO UPDATE command cannot affect row a second
      // time"), which fails the ENTIRE 300-row chunk containing it, not
      // just the duplicate — silently dropping up to 299 unrelated good
      // rows along with it.
      const byReg = new Map();
      codBulkRows.forEach(r => byReg.set(r.registration_number, r));
      const droppedDupes = codBulkRows.length - byReg.size;
      codBulkRows = Array.from(byReg.values());
      if (droppedDupes > 0) {
        notify(`${droppedDupes} duplicate Registration Number row(s) in this file — kept the last entry for each, dropped the earlier one(s).`, { icon: 'info' });
      }
      renderCodBulkPreview(type);
    } catch (err) {
      notify('Could not read file: ' + err.message, { icon: 'error' });
    }
  };
  reader.readAsArrayBuffer(file);
}

function renderCodBulkPreview(type) {
  const area = document.getElementById('codBulkPreviewArea');
  if (!codBulkRows || !codBulkRows.length) { area.style.display = 'none'; return; }
  const cols = Object.keys(codBulkRows[0]);
  document.getElementById('codBulkPreviewHead').innerHTML = '<tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr>';
  const show = codBulkRows.slice(0, 100);
  document.getElementById('codBulkPreviewBody').innerHTML = show.map(r => '<tr>' + cols.map(c => `<td>${r[c] === null || r[c] === '' ? '—' : r[c]}</td>`).join('') + '</tr>').join('');
  document.getElementById('codBulkPreviewCount').textContent = `${codBulkRows.length} row(s) parsed for ${type}` + (codBulkRows.length > 100 ? ' (showing first 100)' : '');
  area.style.display = '';
}

async function runCodCvsBulkUpload() {
  const type = document.getElementById('codBulkType').value;
  if (!type) { notify('Select an Upload Type.', { icon: 'error', title: 'Missing field' }); return; }
  if (!codBulkRows || !codBulkRows.length) { notify('Upload a file first.', { icon: 'error' }); return; }
  if (!confirm(`This will upsert ${codBulkRows.length} "${type}" row(s) — existing entries for the same Registration Number + Upload Type get overwritten with the file's values, missing ones get created. Continue?`)) return;

  const rows = codBulkRows.map(r => ({ ...r, upload_type: type, filled_by: currentProfile.id, filled_on: new Date().toISOString() }));
  // Chunked — same URL/payload-size caution used everywhere else large
  // arrays get sent to Supabase this session.
  let success = 0; const failed = [];
  const chunkSize = 300;
  for (let i = 0; i < rows.length; i += chunkSize) {
    const chunk = rows.slice(i, i + chunkSize);
    const { error } = await sb.from('rewire_cod_cvs').upsert(chunk, { onConflict: 'registration_number,upload_type' });
    if (error) chunk.forEach(r => failed.push({ key: r.registration_number, error: error.message }));
    else success += chunk.length;
  }

  const resultsArea = document.getElementById('codBulkResultsArea');
  resultsArea.style.display = '';
  resultsArea.innerHTML = `<div class="info-banner" style="${failed.length ? 'background:#fef2f2;border-color:#fecaca;' : ''}">
    <i class="ti ${failed.length ? 'ti-alert-triangle' : 'ti-circle-check'}" aria-hidden="true"></i>
    <span><strong>${success}</strong> row(s) uploaded.${failed.length ? ` <strong style="color:#dc2626;">${failed.length} failed</strong> — ${failed.slice(0, 5).map(f => f.key + ': ' + f.error).join('; ')}` : ''}</span>
  </div>`;
  notify(`${type} bulk upload: ${success} row(s) saved` + (failed.length ? `, ${failed.length} failed.` : '.'));
  if (typeof renderCodCvsSection === 'function') renderCodCvsSection();
}


// "COD Generated vs Vehicle Purchased" (Ramvir, Sept 2026; corrected Oct
// 2026 — see below) — a Module-1 (COD/CVS entry) report, NOT a Trader-COD
// Trading report. Purpose, per Ramvir: "humne Module 1 mein kitne COD
// upload kiye, or unme se kitni vehicle purchase ho gayi" — i.e. of every
// COD entry actually uploaded in the COD/CVS module (rewire_cod_cvs,
// upload_type='COD'), how many correspond to a vehicle that has actually
// reached overall_status='Purchased'. This is the mirror-opposite
// direction of "Vehicles Purchased vs COD Report"
// (exportCodVsPurchasedReport below), which starts from Purchased
// vehicles and checks for a COD; this one starts from COD entries and
// checks for a Purchased vehicle, which is the only angle that can catch
// a COD uploaded against a registration number with NO matching lead at
// all, or a lead that hasn't reached Purchased yet.
//
// (Ramvir, Oct 2026 — bug fix) This function used to incorrectly query
// `rewire_cod_trades` instead — a completely different table belonging to
// the separate Trader-COD DEALER TRADING module (CD-number buy/sell,
// built this session), which has no relationship to Module 1's COD/CVS
// entries. That mistake is why a genuinely-uploaded COD (e.g.
// COD2026059RJ06CF9714, present in rewire_cod_cvs) showed up as "not
// uploaded" when checked against this report — it was looking in the
// wrong module's table entirely. Rewritten below to query rewire_cod_cvs,
// same as every other Module-1 report on this page.
async function exportCodGeneratedVsPurchasedReport() {
  const codRows = await fetchAllRows((from, to) => applyReportDateFilter(
    sb.from('rewire_cod_cvs').select('registration_number, cod_number, cod_cvs_date').eq('upload_type', 'COD'), 'cod_cvs_date'
  ).range(from, to))
    .catch(err => { notify('Export failed: ' + err.message, { icon: 'error' }); return null; });
  if (codRows === null) return;
  if (!codRows.length) { notify('No CODs uploaded yet.', { icon: 'info' }); return; }

  // One row per distinct registration number — a vehicle only ever needs
  // one COD entry; if duplicates exist, keep the earliest.
  const byReg = new Map();
  codRows.forEach(r => {
    const reg = (r.registration_number || '').trim().toUpperCase();
    if (!reg) return;
    const existing = byReg.get(reg);
    if (!existing || (r.cod_cvs_date && existing.cod_cvs_date && r.cod_cvs_date < existing.cod_cvs_date)) byReg.set(reg, r);
  });
  const cods = Array.from(byReg.values());

  // Not chunked by registration number — val_vehicle_number's casing in
  // rewire_master_data isn't guaranteed to match rewire_cod_cvs's, so this
  // fetches every lead with a vehicle number once (paginated) and matches
  // client-side by uppercased value, same pattern exportCvsVsCodReport
  // above already uses for this same registration_number join.
  const leadRows = await fetchAllRows((from, to) => sb.from('rewire_master_data')
    .select('lead_no, customer_name, val_vehicle_number, val_make, val_model_variant, overall_status, ud_filled_on, pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(name), manager:rewire_user_profiles!rewire_master_data_manager_id_fkey(name)')
    .not('val_vehicle_number', 'is', null).range(from, to))
    .catch(err => { notify('Export failed: ' + err.message, { icon: 'error' }); return null; });
  if (leadRows === null) return;
  const leadByReg = {};
  leadRows.forEach(l => { leadByReg[(l.val_vehicle_number || '').trim().toUpperCase()] = l; });

  const details = cods.map(c => {
    const reg = (c.registration_number || '').trim().toUpperCase();
    const lead = leadByReg[reg] || null;
    const isPurchased = !!lead && lead.overall_status === 'Purchased';
    return {
      'COD No.': c.cod_number || '', 'Vehicle No.': c.registration_number || '',
      'CoD Date': c.cod_cvs_date ? new Date(c.cod_cvs_date).toLocaleDateString() : '',
      'Matched Lead': lead ? lead.lead_no : 'Not Matched',
      'Customer': lead ? (lead.customer_name || '') : '',
      'Make': lead ? (lead.val_make || '') : '', 'Model': lead ? (lead.val_model_variant || '') : '',
      'PE': lead && lead.pe ? lead.pe.name : '', 'Manager': lead && lead.manager ? lead.manager.name : '',
      'Vehicle Status': lead ? lead.overall_status : '—',
      'Vehicle Purchased?': isPurchased ? 'Yes' : 'No',
      'Vehicle Purchase Date': (isPurchased && lead && lead.ud_filled_on) ? new Date(lead.ud_filled_on).toLocaleDateString() : '',
    };
  });

  const totalCds = cods.length;
  const purchasedCount = details.filter(d => d['Vehicle Purchased?'] === 'Yes').length;
  const notMatchedCount = details.filter(d => d['Matched Lead'] === 'Not Matched').length;
  const matchedNotPurchased = totalCds - purchasedCount - notMatchedCount;
  const summary = [{
    'Total CoDs Uploaded': totalCds,
    'Vehicle Purchased': purchasedCount,
    'Matched to Lead, Not Yet Purchased': matchedNotPurchased,
    'Not Matched to Any Lead': notMatchedCount,
  }];
  downloadXlsxMulti('rewire-dms-cod-generated-vs-purchased-report.xlsx', [{ name: 'Summary', rows: summary }, { name: 'Details', rows: details }]);
}

  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (!json.length) { notify('File has no data rows.', { icon: 'error' }); return; }
      pbpBulkRows = json.map(row => ({
        reg_no: bulkCell(row, ['registration number', 'reg no', 'vehicle number', 'vehicle no']),
        purchase_date_raw: bulkCell(row, ['purchase date']),
        customer_name: bulkCell(row, ['customer name']),
        address: bulkCell(row, ['address']),
        city: bulkCell(row, ['city']),
        pan: bulkCell(row, ['pan/tan', 'pan tan', 'pan']),
        aadhar: bulkCell(row, ['aadhar', 'aadhaar']),
        phone: bulkCell(row, ['mobile number', 'mobile', 'phone']),
        email: bulkCell(row, ['email id', 'email']),
        make: bulkCell(row, ['vehicle make', 'make']),
        model_variant: bulkCell(row, ['model/variant', 'model variant', 'model']),
        reg_year: bulkCell(row, ['registration year']),
        vehicle_type: bulkCell(row, ['vehicle type']),
        pe_name: bulkCell(row, ['procurement executive name', 'pe name']),
        purchase_type: bulkCell(row, ['purchase type']),
        vendor_name: bulkCell(row, ['vendor name']),
        cod_ownership: bulkCell(row, ['cod ownership']),
        trader_name: bulkCell(row, ['trader name']),
        // Added (Ramvir, Sept 2026) after reviewing the actual Purchased
        // table columns — Engine No./Chassis No./Fuel Type/RC Type all show
        // there for every organically-created lead and were blank for bulk
        // ones without this; Location/Sub-Location matters for the
        // Received at Plant / Location Tracking Report, since these
        // vehicles are inserted ALREADY marked "Sent to Plant". All 6 stay
        // optional — a bulk upload not knowing them yet shouldn't block it.
        engine_no: bulkCell(row, ['engine no', 'engine number', 'engine no.']),
        chassis_no: bulkCell(row, ['chassis no', 'chassis number', 'chassis no.']),
        fuel_type: bulkCell(row, ['fuel type']),
        rc_type: bulkCell(row, ['rc type']),
        location: bulkCell(row, ['location']),
        sub_location: bulkCell(row, ['sub-location', 'sub location']),
        purchase_value: bulkCell(row, ['car purchase value', 'purchase value']),
        customer_payment: bulkCell(row, ['customer payment']),
        broker_payment: bulkCell(row, ['dealer/broker payment', 'dealer broker payment', 'broker payment']),
        cod_payment: bulkCell(row, ['cod payment']),
        bank_name: bulkCell(row, ['bank name']),
        bank_branch: bulkCell(row, ['bank branch name', 'branch name']),
        bank_account: bulkCell(row, ['bank account number', 'account number']),
        ifsc: bulkCell(row, ['ifsc code', 'ifsc']),
        remarks: bulkCell(row, ['remarks']),
      })).filter(r => r.reg_no);
      if (!pbpBulkRows.length) { notify('No rows had a Registration Number — check the file headers.', { icon: 'error' }); return; }
      // De-dupe WITHIN this file by Registration Number (keep the last
      // occurrence), same reasoning as the other bulk uploads — this
      // file's own duplicates would otherwise both try to insert as
      // separate rows.
      const byReg = new Map();
      pbpBulkRows.forEach(r => byReg.set(r.reg_no.trim().toUpperCase(), r));

async function runPlantBulkPurchaseUpload() {
  if (!pbpBulkRows || !pbpBulkRows.length) { notify('Upload a file first.', { icon: 'error' }); return; }
  if (!confirm(`This will create ${pbpBulkRows.length} brand-new "Purchased" vehicle record(s), marked as already fully processed with payment done. This cannot be bulk-undone — continue?`)) return;

  // Registration numbers already in the system — skip these instead of
  // creating a duplicate vehicle record (val_vehicle_number has no DB
  // unique constraint, so this app-level check is the only guard).
  const regsInFile = pbpBulkRows.map(r => r.reg_no.trim().toUpperCase());
  const existingRegs = new Set();
  const existingRows = await fetchAllRows((from, to) => sb.from('rewire_master_data')
    .select('val_vehicle_number').not('val_vehicle_number', 'is', null).range(from, to))
    .catch(err => { console.error(err); return []; });
  (existingRows || []).forEach(r => { if (r.val_vehicle_number) existingRegs.add(r.val_vehicle_number.trim().toUpperCase()); });

  // Procurement Executive name -> profile lookup, so the bulk vehicle
  // still shows up under the right PE/Manager elsewhere in the app (e.g.
  // PE-scoped dashboards) exactly like an organically-created lead would.
  //
  // Permanent fix (Ramvir, Sept 2026 — L7103240/NL01Q0639 bug report): this
  // used to filter .eq('role', 'PE'), so a name that matched a real profile
  // but with role Manager/Head (e.g. "Rahul Sharma", the Plant Head — used
  // on this row exactly because the purchase wasn't routed through a PE)
  // silently failed to match, leaving BOTH pe_id and manager_id null with
  // no warning anywhere. Now every role is searched: a PE match still fills
  // in pe_id + that PE's manager_id as before; a Manager/Head match sets
  // manager_id directly to that person (no PE, since there isn't one) so
  // the vehicle still shows up under the right person's team on this
  // dashboard. A name that matches nobody at all is now surfaced as an
  // explicit warning in the results banner below, instead of failing silently.
  const { data: allProfiles } = await sb.from('rewire_user_profiles').select('id, name, role, manager_id');
  const profileByName = {};
  (allProfiles || []).forEach(p => { if (p.name) profileByName[p.name.trim().toLowerCase()] = p; });

  const skipped = [];
  const unmatchedNames = [];
  const toInsert = [];
  pbpBulkRows.forEach(r => {
    const regNorm = r.reg_no.trim().toUpperCase();
    if (existingRegs.has(regNorm)) { skipped.push({ reg: r.reg_no, reason: 'Already exists in system' }); return; }
    const missing = ['customer_name', 'address', 'city', 'phone', 'make'].filter(f => !r[f]);
    if (missing.length) { skipped.push({ reg: r.reg_no, reason: 'Missing: ' + missing.join(', ') }); return; }
    if (!isValidMasterValue('location', r.city)) { skipped.push({ reg: r.reg_no, reason: `"${r.city}" is not in the Location master list` }); return; }
    r.city = normalizeMasterValue('location', r.city);
    const nameMatch = r.pe_name ? profileByName[r.pe_name.trim().toLowerCase()] : null;
    if (r.pe_name && !nameMatch) unmatchedNames.push({ reg: r.reg_no, name: r.pe_name });
    const rowPeId = nameMatch && nameMatch.role === 'PE' ? nameMatch.id : null;
    const rowManagerId = nameMatch ? (nameMatch.role === 'PE' ? nameMatch.manager_id : nameMatch.id) : null;
    const num = (v) => v ? (Number(String(v).replace(/[^0-9.]/g, '')) || null) : null;
    const purchaseValue = num(r.purchase_value);
    const brokerPayment = num(r.broker_payment);
    toInsert.push({
      _reg: r.reg_no,
      customer_name: r.customer_name,
      phone: r.phone,
      email: r.email || null,
      address: r.address,
      city: r.city,
      lead_source: r.vendor_name || 'OEM Plant Purchase',
      lead_type: 'Direct',
      lead_status: 'Qualified',
      overall_status: 'Active',
      current_stage: 9,
      entry_source: 'Plant Bulk Purchase',
      bulk_purchase_date: bulkDate(r.purchase_date_raw),
      val_vehicle_number: regNorm,
      val_make: r.make,
      val_model_variant: r.model_variant || null,
      val_registration_year: r.reg_year || null,
      val_vehicle_type: r.vehicle_type || null,
      val_engine_no: r.engine_no || null,
      val_chassis_no: r.chassis_no || null,
      val_fuel_type: r.fuel_type || null,
      val_rc_type: r.rc_type || null,
      val_status: 'Complete',
      pn_status: 'Complete',
      pn_deal_type: r.cod_ownership || null,
      pn_payment_type: r.purchase_type || null,
      pn_trader_name: r.trader_name || null,
      pn_total_offer_price: purchaseValue,
      pn_customer_payment: num(r.customer_payment),
      pn_broker_payment: brokerPayment,
      pn_cod_payment: num(r.cod_payment),
      kyc_status: 'Complete',
      kyc_pan_number: r.pan || null,
      kyc_aadhar_number: r.aadhar || null,
      kyc_bank_name: r.bank_name || null,
      kyc_branch_name: r.bank_branch || null,
      kyc_account_number: r.bank_account || null,
      kyc_ifsc_code: r.ifsc || null,
      vz_status: 'Complete',
      ud_status: 'Complete',
      ud_total_offer_price: purchaseValue,
      ud_broker_payment: brokerPayment,
      ud_vehicle_parking: r.location || null,
      ud_vehicle_sub_parking: r.sub_location || null,
      ma_status: 'Approved',
      ha_status: 'Approved',
      logistics_status: 'Sent to Plant',
      logistics_received_on: new Date().toISOString(), // already physically at plant (OEM intake) — counts as received
      val_remarks: r.remarks ? `[Plant Bulk Purchase] ${r.remarks}` : '[Plant Bulk Purchase — Honda/Tata OEM intake]',
      pe_id: rowPeId,
      manager_id: rowManagerId,
      created_by: currentProfile.id,
    });
  });

  let success = 0; const failed = [];
  const chunkSize = 50;
  for (let i = 0; i < toInsert.length; i += chunkSize) {
    const chunk = toInsert.slice(i, i + chunkSize).map(({ _reg, ...rest }) => rest);
    const chunkRegs = toInsert.slice(i, i + chunkSize).map(r => r._reg);
    const { error } = await sb.from('rewire_master_data').insert(chunk);
    if (error) chunkRegs.forEach(reg => failed.push({ reg, error: error.message }));
    else success += chunk.length;
  }

  const resultsArea = document.getElementById('pbpBulkResultsArea');
  resultsArea.style.display = '';
  const problems = [...skipped.map(s => `${s.reg}: ${s.reason}`), ...failed.map(f => `${f.reg}: ${f.error}`)];
  // Unmatched PE/Manager names get their own warning banner — these rows
  // were still created (not skipped), just without a PE/Manager, so this
  // needs to stand out separately from actual skip/fail reasons or it'll
  // get lost in that list and go unnoticed until someone spots it on the
  // dashboard weeks later (exactly what happened with L7103240).
  const unmatchedHtml = unmatchedNames.length
    ? `<div class="info-banner" style="background:#fffbeb;border-color:#fde68a;margin-top:8px;">
        <i class="ti ti-alert-triangle" aria-hidden="true"></i>
        <span><strong>${unmatchedNames.length}</strong> vehicle(s) created with PE/Manager left blank — the name entered didn't match any user in Settings &gt; Users (check spelling): ${unmatchedNames.map(u => `${u.reg} ("${u.name}")`).join('; ')}</span>
      </div>`
    : '';
  resultsArea.innerHTML = `<div class="info-banner" style="${(skipped.length || failed.length) ? 'background:#fef2f2;border-color:#fecaca;' : ''}">
    <i class="ti ${(skipped.length || failed.length) ? 'ti-alert-triangle' : 'ti-circle-check'}" aria-hidden="true"></i>
    <span><strong>${success}</strong> vehicle(s) created as Purchased.${skipped.length ? ` <strong style="color:#dc2626;">${skipped.length} skipped</strong>` : ''}${failed.length ? ` <strong style="color:#dc2626;">${failed.length} failed</strong>` : ''}${problems.length ? ' — ' + problems.slice(0, 8).join('; ') + (problems.length > 8 ? ` (+${problems.length - 8} more)` : '') : ''}</span>
  </div>${unmatchedHtml}`;
  notify(`Plant Bulk Purchase: ${success} vehicle(s) created.` + (skipped.length ? ` ${skipped.length} skipped.` : '') + (failed.length ? ` ${failed.length} failed.` : '') + (unmatchedNames.length ? ` ${unmatchedNames.length} with unmatched PE name.` : ''));
  if (typeof renderPurchasedSection === 'function') renderPurchasedSection();
}

// DOCUMENTS MANAGEMENT — one row per Purchased vehicle. Header fields
// (PE, Vehicle Reg No, Customer, Mobile, Broker/Dealer/Vendor, Pickup
// Location) are prefilled read-only from the lead. Pickup Location has no
// dedicated field anywhere in the pipeline yet, so it's shown from City
// (captured at Lead Entry) as the closest existing equivalent — swap this
// mapping if a real "Pickup Location" field gets added later.
// Each of the 13 items below gets a Source (Zoho/Manual) + Status
// (Yes/No) dropdown, saved as one flat-column row on rewire_documents
// (upsert on lead_id) — same pattern as PLANT_ACCESSORY_ITEMS/
// rewire_vehicle_receipt (JS-Operations.html). Vehicle RC additionally
// supports a reupload (its own file URL column, independent of
// val_rc_copy_url captured at Valuation).
// ------------------------------------------------------------
const DOCUMENT_ITEMS = [
  ['Customer Quotation Copy', 'doc_quotation_source', 'doc_quotation_status'],
  ['Customer Application', 'doc_application_source', 'doc_application_status'],
  ['VScrap Portal Form 2', 'doc_vscrap_form_source', 'doc_vscrap_form_status'],
  ['Letter of Authorization', 'doc_loa_source', 'doc_loa_status'],
  ['Aadhar Card Copy', 'doc_aadhar_source', 'doc_aadhar_status'],
  ['GST Registration Certificate', 'doc_gst_cert_source', 'doc_gst_cert_status'],
  ['PAN Card Copy', 'doc_pan_source', 'doc_pan_status'],
  // isRcType (5th flag) — this row's "status" column is an RC Type picker
  // (Original/FIR/ERC), not the generic Yes/No every other document uses.
  // "Collected" completeness for this row means doc_rc_status has ANY type
  // picked, not specifically === 'Yes'. hasReupload (4th flag) still
  // controls the file column.
  ['Vehicle RC (eRC/Physical RC/FIR_NCR)', 'doc_rc_source', 'doc_rc_status', true, true],
  ['Weigh Bridge Receipt', 'doc_weigh_bridge_source', 'doc_weigh_bridge_status'],
  ['Chassis Plate', 'doc_chassis_plate_source', 'doc_chassis_plate_status'],
  ['Engine Plate', 'doc_engine_plate_source', 'doc_engine_plate_status'],
  ['CoD Copy', 'doc_cod_copy_source', 'doc_cod_copy_status'],
  ['CvS Copy', 'doc_cvs_copy_source', 'doc_cvs_copy_status'],
];
// 2-person split (Ramvir, Sept 2026): Part 1 = pre-dispatch paperwork
// collected City Office side, through Vehicle RC (indices 0-7). Part 2 =
// items only collectible once the vehicle is physically at Jaipur Plant
// (Weigh Bridge Receipt, Chassis Plate, Engine Plate, CoD Copy, CvS Copy —
// indices 8-12). Each part is saved independently (submitDocumentsPart1/2
// below) so 2 different Back Office people can each fill their own part
// without clobbering the other's already-saved values.
const DOCUMENT_ITEMS_PART1 = DOCUMENT_ITEMS.slice(0, 8);
const DOCUMENT_ITEMS_PART2 = DOCUMENT_ITEMS.slice(8);
const RC_TYPE_OPTIONS = ['eRC', 'Physical RC', 'FIR_NCR'];
// "Collected" for any item = Yes, except the RC row which uses its own
// RC Type value (any of Original/FIR/ERC counts as collected).
const isDocItemCollected = (doc, statusKey, isRcType) => isRcType ? !!(doc && doc[statusKey]) : !!(doc && doc[statusKey] === 'Yes');

// (Ramvir, Oct 2026) A vehicle's documents are "Completed" once EVERY Status dropdown across Part 1 + Part 2
// has a value picked (Yes / No / RC type) - not only "Yes". Incomplete = some, but not all, dropdowns filled.
const docFilledCount = doc => DOCUMENT_ITEMS.filter(([, , statusKey]) => doc && doc[statusKey] !== null && doc[statusKey] !== undefined && String(doc[statusKey]).trim() !== '').length;
const isDocsCompleted = doc => docFilledCount(doc) === DOCUMENT_ITEMS.length;
const isDocsIncomplete = doc => { const n = docFilledCount(doc); return n > 0 && n < DOCUMENT_ITEMS.length; };

let documentsCache = [];
let documentsSearchTerm = '';

async function renderDocumentsSection() {
  // Only vehicles that are actually Purchased (overall_status = 'Purchased',
  // set on Head Approval — i.e. after payment/final closure) show here
  // (Ramvir, Sept 2026). Earlier this was gated to "Jaipur Plant" parking
  // only, which hid genuinely-purchased vehicles parked elsewhere; briefly
  // widened to "everything except Closed Lost", which wrongly pulled in
  // leads still at Need Analysis/Qualified Pipeline (nowhere near having
  // paperwork to collect). Purchased-only is the correct gate.
  const rawLeads = await fetchAllRows((from, to) => sb.from('rewire_master_data')
    .select(`id, lead_no, customer_name, phone, city, val_vehicle_number, val_rc_copy_url, rc_status, ud_rc_received_type,
      pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(name), rewire_partners(partner_name)`)
    .or('overall_status.eq.Purchased,early_plant_entry.eq.true')
    .order('ud_filled_on', { ascending: false }).range(from, to))
    .catch(err => { console.error(err); return []; });

  const docs = await fetchAllRows((from, to) => sb.from('rewire_documents').select('*').range(from, to))
    .catch(err => { console.error(err); return []; });
  const docByLead = {};
  (docs || []).forEach(d => { docByLead[d.lead_id] = d; });

  documentsCache = (rawLeads || []).map(l => ({ ...l, doc: docByLead[l.id] || null }));
  const incomplete = documentsCache.filter(l => !isDocsCompleted(l.doc)).length;
  const completedCnt = documentsCache.length - incomplete;
  document.getElementById('countDocuments').textContent = documentsCache.length + ' vehicles · ' + completedCnt + ' completed · ' + incomplete + ' incomplete';
  const badgeEl = document.getElementById('badgeDocuments');
  if (badgeEl) badgeEl.textContent = incomplete;
  applyDocumentsTableFilters();
}

// "All" vs "Incomplete" tab (Ramvir, Sept 2026) — a vehicle counts as
// incomplete the same way the "Docs Collected" badge/count above already
// does: fewer than DOCUMENT_ITEMS.length items collected (e.g. not 13/13).
// Kept as a single shared filter function so the search box and the tab
// combine correctly (searching while on "Incomplete" narrows within it,
// same as switching tabs while a search term is active).
let documentsTabFilter = 'all';
function showDocumentsTab(tab) {
  documentsTabFilter = tab;
  document.querySelectorAll('#section-documents .tab').forEach(t => t.classList.remove('active'));
  const navEl = document.getElementById('docnav-' + tab);
  if (navEl) navEl.classList.add('active');
  applyDocumentsTableFilters();
}
function applyDocumentsTableFilters() {
  let rows = documentsCache;
  // "Pending" (formerly "All") = everything not yet Completed (all 13 Status dropdowns filled).
  if (documentsTabFilter === 'all') rows = rows.filter(l => !isDocsCompleted(l.doc));
  if (documentsTabFilter === 'incomplete') {
    // "Incomplete" = partially done (1-12 of 13 items), not untouched.
    // Untouched (0/13) leads still show under "All" but not here — this
    // tab is meant to surface work Back Office already started but hasn't
    // finished, not every Purchased lead whose paperwork hasn't begun yet.
    rows = rows.filter(l => isDocsIncomplete(l.doc));
  } else if (documentsTabFilter === 'completed') {
    rows = rows.filter(l => isDocsCompleted(l.doc));
  }
  if (documentsSearchTerm) {
    rows = rows.filter(l => (l.val_vehicle_number || '').toLowerCase().includes(documentsSearchTerm)
      || (l.customer_name || '').toLowerCase().includes(documentsSearchTerm));
  }
  renderDocumentsTable(rows);
}

function openDocumentsModal(leadId) {
  const l = documentsCache.find(x => x.id === leadId);
  if (!l) { notify('Could not load lead details.', { icon: 'error' }); return; }
  activeLeadId = leadId;
  activeLeadNo = l.lead_no;
  document.getElementById('docModalSub').textContent = l.lead_no + (l.val_vehicle_number ? ' • ' + l.val_vehicle_number : '');
  document.getElementById('docPeName').textContent = l.pe ? l.pe.name : '—';
  document.getElementById('docVehicleNo').textContent = l.val_vehicle_number || '—';
  document.getElementById('docCustomerName').textContent = l.customer_name || '—';
  document.getElementById('docCustomerMobile').textContent = l.phone || '—';
  document.getElementById('docBrokerName').textContent = l.rewire_partners ? l.rewire_partners.partner_name : '—';
  document.getElementById('docPickupLocation').textContent = l.city || '—';

  const existing = l.doc || {};
  // Uploaded RC shown here = whatever was reuploaded on THIS tab
  // (doc_rc_reupload_url), falling back to the RC captured way back at
  // Valuation (val_rc_copy_url) if nothing's been reuploaded yet. A fresh
  // reupload here replaces which one is shown/linked going forward — it
  // overwrites doc_rc_reupload_url, a single-value column, so the new file
  // takes the old one's place rather than sitting alongside it.
  const currentRcUrl = existing.doc_rc_reupload_url || l.val_rc_copy_url || '';
  const docItemRowHtml = ([label, sourceKey, statusKey, hasReupload, isRcType]) => {
    const statusCell = isRcType
      ? `<select id="docSel_${statusKey}" style="border:0.5px solid var(--color-border-secondary);border-radius:5px;padding:4px 8px;font-size:12px;">
          <option value="">Select</option>
          ${RC_TYPE_OPTIONS.map(t => `<option value="${t}" ${existing[statusKey] === t ? 'selected' : ''}>${t}</option>`).join('')}
        </select>`
      : `<select id="docSel_${statusKey}" style="border:0.5px solid var(--color-border-secondary);border-radius:5px;padding:4px 8px;font-size:12px;">
          <option value="">Select</option>
          <option value="Yes" ${existing[statusKey] === 'Yes' ? 'selected' : ''}>Yes</option>
          <option value="No" ${existing[statusKey] === 'No' ? 'selected' : ''}>No</option>
        </select>`;
    const fileCell = hasReupload
      ? (currentRcUrl
          ? `<a href="javascript:void(0)" onclick="viewAccessoryPhoto('${currentRcUrl}','Vehicle RC')" style="color:#1d4ed8;font-size:11px;text-decoration:underline;">View${existing.doc_rc_reupload_url ? '' : ' (Valuation)'}</a><br/><input type="file" class="upload-field-input" id="docRcReupload" style="width:110px;" />`
          : `<input type="file" class="upload-field-input" id="docRcReupload" style="width:110px;" />`)
      : '—';
    return `<tr>
    <td style="font-weight:500;">${label}</td>
    <td>${statusCell}</td>
    <td>${fileCell}</td>
  </tr>`;
  };
  document.getElementById('docItemsBodyPart1').innerHTML = DOCUMENT_ITEMS_PART1.map(docItemRowHtml).join('');
  document.getElementById('docItemsBodyPart2').innerHTML = DOCUMENT_ITEMS_PART2.map(docItemRowHtml).join('');
  document.getElementById('docRemarks').value = existing.doc_remarks || '';
  // Single form-wide Source (Ramvir, Sept 2026, replaces the old
  // per-document Source dropdown) — prefill from whichever source value
  // is already saved on this lead (any item's *_source column, they were
  // always meant to be the same across the whole form anyway), so
  // re-opening an already-filled form doesn't reset it to blank.
  const docFormSourceSel = document.getElementById('docFormSource');
  if (docFormSourceSel) {
    const existingSource = DOCUMENT_ITEMS.map(([, sourceKey]) => existing[sourceKey]).find(Boolean) || '';
    docFormSourceSel.value = existingSource;
  }

  // RC sync badge (Ramvir, Sept 2026): RC Tracking's "Mark as Received" sets
  // rewire_master_data.rc_status = 'Received' (via the existing
  // mirror_rc_received DB trigger) but never touches doc_rc_status here —
  // we don't want to guess the RC Type. Instead, if RC Tracking already
  // says Received but Part 1's RC Type hasn't been picked yet, show an
  // informational nudge so whoever fills Part 1 knows to also set it.
  // (The reverse direction — Part 1 setting an RC Type — writes rc_status
  // itself directly in submitDocumentsPart1, no badge needed there.)
  const badge = document.getElementById('docRcSyncBadge');
  if (badge) {
    if (isRcReceived(l.rc_status) && !existing.doc_rc_status) {
      badge.style.display = '';
      badge.innerHTML = '<i class="ti ti-info-circle" aria-hidden="true"></i> RC Tracking already shows this as <strong>Received</strong> — please also select the RC Type above.';
    } else {
      badge.style.display = 'none';
    }
  }
  openModal('documentsModal');
}

async function submitDocumentsPart1() {
  if (!activeLeadId) { notify('No lead selected', { icon: 'error' }); return; }
  const values = { lead_id: activeLeadId, filled_by: currentProfile.id, filled_on: new Date().toISOString() };
  // Single form-wide Source (Ramvir, Sept 2026) — whatever's selected in
  // the header Source field at Save time applies to every item in this
  // Part, replacing the old per-document Source dropdown.
  const formSource = (document.getElementById('docFormSource') || {}).value || null;
  DOCUMENT_ITEMS_PART1.forEach(([, sourceKey, statusKey]) => {
    values[sourceKey] = formSource;
    values[statusKey] = document.getElementById('docSel_' + statusKey).value || null;
  });
  values.doc_remarks = document.getElementById('docRemarks').value.trim() || null;

  const rcFile = document.getElementById('docRcReupload');
  if (rcFile && rcFile.files && rcFile.files.length) {
    const l = documentsCache.find(x => x.id === activeLeadId);
    const url = await uploadFile(rcFile.files[0], (l && l.val_vehicle_number) || activeLeadNo || 'Unsorted', 'RC_Reupload');
    if (url) values.doc_rc_reupload_url = url;
    else notify('RC reupload failed — other fields will still be saved.', { icon: 'error' });
  }

  const { error } = await sb.from('rewire_documents').upsert(values, { onConflict: 'lead_id' });
  if (error) { notify('Error saving Part 1: ' + error.message, { icon: 'error' }); return; }

  // RC sync (Ramvir, Sept 2026): picking any RC Type here means the RC has
  // been logged/verified at the plant — mirror that into rc_status so the
  // lead also drops off RC Tracking's Pending list, same as if Back Office
  // had marked it Received there directly. Harmless no-op for leads that
  // don't use RC Tracking (non-Physical-RC types never show in that tab
  // regardless of rc_status).
  if (values.doc_rc_status) {
    const { error: rcErr } = await sb.from('rewire_master_data').update({ rc_status: 'Received' }).eq('id', activeLeadId);
    if (rcErr) console.error('RC status sync failed:', rcErr);
  }

  notify('Part 1 saved.');
  closeModal('documentsModal');
  await renderDocumentsSection();
}

async function submitDocumentsPart2() {
  if (!activeLeadId) { notify('No lead selected', { icon: 'error' }); return; }
  const values = { lead_id: activeLeadId, filled_by: currentProfile.id, filled_on: new Date().toISOString() };
  // Single form-wide Source (Ramvir, Sept 2026) — see submitDocumentsPart1's
  // comment above.
  const formSource = (document.getElementById('docFormSource') || {}).value || null;
  DOCUMENT_ITEMS_PART2.forEach(([, sourceKey, statusKey]) => {
    values[sourceKey] = formSource;
    values[statusKey] = document.getElementById('docSel_' + statusKey).value || null;

  if (error) { notify('Error saving Part 2: ' + error.message, { icon: 'error' }); return; }

  closeModal('documentsModal');
  await renderDocumentsSection();
}

// MATERIAL — rebuilt (Ramvir, Sept 2026) from his old standalone Apps
// Script "Material Management Form": one row per vehicle in
// rewire_materials (upsert on lead_id), covering all 14 old material
// categories (Fuel, Tyre, Parts, Engine, Catcon, Seats, Spare Wheel,
// Speaker, Stereo, Battery, Tyre Inventory, Rim Inventory, Jack, Jack Rod).
// Reworked a second time the same week, per Ramvir's screenshots of the
// real old-app UI: the modal now gates one category's fields at a time via
// a "Material Category" dropdown (handleMatCategoryChange, .mat-cat-group
// divs in Modals-General.html) instead of showing all 14 at once — but the
// DB row itself is still ONE combined upsert per vehicle, not a fresh row
// per category submission, since every category's fields stay in the DOM
// (just hidden) holding their last-saved value. Scoped to vehicles already
// "Received at Plant" — same real signal renderReceivedPlantSection() uses
// (rewire_vehicle_receipt.rst_no filled), not just parked at Jaipur Plant,
// since Ramvir specifically wants this AFTER the plant receipt step, not
// before.
//
// MATERIAL_CATEGORIES is the single source of truth for the 14 categories'
// column lists — used to compute the "X / 14 categories filled" badge
// (same style as Documents Management's "collected / total" badge) by
// checking whether ANY of a category's fields is non-empty on the saved
// row, matching the old app's own "fill one category, submit" granularity.
// ------------------------------------------------------------
let materialsCache = [];
let materialsSearchTerm = '';

// 4th element = the rewire_materials column holding that category's unique
// code (null for Fuel — excluded per Ramvir, Sept 2026: fuel is consumed,
// not a trackable physical item that gets a code written on it). Every
// other category's code is prefix + 6-digit sequential number
// (ENG003574, CAT002202, SPK002201, STR018514, BAT002792, TYR000001,
// RIM000001, JCK000355, JR000003 were Ramvir's own real examples), always
// generated by the get_next_material_code() DB function — the field is
// readonly (Ramvir, Sept 2026: no manual typing, only the refresh button
// sets it) and mandatory before Save for whichever category is selected.
const MATERIAL_CATEGORIES = [
  ['fuel', 'Fuel', ['mat_fuel_type', 'mat_fuel_qty', 'mat_black_oil_qty'], null],
  ['tyre', 'Tyre', ['mat_tyre_qty'], 'mat_tyre_code'],

  ['engine', 'Engine', ['mat_engine_gear', 'mat_engine_qty'], 'mat_engine_code'],

  ['seats', 'Seats', ['mat_seats_qty'], 'mat_seats_code'],
  ['spareWheel', 'Spare Wheel', ['mat_spare_wheel'], 'mat_spare_wheel_code'],
  ['speaker', 'Speaker', ['mat_speaker_qty', 'mat_speaker_photo_url'], 'mat_speaker_code'],
  ['stereo', 'Stereo', ['mat_stereo_photo_url'], 'mat_stereo_code'],
  ['battery', 'Battery', ['mat_battery_category', 'mat_battery_make', 'mat_battery_yom', 'mat_battery_parameter', 'mat_battery_weight', 'mat_battery_testing_report_url'], 'mat_battery_code'],
  ['tyreInv', 'Tyre Inv', ['mat_tyre_inv_category', 'mat_tyre_inv_make', 'mat_tyre_inv_model', 'mat_tyre_inv_thread_pct', 'mat_tyre_inv_weight'], 'mat_tyre_inv_code'],
  ['rimInv', 'Rim Inv', ['mat_rim_type', 'mat_rim_category', 'mat_rim_weight'], 'mat_rim_code'],
  ['jack', 'Jack', ['mat_jack'], 'mat_jack_code'],
  ['jackRod', 'Jack Rod', ['mat_jack_rod'], 'mat_jack_rod_code'],
];

  const cat = MATERIAL_CATEGORIES.find(([key]) => key === categoryKey);
  return cat ? cat[3] : null;
}

// Sale tab detail columns (Ramvir, Sept 2026) — he flagged that the Sale
// table never actually showed WHAT material was recorded for that vehicle
// (qty/category/make/etc, whatever got filled in on Material Entry for
// this category) — just the code + logistics/status columns. These labels
// mirror the actual field labels used in the Material Entry modal
// (Modals-General.html) for consistency. Fields ending in _url render as a
// "View" link (uploaded photo/report) instead of the raw URL text.
const MATERIAL_DETAIL_FIELD_LABELS = {
  mat_fuel_type: 'Fuel Type', mat_fuel_qty: 'Qty (Ltr)', mat_black_oil_qty: 'Black Oil Qty',
  mat_tyre_qty: 'Tyre Qty (Nos)',
  mat_parts_qty: 'Parts Qty (KGs)',
  mat_engine_gear: 'With Gear', mat_engine_qty: 'Engine Qty (KGs)',
  mat_catcon: 'Catcon', mat_catcon_fuel_type: 'Fuel Type',
  mat_seats_qty: 'Seats Qty (Nos)',
  mat_spare_wheel: 'Spare Wheel',
  mat_speaker_qty: 'Speaker Qty (Nos)', mat_speaker_photo_url: 'Speaker Photo',
  mat_stereo_photo_url: 'Stereo Photo',
  mat_battery_category: 'Battery Category', mat_battery_make: 'Battery Make', mat_battery_yom: 'Battery YoM',
  mat_battery_parameter: 'Battery Parameter', mat_battery_weight: 'Battery Weight (KG)', mat_battery_testing_report_url: 'Testing Report',
  mat_tyre_inv_category: 'Tyre Category', mat_tyre_inv_make: 'Tyre Make', mat_tyre_inv_model: 'Tyre Model',

};
const MATERIAL_URL_FIELDS = new Set(['mat_speaker_photo_url', 'mat_stereo_photo_url', 'mat_battery_testing_report_url']);
// Returns [[fieldKey, label, isUrlField], ...] for one category — the exact
// field list already used to decide "is this category filled"
// (isMaterialCategoryFilled), so the Sale table's detail columns are
// guaranteed to be the same fields Material Entry actually collected.
function materialCategoryDetailFields(categoryKey) {
  const cat = MATERIAL_CATEGORIES.find(([key]) => key === categoryKey);
  if (!cat) return [];
  const [, , fields] = cat;
  return fields.map(f => [f, MATERIAL_DETAIL_FIELD_LABELS[f] || f, MATERIAL_URL_FIELDS.has(f)]);
}
// Rebuilds the Sale table's <thead> for whichever category tab is active —

// Shows/hides the modal's .mat-cat-group blocks — only the one matching

  const codeField = materialCodeFieldFor(val);

// field itself is readonly (Ramvir, Sept 2026: no manual typing at all, this
// refresh button is the ONLY way to set/change it), used both on
// category-select and via the per-category refresh button.
async function suggestMaterialCode(categoryKey) {
  const input = document.getElementById('matCode_' + categoryKey);
  if (!input) return;
  const { data, error } = await sb.rpc('get_next_material_code', { p_category: categoryKey });

async function fetchMaterialEligibleLeadsWithMat() {
  // (Ramvir, Oct 2026) — base set must match Vehicle Disposal's exactly
  // (same .or(...) condition, including ud_vehicle_parking = 'Jaipur Plant')
  // per explicit instruction that whatever shows in Received at Plant /
  // Vehicle Disposal must ALSO show here. Found L7103024 (UP81DV7626) sitting

  // because this query was missing that same clause — logistics_status was
  // null and early_plant_entry false for it, so it fell through the old,
  // narrower condition. Added the missing clause to bring this back in sync.
  const rawLeads = await fetchAllRows((from, to) => sb.from('rewire_master_data')
    .select(`id, lead_no, customer_name, phone, val_vehicle_number, val_make, val_model_variant, ud_vehicle_parking, early_plant_entry,
      pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(name), rewire_partners(partner_name)`)
    // ud_status=Complete dropped (Oct 2026) — in lockstep with Received at
    // Plant / Vehicle Disposal: every 'Sent to Plant' vehicle shows here too.
    .or('ud_vehicle_parking.eq.Jaipur Plant,logistics_status.eq."Sent to Plant",early_plant_entry.eq.true')
    .neq('overall_status', 'Closed Lost').range(from, to))
    .catch(err => { console.error(err); return []; });

  // (Ramvir, Oct 2026) — previously ALSO required rewire_vehicle_receipt.
  // rst_no to be filled before a lead counted as eligible here ("truly
  // received" signal on top of the base candidate set). Relaxed per his
  // explicit request: a large batch of vehicles sitting in the "Received at
  // Plant" queue are already physically scrapped, but their RST/plant-check
  // paperwork hasn't been backfilled yet — he wants them workable in
  // Material Entry/Material Sale right away rather than blocked on that
  // paperwork, which can be filled in later. rawLeads here is already the
  // correct, narrow base set (ud_status=Complete AND logistics_status=
  // 'Sent to Plant', or early_plant_entry) from the Sept 2026 fix described
  // above, so dropping the extra rst_no gate does NOT reintroduce that
  // earlier bug (which was about a much broader incorrect base set, not
  // this one).
  //
  // (Ramvir, Oct 2026 — correction, then reverted) — a plant/scrap-location
  // whitelist was briefly added here to exclude leads Location Tracking
  // moved to another city, mirroring a similar fix on renderReceivedPlant
  // Section. Reverted per explicit instruction: whatever vehicles show in
  // Received at Plant must ALSO show here in Material Entry (and in
  // Vehicle Disposal) — so this stays in lockstep with that tab's own base
  // set (no location filtering), rather than being independently narrower.
  const eligibleLeads = rawLeads || [];

  const mats = await fetchAllRows((from, to) => sb.from('rewire_materials').select('*').range(from, to))
    .catch(err => { console.error(err); return []; });
  const matByLead = {};
  (mats || []).forEach(m => { matByLead[m.lead_id] = m; });

  return eligibleLeads.map(l => ({ ...l, mat: matByLead[l.id] || null }));
}

function filterMaterialTable(v) {
