// ------------------------------------------------------------
// MATERIAL SALE (Ramvir, Sept 2026) — replaces the old placeholder "Sale"
// sub-tab under Material with its own Sidebar section, one sub-tab per
// Material Category. Each sub-tab only lists vehicles that actually have
// THAT category filled on Material Entry (reuses MATERIAL_CATEGORIES'
// field list — the same "is this category filled" check as the Material
// Entry badge), with a Status dropdown (Available/Sold) and Sale Invoice
// Date/No./Amount that only matter once Sold. Backed by
// rewire_material_sales — one row per (lead, category); a missing row
// means "Available" (nothing sold yet), so most vehicles never need a row
// written at all.
// ------------------------------------------------------------
let materialSaleCache = [];
let materialSaleSearchTerm = '';
let materialSaleActiveCategory = MATERIAL_CATEGORIES[0][0];
// Stock/Sold toggle (Ramvir, Sept 2026) — the tab used to show every
// vehicle (Available + Sold) mixed together in one list; now defaults to
// showing only Stock (Available) with a separate Sold view, one click away.
let materialSaleStatusFilter = 'Stock';
// Checkbox multi-select + Print Labels (Ramvir, Sept 2026) — replaces the
// old manual Word-doc label typing. Selection is per-category-tab; cleared
// whenever the tab changes (fresh fetch) but preserved across search/status
// filtering within the same tab since those just re-filter the same cache.
let materialSaleSelectedIds = new Set();

function isMaterialCategoryFilled(mat, categoryKey) {
  if (!mat) return false;
  const cat = MATERIAL_CATEGORIES.find(([key]) => key === categoryKey);
  if (!cat) return false;
  const [, , fields] = cat;
  return fields.some(f => mat[f] !== null && mat[f] !== undefined && mat[f] !== '');
}

async function renderMaterialSaleSection() {
  // Build the sub-tab row once — MATERIAL_CATEGORIES is the single source
  // of truth, so a category added there automatically gets a Sale sub-tab
  // too, no separate list to keep in sync.
  const tabsRow = document.getElementById('matSaleTabsRow');
  if (tabsRow && !tabsRow.dataset.built) {
    tabsRow.innerHTML = MATERIAL_CATEGORIES.map(([key, label]) =>
      `<div class="tab${key === materialSaleActiveCategory ? ' active' : ''}" id="matsalenav-${key}" onclick="showMaterialSaleTab('${key}')">${label}</div>`).join('');
    tabsRow.dataset.built = '1';
  }

  // Rebuilt every time (not just once, like the tabs row above) — the
  // detail columns change per category, so switching tabs must re-render
  // the header, not just the body.
  renderMaterialSaleTableHead();

  const leads = await fetchMaterialEligibleLeadsWithMat();
  const eligibleForCat = leads.filter(l => isMaterialCategoryFilled(l.mat, materialSaleActiveCategory));
  const leadIds = eligibleForCat.map(l => l.id);
  const { data: salesRows } = leadIds.length
    ? await fetchByIds(ch => sb.from('rewire_material_sales').select('*').eq('category_key', materialSaleActiveCategory).in('lead_id', ch), leadIds)
    : { data: [] };
  const saleByLead = {};
  (salesRows || []).forEach(s => { saleByLead[s.lead_id] = s; });

  materialSaleCache = eligibleForCat.map(l => ({ ...l, sale: saleByLead[l.id] || null }));
  updateMaterialSaleCounts();
  // Fresh fetch (tab switch/section load) — old selection no longer applies
  // (different category = different unique codes on the labels anyway).
  materialSaleSelectedIds.clear();
  renderMaterialSaleTable(getMaterialSaleFilteredRows());
}

function updateMaterialSaleCounts() {
  const stOf = l => (l.sale ? l.sale.status : 'Available');
  const avail = materialSaleCache.filter(l => stOf(l) === 'Available').length;
  const soldN = materialSaleCache.filter(l => stOf(l) === 'Sold').length;
  const emptyN = materialSaleCache.filter(l => stOf(l) === 'Empty').length;
  const el = document.getElementById('countMaterialSale');
  if (el) {
    if (materialSaleStatusFilter === 'Sold') el.textContent = soldN + ' sold';
    else if (materialSaleStatusFilter === 'Empty') el.textContent = emptyN + ' empty';
    else el.textContent = avail + ' available';
  }
  const badgeEl = document.getElementById('badgeMaterialSale');
  if (badgeEl) badgeEl.textContent = avail;
}

async function bulkMaterialSaleDetails() {
  const ids = Array.from(materialSaleSelectedIds);
  if (!ids.length) return;
  const catLabel = (MATERIAL_CATEGORIES.find(([key]) => key === materialSaleActiveCategory) || [null, materialSaleActiveCategory])[1];
  const today = new Date().toISOString().slice(0, 10);
  const res = await Swal.fire({
    title: 'Sale details - ' + ids.length + ' ' + catLabel + ' item(s)',
    html: '<div style="text-align:left;font-size:13px;">'
      + '<label>Sale Invoice Date *</label><input id="bulkSaleDate" type="date" value="' + today + '" class="swal2-input" style="margin:4px 0 10px;width:100%;">'
      + '<label>Sale Invoice No. *</label><input id="bulkSaleInv" type="text" class="swal2-input" placeholder="Same invoice no. for all selected" style="margin:4px 0 10px;width:100%;">'
      + '<label>Amount per item (optional)</label><input id="bulkSaleAmt" type="number" min="0" class="swal2-input" placeholder="Leave blank to fill per row later" style="margin:4px 0 4px;width:100%;">'
      + '</div>',
    showCancelButton: true, confirmButtonText: 'Mark Sold & Save', confirmButtonColor: '#1d4ed8',
    preConfirm: () => {
      const d = document.getElementById('bulkSaleDate').value;
      const n = document.getElementById('bulkSaleInv').value.trim();
      const a = document.getElementById('bulkSaleAmt').value;
      if (!d || !n) { Swal.showValidationMessage('Invoice Date and Invoice No. are required.'); return false; }
      return { d, n, a };
    },
  });
  if (!res.isConfirmed) return;
  const { d, n, a } = res.value;
  const nowIso = new Date().toISOString();
  const rows = ids.map(id => ({
    lead_id: id, category_key: materialSaleActiveCategory, status: 'Sold',
    sale_invoice_date: d, sale_invoice_no: n, sale_amount: a === '' ? null : Number(a),
    updated_by: currentProfile.id, updated_at: nowIso,
  }));
  for (let i = 0; i < rows.length; i += 200) {
    const { error } = await sb.from('rewire_material_sales').upsert(rows.slice(i, i + 200), { onConflict: 'lead_id,category_key' });
    if (error) { notify('Error saving: ' + error.message, { icon: 'error' }); return; }
  }
  rows.forEach(r => {
    const row = materialSaleCache.find(l => l.id === r.lead_id);
    if (row) row.sale = { ...(row.sale || {}), ...r };
  });
  materialSaleSelectedIds.clear();
  updateMaterialSaleCounts();
  renderMaterialSaleTable(getMaterialSaleFilteredRows());
  notify(rows.length + ' item(s) marked Sold with Invoice ' + n + '.');
}

function showMaterialSaleTab(key) {
  materialSaleActiveCategory = key;
  document.querySelectorAll('#matSaleTabsRow .tab').forEach(t => t.classList.remove('active'));
  const el = document.getElementById('matsalenav-' + key);
  if (el) el.classList.add('active');
  renderMaterialSaleSection();
}

// Combines the search box with the Stock/Sold toggle — shared by
// renderMaterialSaleSection() (fresh fetch), filterMaterialSaleTable()
// (search typed) and setMaterialSaleStatusFilter() (toggle clicked), all of
// which re-filter the same materialSaleCache rather than re-fetching.
function getMaterialSaleFilteredRows() {
  const filtered = materialSaleCache.filter(l => {
    const st = l.sale ? l.sale.status : 'Available';
    if (materialSaleStatusFilter === 'Sold' && st !== 'Sold') return false;
    if (materialSaleStatusFilter === 'Empty' && st !== 'Empty') return false;
    if (materialSaleStatusFilter === 'Stock' && st !== 'Available') return false;
    return !materialSaleSearchTerm
      || (l.val_vehicle_number || '').toLowerCase().includes(materialSaleSearchTerm)
      || (l.customer_name || '').toLowerCase().includes(materialSaleSearchTerm);
  });
  // Sequential Unique Code order (Ramvir, Oct 2026) — rows previously came
  // back in whatever order Postgres/PostgREST happened to return (no
  // .order() in fetchMaterialEligibleLeadsWithMat()), so BAT002268,
  // BAT002419, BAT002649... appeared scrambled. Sorting here (rather than
  // adding an .order() to the fetch, which can't sort by a value that lives
  // on the joined rewire_materials row) covers every call site —
  // tab-switch, search, and the Stock/Sold toggle all go through this
  // function. { numeric:true } makes "BAT2" sort before "BAT10" instead of
  // comparing them as plain strings.
  const codeField = materialCodeFieldFor(materialSaleActiveCategory);
  if (codeField) {
    filtered.sort((a, b) => {
      const ca = (a.mat && a.mat[codeField]) || '';
      const cb = (b.mat && b.mat[codeField]) || '';
      if (!ca && !cb) return 0;
      if (!ca) return 1;   // blanks last
      if (!cb) return -1;
      return ca.localeCompare(cb, undefined, { numeric: true, sensitivity: 'base' });
    });
  }
  return filtered;
}

// Stock/Sold toggle (Ramvir, Sept 2026) — was one flat list mixing
// Available + Sold; now defaults to Stock (Available only) with Sold as a
// separate one-click view, same table/columns/print-labels underneath.
function setMaterialSaleStatusFilter(view) {
  materialSaleStatusFilter = view;
  const stockBtn = document.getElementById('matsaleStatusBtn-Stock');
  const soldBtn = document.getElementById('matsaleStatusBtn-Sold');
  const emptyBtn = document.getElementById('matsaleStatusBtn-Empty');
  if (emptyBtn) emptyBtn.className = 'btn' + (view === 'Empty' ? ' btn-primary' : '');
  updateMaterialSaleCounts();
  if (stockBtn) stockBtn.className = 'btn' + (view === 'Stock' ? ' btn-primary' : '');
  if (soldBtn) soldBtn.className = 'btn' + (view === 'Sold' ? ' btn-primary' : '');
  renderMaterialSaleTable(getMaterialSaleFilteredRows());
}

function filterMaterialSaleTable(v) {
  materialSaleSearchTerm = (v || '').toLowerCase();
  renderMaterialSaleTable(getMaterialSaleFilteredRows());
}

function renderMaterialSaleTable(rows) {
  materialSaleVisibleRows = rows || [];
  const tbody = document.getElementById('tbodyMaterialSale');
  const detailFields = materialCategoryDetailFields(materialSaleActiveCategory);
  const colCount = 11 + detailFields.length;
  const selectAllEl = document.getElementById('matsaleSelectAll');
  if (!rows || !rows.length) {
    tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align:center;color:var(--color-text-tertiary);padding:24px;">No vehicles with this category filled in Material Entry yet.</td></tr>`;
    initColumnPicker('matsale', getMaterialSaleColumns(), 'matsaleColumnPicker', 'tableMaterialSale');
    if (selectAllEl) selectAllEl.checked = false;
    updateMaterialSalePrintButtonState();
    return;
  }
  tbody.innerHTML = rows.map(l => {
    const sale = l.sale;
    const status = sale ? sale.status : 'Available';
    const isSold = status === 'Sold';
    const rowIdSafe = l.id;
    const isChecked = materialSaleSelectedIds.has(l.id);
    // Unique Code column (Ramvir, Sept 2026) — replaces Lead No.; Fuel has
    // no codeField (excluded per Ramvir), shows "—" for that sub-tab.
    const codeField = materialCodeFieldFor(materialSaleActiveCategory);
    const codeVal = (codeField && l.mat && l.mat[codeField]) ? l.mat[codeField] : '—';
    // Material-detail columns (Ramvir, Sept 2026) — "kon sa maal kitna
    // nikla", between Make/Model and Location: whatever this category's own
    // fields hold on this lead's rewire_materials row (same field list
    // Material Entry itself collects). URL fields render as a "View" link.
    const detailCells = detailFields.map(([field, label, isUrl]) => {
      const val = l.mat ? l.mat[field] : null;
      if (isUrl) {
        return `<td data-col="detail_${field}">${isRealFileUrl(val) ? `<a href="javascript:void(0)" onclick="viewAccessoryPhoto('${val}','${label}')" style="color:#1d4ed8;text-decoration:underline;">View</a>` : '—'}</td>`;
      }
      return `<td data-col="detail_${field}">${val !== null && val !== undefined && val !== '' ? val : '—'}</td>`;
    }).join('');
    // Save only makes sense once all 3 invoice fields are filled — see
    // updateMaterialSaleSaveState(), wired via oninput below.
    const canSaveNow = isSold && sale && sale.sale_invoice_date && sale.sale_invoice_no && (sale.sale_amount !== null && sale.sale_amount !== undefined && sale.sale_amount !== '');
    return `<tr>
    <td><input type="checkbox" class="matsale-row-check" data-id="${rowIdSafe}" ${isChecked ? 'checked' : ''} onchange="toggleMaterialSaleRowSelect('${rowIdSafe}', this.checked)" /></td>
    <td data-col="unique_code" style="font-weight:500;">${codeVal}</td>
    <td data-col="vehicle_no">${l.val_vehicle_number || '—'}</td>
    <td data-col="make_model">${[l.val_make, l.val_model_variant].filter(Boolean).join(' / ') || '—'}</td>
    <td data-col="entry_date">${matSaleEntryDate(l) || '—'}</td>
    ${detailCells}
    <td data-col="location">${l.ud_vehicle_parking || '—'}</td>
    <td data-col="status">
      <select id="matsaleStatus_${rowIdSafe}" onchange="handleMaterialSaleStatusChange('${rowIdSafe}', this.value)" style="border:0.5px solid var(--color-border-secondary);border-radius:5px;padding:4px 7px;font-size:12px;font-weight:700;color:${isSold ? '#dc2626' : (status === 'Empty' ? '#64748b' : '#16a34a')};">
        <option value="Available" ${status === 'Available' ? 'selected' : ''} style="color:#16a34a;">Available</option>
        <option value="Sold" ${isSold ? 'selected' : ''} style="color:#dc2626;">Sold</option>
        <option value="Empty" ${status === 'Empty' ? 'selected' : ''} style="color:#64748b;">Empty</option>
      </select>
    </td>
    <td data-col="sale_invoice_date"><input type="date" id="matsaleDate_${rowIdSafe}" value="${sale && sale.sale_invoice_date ? sale.sale_invoice_date : ''}" oninput="updateMaterialSaleSaveState('${rowIdSafe}')" ${isSold ? '' : 'disabled'} style="border:0.5px solid var(--color-border-secondary);border-radius:5px;padding:4px 7px;font-size:12px;width:130px;" /></td>
    <td data-col="sale_invoice_no"><input type="text" id="matsaleInvNo_${rowIdSafe}" value="${sale && sale.sale_invoice_no ? sale.sale_invoice_no : ''}" placeholder="Invoice No." oninput="updateMaterialSaleSaveState('${rowIdSafe}')" ${isSold ? '' : 'disabled'} style="border:0.5px solid var(--color-border-secondary);border-radius:5px;padding:4px 7px;font-size:12px;width:110px;" /></td>
    <td data-col="amount"><input type="number" min="0" onwheel="this.blur()" id="matsaleAmt_${rowIdSafe}" value="${sale && sale.sale_amount !== null && sale.sale_amount !== undefined ? sale.sale_amount : ''}" placeholder="Amount" oninput="updateMaterialSaleSaveState('${rowIdSafe}')" ${isSold ? '' : 'disabled'} style="border:0.5px solid var(--color-border-secondary);border-radius:5px;padding:4px 7px;font-size:12px;width:100px;" /></td>
    <td id="matsaleActionCell_${rowIdSafe}">${materialSaleActionCellHtml(rowIdSafe, isSold, canSaveNow)}</td>
  </tr>`;
  }).join('');
  initColumnPicker('matsale', getMaterialSaleColumns(), 'matsaleColumnPicker', 'tableMaterialSale');
  if (selectAllEl) selectAllEl.checked = rows.length > 0 && rows.every(l => materialSaleSelectedIds.has(l.id));
  updateMaterialSalePrintButtonState();
}

// Checkbox multi-select + Print Labels (Ramvir, Sept 2026) — replaces
// manually typing each label into the Word doc. Selection lives in
// materialSaleSelectedIds (by lead id), read back at print time against
// materialSaleCache so it still works even if the row is currently filtered
// out of view (e.g. selected while on "Stock", printed after switching to
// search results — the id stays selected either way).
function toggleMaterialSaleRowSelect(id, checked) {
  if (checked) materialSaleSelectedIds.add(id); else materialSaleSelectedIds.delete(id);
  const selectAllEl = document.getElementById('matsaleSelectAll');
  if (selectAllEl) selectAllEl.checked = materialSaleVisibleRows.length > 0 && materialSaleVisibleRows.every(l => materialSaleSelectedIds.has(l.id));
  updateMaterialSalePrintButtonState();
}

function toggleMaterialSaleSelectAll(checked) {
  materialSaleVisibleRows.forEach(l => {
    if (checked) materialSaleSelectedIds.add(l.id); else materialSaleSelectedIds.delete(l.id);
  });
  document.querySelectorAll('.matsale-row-check').forEach(cb => { cb.checked = checked; });
  updateMaterialSalePrintButtonState();
}

function updateMaterialSalePrintButtonState() {
  const btn = document.getElementById('matsalePrintBtn');
  if (!btn) return;
  const count = materialSaleSelectedIds.size;
  btn.disabled = count === 0;
  btn.style.opacity = count ? '' : '.45';
  btn.style.cursor = count ? '' : 'not-allowed';
  btn.innerHTML = `<i class="ti ti-printer" style="font-size:13px;" aria-hidden="true"></i> Print Labels${count ? ' (' + count + ')' : ''}`;
  const bulkBtn = document.getElementById('matsaleBulkSaleBtn');
  if (bulkBtn) {
    bulkBtn.disabled = count === 0;
    bulkBtn.style.opacity = count ? '' : '.45';
    bulkBtn.style.cursor = count ? '' : 'not-allowed';
    bulkBtn.innerHTML = `<i class="ti ti-receipt" style="font-size:13px;" aria-hidden="true"></i> Bulk Sale Details${count ? ' (' + count + ')' : ''}`;
  }
}

// Builds a print-only popup sized to the physical label (3.5in x 1.93in —
// matches the "RAVII KANT LABEL.docx" template Ramvir already uses on the
// TVS LP 46 Lite thermal printer) with one label per selected vehicle:
// Unique Code / Make-Model / Category, same fields, same bold layout. The
// user picks the TVS printer in the normal browser print dialog — no driver
// integration needed.
function printMaterialSaleLabels() {
  if (!materialSaleSelectedIds.size) return;
  const catLabel = (MATERIAL_CATEGORIES.find(([key]) => key === materialSaleActiveCategory) || [null, materialSaleActiveCategory])[1];
  const codeField = materialCodeFieldFor(materialSaleActiveCategory);
  const selected = materialSaleCache.filter(l => materialSaleSelectedIds.has(l.id));
  if (!selected.length) { notify('Selected vehicles not found — try re-selecting.', { icon: 'error' }); return; }
  const labelsHtml = selected.map(l => {
    const code = (codeField && l.mat && l.mat[codeField]) ? l.mat[codeField] : '—';
    const makeModel = [l.val_make, l.val_model_variant].filter(Boolean).join(' / ') || '—';
    // Last 4 digits of the Vehicle No. (Ramvir, Sept 2026) — printed on the
    // label alongside the Unique Code, e.g. RJ14CP3532 -> 3532.
    const vehLast4 = (l.val_vehicle_number || '').replace(/\s+/g, '').slice(-4) || '—';
    return `<div class="label-card">
      <div class="label-line label-code">${code}</div>
      <div class="label-line label-vehno">${vehLast4}</div>
      <div class="label-line label-model">${makeModel}</div>
      <div class="label-line label-cat">${catLabel}</div>
    </div>`;
  }).join('');
  const win = window.open('', '_blank', 'width=520,height=420');
  if (!win) { notify('Popup blocked — please allow popups for this site to print labels.', { icon: 'error' }); return; }
  win.document.open();
  win.document.write(`<!DOCTYPE html><html><head><title>Print Labels</title><style>
    @page { size: 1.93in 3.5in; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; }
    .label-card { width: 1.93in; height: 3.5in; padding: 0.12in 0.15in; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; page-break-after: always; }
    .label-card:last-child { page-break-after: auto; }
    .label-line { font-weight: 700; }
    .label-code { font-size: 22pt; margin-bottom: 4pt; }
    .label-vehno { font-size: 16pt; color: #1d4ed8; margin-bottom: 6pt; }
    .label-model { font-size: 14pt; margin-bottom: 6pt; }
    .label-cat { font-size: 13pt; }
  </style></head><body>${labelsHtml}</body></html>`);
  win.document.close();
  setTimeout(() => { win.focus(); win.print(); }, 300);
}

// Shared by renderMaterialSaleTable() and handleMaterialSaleStatusChange() —
// the Action cell's Save button only exists once Sold, so switching the
// Status dropdown live (without a full table re-render) needs to be able
// to inject/remove it too, not just toggle the 3 inputs' disabled state.
function materialSaleActionCellHtml(rowIdSafe, isSold, canSaveNow) {
  if (!isSold) return '<span style="color:var(--color-text-tertiary);font-size:11px;">—</span>';
  return `<button class="ab ab-form" id="matsaleSaveBtn_${rowIdSafe}" onclick="saveMaterialSaleDetails('${rowIdSafe}')" ${canSaveNow ? '' : 'disabled'} style="${canSaveNow ? '' : 'opacity:.45;cursor:not-allowed;'}" title="${canSaveNow ? 'Save' : 'Fill Sale Invoice Date, Invoice No. and Amount to save'}"><i class="ti ti-device-floppy" style="font-size:11px;" aria-hidden="true"></i> Save</button>`;
}

// Toggles the row's Save button disabled/enabled as the 3 invoice fields
// are filled in — mirrors saveMaterialSaleDetails()'s own validation so the
// button visibly can't be clicked until all 3 are present, rather than only
// failing silently/late inside the save call.
function updateMaterialSaleSaveState(leadId) {
  const dateEl = document.getElementById('matsaleDate_' + leadId);
  const invNoEl = document.getElementById('matsaleInvNo_' + leadId);
  const amtEl = document.getElementById('matsaleAmt_' + leadId);
  const btn = document.getElementById('matsaleSaveBtn_' + leadId);
  if (!btn) return;
  const ready = dateEl && dateEl.value && invNoEl && invNoEl.value.trim() && amtEl && amtEl.value !== '';
  btn.disabled = !ready;
  btn.style.opacity = ready ? '' : '.45';
  btn.style.cursor = ready ? '' : 'not-allowed';
  btn.title = ready ? 'Save' : 'Fill Sale Invoice Date, Invoice No. and Amount to save';
}

// Status change saves immediately (it's a single field, no reason to make
// the user hunt for a Save button for just this) — also toggles the 3
// invoice inputs' disabled state live so switching to Sold immediately
// makes them editable without a re-render round-trip.
async function handleMaterialSaleStatusChange(leadId, newStatus) {
  const dateEl = document.getElementById('matsaleDate_' + leadId);
  const invNoEl = document.getElementById('matsaleInvNo_' + leadId);
  const amtEl = document.getElementById('matsaleAmt_' + leadId);
  const selectEl = document.getElementById('matsaleStatus_' + leadId);
  const actionCell = document.getElementById('matsaleActionCell_' + leadId);
  const isSold = newStatus === 'Sold';
  [dateEl, invNoEl, amtEl].forEach(el => { if (el) el.disabled = !isSold; });
  if (selectEl) selectEl.style.color = isSold ? '#dc2626' : (newStatus === 'Empty' ? '#64748b' : '#16a34a');
  // Switching live (no full table re-render) — rebuild the Action cell so
  // Available -> Sold makes the Save button appear (disabled, since the 3
  // invoice fields are still blank right after the switch), and
  // Sold -> Available removes it again.
  if (actionCell) actionCell.innerHTML = materialSaleActionCellHtml(leadId, isSold, false);

  const { error } = await sb.from('rewire_material_sales').upsert({
    lead_id: leadId, category_key: materialSaleActiveCategory, status: newStatus,
    updated_by: currentProfile.id, updated_at: new Date().toISOString(),
  }, { onConflict: 'lead_id,category_key' });
  if (error) { notify('Error saving status: ' + error.message, { icon: 'error' }); return; }
  const row = materialSaleCache.find(l => l.id === leadId);
  if (row) row.sale = { ...(row.sale || {}), status: newStatus };
  notify(isSold ? 'Marked Sold — fill in invoice details and Save.' : 'Marked ' + newStatus + '.');
  updateMaterialSaleCounts();
}

async function saveMaterialSaleDetails(leadId) {
  const date = document.getElementById('matsaleDate_' + leadId).value || null;
  const invNo = document.getElementById('matsaleInvNo_' + leadId).value.trim() || null;
  const amt = document.getElementById('matsaleAmt_' + leadId).value;
  // Defense in depth — the Save button is already disabled until all 3 are
  // filled (updateMaterialSaleSaveState), but guard the actual save too.
  if (!date || !invNo || amt === '') { notify('Fill Sale Invoice Date, Invoice No. and Amount before saving.', { icon: 'error' }); return; }
  const { error } = await sb.from('rewire_material_sales').upsert({
    lead_id: leadId, category_key: materialSaleActiveCategory, status: 'Sold',
    sale_invoice_date: date, sale_invoice_no: invNo, sale_amount: amt === '' ? null : amt,
    updated_by: currentProfile.id, updated_at: new Date().toISOString(),
  }, { onConflict: 'lead_id,category_key' });
  if (error) { notify('Error saving sale details: ' + error.message, { icon: 'error' }); return; }
  notify('Sale details saved.');
}

// ------------------------------------------------------------
// STOCK BULK UPDATE (Ramvir, Sept 2026) — Admin-only, one-time-per-upload
// tool to bring historical Material/Stock data into the DMS in bulk,
// using the exact "Stock/Sold Update Format" workbook (one sheet per
// category, same headers as this app's own Material Entry + Stock tab).
// Matches by Vehicle No. against rewire_master_data, generates missing
// Unique Codes via the same get_next_material_code() RPC the in-app
// "refresh" button uses, then upserts rewire_materials (one row per
// vehicle, merging every category's detail fields) and
// rewire_material_sales (one row per vehicle+category, for Status/Sale
// Invoice fields). Runs entirely in the browser via the Supabase client —
// no size limit on how many rows this can handle in one go.
// ------------------------------------------------------------
const STOCK_BULK_CATEGORY_FIELDS = {
  'Fuel': { fields: ['mat_fuel_type', 'mat_fuel_qty', 'mat_black_oil_qty'], labels: ['Fuel Type', 'Qty (Ltr)', 'Black Oil Qty'], codeField: null, key: 'fuel' },
  'Tyre': { fields: ['mat_tyre_qty'], labels: ['Tyre Qty (Nos)'], codeField: 'mat_tyre_code', key: 'tyre' },
  'Parts': { fields: ['mat_parts_qty'], labels: ['Parts Qty (KGs)'], codeField: 'mat_parts_code', key: 'parts' },
  'Engine': { fields: ['mat_engine_gear', 'mat_engine_qty'], labels: ['With Gear', 'Engine Qty (KGs)'], codeField: 'mat_engine_code', key: 'engine' },
  'Catcon': { fields: ['mat_catcon', 'mat_catcon_fuel_type'], labels: ['Catcon', 'Fuel Type'], codeField: 'mat_catcon_code', key: 'catcon' },
  'Seats': { fields: ['mat_seats_qty'], labels: ['Seats Qty (Nos)'], codeField: 'mat_seats_code', key: 'seats' },
  'Spare Wheel': { fields: ['mat_spare_wheel'], labels: ['Spare Wheel'], codeField: 'mat_spare_wheel_code', key: 'spareWheel' },
  'Speaker': { fields: ['mat_speaker_qty', 'mat_speaker_photo_url'], labels: ['Speaker Qty (Nos)', 'Speaker Photo'], codeField: 'mat_speaker_code', key: 'speaker' },
  'Stereo': { fields: ['mat_stereo_photo_url'], labels: ['Stereo Photo'], codeField: 'mat_stereo_code', key: 'stereo' },
  'Battery': { fields: ['mat_battery_category', 'mat_battery_make', 'mat_battery_yom', 'mat_battery_parameter', 'mat_battery_weight', 'mat_battery_testing_report_url'], labels: ['Battery Category', 'Battery Make', 'Battery YoM', 'Battery Parameter', 'Battery Weight (KG)', 'Testing Report'], codeField: 'mat_battery_code', key: 'battery' },
  'Tyre Inv': { fields: ['mat_tyre_inv_category', 'mat_tyre_inv_make', 'mat_tyre_inv_model', 'mat_tyre_inv_thread_pct', 'mat_tyre_inv_weight'], labels: ['Tyre Category', 'Tyre Make', 'Tyre Model', 'Tyre Thread %', 'Tyre Weight'], codeField: 'mat_tyre_inv_code', key: 'tyreInv' },
  'Rim Inv': { fields: ['mat_rim_type', 'mat_rim_category', 'mat_rim_weight'], labels: ['Rim Type', 'Rim Category', 'Rim Weight'], codeField: 'mat_rim_code', key: 'rimInv' },
  'Jack': { fields: ['mat_jack'], labels: ['Jack'], codeField: 'mat_jack_code', key: 'jack' },
  'Jack Rod': { fields: ['mat_jack_rod'], labels: ['Jack Rod'], codeField: 'mat_jack_rod_code', key: 'jackRod' },
};
// Fields whose DB column is `numeric` — cast on the way in so PostgREST
// never rejects a value Excel handed back as a plain string.
const STOCK_BULK_NUMERIC_FIELDS = new Set([
  'mat_fuel_qty', 'mat_black_oil_qty', 'mat_tyre_qty', 'mat_parts_qty', 'mat_engine_qty',
  'mat_seats_qty', 'mat_speaker_qty', 'mat_battery_weight', 'mat_tyre_inv_thread_pct',
  'mat_tyre_inv_weight', 'mat_rim_weight',
]);

let stockBulkRows = null;

function resetStockBulkUpdate() {
  stockBulkRows = null;
  const fileInput = document.getElementById('stockBulkFile');
  if (fileInput) fileInput.value = '';
  document.getElementById('stockBulkPreviewArea').style.display = 'none';
  const resultsArea = document.getElementById('stockBulkResultsArea');
  resultsArea.style.display = 'none'; resultsArea.innerHTML = '';
}

function stockBulkUpdateFileSelected(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const parsedRows = [];
      Object.keys(STOCK_BULK_CATEGORY_FIELDS).forEach(catLabel => {
        const sheetName = wb.SheetNames.find(n => n.trim().toLowerCase() === catLabel.toLowerCase());
        if (!sheetName) return;
        const cfg = STOCK_BULK_CATEGORY_FIELDS[catLabel];
        const ws = wb.Sheets[sheetName];
        const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
        json.forEach(row => {
          const vehNo = bulkCell(row, ['vehicle no.', 'vehicle no', 'vehicle number']);
          if (!vehNo) return;
          const detail = {};
          cfg.fields.forEach((field, i) => {
            const val = bulkCell(row, [cfg.labels[i]]);
            if (val !== null) detail[field] = STOCK_BULK_NUMERIC_FIELDS.has(field) ? (isNaN(Number(val)) ? null : Number(val)) : val;
          });
          parsedRows.push({
            category: catLabel, codeField: cfg.codeField, categoryKey: cfg.key,
            vehicle_no: vehNo.trim().toUpperCase().replace(/\s+/g, ''),
            unique_code: bulkCell(row, ['unique code']),
            detail,
            status: (bulkCell(row, ['status']) || 'Available').trim(),
            sale_invoice_date: bulkDate(bulkCell(row, ['sale invoice date'])),
            sale_invoice_no: bulkCell(row, ['sale invoice no.', 'sale invoice no']),
            amount: bulkCell(row, ['amount']),
          });
        });
      });
      if (!parsedRows.length) { notify('No rows found — check the sheet names match Fuel/Tyre/Parts/Engine/Catcon/Seats/Spare Wheel/Speaker/Stereo/Battery/Tyre Inv/Rim Inv/Jack/Jack Rod.', { icon: 'error' }); return; }
      stockBulkRows = parsedRows;
      renderStockBulkUpdatePreview();
    } catch (err) {
      notify('Could not read file: ' + err.message, { icon: 'error' });
    }
  };
  reader.readAsArrayBuffer(file);
}

function renderStockBulkUpdatePreview() {
  const area = document.getElementById('stockBulkPreviewArea');
  if (!stockBulkRows || !stockBulkRows.length) { area.style.display = 'none'; return; }
  const byCategory = {};
  stockBulkRows.forEach(r => { byCategory[r.category] = (byCategory[r.category] || 0) + 1; });
  document.getElementById('stockBulkPreviewCount').innerHTML = `<b>${stockBulkRows.length}</b> row(s) parsed across ${Object.keys(byCategory).length} categor${Object.keys(byCategory).length === 1 ? 'y' : 'ies'}: ` +
    Object.entries(byCategory).map(([c, n]) => `${c} (${n})`).join(', ');
  const show = stockBulkRows.slice(0, 100);
  document.getElementById('stockBulkPreviewHead').innerHTML = '<tr><th>Category</th><th>Vehicle No.</th><th>Unique Code</th><th>Status</th></tr>';
  document.getElementById('stockBulkPreviewBody').innerHTML = show.map(r => `<tr><td>${r.category}</td><td>${r.vehicle_no}</td><td>${r.unique_code || '—'}</td><td>${r.status}</td></tr>`).join('');
  area.style.display = '';
}

async function runStockBulkUpdateUpload() {
  if (!stockBulkRows || !stockBulkRows.length) { notify('Upload a file first.', { icon: 'error' }); return; }
  if (!confirm(`This will update ${stockBulkRows.length} row(s) in the database. This directly writes Material/Stock data — continue?`)) return;

  const allLeads = await fetchAllRows((from, to) => sb.from('rewire_master_data')
    .select('id, val_vehicle_number').not('val_vehicle_number', 'is', null).range(from, to))
    .catch(err => { console.error(err); return []; });
  const leadByVeh = {};
  (allLeads || []).forEach(l => { if (l.val_vehicle_number) leadByVeh[l.val_vehicle_number.trim().toUpperCase().replace(/\s+/g, '')] = l.id; });

  const unmatched = [];
  const matched = [];
  stockBulkRows.forEach(r => {
    const leadId = leadByVeh[r.vehicle_no];
    if (!leadId) { unmatched.push(r); return; }
    matched.push({ ...r, lead_id: leadId });
  });

  // Generate any missing Unique Codes, one RPC call at a time so each call
  // sees the previous one's freshly-written max (same numbering the
  // in-app "refresh code" button relies on) — never done in parallel.
  const rowsNeedingCode = matched.filter(r => r.codeField && !r.unique_code);
  for (const r of rowsNeedingCode) {
    const { data, error } = await sb.rpc('get_next_material_code', { p_category: r.categoryKey });
    if (!error && data) r.unique_code = data;
  }

  // One rewire_materials row per vehicle — merge every category's detail
  // fields (+ code) for that vehicle into a single upsert payload.
  const materialsByLead = {};
  matched.forEach(r => {
    if (!materialsByLead[r.lead_id]) materialsByLead[r.lead_id] = { lead_id: r.lead_id };
    Object.assign(materialsByLead[r.lead_id], r.detail);
    if (r.codeField && r.unique_code) materialsByLead[r.lead_id][r.codeField] = r.unique_code;
  });
  const materialsRows = Object.values(materialsByLead);

  const CHUNK = 500;
  for (let i = 0; i < materialsRows.length; i += CHUNK) {
    const { error } = await sb.from('rewire_materials').upsert(materialsRows.slice(i, i + CHUNK), { onConflict: 'lead_id' });
    if (error) { console.error(error); notify('Error updating materials: ' + error.message, { icon: 'error' }); return; }
  }

  const salesRows = matched.map(r => ({
    lead_id: r.lead_id, category_key: r.categoryKey,
    status: r.status === 'Sold' ? 'Sold' : (r.status === 'Empty' ? 'Empty' : 'Available'),
    sale_invoice_date: r.status === 'Sold' ? (r.sale_invoice_date || null) : null,
    sale_invoice_no: r.status === 'Sold' ? (r.sale_invoice_no || null) : null,
    sale_amount: r.status === 'Sold' && r.amount ? Number(r.amount) : null,
    updated_by: currentProfile.id, updated_at: new Date().toISOString(),
  }));
  for (let i = 0; i < salesRows.length; i += CHUNK) {
    const { error } = await sb.from('rewire_material_sales').upsert(salesRows.slice(i, i + CHUNK), { onConflict: 'lead_id,category_key' });
    if (error) { console.error(error); notify('Error updating sale status: ' + error.message, { icon: 'error' }); return; }
  }

  const resultsArea = document.getElementById('stockBulkResultsArea');
  resultsArea.style.display = '';
  resultsArea.innerHTML = `<div class="info-banner" style="background:#dcfce7;border-color:#16a34a;"><i class="ti ti-check" aria-hidden="true"></i><span>${matched.length} row(s) applied across ${materialsRows.length} vehicle(s). ${unmatched.length} row(s) skipped — Vehicle No. not found in system.</span></div>` +
    (unmatched.length ? `<div style="margin-top:8px;max-height:200px;overflow:auto;font-size:12px;border:0.5px solid var(--color-border-tertiary);border-radius:6px;padding:6px 8px;">${unmatched.slice(0, 300).map(r => `${r.category} — ${r.vehicle_no}`).join('<br>')}${unmatched.length > 300 ? '<br>…and ' + (unmatched.length - 300) + ' more' : ''}</div>` : '');
  notify(`Stock bulk update complete — ${matched.length} row(s) applied, ${unmatched.length} skipped.`);
  stockBulkRows = null;
  if (typeof renderMaterialSaleSection === 'function') renderMaterialSaleSection();
}

let activeMaterialLeadId = null;

  const m = l.mat || {};
  const setVal = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };

  setVal('matBlackOilQty', m.mat_black_oil_qty);
  setVal('matTyreQty', m.mat_tyre_qty);
  setVal('matPartsQty', m.mat_parts_qty);
  setVal('matEngineGear', m.mat_engine_gear);
  setVal('matEngineQty', m.mat_engine_qty);
  setVal('matCatcon', m.mat_catcon);
  setVal('matCatconFuelType', m.mat_catcon_fuel_type);
  setVal('matSeatsQty', m.mat_seats_qty);
  setVal('matSpareWheel', m.mat_spare_wheel);
  setVal('matSpeakerQty', m.mat_speaker_qty);
  setVal('matBatteryCategory', m.mat_battery_category);
  setVal('matBatteryMake', m.mat_battery_make);
  setVal('matBatteryYom', m.mat_battery_yom);
  setVal('matBatteryParameter', m.mat_battery_parameter);
  setVal('matBatteryWeight', m.mat_battery_weight);
  setVal('matTyreInvCategory', m.mat_tyre_inv_category);
  setVal('matTyreInvMake', m.mat_tyre_inv_make);
  setVal('matTyreInvModel', m.mat_tyre_inv_model);
  setVal('matTyreInvThreadPct', m.mat_tyre_inv_thread_pct);
  setVal('matTyreInvWeight', m.mat_tyre_inv_weight);
  setVal('matRimType', m.mat_rim_type);
  setVal('matRimCategory', m.mat_rim_category);
  setVal('matRimWeight', m.mat_rim_weight);
  setVal('matJack', m.mat_jack);
  setVal('matJackRod', m.mat_jack_rod);
  setVal('matRemarks', m.mat_remarks);

  // Unique code inputs — prefill with whatever's already saved (blank if
  // this category was never filled yet; suggestMaterialCode() fills a
  // suggestion in only once that category actually gets selected, via
  // handleMatCategoryChange()).
  MATERIAL_CATEGORIES.forEach(([key, , , codeField]) => {
    if (!codeField) return;
    setVal('matCode_' + key, m[codeField]);
  });

  const fileLink = (id, url, label) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = url ? `<a href="javascript:void(0)" onclick="viewAccessoryPhoto('${url}','${label}')" style="color:#1d4ed8;text-decoration:underline;">View current ${label}</a>` : '';
  };

  ['matSpeakerPhoto', 'matStereoPhoto', 'matBatteryTestingReport'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });

  // Always opens with no category selected — same as the old app, which
  // required picking a Material Category before any fields even enabled.
  // Every category's fields above are already prefilled from the saved
  // row (or blank if never filled), so whichever category gets picked
  // next shows its real current value, not a blank field.
  const catSel = document.getElementById('matCategory');
  if (catSel) catSel.value = '';

  openModal('materialModal');
}

async function submitMaterial() {
  if (!activeMaterialLeadId) { notify('No lead selected', { icon: 'error' }); return; }
  const l = materialsCache.find(x => x.id === activeMaterialLeadId);
  const folderName = (l && l.val_vehicle_number) || (l && l.lead_no) || 'Unsorted';
  const getVal = (id) => { const el = document.getElementById(id); return el && el.value !== '' ? el.value : null; };

  const values = {
    lead_id: activeMaterialLeadId, filled_by: currentProfile.id, filled_on: new Date().toISOString(),
    mat_fuel_type: getVal('matFuelType'), mat_fuel_qty: getVal('matFuelQty'), mat_black_oil_qty: getVal('matBlackOilQty'),
    mat_tyre_qty: getVal('matTyreQty'), mat_parts_qty: getVal('matPartsQty'),
    mat_engine_gear: getVal('matEngineGear'), mat_engine_qty: getVal('matEngineQty'),
    mat_catcon: getVal('matCatcon'), mat_catcon_fuel_type: getVal('matCatconFuelType'),
    mat_seats_qty: getVal('matSeatsQty'), mat_spare_wheel: getVal('matSpareWheel'),
    mat_speaker_qty: getVal('matSpeakerQty'),
    mat_battery_category: getVal('matBatteryCategory'), mat_battery_make: getVal('matBatteryMake'),
    mat_battery_yom: getVal('matBatteryYom'), mat_battery_parameter: getVal('matBatteryParameter'),
    mat_battery_weight: getVal('matBatteryWeight'),
    mat_tyre_inv_category: getVal('matTyreInvCategory'), mat_tyre_inv_make: getVal('matTyreInvMake'),
    mat_tyre_inv_model: getVal('matTyreInvModel'), mat_tyre_inv_thread_pct: getVal('matTyreInvThreadPct'),
    mat_tyre_inv_weight: getVal('matTyreInvWeight'),
    mat_rim_type: getVal('matRimType'), mat_rim_category: getVal('matRimCategory'), mat_rim_weight: getVal('matRimWeight'),
    mat_jack: getVal('matJack'), mat_jack_rod: getVal('matJackRod'),
    mat_remarks: getVal('matRemarks'),
  };

  // Unique codes — every category's code input stays in the DOM (just
  // hidden), same "resubmit the full set" pattern as every other field
  // here, so whichever code(s) were generated/edited across however many
  // categories get saved together.
  MATERIAL_CATEGORIES.forEach(([key, , , codeField]) => {
    if (codeField) values[codeField] = getVal('matCode_' + key);
  });

  // Unique Code is mandatory for EVERY category that actually has data
  // filled in on this save — not just whichever category the dropdown
  // happens to be sitting on when Save is clicked (Ramvir, Sept 2026 bug
  // fix). This form combines all 14 categories into one save, so a PE can
  // fill Tyre, then Catcon, then land back on a third category before
  // hitting Save — the old check only validated that third (active)
  // category, silently letting Catcon's "Yes" save with a blank code (5
  // rows found missing mat_catcon_code this way). Fuel has no code field,
  // skipped via codeField being null.
  for (const [key, label, fields, codeField] of MATERIAL_CATEGORIES) {
    if (!codeField) continue;
    const hasData = fields.some(f => values[f] !== null && values[f] !== undefined && values[f] !== '');
    if (hasData && !values[codeField]) {
      notify(`Unique Code is required for "${label}" — switch to that category tab and click the refresh button to generate one before saving.`, { icon: 'error', title: 'Missing Unique Code' });
      return;
    }
  }

  // 3 optional photo/document uploads — only overwrite if a new file was
  // actually chosen this time, same "keep existing unless replaced"
  // pattern as Documents Management's RC reupload.
  const uploads = [
    ['matSpeakerPhoto', 'mat_speaker_photo_url', 'Material_Speaker'],
    ['matStereoPhoto', 'mat_stereo_photo_url', 'Material_Stereo'],
    ['matBatteryTestingReport', 'mat_battery_testing_report_url', 'Material_BatteryReport'],
  ];
  for (const [inputId, col, label] of uploads) {
    const input = document.getElementById(inputId);
    if (input && input.files && input.files.length) {
      const url = await uploadFile(input.files[0], folderName, label);
      if (url) values[col] = url;
      else notify(`${label.replace('Material_', '')} upload failed — other fields will still be saved.`, { icon: 'error' });
    }
  }

  const { error } = await sb.from('rewire_materials').upsert(values, { onConflict: 'lead_id' });
  if (error) { notify('Error saving Material: ' + error.message, { icon: 'error' }); return; }
  notify('Material saved.');
  closeModal('materialModal');
  await renderMaterialSection();
}

// ------------------------------------------------------------
// LEAD HEALTH CHECK — Settings tab (Admin only). Structured, reusable
// checks for the "stuck lead" data patterns that have repeatedly needed
// one-off manual SQL fixes throughout this project (fake-complete stage
// data, pn_payment_type typos, approved leads missing their Payments
// row). Add a new check by adding one entry to HEALTH_CHECKS — the
// panel (renderHealthCheckPanel) and the run/fix wiring are generic.
// ------------------------------------------------------------
let healthCheckCache = {};

const HEALTH_CHECKS = [
  {
    key: 'fake-complete',
    title: 'Fake-complete stage data',
    description: 'A stage shows status "Complete" but its filled_on date is blank — proof it was never actually filled through the app (only the real submit sets filled_on). Blocks re-editing that stage and misrepresents the lead’s real progress. Same pattern fixed manually for Upload Delivery, then Valuation/Price Negotiation/Bank KYC, across this project.',
    run: async () => {
      const { data, error } = await sb.from('rewire_master_data')
        .select('id, lead_no, customer_name, current_stage, pn_payment_type, val_status, val_filled_on, pn_status, pn_filled_on, kyc_status, kyc_filled_on, ud_status, ud_filled_on')
        .neq('overall_status', 'Closed Lost');
      if (error) throw error;
      const rows = [];
      (data || []).forEach(l => {
        if (l.val_status === 'Complete' && !l.val_filled_on && l.current_stage > 0) rows.push({ lead: l, stage: 'Valuation', field: 'val', resetTo: 0 });
        if (l.pn_status === 'Complete' && !l.pn_filled_on && l.current_stage > 1) rows.push({ lead: l, stage: 'Price Negotiation', field: 'pn', resetTo: 1 });
        if (l.kyc_status === 'Complete' && !l.kyc_filled_on && l.current_stage > 2) rows.push({ lead: l, stage: 'Bank KYC', field: 'kyc', resetTo: 2 });
        const isPostDelivery = !l.pn_payment_type || l.pn_payment_type === 'Post Delivery';
        const udDue = isPostDelivery ? l.current_stage > 3 : true; // decoupled types: always worth checking regardless of current_stage
        if (l.ud_status === 'Complete' && !l.ud_filled_on && udDue) rows.push({ lead: l, stage: 'Upload Delivery', field: 'ud', resetTo: isPostDelivery ? 3 : null });
      });
      return rows;
    },
    describeRow: (r) => `${r.lead.lead_no} — ${r.lead.customer_name} — fake "${r.stage}" Complete`,
    // Grouped by lead first — a lead fake at more than one stage at once
    // (rare, but possible) resets to the EARLIEST of them, not each one
    // independently overwriting the last (same cascading-safety intent
    // as the original manual SQL batches).
    fix: async (rows) => {
      const byLead = {};
      rows.forEach(r => { (byLead[r.lead.id] = byLead[r.lead.id] || []).push(r); });
      for (const leadId of Object.keys(byLead)) {
        const group = byLead[leadId];
        const update = { overall_status: 'Active' };
        const stageTargets = group.filter(r => r.field !== 'ud' && r.resetTo !== null).map(r => r.resetTo);
        const udRow = group.find(r => r.field === 'ud');
        if (udRow) { update.ud_status = null; if (udRow.resetTo !== null) stageTargets.push(udRow.resetTo); }
        if (stageTargets.length) update.current_stage = Math.min(...stageTargets);
        const { error } = await sb.from('rewire_master_data').update(update).eq('id', leadId);
        if (error) throw error;
      }
    },
  },
  {
    key: 'payment-type-typo',
    title: 'Payment Type typo',
    description: 'pn_payment_type isn’t exactly one of the 4 valid values (Post Delivery / Advance Payment / Omini Pay / Instant Payments) — breaks every exact-string check for that lead (Manager Approval/Upload Delivery tab membership, the DB trigger’s validation, etc.) without raising any visible error.',
    run: async () => {
      // Was previously passing '("Post Delivery",...)' as a raw string to
      // .not(col,'in',...) with embedded literal quote characters that
      // never match real data — the filter matched nearly EVERY non-null
      // lead (328 leads on one run) instead of just actual typos. Tried
      // passing a plain JS array next, but unlike .in(), supabase-js's
      // .not() does NOT auto-wrap an array value in the required
      // PostgREST in.(...) parentheses for a third-argument value — it
      // just CSV-joins it, producing an invalid "not.in.a,b,c" filter
      // (confirmed by the "failed to parse filter" error). PostgREST's
      // in-list syntax needs the surrounding parens built by hand; plain
      // spaces inside a value ("Post Delivery") don't need quoting,
      // only commas/parens/quotes/leading-trailing-whitespace would.
      // Also excluding Closed Lost leads — same as the other 2 checks —
      // since fixing them trips check_stage_progression()'s guard for no
      // benefit (a Closed Lost lead never shows in any active tab anyway).
      const VALID_PAYMENT_TYPES = ['Post Delivery', 'Advance Payment', 'Omini Pay', 'Instant Payments'];
      const { data, error } = await sb.from('rewire_master_data')
        .select('id, lead_no, customer_name, pn_payment_type, overall_status')
        .not('pn_payment_type', 'is', null)
        .not('pn_payment_type', 'in', `(${VALID_PAYMENT_TYPES.join(',')})`)
        .neq('overall_status', 'Closed Lost');
      if (error) throw error;
      return (data || []).map(l => ({ lead: l }));
    },
    describeRow: (r) => `${r.lead.lead_no} — ${r.lead.customer_name} — Payment Type: "${r.lead.pn_payment_type}"`,
    fix: async (rows) => {
      const skipped = [];
      for (const r of rows) {
        // Defensive — same guard the run() query now applies, in case a
        // lead was closed out between scanning and fixing.
        if (r.lead.overall_status === 'Closed Lost') { skipped.push(r.lead.lead_no); continue; }
        const raw = (r.lead.pn_payment_type || '').toLowerCase();
        let corrected = null;
        if (raw.includes('instant')) corrected = 'Instant Payments';
        else if (raw.includes('omini') || raw.includes('omni')) corrected = 'Omini Pay';
        else if (raw.includes('advance')) corrected = 'Advance Payment';
        else if (raw.includes('post') || raw.includes('delivery')) corrected = 'Post Delivery';
        if (!corrected) continue; // not recognizable — leave for manual review rather than guess wrong
        const { error } = await sb.from('rewire_master_data').update({ pn_payment_type: corrected }).eq('id', r.lead.id);
        if (error) throw error;
      }
      if (skipped.length) notify('Skipped ' + skipped.length + ' Closed Lost lead(s): ' + skipped.join(', '), { icon: 'info' });
    },
  },
  {
    key: 'missing-payment-row',
    title: 'Approved lead missing its Payment row',
    description: 'Head Approval (or Payment Release for Advance Payment/Omini Pay) is done, but rewire_payments has no Customer/Broker row for it — Accounts never sees it to actually pay. Same check as the "Find Missing Payment Rows" button on the Payments tab, offered here too for one place to run every check.',
    run: async () => {
      // Both queries now go through fetchAllRows() (JS-Core.html) — a
      // plain .select() with no .range() silently caps at 1000 rows, and
      // rewire_payments alone has 4700+, so the old unpaginated fetch
      // below was missing most already-existing rows and flagging them
      // as "missing" (675 false positives, then failing on insert with
      // rewire_payments' unique lead_id+payment_type constraint since
      // the row was there all along).
      // NOT scoping this by .in('lead_id', eligibleIds) — eligible can run
      // into the thousands, and cramming that many UUIDs into one query's
      // URL blew past the URL length limit ("TypeError: Failed to fetch",
      // the request never even reaching the server). Paginating the whole
      // table instead is bounded either way (~5 requests for 4700 rows).
      const eligible = await fetchAllRows((from, to) => sb.from('rewire_master_data')
        .select('id, lead_no, customer_name, pn_customer_payment, pn_broker_payment, ud_customer_payment, ud_broker_payment')
        .neq('overall_status', 'Closed Lost')
        .or('ha_status.eq.Approved,payment_release_status.eq.Approved')
        .range(from, to));
      // Also checking rewire_payments_archive, not just the live table —
      // a payment that's already been marked Completed moves there (see
      // updatePaymentStatus/completePayment, JS-Payments.html), so a
      // lead whose Broker or Customer side was already fully paid had NO
      // row left in the live table at all. Without this, this check
      // treated "already paid and archived" the same as "genuinely never
      // created" and inserted a brand new duplicate row — that's exactly
      // what happened to L7102491's Broker payment (already Completed +
      // archived on 2026-09-04, then a second Broker row got created by
      // this exact check an hour later, since it only looked here).
      const existing = await fetchAllRows((from, to) => sb.from('rewire_payments').select('lead_id, payment_type').range(from, to));
      const existingArchived = await fetchAllRows((from, to) => sb.from('rewire_payments_archive').select('lead_id, payment_type').range(from, to));
      const haveCustomer = new Set(), haveBroker = new Set();
      [...(existing || []), ...(existingArchived || [])].forEach(r => {
        if (r.payment_type === 'Customer') haveCustomer.add(r.lead_id);
        if (r.payment_type === 'Broker') haveBroker.add(r.lead_id);
      });
      const rows = [];
      (eligible || []).forEach(l => {
        const custAmt = l.ud_customer_payment || l.pn_customer_payment || 0;
        const brokAmt = l.ud_broker_payment || l.pn_broker_payment || 0;
        if (custAmt > 0 && !haveCustomer.has(l.id)) rows.push({ lead: l, type: 'Customer', amount: custAmt });
        if (brokAmt > 0 && !haveBroker.has(l.id)) rows.push({ lead: l, type: 'Broker', amount: brokAmt });
      });
      return rows;
    },
    describeRow: (r) => `${r.lead.lead_no} — ${r.lead.customer_name} — missing ${r.type} row — ₹${r.amount}`,
    fix: async (rows) => {
      const inserts = rows.map(r => ({ lead_id: r.lead.id, payment_type: r.type, amount: r.amount, status: 'Pending' }));
      const { error } = await sb.from('rewire_payments').insert(inserts);
      if (error) throw error;
    },
  },
];

// Lead No. / Vehicle No. lookup — the user's own suggestion for the
// Health Check panel: find any lead directly (however stuck/wherever it
// currently is) and open its full View Lead Details popup rather than
// hunting for which tab it's sitting in. Reuses viewLeadDetails(), which
// (as of the Admin-only Customer/Lead Details "Edit" link added there)
// already gives Admin full edit access from that popup no matter the stage.
async function runLeadLookup() {
  const input = document.getElementById('hcLookupInput');
  const resultEl = document.getElementById('hcLookupResult');
  const q = (input && input.value || '').trim();
  if (!resultEl) return;
  if (!q) { resultEl.innerHTML = '<div style="font-size:12px;color:var(--color-text-tertiary,#6b7280);">Enter a Lead No. or Vehicle No.</div>'; return; }
  resultEl.innerHTML = '<div style="font-size:12px;color:var(--color-text-tertiary,#6b7280);">Searching…</div>';
  try {
    const { data, error } = await sb.from('rewire_master_data')
      .select('id, lead_no, customer_name, val_vehicle_number, current_stage, overall_status, lead_status')
      .or(`lead_no.ilike.%${q}%,val_vehicle_number.ilike.%${q}%`)
      .order('created_at', { ascending: false })
      .limit(15);
    if (error) throw error;
    if (!data || !data.length) { resultEl.innerHTML = '<div style="font-size:12px;color:var(--color-text-tertiary,#6b7280);">No lead found matching "' + q + '".</div>'; return; }
    resultEl.innerHTML = data.map(l => `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--color-border-tertiary);">
        <div style="cursor:pointer;flex:1;" onclick="viewLeadDetails('${l.id}')">
          <div style="font-size:13px;font-weight:600;">${l.lead_no} — ${l.customer_name || '—'}</div>
          <div style="font-size:11.5px;color:var(--color-text-tertiary,#6b7280);">${l.val_vehicle_number || 'No vehicle no. yet'} · ${l.overall_status}${l.overall_status === 'Active' ? ' · Stage ' + l.current_stage + ' of 8' : ''}</div>
        </div>
        <button class="btn btn-outline" style="flex-shrink:0;font-size:11px;padding:4px 8px;" onclick="event.stopPropagation();diagnosePaymentVisibility('${l.id}')">Why not in Payments?</button>
        <span style="font-size:11px;color:#1d4ed8;font-weight:600;cursor:pointer;" onclick="viewLeadDetails('${l.id}')">Open →</span>
      </div>`).join('');
  } catch (e) {
    resultEl.innerHTML = `<div style="font-size:12px;color:#dc2626;">Search failed: ${e.message}</div>`;
  }
}

// Self-service answer to "why isn't this lead's payment showing?" — runs
// the EXACT same eligibility logic renderPaymentsSection()/
// renderPaymentsHoldSection()/renderPendingUtrSection() (JS-Payments.html)
// apply, against a fresh read of the lead + its rewire_payments +
// rewire_payments_archive rows, and reports which specific check
// passes/fails for each side (Customer/Broker), and which of the 4
// Payments tabs (Pending/Hold/Pending UTR/Archive) it should actually be
// sitting in right now. Built after several rounds of "still not showing"
// reports that turned out to need a fresh SQL round-trip each time
// (L7101673 among them) — this gives a definitive, instant answer
// in-app instead, including flagging the one thing that CAN'T be checked
// from here: a leftover PE/Manager/Date filter left active on the
// Payments page itself (tableFilterState, JS-Core.html) from an earlier
// visit, which silently hides an otherwise-eligible row.
async function diagnosePaymentVisibility(leadId) {
  const { data: lead, error } = await sb.from('rewire_master_data')
    .select('id, lead_no, customer_name, overall_status, pn_payment_type, ha_status, payment_release_status, pn_customer_payment, pn_broker_payment, ud_customer_payment, ud_broker_payment')
    .eq('id', leadId).single();
  if (error || !lead) { notify('Could not load lead.', { icon: 'error' }); return; }
  const [{ data: liveRows }, { data: archiveRows }] = await Promise.all([
    sb.from('rewire_payments').select('*').eq('lead_id', leadId),
    sb.from('rewire_payments_archive').select('*').eq('lead_id', leadId),
  ]);

  const isOmini = lead.pn_payment_type === 'Omini Pay';
  const isInstant = lead.pn_payment_type === 'Instant Payments';
  const isAdvance = lead.pn_payment_type === 'Advance Payment';
  const gate = isAdvance ? lead.payment_release_status === 'Approved' : lead.ha_status === 'Approved';

  const lines = [];
  lines.push(`<div style="font-weight:700;margin-bottom:4px;">${lead.lead_no} — ${lead.customer_name || '—'}</div>`);
  lines.push(`<div style="font-size:12px;color:#6b7280;margin-bottom:10px;">Type: ${lead.pn_payment_type || '—'} · Overall: ${lead.overall_status} · ha_status: ${lead.ha_status || '—'} · payment_release_status: ${lead.payment_release_status || '—'}</div>`);

  if (isOmini) {
    lines.push(`<div style="color:#d97706;">Omini Pay has its OWN tab — it's deliberately excluded from Payments/Hold/Pending UTR. Check the Omini Pay tab instead.</div>`);
  } else if (isInstant) {
    lines.push(`<div style="color:#d97706;">Instant Payments bypass Pending/Hold entirely by design — check the Pending UTR tab, not Pending.</div>`);
  } else if (!gate) {
    lines.push(`<div style="color:#d97706;">Not eligible yet — ${isAdvance ? 'Payment Release' : 'Head Approval'} isn't Approved (currently: ${(isAdvance ? lead.payment_release_status : lead.ha_status) || 'Pending'}). Correct behavior, not a bug — nothing due yet.</div>`);
  } else {
    lines.push(`<div style="color:#059669;">Eligibility gate passes.</div>`);
  }
  lines.push('<hr style="margin:10px 0;border-color:var(--color-border-tertiary);">');

  const TAB_BY_STATUS = { 'Pending': 'Pending', 'Hold': 'Hold', 'To be Sent for Payment': 'To be Sent for Payment (queued — select it and click "Send for Payment" to actually dispatch)', 'Pending UTR': 'Pending UTR' };
  ['Customer', 'Broker'].forEach(type => {
    const amt = type === 'Customer' ? (lead.ud_customer_payment || lead.pn_customer_payment) : (lead.ud_broker_payment || lead.pn_broker_payment);
    const liveRow = (liveRows || []).find(r => r.payment_type === type);
    const archRow = (archiveRows || []).find(r => r.payment_type === type);
    lines.push(`<div style="font-weight:600;margin-top:6px;">${type} — amount ₹${amt || 0}</div>`);
    if (!amt) {
      lines.push(`<div style="font-size:12.5px;color:#6b7280;">Amount is 0/blank — correctly never shown.</div>`);
    } else if (archRow) {
      lines.push(`<div style="font-size:12.5px;color:#6b7280;">Already ${archRow.status || 'Completed'} and in Archive — check the Payments Archive tab, not Pending/Hold/Pending UTR.</div>`);
    } else if (liveRow) {
      if (liveRow.status === 'Completed' || liveRow.status === 'Rejected') {
        lines.push(`<div style="font-size:12.5px;color:#d97706;">Row exists, status ${liveRow.status}, but NOT yet in Archive — a stale row (should have moved). Not a "missing" gap, a "stuck" one — see supabase-batch90 for the archive-move trigger check.</div>`);
      } else {
        const tabName = isInstant ? 'Pending UTR (Instant Payments bypass Pending/Hold)' : (TAB_BY_STATUS[liveRow.status] || liveRow.status);
        lines.push(`<div style="font-size:12.5px;color:#059669;">Row exists (status "${liveRow.status}", id ${liveRow.id}) and passes every check — it SHOULD be visible right now in: <b>${tabName}</b>. If it isn't: (1) hard-refresh the Payments page, (2) check the PE/Manager/Date filter row at the top of that tab isn't set to something excluding it, (3) confirm the latest JS-Payments.html is actually deployed in Apps Script.</div>`);
      }
    } else {
      lines.push(`<div style="font-size:12.5px;color:#dc2626;">No row in either table — genuinely missing. Run "Find Missing Payment Rows" on the Payments tab, or the matching Health Check.</div>`);
    }
  });

  if (typeof Swal !== 'undefined') {
    Swal.fire({ title: 'Payment Visibility', html: lines.join(''), width: 560, confirmButtonText: 'Close' });
  } else {
    notify(lines.join(' '));
  }
}

function renderHealthCheckPanel() {
  const list = document.getElementById('healthCheckList');
  if (!list) return;
  list.innerHTML = HEALTH_CHECKS.map(c => `
    <div class="vd-card" style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
        <div>
          <div style="font-weight:700;font-size:14px;">${c.title}</div>
          <div style="font-size:12px;color:var(--color-text-tertiary,#6b7280);margin-top:3px;max-width:640px;">${c.description}</div>
        </div>
        <button class="btn btn-outline" style="flex-shrink:0;" onclick="runHealthCheck('${c.key}')">Run Check</button>
      </div>
      <div id="hc-result-${c.key}" style="margin-top:10px;"></div>
    </div>`).join('');
}

async function runHealthCheck(key) {
  const check = HEALTH_CHECKS.find(c => c.key === key);
  if (!check) return;
  const resultEl = document.getElementById('hc-result-' + key);
  if (resultEl) resultEl.innerHTML = '<div style="font-size:12px;color:var(--color-text-tertiary,#6b7280);">Scanning…</div>';
  try {
    const rows = await check.run();
    healthCheckCache[key] = rows;
    if (!resultEl) return;
    if (!rows.length) {
      resultEl.innerHTML = '<div style="font-size:12px;color:#059669;"><i class="ti ti-circle-check" aria-hidden="true"></i> Nothing found — all clear.</div>';
      return;
    }
    const listHtml = rows.map(r => `<div style="font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--color-border-tertiary);">${check.describeRow(r)}</div>`).join('');
    resultEl.innerHTML = `
      <div style="font-size:12px;font-weight:600;color:#dc2626;margin-bottom:6px;">${rows.length} found</div>
      <div style="max-height:240px;overflow-y:auto;margin-bottom:8px;">${listHtml}</div>
      <button class="btn" style="background:#dc2626;border-color:#dc2626;color:#fff;" onclick="fixHealthCheck('${key}')">Fix All (${rows.length})</button>`;
  } catch (e) {
    if (resultEl) resultEl.innerHTML = `<div style="font-size:12px;color:#dc2626;">Scan failed: ${e.message}</div>`;
  }
}

async function fixHealthCheck(key) {
  const check = HEALTH_CHECKS.find(c => c.key === key);
  const rows = healthCheckCache[key];
  if (!check || !rows || !rows.length) return;
  const ok = await confirmDialog(`Apply the fix for ${rows.length} lead(s) under "${check.title}"?`);
  if (!ok) return;
  try {
    await check.fix(rows);
    notify(`Fixed ${rows.length} lead(s).`);
    await runHealthCheck(key);
  } catch (e) {
    notify('Fix failed: ' + e.message, { icon: 'error' });
  }
}

let usersCache = [];

// Every value the DB's user_role enum actually accepts — kept in sync
// manually with pg_enum (checked directly, Sept 2026) rather than derived
// live, since this list barely ever changes and a live enum lookup would
// need its own round trip on every Settings > Users load.
const USER_ROLES = ['PE', 'Manager', 'Back Office', 'Back Office 2', 'Accounts', 'Head', 'Admin', 'Back Office Head', 'Store', 'Logistics', 'Warehouse', 'CRE'];

// Role/Manager edits used to save immediately on every dropdown change
// (the old updateUserManager()) — Ramvir asked for this to stop: edits
// are now queued here in memory and only written to the DB when "Save
// Changes" is clicked (saveUserChanges), keyed by user id so multiple
// users' edits can be queued and saved together in one go.
let pendingUserEdits = {};

function renderUsersTable(rows) {
  // Manager column — a live dropdown so Admin can reassign anyone's
  // manager right from this table instead of needing a separate edit
  // flow. Options are every Manager-role user in usersCache; selecting
  // "No manager" clears it. Role column is the same idea, added Sept 2026
  // (Ramvir) — both queue into pendingUserEdits via markUserEditPending
  // rather than saving immediately.
  const managerOptions = usersCache.filter(m => m.role === 'Manager');
  document.getElementById('tbodyUsers').innerHTML = (rows && rows.length) ? rows.map(u => {
    const pending = pendingUserEdits[u.id] || {};
    const roleVal = pending.role !== undefined ? pending.role : u.role;
    const managerVal = pending.manager_id !== undefined ? pending.manager_id : (u.manager_id || '');
    const activeVal = pending.active !== undefined ? pending.active : u.active;
    const phoneVal = pending.phone !== undefined ? pending.phone : (u.phone || '');
    const dirty = pendingUserEdits[u.id] ? 'background:#fffbeb;' : '';
    return `<tr style="${dirty}">
    <td>${u.user_id}</td>
    <td style="font-weight:500;">${u.name}</td>
    <td><select onchange="markUserEditPending('${u.id}', 'role', this.value)" style="border:0.5px solid var(--color-border-secondary);border-radius:6px;padding:4px 8px;font-size:12.5px;">
      ${USER_ROLES.map(r => `<option value="${r}" ${roleVal === r ? 'selected' : ''}>${r}</option>`).join('')}
    </select></td>
    <td><select onchange="markUserEditPending('${u.id}', 'manager_id', this.value)" style="border:0.5px solid var(--color-border-secondary);border-radius:6px;padding:4px 8px;font-size:12.5px;">
      <option value="">No manager</option>
      ${managerOptions.map(m => `<option value="${m.id}" ${managerVal === m.id ? 'selected' : ''}>${m.name}</option>`).join('')}
    </select></td>
    <td><input type="tel" value="${phoneVal}" placeholder="10-digit" onchange="markUserEditPending('${u.id}', 'phone', this.value.replace(/\\D/g,'') || null)" style="border:0.5px solid var(--color-border-secondary);border-radius:6px;padding:4px 8px;font-size:12.5px;width:100px;" /></td>
    <td style="text-align:center;"><input type="checkbox" title="Calling (CRE) access" ${(pending.calling_access !== undefined ? pending.calling_access : u.calling_access) || u.role === 'CRE' ? 'checked' : ''} ${u.role === 'CRE' ? 'disabled' : ''} onchange="markUserEditPending('${u.id}', 'calling_access', this.checked)" /></td>
    <td><select onchange="markUserEditPending('${u.id}', 'active', this.value === 'Active')" style="border:0.5px solid var(--color-border-secondary);border-radius:6px;padding:4px 8px;font-size:12.5px;${activeVal ? '' : 'color:#b91c1c;'}">
      <option value="Active" ${activeVal ? 'selected' : ''}>Active</option>
      <option value="Inactive" ${!activeVal ? 'selected' : ''}>Inactive</option>
    </select></td>
    <td>${u.created_at ? new Date(u.created_at).toLocaleDateString() : '—'}</td>
  </tr>`;
  }).join('') : '<tr><td colspan="8" style="text-align:center;color:var(--color-text-tertiary);padding:24px;">No users found.</td></tr>';
}

function markUserEditPending(userId, field, value) {
  pendingUserEdits[userId] = pendingUserEdits[userId] || {};
  pendingUserEdits[userId][field] = field === 'manager_id' ? (value || null) : value;
  const btn = document.getElementById('saveUserChangesBtn');
  if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.style.pointerEvents = ''; }
  // Re-render so the row gets its "unsaved" highlight — the dropdown the
  // user just touched keeps its just-picked value since roleVal/managerVal
  // above read from pendingUserEdits first.
  renderUsersTable(usersCache.filter(u => !document.getElementById('searchUsers') || !document.getElementById('searchUsers').value
    || u.name.toLowerCase().includes(document.getElementById('searchUsers').value.toLowerCase())
    || u.user_id.toLowerCase().includes(document.getElementById('searchUsers').value.toLowerCase())
    || u.role.toLowerCase().includes(document.getElementById('searchUsers').value.toLowerCase())));
}

async function saveUserChanges() {
  const userIds = Object.keys(pendingUserEdits);
  if (!userIds.length) { notify('No changes to save.', { icon: 'info' }); return; }
  let failed = 0;
  for (const userId of userIds) {
    const { error } = await sb.from('rewire_user_profiles').update(pendingUserEdits[userId]).eq('id', userId);
    if (error) { console.error(error); failed++; }
  }
  pendingUserEdits = {};
  const btn = document.getElementById('saveUserChangesBtn');
  if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; btn.style.pointerEvents = 'none'; }
  if (failed) notify(`Saved with ${failed} error(s) for ${userIds.length - failed}/${userIds.length} user(s) — check console.`, { icon: 'error' });
  else notify(`Saved changes for ${userIds.length} user(s).`);
  await renderUsersList();
}

// ------------------------------------------------------------
// ACCESS CONTROL (Permissions Editor) — Ramvir, Sept 2026 permissions
// redesign, item 8: "admin per access nahi de sakte ki front se hi change
// karte rahe". Live, DB-backed checkbox grid over rewire_role_permissions.
// Admin is deliberately excluded as a column/role here — it's hardcoded to
// '*' in applyRoleBasedUI (JS-Core.html) and never stored in this table,
// so a mistaken edit can never lock Admin out of their own app.
// ------------------------------------------------------------
const ROLE_COLUMNS = ['PE','Manager','Back Office','Back Office 2','Back Office Head','Store','Logistics','Warehouse','Accounts','Head','CRE'];
let rolePermissionsCache = {};      // { role: Set(gate_key) } — last-loaded state from the DB
let pendingPermissionEdits = {};    // { 'role|gate_key': true|false } — unsaved checkbox changes

async function loadAndRenderPermissionsEditor(){
  const countEl = document.getElementById('countAccessEditor');
  if (countEl) countEl.textContent = 'Loading…';
  const { data, error } = await sb.from('rewire_role_permissions').select('role, gate_key');
  if (error) { console.error(error); if (countEl) countEl.textContent = 'Failed to load.'; notify('Failed to load permissions: ' + error.message, { icon: 'error' }); return; }
  rolePermissionsCache = {};
  ROLE_COLUMNS.forEach(r => rolePermissionsCache[r] = new Set());
  (data || []).forEach(row => {
    if (!rolePermissionsCache[row.role]) rolePermissionsCache[row.role] = new Set();
    rolePermissionsCache[row.role].add(row.gate_key);
  });
  pendingPermissionEdits = {};
  const btn = document.getElementById('savePermissionsBtn');
  if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; btn.style.pointerEvents = 'none'; }
  renderPermissionsEditorTable();
  if (countEl) countEl.textContent = PERMISSION_GATE_REGISTRY.length + ' screens/tabs × ' + ROLE_COLUMNS.length + ' roles';
}

function isPermissionChecked(role, gateKey){
  const pendKey = role + '|' + gateKey;
  if (pendingPermissionEdits[pendKey] !== undefined) return pendingPermissionEdits[pendKey];
  return !!(rolePermissionsCache[role] && rolePermissionsCache[role].has(gateKey));
}

function renderPermissionsEditorTable(){
  const headRow = document.getElementById('accessEditorHeadRow');
  if (headRow) headRow.innerHTML = '<th>Screen / Tab</th>' + ROLE_COLUMNS.map(r => `<th style="text-align:center;">${r}</th>`).join('');

  const groups = [];
  PERMISSION_GATE_REGISTRY.forEach(g => {
    let grp = groups.find(x => x.group === g.group);
    if (!grp) { grp = { group: g.group, items: [] }; groups.push(grp); }
    grp.items.push(g);
  });

  let html = '';
  groups.forEach(grp => {
    html += `<tr style="background:var(--color-bg-secondary);"><td colspan="${ROLE_COLUMNS.length + 1}" style="font-weight:600;font-size:11.5px;">${grp.group}</td></tr>`;
    grp.items.forEach(item => {
      const dirtyRow = ROLE_COLUMNS.some(r => pendingPermissionEdits[r + '|' + item.key] !== undefined);
      html += `<tr${dirtyRow ? ' style="background:#fffbeb;"' : ''}><td>${item.label}</td>`;
      ROLE_COLUMNS.forEach(role => {
        // restrictedTo (Ramvir, Sept 2026) — a handful of rows (the 4
        // "Edit —" ones) control actual database write rights, not just
        // visibility, and the database itself only ever honors 2 specific
        // roles for them. Showing a live checkbox for every other role
        // would silently promise something Save will then fail on — grey
        // "—" instead, with a tooltip saying why, same as the row's own
        // registry comment explains.
        if (item.restrictedTo && item.restrictedTo.indexOf(role) === -1) {
          html += `<td style="text-align:center;color:var(--color-text-tertiary);" title="Database yahan sirf ${item.restrictedTo.join('/')} ko hi allow karta hai — is role ke liye ye kabhi kaam nahi karega chahe tick kar bhi do.">—</td>`;
          return;
        }
        const checked = isPermissionChecked(role, item.key);
        html += `<td style="text-align:center;"><input type="checkbox" ${checked ? 'checked' : ''} onchange="togglePermissionEdit('${role}','${item.key}',this.checked)" /></td>`;
      });
      html += '</tr>';
    });
  });
  document.getElementById('accessEditorBody').innerHTML = html;
}

function togglePermissionEdit(role, gateKey, checked){
  const pendKey = role + '|' + gateKey;
  const current = !!(rolePermissionsCache[role] && rolePermissionsCache[role].has(gateKey));
  if (checked === current) delete pendingPermissionEdits[pendKey];
  else pendingPermissionEdits[pendKey] = checked;
  const btn = document.getElementById('savePermissionsBtn');
  const hasPending = Object.keys(pendingPermissionEdits).length > 0;
  if (btn) { btn.disabled = !hasPending; btn.style.opacity = hasPending ? '1' : '0.5'; btn.style.pointerEvents = hasPending ? '' : 'none'; }
  renderPermissionsEditorTable();
}

async function savePermissionsEditor(){
  const edits = Object.entries(pendingPermissionEdits);
  if (!edits.length) { notify('No changes to save.', { icon: 'info' }); return; }
  let failed = 0;
  for (const [key, grant] of edits) {
    const sep = key.indexOf('|');
    const role = key.slice(0, sep);
    const gateKey = key.slice(sep + 1);
    if (grant) {
      const { error } = await sb.from('rewire_role_permissions').upsert({ role, gate_key: gateKey }, { onConflict: 'role,gate_key' });
      if (error) { console.error(error); failed++; }
    } else {
      const { error } = await sb.from('rewire_role_permissions').delete().eq('role', role).eq('gate_key', gateKey);
      if (error) { console.error(error); failed++; }
    }
  }
  if (failed) notify(`Saved with ${failed} error(s) out of ${edits.length} change(s) — check console.`, { icon: 'error' });
  else notify(`Saved ${edits.length} permission change(s). Affected users should refresh/re-login to see it.`);
  await loadAndRenderPermissionsEditor();
}

function submitAddUser() {
  const userId = document.getElementById('nuUserId').value.trim();
  const name = document.getElementById('nuName').value.trim();
  const password = document.getElementById('nuPassword').value;
  const phone = document.getElementById('nuPhone') ? document.getElementById('nuPhone').value.trim() : '';
  const role = document.getElementById('nuRole').value;
  const managerId = document.getElementById('nuManagerId') ? document.getElementById('nuManagerId').value : '';
  const managerEmail = document.getElementById('nuManagerEmail') ? document.getElementById('nuManagerEmail').value.trim() : '';

  if (!userId || !name || !password || !role) { notify('Please fill all fields', { icon: 'error', title: 'Missing fields' }); return; }
  if (password.length < 6) { notify('Password must be at least 6 characters', { icon: 'error', title: 'Weak password' }); return; }
  // Phone is optional (not every role needs WhatsApp notifications yet),
  // but if entered it's validated as a plain 10-digit Indian mobile
  // number — same digits-only shape waNormalizePhone_() (WhatsApp.gs)
  // expects, so a bad value here doesn't silently fail a WhatsApp send
  // later.
  const phoneDigits = phone.replace(/\D/g, '');
  if (phone && phoneDigits.length !== 10) { notify('Enter a valid 10-digit phone number.', { icon: 'error', title: 'Invalid phone' }); return; }
  // Email only matters (and is required) for Manager — used to CC the
  // "Send for Payment" bank/cashier notification.
  if (role === 'Manager') {
    if (!managerEmail) { notify('Email is required for a Manager.', { icon: 'error', title: 'Missing field' }); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(managerEmail)) { notify('Enter a valid email address.', { icon: 'error', title: 'Invalid email' }); return; }
  }

  google.script.run
    .withSuccessHandler((res) => {
      notify(`User ${res.userId} created successfully.`);
      closeModal('addUserModal');
      ['nuUserId','nuName','nuPassword','nuPhone','nuManagerEmail'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('nuRole').value = '';
      document.getElementById('nuManagerField').style.display = 'none';
      document.getElementById('nuManagerEmailField').style.display = 'none';
      renderUsersList();
    })
    .withFailureHandler((err) => {
      notify('Error creating user: ' + err.message, { icon: 'error', title: 'Failed' });
    })
    .createSupabaseUser(userId, name, role, password, managerId || null, role === 'Manager' ? managerEmail : null, phoneDigits || null);
}

async function submitChangePassword() {
  const p1 = document.getElementById('newPassword').value;
  const p2 = document.getElementById('confirmPassword').value;
  if (!p1 || p1.length < 6) { notify('Password must be at least 6 characters', { icon: 'error', title: 'Weak password' }); return; }
  if (p1 !== p2) { notify('Passwords do not match', { icon: 'error', title: 'Mismatch' }); return; }

  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) { notify('Error updating password: ' + error.message, { icon: 'error' }); return; }
  notify('Password updated.');
  document.getElementById('newPassword').value = '';
  document.getElementById('confirmPassword').value = '';
}
