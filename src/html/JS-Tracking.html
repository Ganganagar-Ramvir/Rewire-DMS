// PURCHASED SECTION — all leads past Upload Delivery, all columns
// ------------------------------------------------------------
let purchasedPage = 0, purchasedTotal = 0, purchasedSearch = '';

// Shared fetch+join used by both the on-screen table (paged=true, current
// page only) and the Download Excel export (paged=false, every matching
// row) — pulled out so the 2 stay in sync instead of drifting apart.
async function fetchPurchasedRows(paged) {
  const pf = tableFilterState.purchased || {};
  const baseQuery = () => {
    let q = sb.from('rewire_master_data')
      .select(`id, lead_no, customer_name, phone, email, city, val_vehicle_type, val_vehicle_number, val_make, val_model_variant, val_fuel_type,
        val_registration_year,
        ud_vehicle_parking, ud_vehicle_sub_parking, logistics_status, val_rc_type, val_engine_no, val_chassis_no, pn_deal_type, pn_payment_type,
        ud_total_offer_price, ud_customer_payment, ud_broker_payment,
        kyc_status, kyc_bank_name, ud_upi_amount, rc_status, ma_status, ha_status, overall_status, rewire_partners(partner_name),
        kyc_aadhar_number, kyc_aadhar_url, kyc_pan_number, kyc_pan_url, kyc_gst_number, kyc_gst_url, kyc_cheque_url,
        pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(name),
        manager:rewire_user_profiles!rewire_master_data_manager_id_fkey(name), ud_filled_on,
        rc_image_url, val_rc_copy_url, ud_delivery_photo_url, val_kerb_weight_kg`, { count: 'exact' })
      .eq('ud_status', 'Complete')
      // (Ramvir, Oct 2026) — removed `.eq('ha_status','Approved')`: this
      // table already has its own "Head Approval" badge column showing
      // Pending vs Approved, so requiring ha_status='Approved' just to be
      // listed here hid every genuinely-purchased (ud_status=Complete)
      // vehicle still awaiting Head Approval — 16 vehicles in Sept 2026
      // alone, the exact gap behind the 705-vs-724 mismatch against the
      // Dashboard's purchase count, which correctly uses ud_status=
      // Complete alone as the single source of truth for "purchased".
      .neq('overall_status', 'Closed Lost')
      .order('ud_filled_on', { ascending: false });
    if (pf.pe) q = q.eq('pe_id', pf.pe);
    if (pf.manager) q = q.eq('manager_id', pf.manager);
    if (pf.from) q = q.gte('ud_filled_on', istDayStart(pf.from));
    if (pf.to) q = q.lte('ud_filled_on', istDayEnd(pf.to));
    q = withSearch(q, ['customer_name', 'lead_no', 'val_vehicle_number'], purchasedSearch);
    return q;
  };

  let data, count;
  if (paged) {
    const { data: d, error, count: c } = await baseQuery().range(purchasedPage * PAGE_SIZE, purchasedPage * PAGE_SIZE + PAGE_SIZE - 1);
    if (error) { console.error(error); return { rows: [], total: 0 }; }
    data = d; count = c;
  } else {
    data = await fetchAllRows((from, to) => baseQuery().range(from, to)).catch(err => { console.error(err); return []; });
    count = data.length;
  }

  const leadIds = (data || []).map(l => l.id);
  const regNos = (data || []).map(l => (l.val_vehicle_number || '').toUpperCase()).filter(Boolean);

  const { data: receipts } = leadIds.length
    ? await fetchByIds(ch => sb.from('rewire_vehicle_receipt').select('lead_id, rst_no, rst_receipt_date, weight_kg').in('lead_id', ch), leadIds)
    : { data: [] };
  const receiptByLead = {};
  (receipts || []).forEach(r => { receiptByLead[r.lead_id] = r; });

  const [{ data: payRows }, { data: archivedPayRows }] = leadIds.length
    ? await Promise.all([
        fetchByIds(ch => sb.from('rewire_payments').select('lead_id, status').in('lead_id', ch), leadIds),
        fetchByIds(ch => sb.from('rewire_payments_archive').select('lead_id, status').in('lead_id', ch), leadIds),
      ])
    : [{ data: [] }, { data: [] }];
  const paymentStatusByLead = {};
  (payRows || []).forEach(r => {
    const cur = paymentStatusByLead[r.lead_id];
    if (!cur || (cur === 'Completed' && r.status !== 'Completed')) paymentStatusByLead[r.lead_id] = r.status;
  });
  (archivedPayRows || []).forEach(r => {
    const cur = paymentStatusByLead[r.lead_id];
    if (!cur || (cur === 'Completed' && (r.status || 'Completed') !== 'Completed')) paymentStatusByLead[r.lead_id] = r.status || 'Completed';
  });

  const { data: codCvsRows } = regNos.length
    ? await fetchByIds(ch => sb.from('rewire_cod_cvs').select('registration_number, upload_type, cod_cvs_date, cod_number, cod_url, cvs_number, cvs_url, uploaded_in_dms_rewire').in('registration_number', ch), regNos, 100)
    : { data: [] };
  const codCvsByReg = {};
  (codCvsRows || []).forEach(r => {
    const key = (r.registration_number || '').toUpperCase();
    if (!codCvsByReg[key]) codCvsByReg[key] = {};
    codCvsByReg[key][r.upload_type] = r;
  });

  const { data: vzRows } = leadIds.length
    ? await fetchByIds(ch => sb.from('rewire_verification_zoho').select('lead_id, form_2a_url, authorization_letter_url').in('lead_id', ch), leadIds)
    : { data: [] };
  const vzByLead = {};
  (vzRows || []).forEach(r => { vzByLead[r.lead_id] = r; });

  const enriched = (data || []).map(l => {
    const receipt = receiptByLead[l.id];
    const cc = codCvsByReg[(l.val_vehicle_number || '').toUpperCase()] || {};
    return {
      ...l,
      _receipt: receipt,
      _payStatus: paymentStatusByLead[l.id] || 'No Payment Row',
      _cod: cc['COD'], _cvs: cc['CVS'], _dms: cc['DMS/Rewire No.'],
      _vz: vzByLead[l.id],
      _parkingDisplay: receipt && receipt.rst_no ? 'Jaipur Plant' : (l.logistics_status === 'Sent to Plant' ? 'In Transit to Jaipur Plant' : (l.ud_vehicle_parking || '—')),
    };
  });

  return { rows: enriched, total: paged ? (count || 0) : enriched.length };
}

// ---- SELL PART (Challan entry form) ----
let psItemRows = [];
let psRowIdCounter = 0;
let psAvailableStock = []; // cached 'Available' rewire_part_inventory rows, refetched every time this tab opens

async function renderPartSoldEntryTab() {
  // Fix (Ramvir, Sept 2026 — "kafi part aate hi nahi" in the Part No
  // search): this used to be a plain .select() with no pagination, which
  // Supabase silently caps at 1000 rows — with more Available parts than
  // that in stock, everything past the cap simply never made it into
  // psAvailableStock, so a huge chunk of real, in-stock parts could never
  // be found no matter what was typed. fetchAllRows() (same pagination
  // helper used everywhere else in this app) pages through .range() calls
  // until every Available row is actually loaded.
  const data = await fetchAllRows((from, to) => sb.from('rewire_part_inventory')
    .select('id, part_number, part_name, make, model, registration_number')
    .eq('status', 'Available').order('part_number').range(from, to))
    .catch(err => { console.error(err); return []; });
  psAvailableStock = data || [];
  resetPartSoldForm();
}

function resetPartSoldForm() {
  const cn = document.getElementById('psCustomerName'); if (cn) cn.value = '';
  const ph = document.getElementById('psPhone'); if (ph) ph.value = '';
  const rm = document.getElementById('psRemarks'); if (rm) rm.value = '';
  psItemRows = [];
  addPartSoldRow();
}

function addPartSoldRow() {
  psItemRows.push({ rowId: 'ps' + (psRowIdCounter++), partInventoryId: null, partNumber: '', partName: '', weight: '', price: '' });
  renderPsItemsBody();
}
function removePartSoldRow(rowId) {
  psItemRows = psItemRows.filter(r => r.rowId !== rowId);
  if (!psItemRows.length) { addPartSoldRow(); return; } // addPartSoldRow already re-renders
  renderPsItemsBody();
}

function renderPsItemsBody() {
  document.getElementById('psItemsBody').innerHTML = psItemRows.map((r, idx) => `<tr>
    <td>${idx + 1}</td>
    <td>
      <div class="partner-search-wrap">
        <div class="ps-input-row" onclick="togglePSD('psPartDropdown_${r.rowId}',event)">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input value="${(r.partNumber || '').replace(/"/g, '&quot;')}" placeholder="Search part no. / name…" oninput="filterPsPartOptions('${r.rowId}',this.value)" onclick="openPSD('psPartDropdown_${r.rowId}');event.stopPropagation()" onblur="validatePsRowSelection('${r.rowId}')" autocomplete="off" style="font-size:12px;" />
        </div>
        <div class="ps-dropdown" id="psPartDropdown_${r.rowId}"><div class="ps-list" id="psPartList_${r.rowId}"></div></div>
      </div>
    </td>
    <td style="font-size:12px;">${r.partName || '<span style="color:var(--color-text-tertiary);">—</span>'}</td>
    <td><input type="number" min="0" step="0.01" placeholder="0.00" value="${r.weight}" oninput="updatePsRowField('${r.rowId}','weight',this.value)" style="width:100%;padding:5px 6px;font-size:12px;" /></td>
    <td><input type="number" min="0" step="0.01" placeholder="0.00" value="${r.price}" oninput="updatePsRowField('${r.rowId}','price',this.value)" style="width:100%;padding:5px 6px;font-size:12px;" /></td>
    <td><button class="btn" style="padding:4px 7px;" onclick="removePartSoldRow('${r.rowId}')" title="Remove row"><i class="ti ti-trash" style="font-size:13px;color:#dc2626;" aria-hidden="true"></i></button></td>
  </tr>`).join('');
  recalcPsTotals();
}

// Typing invalidates any prior selection for that row (must re-pick from
// the dropdown — free text alone can't be sold since it has no
// rewire_part_inventory id to mark Sold against).
function filterPsPartOptions(rowId, v) {
  openPSD('psPartDropdown_' + rowId);
  const row = psItemRows.find(r => r.rowId === rowId);
  if (row) { row.partNumber = v; row.partInventoryId = null; row.partName = ''; }
  const q = (v || '').toUpperCase().trim();
  const pool = q
    ? psAvailableStock.filter(p => (p.part_number || '').toUpperCase().includes(q) || (p.part_name || '').toUpperCase().includes(q))
    : psAvailableStock.slice(0, 20);
  const list = pool.slice(0, 20);
  document.getElementById('psPartList_' + rowId).innerHTML = list.length
    ? list.map(p => `<div class="ps-item" onclick="selectPsPartOption('${rowId}','${p.id}')">
        <div class="ps-item-name">${p.part_number}</div>
        <div class="ps-item-loc">${p.part_name || ''}${p.make ? ' · ' + p.make + (p.model ? ' ' + p.model : '') : ''}${p.registration_number ? ' · ' + p.registration_number : ''}</div>
      </div>`).join('')
    : '<div class="ps-item" style="color:var(--color-text-tertiary);font-size:12px;">No matching available part</div>';
}
// Fix (Ramvir, Sept 2026 — "Part No Stock me na ho usko entry hi na karne
// de"): typing free text that never resolves to a real dropdown pick left
// the row LOOKING filled (text visible) while partInventoryId stayed null
// — submitPartSaleChallan() already blocked this at submit time, but the
// bad text just sat there until the user tried to submit and got an error,
// with no indication which row was actually wrong. Clearing the invalid
// text right when the field loses focus makes it obvious immediately.
// The setTimeout is required: blur fires the instant the user clicks a
// dropdown option (before that option's own onclick runs), so clearing
// synchronously here would wipe the row's partNumber before
// selectPsPartOption() below ever got a chance to set it — delaying just
// long enough for that click handler to run first, then only clearing if
// still nothing got selected.
function validatePsRowSelection(rowId) {
  setTimeout(() => {
    const row = psItemRows.find(r => r.rowId === rowId);
    if (row && !row.partInventoryId && row.partNumber) {
      notify('"' + row.partNumber + '" stock me available nahi hai — dropdown se hi select karein.', { icon: 'error' });
      row.partNumber = '';
      renderPsItemsBody();
    }
  }, 200);
}
function selectPsPartOption(rowId, partId) {
  const item = psAvailableStock.find(p => p.id === partId);
  const row = psItemRows.find(r => r.rowId === rowId);
  if (!item || !row) return;
  row.partInventoryId = item.id; row.partNumber = item.part_number; row.partName = item.part_name;
  renderPsItemsBody();
}
function updatePsRowField(rowId, field, val) {
  const row = psItemRows.find(r => r.rowId === rowId);
  if (!row) return;
  row[field] = val;
  recalcPsTotals();
}
function recalcPsTotals() {
  const totalWeight = psItemRows.reduce((s, r) => s + (Number(r.weight) || 0), 0);
  const totalPrice = psItemRows.reduce((s, r) => s + (Number(r.price) || 0), 0);
  const w = document.getElementById('psTotalWeight'); if (w) w.textContent = totalWeight + ' Kg';
  const p = document.getElementById('psTotalPrice'); if (p) p.textContent = '₹' + totalPrice.toLocaleString('en-IN');
}

async function submitPartSaleChallan() {
  const customerName = document.getElementById('psCustomerName').value.trim();
  const phone = document.getElementById('psPhone').value.trim();
  const remarks = document.getElementById('psRemarks').value.trim();
  if (!customerName) { notify('Customer Name is required.', { icon: 'error' }); return; }
  if (!phone) { notify('Phone Number is required.', { icon: 'error' }); return; }
  if (!psItemRows.length) { notify('Add at least one part row.', { icon: 'error' }); return; }
  for (const r of psItemRows) {
    if (!r.partInventoryId) { notify('Select a valid Part Number from the dropdown for every row.', { icon: 'error' }); return; }
    if (!r.weight || Number(r.weight) <= 0) { notify('Enter a Weight for every row.', { icon: 'error' }); return; }
    if (r.price === '' || r.price === null || Number(r.price) < 0) { notify('Enter a Price with GST for every row.', { icon: 'error' }); return; }
  }
  const items = psItemRows.map(r => ({ part_inventory_id: r.partInventoryId, part_number: r.partNumber, part_name: r.partName, weight: Number(r.weight), price: Number(r.price) }));
  const { data, error } = await sb.rpc('create_part_sale_challan', {
    p_customer_name: customerName, p_phone: phone || null, p_remarks: remarks || null, p_items: items, p_created_by: currentProfile.id,
  });
  if (error) { notify('Could not create Challan: ' + error.message, { icon: 'error' }); return; }
  const challanNo = (data && data[0]) ? data[0].challan_no : '';
  notify('Challan ' + challanNo + ' created — moved to Pending Invoice.', { icon: 'success' });
  renderPartSoldEntryTab(); // reset form + refresh available stock (just-sold parts drop out)
}

    title: 'Update Invoice Details — ' + challanNo,

      </select>
    </div>`,
    confirmButtonText: 'Submit', confirmButtonColor: '#1d4ed8', showCancelButton: true,
    preConfirm: () => {
      const invNo = document.getElementById('swalInvNo').value.trim();
      const invDate = document.getElementById('swalInvDate').value;
      const mode = document.getElementById('swalPayMode').value;

      p_challan_id: challanId, p_invoice_number: invNo, p_invoice_date: invDate, p_payment_mode: mode, p_updated_by: currentProfile.id,

// Sample format for the Daily Stock Upload above (Ramvir, Oct 2026) —

// bulkCell(), with 2 realistic example rows, so whoever fills this in
// always matches what the upload expects. Reuses downloadXlsx()

// export in this app.
function downloadPartStockSampleFormat() {

    { 'Part Number': '1140669', 'Part Name': 'Mirror assembly (RH) - Normal', 'Short Description': 'RH door mirror, normal condition', 'Make': 'MARUTI', 'Model': 'SWIFT', 'Variant': 'VDI', 'Year of Manufacture': '2015', 'Registration Number': 'RJ45CN3490', 'Storage Date': '2026-09-15', 'Category': 'Door', 'Sub Category': 'Mirror', 'TEI Updated At': '2026-09-15 10:30:00' },

  ];

function partStockFileSelected(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (!json.length) { notify('File has no data rows.', { icon: 'error' }); return; }
      psPendingStockRows = json.map(row => ({
        part_number: bulkCell(row, ['part number']),
        part_name: bulkCell(row, ['part name']),
        short_description: bulkCell(row, ['short description']),
        make: bulkCell(row, ['make']),
        model: bulkCell(row, ['model']),
        variant: bulkCell(row, ['variant']),
        year_of_manufacture: bulkCell(row, ['year of manufacture']),
        registration_number: bulkCell(row, ['registration number']),
        storage_date: bulkCell(row, ['storage date']),
        category: bulkCell(row, ['category']),
        sub_category: bulkCell(row, ['sub category']),
        tei_updated_at: bulkCell(row, ['tei updated at']),
      })).filter(r => r.part_number);
      if (!psPendingStockRows.length) { notify('No rows had a Part Number — check the file headers.', { icon: 'error' }); return; }
      document.getElementById('psStockPreviewCount').textContent = psPendingStockRows.length + ' row(s) parsed — ready to upload.';
      document.getElementById('psStockPreviewArea').style.display = '';
    } catch (err) {
      notify('Could not read file: ' + err.message, { icon: 'error' });
    }
  };
  reader.readAsArrayBuffer(file);
}
async function confirmPartStockUpload() {
  if (!psPendingStockRows || !psPendingStockRows.length) { notify('Choose a file first.', { icon: 'error' }); return; }
  if (!confirm(`This will REPLACE every currently available part with these ${psPendingStockRows.length} row(s). Parts already sold are kept, untouched. Continue?`)) return;
  const { data, error } = await sb.rpc('replace_part_inventory_available', { p_rows: psPendingStockRows, p_uploaded_by: currentProfile.id });
  if (error) { notify('Upload failed: ' + error.message, { icon: 'error' }); return; }
  notify(`Stock updated — ${data} part(s) now available.`, { icon: 'success' });
  renderPartSoldStockTab();
}

let scrapHsnCache = null;
async function loadScrapHsn() {

function scrapHsnFor(category, sub) {

async function addScrapSaleItem() {
  if (!ssActiveChallanId) { notify('Pick a Vehicle Challan first.', { icon: 'error' }); return; }
  const category = document.getElementById('ssItemCategoryInput').value.trim();
  const subCategory = document.getElementById('ssItemSubCategoryInput').value.trim();
  const uom = document.getElementById('ssItemUom').value;
  const qty = document.getElementById('ssItemQty').value;
  const price = document.getElementById('ssItemPrice').value;
  const bridgeWeight = document.getElementById('ssItemBridgeWeight').value;
  const receiptFile = document.getElementById('ssItemReceiptFile');
  if (!category || !isValidMasterValue('scrap_commodity_category', category)) { notify('Pick a valid Commodity Category from the dropdown.', { icon: 'error' }); return; }
  if (!uom) { notify('UOM is required.', { icon: 'error' }); return; }
  if (!qty || Number(qty) <= 0) { notify((uom === 'Nos' ? 'Nos' : 'Qty') + ' is required.', { icon: 'error' }); return; }
  if (price === '' || Number(price) < 0) { notify('Price/Unit is required.', { icon: 'error' }); return; }

  const receiptUrl = receiptFile && receiptFile.files.length
    ? await uploadFile(receiptFile.files[0], category, 'Scrap_Bridge_Receipt') : null;
  const finalAmount = Number(qty) * Number(price);
  const { error } = await sb.from('rewire_scrap_sale_items').insert({
    challan_id: ssActiveChallanId, category, sub_category: subCategory || null, uom,
    hsn_code: (document.getElementById('ssItemHsn').value.trim()) || scrapHsnFor(category, subCategory) || null,
    qty: Number(qty), price_per_unit: Number(price), final_amount: finalAmount,
    bridge_weight_kg: bridgeWeight ? Number(bridgeWeight) : null, weight_bridge_receipt_url: receiptUrl,
    created_by: currentProfile.id,
  });
  if (error) { notify('Error adding item: ' + error.message, { icon: 'error' }); return; }
  notify('Commodity item added.');
  ['ssItemCategoryInput', 'ssItemSubCategoryInput', 'ssItemQty', 'ssItemPrice', 'ssItemBridgeWeight'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('ssItemUom').value = '';
  receiptFile.value = '';
  ssSelectedCategory = '';
  await renderSsItemsList(ssActiveChallanId);
}

async function renderSsItemsList(challanId) {
  const { data } = await sb.from('rewire_scrap_sale_items').select('*').eq('challan_id', challanId).order('created_at');
  ssActiveItems = data || [];
  document.getElementById('ssItemsTableCard').style.display = ssActiveItems.length ? 'block' : 'none';
  const fileLink = (url) => isRealFileUrl(url) ? `<a href="javascript:void(0)" onclick="viewAccessoryPhoto('${url}','Bridge Receipt')" style="color:#1d4ed8;text-decoration:underline;">View</a>` : '—';
  document.getElementById('ssItemsBody').innerHTML = ssActiveItems.map(it => `<tr>
    <td>${it.category}</td>
    <td>${it.sub_category || '—'}</td>
    <td>${it.hsn_code || '—'}</td>
    <td>${it.uom}</td>
    <td>${it.qty}</td>
    <td>₹${it.price_per_unit}</td>
    <td>${it.bridge_weight_kg != null ? it.bridge_weight_kg : '—'}</td>
    <td>${fileLink(it.weight_bridge_receipt_url)}</td>
    <td>₹${Number(it.final_amount).toLocaleString('en-IN')}</td>
    <td><button class="btn" style="padding:4px 7px;" onclick="removeScrapSaleItem('${it.id}')" title="Remove"><i class="ti ti-trash" style="font-size:13px;color:#dc2626;" aria-hidden="true"></i></button></td>
  </tr>`).join('');
  const total = ssActiveItems.reduce((s, it) => s + Number(it.final_amount || 0), 0);
  document.getElementById('ssTotalAmount').textContent = '₹' + total.toLocaleString('en-IN');
}

async function removeScrapSaleItem(itemId) {
  const ok = await confirmDialog('Remove this commodity item?');
  if (!ok) return;
  const { error } = await sb.from('rewire_scrap_sale_items').delete().eq('id', itemId);
  if (error) { notify('Error removing item: ' + error.message, { icon: 'error' }); return; }
  await renderSsItemsList(ssActiveChallanId);
}

// ---- BUYER ("Add Details", like Broker/Partner add) ----
async function loadScrapBuyers() {
  scrapBuyersCache = await fetchAllRows((from, to) => sb.from('rewire_scrap_buyers').select('*').order('company_name').range(from, to))
    .catch(err => { console.error(err); return []; });
}
function filterSsBuyerOptions(v) {
  openPSD('ssBuyerDropdown');
  const q = (v || '').toUpperCase().trim();
  const pool = q
    ? scrapBuyersCache.filter(b => b.company_name.toUpperCase().includes(q) || (b.contact_name || '').toUpperCase().includes(q))
    : scrapBuyersCache.slice(0, 20);
  document.getElementById('ssBuyerList').innerHTML = pool.length
    ? pool.slice(0, 20).map(b => `<div class="ps-item" onclick="selectSsBuyer('${b.id}')">
        <div class="ps-item-name">${b.company_name}</div>
        <div class="ps-item-loc">${b.contact_name || ''}${b.mobile ? ' · ' + b.mobile : ''}</div>
      </div>`).join('')
    : '<div class="ps-item" style="color:var(--color-text-tertiary);font-size:12px;">No matching buyer — use "Add Details" above</div>';
}
let ssSelectedBuyerId = null;
function selectSsBuyer(buyerId) {
  const b = scrapBuyersCache.find(x => x.id === buyerId);
  if (!b) return;
  ssSelectedBuyerId = buyerId;
  document.getElementById('ssBuyerInput').value = b.company_name;
}
function openScrapBuyerModal() {
  document.querySelectorAll('#scrapBuyerRegModal input[data-field]').forEach(el => { el.value = ''; });
  openModal('scrapBuyerRegModal');
}
async function submitNewScrapBuyer() {
  const payload = readFields('#scrapBuyerRegModal', {
    company_name: 'sb_company_name', billing_address: 'sb_billing_address', contact_name: 'sb_contact_name',
    mobile: 'sb_mobile', pan_number: 'sb_pan_number', gst_number: 'sb_gst_number',
    bank_name: 'sb_bank_name', branch_name: 'sb_branch_name', account_number: 'sb_account_number', ifsc_code: 'sb_ifsc_code',
  });
  if (!payload.company_name) { notify('Customer Company Name is required.', { icon: 'error' }); return; }
  const chequeFile = document.querySelector('#scrapBuyerRegModal [data-field="sb_cheque_photo"]');
  payload.cancelled_cheque_url = chequeFile && chequeFile.files.length ? await uploadFile(chequeFile.files[0], payload.company_name, 'Cancelled_Cheque') : null;
  payload.created_by = currentProfile.id;
  const { data, error } = await sb.from('rewire_scrap_buyers').insert(payload).select().single();
  if (error) { notify('Error saving buyer: ' + error.message, { icon: 'error' }); return; }
  notify('Buyer saved.');
  closeModal('scrapBuyerRegModal');
  await loadScrapBuyers();
  if (data) selectSsBuyer(data.id);
}

// ---- INVOICE / GATE PASS ----
async function submitScrapSaleInvoice() {
  if (!ssActiveChallanId) { notify('Pick a Vehicle Challan first.', { icon: 'error' }); return; }
  if (!ssActiveItems.length) { notify('Add at least one commodity item before generating the Gate Pass.', { icon: 'error' }); return; }
  if (!ssSelectedBuyerId) { notify('Pick a Buyer from the dropdown (or use "Add Details" to create one).', { icon: 'error' }); return; }
  const invoiceNo = document.getElementById('ssInvoiceNo').value.trim();
  const invoiceDate = document.getElementById('ssInvoiceDate').value;
  const paymentType = document.getElementById('ssPaymentType').value;
  if (!invoiceNo) { notify('Invoice Number is required.', { icon: 'error' }); return; }
  if (!invoiceDate) { notify('Invoice Date is required.', { icon: 'error' }); return; }
  if (!paymentType) { notify('Payment Type is required.', { icon: 'error' }); return; }

  const { data, error } = await sb.rpc('complete_scrap_sale_invoice', {
    p_challan_id: ssActiveChallanId, p_buyer_id: ssSelectedBuyerId, p_invoice_no: invoiceNo,
    p_invoice_date: invoiceDate, p_payment_type: paymentType, p_updated_by: currentProfile.id,
  });
  if (error) { notify('Could not generate Gate Pass: ' + error.message, { icon: 'error' }); return; }
  const gatePassNo = (data && data[0]) ? data[0].gate_pass_no : '';
  notify('Gate Pass ' + gatePassNo + ' generated.', { icon: 'success' });
  const challanId = ssActiveChallanId;
  await renderScrapSoldSalesTab();
  await printScrapSaleGatePass(challanId);
}

// ---- COMPLETED TAB ----
async function renderScrapSoldCompletedTab() {
  document.getElementById('countSsCompleted').textContent = 'Loading…';
  const rows = await fetchAllRows((from, to) => sb.from('rewire_scrap_vehicle_challans')
    .select('*, rewire_scrap_buyers(company_name), rewire_scrap_sale_items(final_amount)')
    .eq('status', 'Invoiced').order('invoice_filled_on', { ascending: false }).range(from, to))
    .catch(err => { console.error(err); return []; });
  ssCompletedCache = rows || [];
  renderSsCompletedRows(ssCompletedCache);
}
function renderSsCompletedRows(rows) {
  document.getElementById('countSsCompleted').textContent = rows.length + ' gate pass(es)';
  document.getElementById('tbodySsCompleted').innerHTML = rows.length ? rows.map(c => {
    const total = (c.rewire_scrap_sale_items || []).reduce((s, it) => s + Number(it.final_amount || 0), 0);
    return `<tr>
      <td>${c.challan_no}</td>
      <td style="font-weight:500;">${c.gate_pass_no || '—'}</td>
      <td>${c.vehicle_number}</td>
      <td>${c.rewire_scrap_buyers ? c.rewire_scrap_buyers.company_name : '—'}</td>
      <td>₹${total.toLocaleString('en-IN')}</td>
      <td>${c.invoice_no || '—'}</td>
      <td>${c.invoice_date || '—'}</td>
      <td>${c.payment_type || '—'}</td>
      <td><button class="ab ab-view" onclick="printScrapSaleGatePass('${c.id}')"><i class="ti ti-printer" style="font-size:11px;" aria-hidden="true"></i> Print</button></td>
    </tr>`;
  }).join('') : '<tr><td colspan="9" style="text-align:center;color:var(--color-text-tertiary);padding:24px;">No completed Gate Passes yet.</td></tr>';
}
function filterScrapSoldCompletedTable(v) {
  const q = v.toLowerCase();
  const results = ssCompletedCache.filter(c =>
    (c.challan_no || '').toLowerCase().includes(q) || (c.gate_pass_no || '').toLowerCase().includes(q)
    || (c.vehicle_number || '').toLowerCase().includes(q) || (c.rewire_scrap_buyers && c.rewire_scrap_buyers.company_name.toLowerCase().includes(q)));
  renderSsCompletedRows(results);
}

// Print popup — same window.open()/document.write()/window.print() pattern
// as printMaterialSaleLabels()/printPartSaleGatePass() above, formatted to
// match Ramvir's reference Scrap_Sale_GP000674.pdf exactly (company header,
// "Scrap Sale Gate Pass" title, Gate Pass No./Date, Customer Name, then a
// Description of Goods/Qty(Kg)/Nos/Weight/Price-Unit/Final Amount table).
async function printScrapSaleGatePass(challanId) {
  const { data: challan } = await sb.from('rewire_scrap_vehicle_challans')
    .select('*, rewire_scrap_buyers(company_name)').eq('id', challanId).single();
  const { data: items } = await sb.from('rewire_scrap_sale_items').select('*').eq('challan_id', challanId).order('created_at');
  if (!challan) { notify('Could not load Gate Pass.', { icon: 'error' }); return; }
  const rows = items || [];
  const rowsHtml = rows.map(it => `<tr>
    <td>${it.category}${it.sub_category ? ' — ' + it.sub_category : ''}</td>
    <td style="text-align:center;">${it.hsn_code || ''}</td>
    <td style="text-align:center;">${it.uom === 'KG' ? it.qty : ''}</td>
    <td style="text-align:center;">${it.uom === 'Nos' ? it.qty : ''}</td>
    <td style="text-align:center;">${it.bridge_weight_kg != null ? it.bridge_weight_kg : ''}</td>
    <td style="text-align:center;">${it.price_per_unit}</td>
    <td style="text-align:right;">${Number(it.final_amount).toFixed(1)}</td>
  </tr>`).join('') + Array.from({ length: Math.max(0, 6 - rows.length) }).map(() => '<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>').join('');
  const total = rows.reduce((s, it) => s + Number(it.final_amount || 0), 0);
  const dateStr = challan.invoice_date ? new Date(challan.invoice_date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
  const html = `<html><head><title>${challan.gate_pass_no || challan.challan_no}</title><style>
    @page { size: A4; margin: 14mm; }
    body { font-family: Arial, sans-serif; font-size: 12px; color: #111; }
    .gp-box { border: 1px solid #111; padding: 16px; }
    .gp-header { text-align: center; font-weight: 700; font-size: 16px; margin-bottom: 2px; }
    .gp-sub { text-align: center; font-size: 11px; margin-bottom: 6px; }
    .gp-title { background: #111; color: #fff; text-align: center; font-weight: 700; padding: 4px 0; margin: 8px 0; }
    .gp-meta { display: flex; justify-content: space-between; margin: 6px 0; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { border: 1px solid #111; padding: 6px 8px; font-size: 11px; }
    th { background: #f1f1f1; }
    .gp-total-row td { font-weight: 700; }
  </style></head><body>
    <div class="gp-box">
      <div class="gp-header">Ganganagar Vaahan Udyog Pvt. Ltd.</div>
      <div class="gp-sub">Khasra No 252, Tehsil Mozamabad, Village Nasnoda, Dudu, Nasnoda-303007<br/>Email id : accounts.rewire@gnmotors.net</div>
      <div class="gp-title">Scrap Sale Gate Pass</div>
      <div class="gp-meta"><span>Gate Pass No. : ${challan.gate_pass_no || '—'}</span><span>Date : ${dateStr}</span></div>
      <div class="gp-meta"><span>Customer Name : ${challan.rewire_scrap_buyers ? challan.rewire_scrap_buyers.company_name : '—'}</span><span></span></div>
      <table>
        <thead><tr><th>Description of Goods</th><th>HSN Code</th><th>Qty (in Kg)</th><th>Nos</th><th>Weight</th><th>Price/Unit</th><th>Final Amount</th></tr></thead>
        <tbody>${rowsHtml}
          <tr class="gp-total-row"><td colspan="6" style="text-align:right;">Total</td><td style="text-align:right;">${total.toFixed(1)}</td></tr>
        </tbody>
      </table>
    </div>
  </body></html>`;
  const win = window.open('', '_blank', 'width=850,height=1000');
  win.document.open(); win.document.write(html); win.document.close();
  setTimeout(() => { win.focus(); win.print(); }, 300);
}

</script>
