<script>
// ============================================================
// CALLING MODULE (Ramvir, Oct 2026) — separate module (own file, like
// Incentive / Conveyance). Leads are entered here (one by one or Excel),
// a CRE calls them, logs a disposition for every call, and when the lead is
// interested the CRE assigns it to a PE — which creates the normal DMS lead
// (Need Analysis) for that PE (RPC assign_calling_lead_to_pe).
// Tables: rewire_calling_leads, rewire_calling_logs. Access: role CRE, or
// any user with calling_access ON (Settings > Users).
// Screens: Today's Calls, Total Leads, Other Leads, Performance (+ Leaderboard).
// ============================================================
const CALL_VEHICLE_TYPES = ['M (Cars)', 'L (2W)', 'N (Comm.)', 'O (Other)'];
const CALL_SOURCES = ['Exotel', 'Facebook', 'Heion Meta', 'Heion Rural', 'Heion Website', 'Just Dial', 'Meta Rural', 'OLX', 'TML', 'Whatsapp', 'Partner', 'NCD', 'UCD', 'Telein', 'Reference', 'Walkin', 'Workshop', 'Other'];
const CALL_LEAD_TYPES = ['Vehicle Scrap', 'Parts', 'New Vehicle', 'Misc'];
const CALL_DEAL_TYPES = ['Direct', 'Broker'];
// Status the CRE tags a connected call with (same list the team uses in the calling Google Sheet)
const CALL_CRM_PICK = ['High Demand', 'Interested', 'Open', 'Vehicle HPN', 'Vehicle Backlog', 'Closed'];
const CALL_CRM_COLORS = { 'Interested': '#2563eb', 'High Demand': '#dc2626', 'Open': '#64748b', 'Vehicle HPN': '#d97706', 'Vehicle Backlog': '#7c3aed', 'Purchased': '#059669', 'Closed': '#475569' };
const CALL_STATUSES = ['Fresh', 'Try Again', 'Follow Up', 'Assigned', 'Closed'];
const CALL_REASONS = ['RNR', 'Busy', 'Unreachable', 'Invalid Number', 'Other'];
const CC_PAGE = 10;
const CC_PREFIX = { today: 'ct', leads: 'cl', other: 'co' };

let callingLeadsCache = [];
let callingOtherCache = [];
let callingCreList = [];
let callingPeList = [];
let callingExpanded = new Set();
let callingHistCache = {};
let callingSelectedIds = new Set();
let callingShowDone = false;
let callingOtherShowDone = false;
let callingDispState = { contact: 'Contacted', crm: '', action: '', reason: '' };
let callingActiveLeadId = null;
let callingPerfTab = 'performance';
let callingBulkRows = null;
let callingPartners = null;
const callingPage = { today: 1, leads: 1, other: 1 };
const callingFilt = {
  today: { cs: new Set(), crm: new Set(), src: new Set(), city: '', age: 365 },
  leads: { cs: new Set(), crm: new Set(), src: new Set(), city: '', age: 365 },
};
let callingFiltCtx = 'today';
let callingFiltTmp = null;

function cEsc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function cVal(id) { const el = document.getElementById(id); return el ? (el.value || '') : ''; }
function callingIsCre() { return currentProfile && (currentProfile.role === 'CRE' || currentProfile.calling_access); }
function callingIsAdminish() { return currentProfile && ['Admin', 'Head', 'Back Office Head'].includes(currentProfile.role); }
function callingDayStart(d) { const x = d ? new Date(d + 'T00:00:00') : new Date(); x.setHours(0, 0, 0, 0); return x; }
function callingFmtDT(v) {
  if (!v) return '—';
  const d = new Date(v);
  return isNaN(d) ? '—' : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
}
function callingFmtTime(v) { const d = new Date(v); return isNaN(d) ? '—' : d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }); }
function callingStatusBadge(s) {
  const colors = { 'Fresh': '#2563eb', 'Try Again': '#d97706', 'Follow Up': '#7c3aed', 'Assigned': '#059669', 'Closed': '#64748b' };
  const c = colors[s] || '#64748b';
  return '<span class="cc-chip" style="color:' + c + ';background:' + c + '1a;border-color:' + c + '55;">' + cEsc(s || '—') + '</span>';
}
function callingCrmBadge(st) {
  if (!st) return '';
  const c = CALL_CRM_COLORS[st] || '#64748b';
  return '<span class="cc-chip" style="color:' + c + ';background:' + c + '1a;border-color:' + c + '55;">' + cEsc(st) + '</span>';
}
function callingInitials(n) { return String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase(); }

// ---------------- data loaders ----------------
async function callingLoadPeople() {
  const { data } = await sb.from('rewire_user_profiles').select('id, name, role, manager_id, active, calling_access').eq('active', true);
  const all = data || [];
  callingCreList = all.filter(u => u.role === 'CRE' || u.calling_access).sort((a, b) => a.name.localeCompare(b.name));
  callingPeList = all.filter(u => u.role === 'PE' || u.role === 'Manager').sort((a, b) => a.name.localeCompare(b.name));
}
async function callingLoadLeads() {
  callingLeadsCache = await fetchAllRows((from, to) => sb.from('rewire_calling_leads')
    .select(`*, cre:rewire_user_profiles!rewire_calling_leads_cre_id_fkey(name), pe:rewire_user_profiles!rewire_calling_leads_assigned_pe_id_fkey(name)`)
    .order('created_at', { ascending: false }).range(from, to))
    .catch(err => { console.error(err); notify('Could not load calling leads: ' + (err.message || err), { icon: 'error' }); return []; });
  // Live DMS status of leads already handed to a PE (security-definer RPC — a CRE can't read rewire_master_data directly)
  const { data: st } = await sb.rpc('calling_dms_status');
  const map = {}; (st || []).forEach(r => { map[r.calling_id] = r; });
  callingLeadsCache.forEach(l => { l.lead = map[l.id] || null; });
  // Only Vehicle Scrap leads are called. Parts / New Vehicle / Misc go to the separate "Other Leads" tab (remarks only).
  callingOtherCache = callingLeadsCache.filter(l => l.lead_type && l.lead_type !== 'Vehicle Scrap');
  callingLeadsCache = callingLeadsCache.filter(l => !l.lead_type || l.lead_type === 'Vehicle Scrap');
  callingHistCache = {};
}
function callingDmsStatus(d) {
  if (!d) return '';
  if (d.overall_status === 'Closed Lost') return 'Closed Lost';
  if (d.ud_status === 'Complete' && d.ha_status === 'Approved') return 'Purchased';
  return d.lead_status || 'Need Analysis';
}
function callingDmsBadge(d) {
  const s = callingDmsStatus(d); if (!s) return '';
  const c = { 'Purchased': '#059669', 'Closed Lost': '#dc2626', 'Qualified': '#2563eb' }[s] || '#d97706';
  return '<span class="cc-chip" style="color:' + c + ';background:' + c + '1a;border-color:' + c + '55;">' + cEsc(s) + '</span>';
}
function callingFillSelect(id, items, firstLabel, valueKey, labelKey) {
  const el = document.getElementById(id);
  if (!el) return;
  const cur = el.value;
  el.innerHTML = '<option value="">' + firstLabel + '</option>' + items.map(it => '<option value="' + cEsc(it[valueKey]) + '">' + cEsc(it[labelKey]) + '</option>').join('');
  if (cur) el.value = cur;
}

// WhatsApp: sends the approved template (server side, WhatsApp.gs > sendCallingWhatsApp) instead of opening wa.me
let callingWaLeadId = null;
function callingSendWa(id) {
  const l = callingLeadsCache.find(x => x.id === id) || callingOtherCache.find(x => x.id === id);
  if (!l) return;
  callingWaLeadId = id;
  document.getElementById('cwTo').textContent = l.customer_name + ' · ' + l.phone;
  document.getElementById('cwText').value = '';
  const sb0 = document.getElementById('cwSendBtn'); sb0.disabled = false; sb0.innerHTML = '<i class="ti ti-send" style="font-size:14px;" aria-hidden="true"></i> Send';
  openModal('callingWaModal');
}
function callingWaSubmit() {
  const l = callingLeadsCache.find(x => x.id === callingWaLeadId) || callingOtherCache.find(x => x.id === callingWaLeadId);
  const text = cVal('cwText').replace(/\s+/g, ' ').trim();
  if (!l) return;
  if (!text) { notify('Type the message first.', { icon: 'error' }); return; }
  if (typeof google === 'undefined' || !google.script || !google.script.run) { notify('WhatsApp can only be sent from the deployed app.', { icon: 'error' }); return; }
  const btn = document.getElementById('cwSendBtn');
  if (btn.disabled) return; // already sending — ignore repeat clicks
  const label = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = 'Sending…';
  google.script.run
    .withSuccessHandler(() => { btn.disabled = false; btn.innerHTML = label; closeModal('callingWaModal'); notify('WhatsApp message sent to ' + l.phone + '.'); })
    .withFailureHandler(err => { btn.disabled = false; btn.innerHTML = label; notify('WhatsApp failed: ' + (err && err.message ? err.message : err), { icon: 'error' }); })
    .sendCallingWhatsApp(l.phone, text);
}

// ---------------- shared list helpers (search / filters / pager / cards) ----------------
function callingSearchMatch(l, p) {
  const q = cVal(p + 'Search').trim().toLowerCase();
  if (!q) return true;
  const by = cVal(p + 'SearchIn') || 'name';
  if (by === 'phone') return (l.phone || '').includes(q) || (l.alt_phone || '').includes(q);
  if (by === 'vehicle') return [l.make, l.model, l.vehicle_type, l.vehicle_number].join(' ').toLowerCase().includes(q);
  if (by === 'callno') return (l.call_no || '').toLowerCase().includes(q);
  return (l.customer_name || '').toLowerCase().includes(q);
}
function callingFilterRows(rows, ctx) {
  const f = callingFilt[ctx]; if (!f) return rows;
  const now = Date.now();
  return rows.filter(l => (!f.cs.size || f.cs.has(l.call_status)) && (!f.crm.size || f.crm.has(l.crm_status)) && (!f.src.size || f.src.has(l.lead_source))
    && (!f.city || l.city === f.city) && (f.age >= 365 || (now - new Date(l.created_at).getTime()) / 86400000 <= f.age));
}
function callingFilterCount(ctx) {
  const f = callingFilt[ctx]; if (!f) return 0;
  return (f.cs.size ? 1 : 0) + (f.crm.size ? 1 : 0) + (f.src.size ? 1 : 0) + (f.city ? 1 : 0) + (f.age < 365 ? 1 : 0);
}
function callingPagerHtml(ctx, total, page) {
  if (!total) return '';
  const pages = Math.ceil(total / CC_PAGE);
  const a = (page - 1) * CC_PAGE + 1, b = Math.min(total, page * CC_PAGE);
  const nums = [];
  for (let i = 1; i <= pages; i++) { if (i === 1 || i === pages || Math.abs(i - page) <= 1) nums.push(i); else if (nums[nums.length - 1] !== '…') nums.push('…'); }
  return '<span class="cc-pager-info">Showing <b>' + a + '-' + b + '</b> of <b>' + total + '</b> results</span><div class="cc-pager-btns">'
    + '<button ' + (page <= 1 ? 'disabled' : '') + ' onclick="callingGoPage(\'' + ctx + '\',' + (page - 1) + ')"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>'
    + nums.map(n => n === '…' ? '<span>…</span>' : '<button class="' + (n === page ? 'on' : '') + '" onclick="callingGoPage(\'' + ctx + '\',' + n + ')">' + n + '</button>').join('')
    + '<button ' + (page >= pages ? 'disabled' : '') + ' onclick="callingGoPage(\'' + ctx + '\',' + (page + 1) + ')"><i class="ti ti-chevron-right" aria-hidden="true"></i></button></div>';
}
function callingGoPage(ctx, p) { callingPage[ctx] = p; callingRerender(ctx); const sc = document.querySelector('#section-calling-' + (ctx === 'today' ? 'today' : ctx) + ' .cc-scroll'); if (sc) sc.scrollTop = 0; }
function callingRerender(ctx) {
  if (ctx === 'today') callingRenderTodayList();
  else if (ctx === 'leads') callingRenderLeadsList();
  else callingRenderOtherList();
}
function callingSearchChanged(ctx) { callingPage[ctx] = 1; callingRerender(ctx); }

function callingLastTalk(l) {
  if (!l.last_called_at && !l.last_remarks) return '<div class="cc-last cc-last-none"><i class="ti ti-message-circle-off" aria-hidden="true"></i> No conversation yet</div>';
  const what = l.contact_status === 'Not Contacted' ? 'Not Contacted' + (l.reason ? ' (' + cEsc(l.reason) + ')' : '') : cEsc(l.disposition || l.contact_status || '');
  return '<div class="cc-last"><i class="ti ti-message-circle-2" aria-hidden="true"></i><div><b>Last talk · ' + callingFmtDT(l.last_called_at) + '</b> ' + callingCrmBadge(l.crm_status) + ' <span class="cc-last-what">' + what + '</span>'
    + (l.last_remarks ? '<div class="cc-last-rem">“' + cEsc(l.last_remarks) + '”</div>' : '') + '</div></div>';
}
function callingCardHtml(l, ctx) {
  const veh = [l.make, l.model].filter(Boolean).join(' ') || l.vehicle_type || '';
  const expanded = callingExpanded.has(l.id);
  const waNum = String(l.phone || '').replace(/\D/g, '');
  const overdue = ctx === 'today' && l.next_call_at && new Date(l.next_call_at) < callingDayStart();
  const accent = { 'Fresh': '#2563eb', 'Try Again': '#d97706', 'Follow Up': '#7c3aed', 'Assigned': '#059669', 'Closed': '#94a3b8' }[l.call_status] || '#94a3b8';
  const meta = [l.lead_type, l.lead_source, l.city].filter(Boolean).map(cEsc).join(' · ');
  const canAct = true; // Update stays available even after Closed/Assigned (re-open, add a new remark, set a new follow-up)
  const adm = callingIsAdminish();
  return `<div class="cc-card" style="border-left-color:${accent};" onclick="callingCardClick(event,'${l.id}','${ctx}')">
    <div class="cc-card-main">
      ${ctx === 'leads' && adm ? `<input type="checkbox" class="cc-sel" ${callingSelectedIds.has(l.id) ? 'checked' : ''} onchange="callingToggleSel('${l.id}', this.checked)" />` : ''}
      <div class="cc-avatar" style="background:${accent}1a;color:${accent};">${cEsc(callingInitials(l.customer_name))}</div>
      <div class="cc-card-info">
        <div class="cc-name">${cEsc(l.customer_name)} ${callingStatusBadge(l.call_status)} ${callingCrmBadge(l.crm_status)}${overdue ? ' <span class="cc-chip" style="color:#dc2626;background:#fee2e2;border-color:#fecaca;">Overdue</span>' : ''}</div>
        <div class="cc-phone"><i class="ti ti-phone" aria-hidden="true"></i> ${cEsc(l.phone)}${l.alt_phone ? ` <span style="color:#94a3b8;font-weight:500;">/ ${cEsc(l.alt_phone)}</span>` : ''}</div>
        <div class="cc-meta">${meta || '—'}${veh ? ' · <b>' + cEsc(veh) + '</b>' : ''}${l.deal_type === 'Broker' ? ' · Broker: ' + cEsc(l.broker_name || '') : ''}</div>
        ${l.pe ? `<div class="cc-meta" style="margin-top:2px;">Assigned to <b>${cEsc(l.pe.name)}</b>${l.lead ? ` · <span class="lid">${cEsc(l.lead.lead_no)}</span> ${callingDmsBadge(l.lead)}` : ''}</div>` : ''}
        ${callingLastTalk(l)}
      </div>
      <div class="cc-card-side">
        <div class="cc-side-line"><span>Next</span><b>${callingFmtDT(l.next_call_at)}</b></div>
        <div class="cc-side-line"><span>Attempts</span><b>${l.attempts || 0}</b></div>
        <div class="cc-side-line"><span>CRE</span><b>${cEsc(l.cre ? l.cre.name : '—')}</b></div>
      </div>
      <div class="cc-card-actions">
        <a class="cc-act cc-act-call" href="tel:${cEsc(l.phone)}" title="Call"><i class="ti ti-phone" aria-hidden="true"></i></a>
        <button class="cc-act cc-act-wa" title="Send WhatsApp message" onclick="callingSendWa('${l.id}')"><i class="ti ti-brand-whatsapp" aria-hidden="true"></i></button>
        ${canAct ? `<button class="btn btn-primary cc-update" onclick="openCallingDisposition('${l.id}')">Update</button>` : ''}
        <button class="cc-link" onclick="callingCardClick(event,'${l.id}','${ctx}',true)">${expanded ? 'Hide' : 'Details'}</button>
      </div>
    </div>
    ${expanded ? `<div class="cc-detail" id="ccDetail_${l.id}">${callingDetailHtml(l)}</div>` : ''}
  </div>`;
}
function callingCardClick(ev, id, ctx, force) {
  if (!force && ev.target.closest('a,button,input,select,textarea,label')) return;
  ev.stopPropagation();
  if (callingExpanded.has(id)) callingExpanded.delete(id); else callingExpanded.add(id);
  callingRerender(ctx);
}
function callingDetailHtml(l) {
  const hist = callingHistCache[l.id];
  const waNum = String(l.phone || '').replace(/\D/g, '');
  const prev = hist && hist[0];
  const prevHtml = prev
    ? `<div class="cc-prev"><div class="cc-prev-hd">${callingFmtDT(prev.called_at)} ${callingCrmBadge(prev.crm_status)}</div><div>${cEsc(prev.contact_status || '')}${prev.reason ? ' (' + cEsc(prev.reason) + ')' : ''} · ${cEsc(prev.disposition || '')}</div>${prev.remarks ? `<div class="cc-prev-rem">${cEsc(prev.remarks)}</div>` : ''}</div>`
    : (hist ? '<div class="cc-prev" style="color:#94a3b8;">No previous call</div>' : '<div class="cc-prev" style="color:#94a3b8;">Loading…</div>');
  const histHtml = hist && hist.length > 1 ? hist.slice(1).map(h => `<div class="cc-hist-row"><b>${callingFmtDT(h.called_at)}</b> ${callingCrmBadge(h.crm_status)} ${cEsc(h.contact_status || '')}${h.reason ? ' (' + cEsc(h.reason) + ')' : ''} · ${cEsc(h.disposition || '')}${h.remarks ? `<div style="color:#475569;">${cEsc(h.remarks)}</div>` : ''}</div>`).join('') : '';
  const info = (k, v) => `<div class="cc-kv"><span>${k}</span><b>${v ? cEsc(v) : '—'}</b></div>`;
  return `<div class="cc-detail-grid">
    <div><div class="cc-dt-title">Lead</div>${info('Call No.', l.call_no)}${info('Lead Type', l.lead_type)}${info('Source', l.lead_source)}${info('Location', l.city)}${info('Vehicle', [l.vehicle_type, l.make, l.model].filter(Boolean).join(' · '))}${l.deal_type ? info('Deal', l.deal_type + (l.deal_type === 'Broker' ? ' — ' + (l.broker_name || '') : '')) : ''}${info('Lead Remarks', l.remarks)}${l.lead ? info('DMS Lead', l.lead.lead_no + ' · ' + callingDmsStatus(l.lead)) : ''}</div>
    <div><div class="cc-dt-title">Previous Disposition</div>${prevHtml}<button class="btn cc-outline-btn" onclick="openCallingDisposition('${l.id}')">Update Disposition</button></div>
    <div><div class="cc-dt-title">Communications</div>
      <div class="cc-comm"><span>${cEsc(l.phone)}</span><a class="cc-act cc-act-call" href="tel:${cEsc(l.phone)}"><i class="ti ti-phone" aria-hidden="true"></i></a><button class="cc-act cc-act-wa" title="Send WhatsApp message" onclick="callingSendWa('${l.id}')"><i class="ti ti-brand-whatsapp" aria-hidden="true"></i></button><a class="cc-act cc-act-sms" href="sms:${cEsc(l.phone)}"><i class="ti ti-message" aria-hidden="true"></i></a></div>
      ${l.alt_phone ? `<div class="cc-comm"><span>${cEsc(l.alt_phone)}</span><a class="cc-act cc-act-call" href="tel:${cEsc(l.alt_phone)}"><i class="ti ti-phone" aria-hidden="true"></i></a></div>` : ''}
    </div>
  </div>${histHtml ? `<div class="cc-hist"><div class="cc-dt-title">Earlier calls</div>${histHtml}</div>` : ''}`;
}
async function callingHydrateDetails(rows) {
  for (const l of rows) {
    if (!callingExpanded.has(l.id) || callingHistCache[l.id]) continue;
    const { data } = await sb.from('rewire_calling_logs').select('*').eq('calling_lead_id', l.id).order('called_at', { ascending: false });
    callingHistCache[l.id] = data || [];
    const cell = document.getElementById('ccDetail_' + l.id);
    if (cell) cell.innerHTML = callingDetailHtml(l);
  }
}

// ---------------- FILTER DRAWER ----------------
function callingOpenFilters(ctx) {
  callingFiltCtx = ctx;
  const f = callingFilt[ctx];
  callingFiltTmp = { cs: new Set(f.cs), crm: new Set(f.crm), src: new Set(f.src), city: f.city, age: f.age };
  callingRenderFilters();
  openModal('callingFilterModal');
}
function callingRenderFilters() {
  const t = callingFiltTmp, ctx = callingFiltCtx;
  const pool = ctx === 'today' ? callingLeadsCache : callingLeadsCache;
  const cities = Array.from(new Set(pool.map(l => l.city).filter(Boolean))).sort();
  const chips = (arr, set, key) => arr.map(v => `<button class="cc-chipbtn ${set.has(v) ? 'on' : ''}" onclick="callingFiltToggle('${key}','${cEsc(v).replace(/'/g, '&#39;')}')">${cEsc(v)}</button>`).join('');
  const csList = ctx === 'today' ? ['Fresh', 'Try Again', 'Follow Up'] : CALL_STATUSES;
  document.getElementById('cfBody').innerHTML = `
    <div class="cc-fgroup"><div class="cc-fhd">Call Status</div><div class="cc-chips">${chips(csList, t.cs, 'cs')}</div></div>
    <div class="cc-fgroup"><div class="cc-fhd">Status</div><div class="cc-chips">${chips(CALL_CRM_PICK, t.crm, 'crm')}</div></div>
    <div class="cc-fgroup"><div class="cc-fhd">Lead Source</div><div class="cc-chips">${chips(CALL_SOURCES, t.src, 'src')}</div></div>
    <div class="cc-fgroup"><div class="cc-fhd">Location</div><select id="cfCity" onchange="callingFiltTmp.city=this.value"><option value="">All locations</option>${cities.map(c => `<option ${t.city === c ? 'selected' : ''}>${cEsc(c)}</option>`).join('')}</select></div>
    <div class="cc-fgroup"><div class="cc-fhd">Lead Age <span id="cfAgeLbl" style="font-weight:500;color:#64748b;">${t.age >= 365 ? 'Any' : 'up to ' + t.age + ' days'}</span></div>
      <input type="range" min="1" max="365" value="${t.age}" oninput="callingFiltTmp.age=+this.value;document.getElementById('cfAgeLbl').textContent=(+this.value>=365?'Any':'up to '+this.value+' days')" style="width:100%;height:auto;padding:0;border:none;" /></div>`;
}
function callingFiltToggle(key, v) {
  const s = callingFiltTmp[key]; if (s.has(v)) s.delete(v); else s.add(v);
  callingRenderFilters();
}
function callingFiltApply() {
  callingFilt[callingFiltCtx] = callingFiltTmp;
  closeModal('callingFilterModal');
  callingPage[callingFiltCtx] = 1;
  callingUpdateFilterBadge(callingFiltCtx);
  callingRerender(callingFiltCtx);
}
function callingFiltClear() {
  callingFiltTmp = { cs: new Set(), crm: new Set(), src: new Set(), city: '', age: 365 };
  callingRenderFilters();
}
function callingUpdateFilterBadge(ctx) {
  const el = document.getElementById(CC_PREFIX[ctx] + 'FilterCount'); if (!el) return;
  const n = callingFilterCount(ctx);
  el.textContent = n ? n : ''; el.style.display = n ? 'inline-flex' : 'none';
}

// ---------------- TODAY'S CALLS ----------------
async function renderCallingTodaySection() {
  if (!callingCreList.length && !callingPeList.length) await callingLoadPeople();
  await callingLoadLeads();
  callingFillSelect('ctCre', callingCreList, 'All CREs', 'id', 'name');
  const creWrap = document.getElementById('ctCreWrap');
  if (creWrap) creWrap.style.display = callingIsAdminish() ? '' : 'none';
  callingUpdateFilterBadge('today');
  await callingRenderToday();
}
function callingTodayBase() {
  const dayStart = callingDayStart(), dayEnd = new Date(dayStart.getTime() + 86400000);
  const creFilter = cVal('ctCre');
  const mine = callingLeadsCache.filter(l => !creFilter || l.cre_id === creFilter);

async function callingBulkAssignCre() {

    'Make': l.make || '', 'Model': l.model || '', 'Source': l.lead_source || '', 'CRE': l.cre ? l.cre.name : '',
    'Lead Type': l.lead_type || '', 'Deal Type': l.deal_type || '', 'Broker Name': l.broker_name || '', 'Call Status': l.call_status, 'Status': l.crm_status || '', 'Last Remarks': l.last_remarks || '', 'Attempts': l.attempts || 0, 'Last Disposition': l.disposition || '', 'Last Call': l.last_called_at ? new Date(l.last_called_at).toLocaleString() : '',
    'Next Call': l.next_call_at ? new Date(l.next_call_at).toLocaleString() : '', 'Assigned PE': l.pe ? l.pe.name : '', 'DMS Lead No.': l.lead ? l.lead.lead_no : '', 'DMS Status': callingDmsStatus(l.lead), 'Remarks': l.remarks || '',
  })), 'Calling Leads', ['Phone', 'Alt Phone']);
}

        <div class="cc-phone"><i class="ti ti-phone" aria-hidden="true"></i> ${cEsc(l.phone)}</div>
        <div class="cc-meta">${[l.call_no, l.lead_source, l.city].filter(Boolean).map(cEsc).join(' · ')} · CRE: <b>${cEsc(l.cre ? l.cre.name : '—')}</b></div>
        ${l.remarks ? `<div class="cc-meta">Lead remarks: ${cEsc(l.remarks)}</div>` : ''}
        ${isDone ? callingLastTalk(l) : ''}
      </div>
      <div class="cc-card-actions">
        <a class="cc-act cc-act-call" href="tel:${cEsc(l.phone)}" title="Call"><i class="ti ti-phone" aria-hidden="true"></i></a>
        <button class="cc-act cc-act-wa" title="Send WhatsApp message" onclick="callingSendWa('${l.id}')"><i class="ti ti-brand-whatsapp" aria-hidden="true"></i></button>

      ${isDone ? '' : `<div class="cc-other-row"><input id="coRem_${l.id}" placeholder="Enter remarks…" value="${cEsc(l.last_remarks || '')}" /><button class="btn btn-primary cc-update" onclick="withLoading(this, () => submitCallingOther('${l.id}'))">Submit</button></div>`}

async function submitCallingOther(id) {
  const rem = cVal('coRem_' + id).trim();
  if (!rem) { notify('Enter remarks first.', { icon: 'error' }); return; }
  const now = new Date().toISOString();
  const { error } = await sb.from('rewire_calling_leads').update({ last_remarks: rem, call_status: 'Closed', disposition: 'Remarks Submitted', last_called_at: now, updated_at: now }).eq('id', id);
  if (error) { notify('Could not save: ' + error.message, { icon: 'error' }); return; }
  notify('Submitted.');
  await renderCallingOtherSection();
}

  document.getElementById('cpTabPerformance').className = 'cc-tab' + (tab === 'performance' ? ' on' : '');
  document.getElementById('cpTabLeaderboard').className = 'cc-tab' + (tab === 'leaderboard' ? ' on' : '');
  document.getElementById('cpPerformancePane').style.display = tab === 'performance' ? '' : 'none';
  document.getElementById('cpLeaderboardPane').style.display = tab === 'leaderboard' ? '' : 'none';

async function renderCallingPerformanceSection() {
  if (!callingCreList.length && !callingPeList.length) await callingLoadPeople();

function callingRing(pct, color, label, sub) {
  const r = 24, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, pct || 0));
  return `<div class="cc-ring"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="#eef2f7" stroke-width="6"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(c * p / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">${Math.round(p)}%</text></svg><div><div class="cc-ring-l">${label}</div><div class="cc-ring-s">${sub}</div></div></div>`;
}
function callingChartSvg(items) {
  const W = 560, H = 230, L = 34, B = 26, T = 10, R = 8;
  const rawMax = Math.max(1, ...items.map(i => i.a));
  const step = Math.max(1, Math.ceil(rawMax / 4)), max = step * 4;
  const iw = (W - L - R) / items.length, bw = Math.min(26, iw * 0.55);
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = step * k; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8f0" stroke-dasharray="3 3"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end" font-size="9" fill="#94a3b8">${v}</text>`; }
  let bars = '', pts = [], dots = '', labs = '';
  items.forEach((it, i) => {
    const cx = L + iw * i + iw / 2;
    bars += `<rect x="${cx - bw / 2}" y="${y(it.a)}" width="${bw}" height="${(H - B) - y(it.a)}" rx="3" fill="url(#ccBar)"><title>${it.label}: ${it.a} attempts, ${it.c} contacts</title></rect>`;
    pts.push(cx + ',' + y(it.c)); dots += `<circle cx="${cx}" cy="${y(it.c)}" r="3.5" fill="#fff" stroke="#10b981" stroke-width="2"/>`;
    labs += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="9" fill="#64748b">${it.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="ccBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ea6a1f"/><stop offset="1" stop-color="#f8c9a8"/></linearGradient></defs>${g}${bars}<polyline points="${pts.join(' ')}" fill="none" stroke="#10b981" stroke-width="2"/>${dots}${labs}</svg>`;
}
async function callingRenderPerformance() {
  const date = cVal('cpDate');
  const dayStart = callingDayStart(date), dayEnd = new Date(dayStart.getTime() + 86400000);
  const weekStart = new Date(dayStart.getTime() - 6 * 86400000);
  const creSel = callingIsAdminish() ? cVal('cpCre') : currentProfile.id;

  const { data: board } = await sb.rpc('calling_leaderboard', { p_from: dayStart.toISOString(), p_to: dayEnd.toISOString() });
  const team = board || [];
  const medal = i => i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
  document.getElementById('tbodyCallingLeaderboard').innerHTML = team.length ? team.map((r, i) => `<tr${r.cre_id === currentProfile.id ? ' style="background:#eff6ff;font-weight:600;"' : ''}><td>${medal(i)}</td><td>${cEsc(r.cre_name)}</td><td>${r.attempts}</td><td>${r.contacts}</td><td>${r.assigned}</td><td>${r.follow_ups}</td><td><b>${r.score}</b></td></tr>`).join('')
    : '<tr><td colspan="7" style="text-align:center;color:var(--color-text-tertiary);padding:24px;">No CRE users yet.</td></tr>';

  const mine = creSel ? team.find(r => r.cre_id === creSel) : null;
  const sum = f => team.reduce((s, r) => s + Number(r[f] || 0), 0);
  const attempts = mine ? Number(mine.attempts) : sum('attempts'), contacts = mine ? Number(mine.contacts) : sum('contacts');
  const assigned = mine ? Number(mine.assigned) : sum('assigned'), follow = mine ? Number(mine.follow_ups) : sum('follow_ups');
  const score = mine ? Number(mine.score) : sum('score');
  const rank = mine ? (team.findIndex(r => r.cre_id === creSel) + 1) : '—';
  await callingLoadLeads();
  const pool = callingLeadsCache.filter(l => !creSel || l.cre_id === creSel);
  const openLeads = pool.filter(l => !['Assigned', 'Closed'].includes(l.call_status));
  const fresh = openLeads.filter(l => l.call_status === 'Fresh').length;
  const pendingToday = openLeads.filter(l => !l.next_call_at || new Date(l.next_call_at) < dayEnd).length;

  const { data: logs } = await sb.from('rewire_calling_logs').select('cre_id, contact_status, called_at').gte('called_at', weekStart.toISOString()).lt('called_at', dayEnd.toISOString()).order('called_at');
  const rows = (logs || []).filter(l => !creSel || l.cre_id === creSel);
  const todayRows = rows.filter(l => new Date(l.called_at) >= dayStart);
  let firstT = '—', lastT = '—', rate = '—';
  if (todayRows.length) {
    const t0 = new Date(todayRows[0].called_at), t1 = new Date(todayRows[todayRows.length - 1].called_at);
    firstT = callingFmtTime(t0); lastT = callingFmtTime(t1);
    rate = Math.round(todayRows.length / Math.max(1, (t1 - t0) / 3600000)) + ' calls/hr';
  }
  const pct = (a, b) => b ? a * 100 / b : 0;
  document.getElementById('cpTop').innerHTML = `
    <div class="cc-pcard cc-pcard-left"><div class="cc-pname"><i class="ti ti-user-circle" aria-hidden="true"></i> ${cEsc(mine ? mine.cre_name : (creSel ? '' : 'Whole team'))}</div>
      <div class="cc-pbox"><span>Rank</span><b>${rank}${mine ? ' <small>/ ' + team.length + '</small>' : ''}</b></div>
      <div class="cc-pbox"><span>Score</span><b>${score}</b></div>
      <div class="cc-pfacts"><div><span>Calling Rate</span><b>${rate}</b></div><div><span>First Call Time</span><b>${firstT}</b></div><div><span>Last Call Time</span><b>${lastT}</b></div></div></div>
    <div class="cc-pcard cc-pcard-right"><div class="cc-ptitle">Calling Performance <span class="cc-ptop-stats">Allotted <b>${openLeads.length}</b> &nbsp; Fresh <b>${fresh}</b> &nbsp; Pending today <b>${pendingToday}</b></span></div>
      <div class="cc-rings">
        ${callingRing(pct(attempts, attempts + pendingToday), '#3b82f6', 'Attempts', attempts + ' / ' + (attempts + pendingToday))}
        ${callingRing(pct(contacts, attempts), '#ef4444', 'Contacts', contacts + ' / ' + attempts)}
        ${callingRing(pct(assigned, contacts), '#16a34a', 'Assigned to PE', assigned + ' / ' + contacts)}
        ${callingRing(pct(follow, contacts), '#8b5cf6', 'Follow-ups set', follow + ' / ' + contacts)}
        ${callingRing(pct(attempts - contacts, attempts), '#f59e0b', 'Not contacted', (attempts - contacts) + ' / ' + attempts)}
      </div></div>`;

  const hourly = {}; for (let h = 8; h <= 20; h++) hourly[h] = { a: 0, c: 0 };
  todayRows.forEach(l => { const h = Math.min(20, Math.max(8, new Date(l.called_at).getHours())); hourly[h].a++; if (l.contact_status === 'Contacted') hourly[h].c++; });
  const daily = {}; for (let i = 0; i < 7; i++) { const d = new Date(weekStart.getTime() + i * 86400000); daily[d.toDateString()] = { label: d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }), a: 0, c: 0 }; }
  rows.forEach(l => { const k = new Date(l.called_at).toDateString(); if (daily[k]) { daily[k].a++; if (l.contact_status === 'Contacted') daily[k].c++; } });
  document.getElementById('cpHourly').innerHTML = callingChartSvg(Object.keys(hourly).map(h => ({ label: (h % 12 || 12) + (h < 12 ? ' AM' : ' PM'), a: hourly[h].a, c: hourly[h].c })));
  document.getElementById('cpWeekly').innerHTML = callingChartSvg(Object.values(daily));
  callingRenderSummary();
}
// Status-wise summary per CRE (like the team's Google Sheet): one row per CRE, one column per status, month-wise
const CALL_SUM_COLS = ['Closed', 'High Demand', 'Interested', 'Open', 'Purchased', 'Vehicle Backlog', 'Vehicle HPN'];
function callingSummaryData() {
  const month = cVal('cpMonth');
  const creSel = callingIsAdminish() ? cVal('cpCre') : currentProfile.id;
  const out = {};
  callingLeadsCache.forEach(l => {
    if (creSel && l.cre_id !== creSel) return;
    if (month && String(l.created_at || '').slice(0, 7) !== month) return;
    const eff = callingDmsStatus(l.lead) === 'Purchased' ? 'Purchased' : l.crm_status;
    if (!eff || !CALL_SUM_COLS.includes(eff)) return;
    const name = l.cre ? l.cre.name : '—';
    const r = out[name] = out[name] || { name, total: 0, nofu: 0 };
    r[eff] = (r[eff] || 0) + 1; r.total++;
    if (!['Assigned', 'Closed'].includes(l.call_status) && !l.next_call_at) r.nofu++;
  });
  return Object.values(out).sort((a, b) => a.name.localeCompare(b.name));
}
function callingRenderSummary() {
  const el = document.getElementById('cpSummary'); if (!el) return;
  const rows = callingSummaryData();
  const tot = { total: 0, nofu: 0 }; CALL_SUM_COLS.forEach(c => tot[c] = 0);
  rows.forEach(r => { CALL_SUM_COLS.forEach(c => tot[c] += (r[c] || 0)); tot.total += r.total; tot.nofu += r.nofu; });
  const td = v => '<td>' + (v || 0) + '</td>';
  el.innerHTML = '<table class="cc-sum"><thead><tr><th style="text-align:left;">CRE Name</th>' + CALL_SUM_COLS.map(c => '<th>' + c + '</th>').join('') + '<th>Total</th><th class="cc-sum-y">Without Next Follow-up Date</th></tr></thead><tbody>'
    + (rows.length ? rows.map(r => '<tr><td style="text-align:left;font-weight:600;">' + cEsc(r.name) + '</td>' + CALL_SUM_COLS.map(c => td(r[c])).join('') + '<td><b>' + r.total + '</b></td><td class="cc-sum-yc">' + r.nofu + '</td></tr>').join('')
      + '<tr class="cc-sum-tot"><td style="text-align:left;">Total</td>' + CALL_SUM_COLS.map(c => '<td>' + tot[c] + '</td>').join('') + '<td>' + tot.total + '</td><td class="cc-sum-y">' + tot.nofu + '</td></tr>'
      : '<tr><td colspan="' + (CALL_SUM_COLS.length + 3) + '" style="text-align:center;color:#94a3b8;padding:22px;">No status-tagged leads for this month.</td></tr>')
    + '</tbody></table>';
}
function exportCallingSummaryExcel() {
  const rows = callingSummaryData();
  if (!rows.length) { notify('Nothing to export.', { icon: 'info' }); return; }
  downloadXlsx('calling-summary-' + (cVal('cpMonth') || 'all') + '.xlsx', rows.map(r => {
    const o = { 'CRE Name': r.name }; CALL_SUM_COLS.forEach(c => o[c] = r[c] || 0); o['Total'] = r.total; o['Without Next Follow-up Date'] = r.nofu; return o;
  }), 'Summary');
}
