<script>
// DASHBOARD: All Leads / Qualified / Lost tables + pagination, plus the Dashboard analytics section.
// ------------------------------------------------------------
// READ + RENDER — loads leads for the current user's role
// RLS already restricts PE to their own leads server-side.
// ------------------------------------------------------------
const PAGE_SIZE = 50;
let naPage = 0, qualPage = 0, lostPage = 0;
let naTotal = 0, qualTotal = 0, lostTotal = 0;
let naSearch = '', qualSearch = '', lostSearch = '';
let naPageCache = [], qualPageCache = [], lostPageCache = [];
let searchDebounceTimer = null;

const LEAD_SELECT = `
    *, rewire_partners(partner_name, mobile),
    pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(name),
    manager:rewire_user_profiles!rewire_master_data_manager_id_fkey(name)
  `;

// Refreshes whichever tables/badges are currently relevant. Never loads
// the whole leads table into memory — only the current page of each tab
// (max ~150 rows total) plus lightweight counts from Postgres.
async function refreshLeadsTable() {
  await Promise.all([loadNATab(naPage), loadQualTab(qualPage), loadLostTab(lostPage), updateSidebarBadges()]);
  if (typeof renderDashboard === 'function' && document.getElementById('section-dashboard').style.display !== 'none') {
    renderDashboard(true); // preserveTab — user is actively viewing the dashboard, don't yank them to Overview
  }
}

async function updateSidebarBadges() {
  const { data: stats, error } = await sb.rpc('get_dashboard_stats', { pe_id_filter: null, manager_id_filter: null });
  if (error) { console.error(error); return; }
  document.getElementById('badgeNA').textContent = stats.need_analysis;
  document.getElementById('badgeQual').textContent = stats.qualified_active;
  document.getElementById('badgeLost').textContent = stats.closed_lost;
  const pb = document.getElementById('badgePayments');
  if (pb) pb.textContent = stats.payments_pending ?? '–';
}

function withSearch(query, col_list, term) {
  if (!term) return query;
  const ors = col_list.map(c => `${c}.ilike.%${term}%`).join(',');
  return query.or(ors);
}

// ---- ALL LEADS (Need Analysis + everything active) ----
async function loadNATab(page = 0) {
  naPage = page;
  initTableFilterBar('na', () => loadNATab(0));
  const nf = tableFilterState.na || {};
  let query = sb.from('rewire_master_data').select(LEAD_SELECT, { count: 'exact' })
    .eq('overall_status', 'Active')
    .order('created_at', { ascending: false })
    .range(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE - 1);
  if (nf.pe) query = query.eq('pe_id', nf.pe);
  if (nf.manager) query = query.eq('manager_id', nf.manager);
  if (nf.from) query = query.gte('created_at', istDayStart(nf.from));
  if (nf.to) query = query.lte('created_at', istDayEnd(nf.to));
  query = withSearch(query, ['customer_name', 'lead_no', 'phone', 'val_vehicle_number'], naSearch);
  const { data, error, count } = await query;
  if (error) { console.error(error); return; }
  naPageCache = data || [];
  naTotal = count || 0;
  renderNATable();
}

// PE previously had no way to move their own lead from "Need Analysis"
// to "Qualified" themselves (openEditLead/canEditLeadDetails blocks PE
// entirely) — this lets PE self-qualify their own leads without needing
// a Manager to do it via Edit. Manager/Admin can do it for any lead.
function canMarkQualified(lead) {
  if (!currentProfile) return false;
  if (lead.lead_status !== 'Need Analysis') return false;
  if (currentProfile.role === 'Admin' || currentProfile.role === 'Manager') return true;
  if (currentProfile.role === 'PE') return lead.pe_id === currentProfile.id;
  return false;
}

async function markLeadQualified(leadId) {
  const ok = await confirmDialog('Mark this lead as Qualified? It will move into the Qualified pipeline.');
  if (!ok) return;
  // sub_status must move in lockstep with lead_status — this quick-action
  // button skipped it entirely, unlike the full Edit Lead form (which
  // pairs Status with a dependent Sub-Status dropdown, see SM/handleST in
  // JS-Wiring.html), leaving it stuck blank forever for any lead qualified
  // this way instead of through Edit.
  const { error } = await sb.from('rewire_master_data').update({
    lead_status: 'Qualified', sub_status: 'Qualified', last_updated_by: currentProfile.id,
  }).eq('id', leadId);
  if (error) { notify('Error updating status: ' + error.message, { icon: 'error' }); return; }
  notify('Lead marked Qualified.');
  await refreshLeadsTable();
}

function renderNATable() {
  document.getElementById('countNA').textContent = naTotal + ' entries';
  const tbody = document.getElementById('tbodyNA');
  tbody.innerHTML = naPageCache.length ? naPageCache.map(l => `
    <div class="lead-card" onclick="viewLeadDetails('${l.id}')">
      <div class="lead-card-header">
        <div class="lead-card-title"><i class="ti ti-user" aria-hidden="true"></i> ${l.customer_name} <span class="lid">${l.lead_no}</span></div>
        <div class="lead-card-actions">
          <span class="badge ${l.lead_status === 'Qualified' ? 'badge-q' : 'badge-na'}" style="background:rgba(255,255,255,.9);">${l.lead_status}</span>
          ${canMarkQualified(l) ? `<button class="lead-card-btn" style="background:#059669;color:#fff;" onclick="event.stopPropagation();markLeadQualified('${l.id}')"><i class="ti ti-check" aria-hidden="true"></i> Mark Qualified</button>` : ''}
          <button class="lead-card-btn" onclick="event.stopPropagation();openEditLead('${l.id}')"><i class="ti ti-edit" aria-hidden="true"></i> Edit</button>
        </div>
      </div>
      <div class="lead-card-body">
        <div>
          <div class="lead-card-block-label"><i class="ti ti-phone" aria-hidden="true"></i> Contact</div>
          <div class="lead-card-block-value">${l.phone}<br><span class="sub">${l.email || 'No email'}</span></div>
        </div>
        <div>
          <div class="lead-card-block-label"><i class="ti ti-map-pin" aria-hidden="true"></i> Location</div>
          <div class="lead-card-block-value">${l.city}<br><span class="sub">${l.address ? l.address.slice(0, 40) + (l.address.length > 40 ? '…' : '') : '—'}</span></div>
        </div>
        <div>
          <div class="lead-card-block-label"><i class="ti ti-git-branch" aria-hidden="true"></i> Classification</div>
          <div class="lead-card-block-value">${l.lead_source} · ${l.lead_type}<br><span class="sub">${l.sub_status || '—'}</span></div>
        </div>
        <div>
          <div class="lead-card-block-label"><i class="ti ti-briefcase" aria-hidden="true"></i> Partner</div>
          <div class="lead-card-block-value">${l.rewire_partners ? l.rewire_partners.partner_name : '<span class="sub">— No partner</span>'}</div>
        </div>
        <div>
          <div class="lead-card-block-label"><i class="ti ti-users-group" aria-hidden="true"></i> Team</div>
          <div class="lead-card-block-value">PE: ${l.pe ? l.pe.name : '—'}<br><span class="sub">Mgr: ${l.manager ? l.manager.name : '—'}</span></div>
        </div>
        ${l.val_vehicle_number ? `<div>
          <div class="lead-card-block-label"><i class="ti ti-car" aria-hidden="true"></i> Vehicle</div>
          <div class="lead-card-block-value">${l.val_vehicle_number}<br><span class="sub">${l.val_make || ''} ${l.val_model_variant || ''}</span></div>
        </div>` : ''}
        ${(l.ud_total_offer_price || l.pn_total_offer_price) ? `<div>
          <div class="lead-card-block-label"><i class="ti ti-currency-rupee" aria-hidden="true"></i> Offer Price</div>
          <div class="lead-card-block-value">₹${l.ud_total_offer_price || l.pn_total_offer_price}</div>
        </div>` : ''}
        <div>
          <div class="lead-card-block-label"><i class="ti ti-calendar" aria-hidden="true"></i> Created</div>
          <div class="lead-card-block-value">${l.created_at ? new Date(l.created_at).toLocaleDateString() : '—'}<br><span class="sub">Updated: ${l.last_update ? new Date(l.last_update).toLocaleDateString() : '—'}</span></div>
        </div>
      </div>
    </div>`).join('') : '<div style="text-align:center;color:var(--color-text-tertiary);padding:24px;">No leads yet — click "Add Lead" to create one.</div>';
  renderPaginationControls('paginationNA', naPage, naTotal, (p) => loadNATab(p));
}

function onSearchNA(val) {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => { naSearch = val.trim(); loadNATab(0); }, 350);
}

// ---- QUALIFIED PIPELINE (filtered by current stage) ----
// Advance Payment / Omini Pay / Instant Payments follow a different stage
// order than Post Delivery — VZ/Manager Approval/Payment Release happen
// BEFORE Delivery instead of after it, and Delivery + the final Head
// Approval are decoupled from the strict current_stage ladder for these
// 3 types (Delivery can be filled any time once Bank KYC is done; final
// Head Approval becomes due once Delivery + Accessories Check are BOTH
// done, whatever current_stage happens to be). See
// supabase-batch29-payment-type-flow-redesign.sql for the full design.
const ALT_PAYMENT_TYPES = ['Advance Payment', 'Omini Pay', 'Instant Payments'];

async function loadQualTab(page = 0) {
  qualPage = page;
  initTableFilterBar('qual', () => loadQualTab(0));
  const qf = tableFilterState.qual || {};
  // A Manager should only ever see leads that belong to their own mapped
  // PEs — not every manager's leads company-wide. RLS currently grants
  // Manager broad read access to rewire_master_data for other reasons
  // (Payments/reporting), so this scoping happens here at the query
  // level instead. Applied once in base() so it covers every tab (every
  // curStage branch below builds off base()). Admin/Head/Back Office/
  // Accounts are unaffected — they're meant to see everything.
  // PE/Manager/date-range filter bar is applied here too, for the same
  // reason — every curStage branch (4/5/6/7/8/10 and the default) builds
  // off base(), so one filter application here covers the whole tab.
  const base = () => {
    let q = sb.from('rewire_master_data').select(LEAD_SELECT, { count: 'exact' })
      .eq('lead_status', 'Qualified').eq('overall_status', 'Active')
      .order('created_at', { ascending: false });
    if (currentProfile && currentProfile.role === 'Manager') q = q.eq('manager_id', currentProfile.id);
    if (qf.pe) q = q.eq('pe_id', qf.pe);
    if (qf.manager) q = q.eq('manager_id', qf.manager);
    if (qf.from) q = q.gte('created_at', istDayStart(qf.from));
    if (qf.to) q = q.lte('created_at', istDayEnd(qf.to));
    return q;
  };

  // Stages 4 (Upload Delivery), 5 (Verification & Zoho), 7 (Accessories
  // Check) and 8 (Head Approval, final) need a DIFFERENT filter for Post
  // Delivery leads vs the other 3 payment types, so those tabs fetch both
  // branches separately (no .range() — capped instead) and merge+paginate
  // on the client. Every other tab keeps the original single
  // server-paginated query, unchanged.
  if (curStage === 4 || curStage === 5 || curStage === 7 || curStage === 8) {
    // Each branch below used to build postQuery/altQuery once and await
    // them with no .range() at all — "capped instead" of paginated, per
    // the original comment. That's the same silent-1000-row-cap pattern
    // fixed everywhere else this session: fine while a stage's backlog
    // stays under 1000, but a busy stage eventually hits it with zero
    // error, silently dropping the tail. Restructured so each branch
    // builds a FACTORY function ((from,to) => ...query...) instead of a
    // single query object, and both sides are paginated via fetchAllRows.
    let postQueryFn, altQueryFn;
    // (Ramvir, Oct 2026) — 'Credit' is a real pn_payment_type (added Sept
    // 2026) that follows the exact same stage progression as 'Post
    // Delivery' — the app's own central rule, isAltFlowPaymentType()
    // (JS-Core.html), explicitly excludes 'Credit' from the alt-flow
    // leads alongside 'Post Delivery'. But every postQueryFn/altQueryFn
    // branch below was still hardcoded to .eq('pn_payment_type','Post
    // Delivery') only — so a Credit-type lead matched NEITHER branch the
    // moment it moved past Bank KYC (current_stage 3), vanishing from
    // every tab from Upload Delivery (4) through Head Approval (8)
    // entirely (e.g. L7103457). POST_DELIVERY_LIKE_TYPES below is used
    // everywhere the old literal 'Post Delivery' match was.
    const POST_DELIVERY_LIKE_TYPES = ['Post Delivery', 'Credit'];
    if (curStage === 4) {
      // Upload Delivery — Post Delivery: due right after Bank KYC
      // (current_stage 3), same as before. Advance/Omini/Instant: fillable
      // ANY time once Bank KYC is done, until it's actually completed —
      // not gated on current_stage at all.
      postQueryFn = () => base().in('pn_payment_type', POST_DELIVERY_LIKE_TYPES).eq('current_stage', 3);
      altQueryFn = () => base().in('pn_payment_type', ALT_PAYMENT_TYPES).eq('kyc_status', 'Complete')
        .or('ud_status.is.null,ud_status.neq.Complete');
    } else if (curStage === 5) {
      // Verification & Zoho — Post Delivery: due after Delivery
      // (current_stage 4, unchanged). Advance/Omini/Instant: due right
      // after Bank KYC (current_stage 3) — Delivery isn't in their path
      // at this point.
      postQueryFn = () => base().in('pn_payment_type', POST_DELIVERY_LIKE_TYPES).eq('current_stage', 4);
      altQueryFn = () => base().in('pn_payment_type', ALT_PAYMENT_TYPES).eq('current_stage', 3);
    } else if (curStage === 7) {
      // Accessories Check — Post Delivery: current_stage sits at 6 while
      // this is pending (submitAccessoriesCheck advances it to 7 on
      // confirm), so plain current_stage=6 already means "not yet done"
      // for this type, same as before. Advance Payment/Omini Pay/Instant
      // Payments: current_stage does NOT move for Accessories Check (it's
      // decoupled, same as Delivery) — current_stage=6 for these actually
      // means "Payment Release pending", a completely different stage, so
      // the old un-branched `current_stage = curStage - 1` query wrongly
      // matched every Alt-type lead sitting at Payment Release too (e.g.
      // L7102554 — Advance Payment, current_stage 6, ud_status still
      // Pending — showed up here despite Delivery not even being done).
      // Mirrors the real gating already used by the Operations section's
      // own Accessories Check queue (renderAccessoriesSection,
      // JS-Operations.html): ma_status Approved (or Instant Payments,
      // which skips Manager Approval), Delivery genuinely filled, and not
      // already Confirmed.
      postQueryFn = () => base().in('pn_payment_type', POST_DELIVERY_LIKE_TYPES).eq('current_stage', 6);
      // accessories_check_status is only ever written once, by
      // submitAccessoriesCheck() setting it to 'Confirmed' — nothing
      // initializes it to any other string, so a lead that's never been
      // through this step has it NULL, not 'Pending'. A plain .neq(...,
      // 'Confirmed') never matches a NULL column in Postgres (same class
      // of bug just fixed for payment_release_status), so paired with
      // .is.null the same way to actually catch every not-yet-confirmed
      // lead instead of silently excluding the NULL ones.
      altQueryFn = () => base().in('pn_payment_type', ALT_PAYMENT_TYPES)
        .or('ma_status.eq.Approved,pn_payment_type.eq.Instant Payments')
        .eq('ud_status', 'Complete').not('ud_filled_on', 'is', null)
        .or('accessories_check_status.neq.Confirmed,accessories_check_status.is.null');
    } else {
      // Head Approval (final closure) — Post Delivery: due after
      // Accessories Check (current_stage 7, unchanged). Advance/Omini/
      // Instant: due once Delivery + Accessories Check are BOTH done,
      // regardless of current_stage (which stays parked earlier for these
      // types while Delivery/Accessories happen independently).
      // Accessories Review gate (Ramvir, Sept 2026): if the Accessories
      // Check deduction was > 0, accessories_manager_review_status gets set
      // to 'Pending' and must become 'Reviewed' before Head Approval sees
      // the lead — a null status (no deduction, review step never
      // triggered) is fine to pass straight through, same NULL-safe .or()
      // pattern used for accessories_check_status above.
      postQueryFn = () => base().in('pn_payment_type', POST_DELIVERY_LIKE_TYPES).eq('current_stage', 7)
        .or('accessories_manager_review_status.is.null,accessories_manager_review_status.eq.Reviewed');
      altQueryFn = () => base().in('pn_payment_type', ALT_PAYMENT_TYPES)
        .eq('ud_status', 'Complete').not('ud_filled_on', 'is', null)
        .eq('accessories_check_status', 'Confirmed')
        .or('accessories_manager_review_status.is.null,accessories_manager_review_status.eq.Reviewed');
    }
    const [postData, altData] = await Promise.all([
      fetchAllRows((from, to) => withSearch(postQueryFn(), ['customer_name', 'lead_no', 'phone', 'val_vehicle_number'], qualSearch).range(from, to))
        .catch(err => { console.error(err); return []; }),
      fetchAllRows((from, to) => withSearch(altQueryFn(), ['customer_name', 'lead_no', 'phone', 'val_vehicle_number'], qualSearch).range(from, to))
        .catch(err => { console.error(err); return []; }),
    ]);
    const merged = [...postData, ...altData]
      .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    qualTotal = merged.length;
    qualPageCache = merged.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);
    renderQualTable();
    return;
  }

  if (curStage === 6) {
    // Manager Approval — every type except Instant Payments (which skips
    // Manager Approval entirely) arrives here right after VZ. Used to be
    // a single un-branched .eq('current_stage',5) query on the (wrong)
    // assumption that VZ-complete lands every type on the same number —
    // it doesn't: Post Delivery lands on 5 (Delivery already consumed 4),
    // but Advance Payment/Omini Pay land on 4 (Delivery's slot is skipped
    // for them — see submitVerificationZoho, JS-Pipeline.html). That
    // meant Advance Payment/Omini Pay leads NEVER matched this query at
    // all — permanently invisible here right after VZ, with no way for a
    // Manager to even find them to approve (see
    // supabase-batch64-fix-payment-release-gate.sql for the matching
    // DB-trigger half of this bug — even a workaround attempt to approve
    // one anyway would have been rejected by the trigger too).
    // 'Credit' follows 'Post Delivery's exact progression (see
    // isAltFlowPaymentType, JS-Core.html) — included here same as every
    // other stage branch, for the same reason (L7103457 was invisible).
    const [postData, altData] = await Promise.all([
      fetchAllRows((from, to) => withSearch(base().in('pn_payment_type', ['Post Delivery', 'Credit']).eq('current_stage', 5),
        ['customer_name', 'lead_no', 'phone', 'val_vehicle_number'], qualSearch).range(from, to))
        .catch(err => { console.error(err); return []; }),
      fetchAllRows((from, to) => withSearch(base().in('pn_payment_type', ['Advance Payment', 'Omini Pay']).eq('current_stage', 4),
        ['customer_name', 'lead_no', 'phone', 'val_vehicle_number'], qualSearch).range(from, to))
        .catch(err => { console.error(err); return []; }),
    ]);
    const merged = [...postData, ...altData]
      .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    qualTotal = merged.length;
    qualPageCache = merged.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);
    renderQualTable();
    return;
  }

  if (curStage === 10) {
    // NEW — Payment Release (Head, Advance Payment / Omini Pay only).
    // Right after Manager Approval, before Delivery/Payment.
    // payment_release_status is NULL (never explicitly set) for a lead
    // that has never been through this step yet — a plain .eq(...,
    // 'Pending') never matches a NULL column in Postgres, so every such
    // lead was silently excluded from its own tab (L7102543/L7102554 —
    // search correctly said "Payment Release" via the JS-side
    // `(l.payment_release_status || 'Pending') === 'Pending'` fallback in
    // describeLeadLocation, but the real query here required the literal
    // string). .is.null added alongside .eq.Pending to catch both.
    let query = base().in('pn_payment_type', ['Advance Payment', 'Omini Pay']).eq('current_stage', 6)
      .or('payment_release_status.eq.Pending,payment_release_status.is.null')
      .range(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE - 1);
    query = withSearch(query, ['customer_name', 'lead_no', 'phone', 'val_vehicle_number'], qualSearch);
    const { data, error, count } = await query;
    if (error) { console.error(error); return; }
    qualPageCache = data || [];
    qualTotal = count || 0;
    renderQualTable();
    return;
  }

  if (curStage === 11) {
    // NEW — Accessories Review (Ramvir, Sept 2026), Manager-only step. Same
    // leads/scoping as renderAccessoriesReviewSection() (JS-Operations.html,
    // the dedicated Compliance-group section) but surfaced here too, inside
    // the Qualified Pipeline stepper, right between Accessories Check (7)
    // and Head Approval (8) — so a Manager doesn't have to leave the
    // pipeline view to find a lead waiting on their remarks.
    let query = base().eq('accessories_manager_review_status', 'Pending')
      .range(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE - 1);
    query = withSearch(query, ['customer_name', 'lead_no', 'phone', 'val_vehicle_number'], qualSearch);
    const { data, error, count } = await query;
    if (error) { console.error(error); return; }
    qualPageCache = data || [];
    qualTotal = count || 0;
    renderQualTable();
    return;
  }

  // Valuation / Price Negotiation / Bank KYC (1-3), RC (9) — original
  // behaviour, untouched. (Accessories Check, stage 7, now has its own
  // branch above.)
  // A lead lives in exactly ONE tab — the one it's currently due for.
  // Editing the stage it just finished (e.g. Bank KYC once it's sitting
  // in Upload Delivery) happens via the "Edit — <prev stage>" button on
  // THIS card (see renderQualTable), not by also listing the lead a
  // second time in the earlier tab.
  let query = base().eq('current_stage', curStage - 1).range(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE - 1);
  query = withSearch(query, ['customer_name', 'lead_no', 'phone', 'val_vehicle_number'], qualSearch);
  const { data, error, count } = await query;
  if (error) { console.error(error); return; }
  qualPageCache = data || [];
  qualTotal = count || 0;
  renderQualTable();
}

function renderQualTable() {
  document.getElementById('countQual').textContent = qualTotal + ' leads';
  const tbody = document.getElementById('tbodyQual');
  const isPE = currentProfile && currentProfile.role === 'PE';
  const isApprovalStage = curStage === 6 || curStage === 7 || curStage === 8 || curStage === 10 || curStage === 11; // Manager Approval / Accessories Check / Head Approval / Payment Release / Accessories Review
  tbody.innerHTML = qualPageCache.length ? qualPageCache.map(l => {
    // Accessories Review (11) opens accReviewModal directly via
    // openAccessoriesReview() — it's not in STAGE_MODALS/openStageForm's
    // dispatcher since it's a remarks-only step, not a data-entry form.
    const actionBtn = (isPE && isApprovalStage)
      ? `<span class="badge badge-na" style="background:rgba(255,255,255,.9);">Pending ${STAGE_LABELS[curStage]}</span>`
      : curStage === 11
        ? `<button class="lead-card-btn" onclick="event.stopPropagation();openAccessoriesReview('${l.id}','${l.lead_no}')"><i class="ti ti-message-2" aria-hidden="true"></i> Review</button>`
        : `<button class="lead-card-btn" onclick="event.stopPropagation();openStageForm('${l.id}','${l.lead_no}',${curStage})"><i class="ti ti-clipboard-list" aria-hidden="true"></i> Fill Form — ${STAGE_LABELS[curStage]}</button>`;
    // A lead now due for THIS tab just finished the previous PE-facing
    // stage (Valuation → Price Negotiation → Bank KYC → Upload Delivery).
    // Rather than also listing it a second time back in that earlier
    // tab, this card gets a secondary button to fix that stage's data
    // right here — canEditStageForm() (JS-Wiring.html) still governs
    // whether it's actually still allowed (role, how far the lead has
    // since moved on, etc); the button just doesn't render when it isn't.
    // Manager Approval (6) for Post Delivery leads is a special case: the
    // immediately-previous PE-facing stage is Upload Delivery (4), not 5
    // (Verification & Zoho, which isn't a PE-facing form) — Manager asked
    // to be able to fix Delivery data right from this tab before approving,
    // same as the 2-4 "edit previous stage" pattern below. Alt-payment-type
    // leads (Advance/Omini/Instant) don't need this: their Upload Delivery
    // is already editable any time via canEditStageForm's separate branch,
    // independent of current_stage/this tab.
    const prevIdx = (curStage >= 2 && curStage <= 4) ? curStage - 1
      : (curStage === 6 && (l.pn_payment_type === 'Post Delivery' || l.pn_payment_type === 'Credit')) ? 4
      : null;
    const prevEditable = prevIdx && typeof canEditStageForm === 'function' && canEditStageForm(l, prevIdx);
    const prevEditBtn = prevEditable
      ? `<button class="lead-card-btn" onclick="event.stopPropagation();openStageForm('${l.id}','${l.lead_no}',${prevIdx})" title="Edit — ${STAGE_LABELS[prevIdx]}"><i class="ti ti-edit" aria-hidden="true"></i> Edit</button>`
      : '';
    // Current Stage badge — reflects THIS TAB: the stage the card is due
    // for, always suffixed "Pending" so it's unambiguous.
    const stageName = (curStage === 4 && isAltFlowPaymentType(l.pn_payment_type)) ? 'Upload Delivery'
      : (curStage === 10) ? 'Payment Release'
      : (STAGE_LABELS[curStage] || l.lead_status);
    const trueStageLabel = stageName + ' Pending';
    // Only the Upload Delivery tab itself should suppress the popup's
    // quick-edit button (see applyEditButtonPermission) — every other
    // tab (Manager Approval, Payment Release, etc.) needs it available,
    // including for Advance Payment/Omini Pay/Instant Payments leads
    // that are simultaneously "due" for Delivery in the data sense
    // (kyc done, ud not done) while ALSO due here — curStage is what
    // actually tells us which tab this card is being shown in.
    return `
    <div class="lead-card" onclick="viewLeadDetails('${l.id}', ${curStage === 4})">
      <div class="lead-card-header">
        <div class="lead-card-title"><i class="ti ti-car" aria-hidden="true"></i> ${l.customer_name} <span class="lid">${l.lead_no}</span></div>

      </div>
      <div class="lead-card-body">
        <div>
          <div class="lead-card-block-label"><i class="ti ti-phone" aria-hidden="true"></i> Contact</div>
          <div class="lead-card-block-value">${l.phone}<br><span class="sub">${l.city}</span></div>
        </div>
        <div>
          <div class="lead-card-block-label"><i class="ti ti-flag" aria-hidden="true"></i> Current Stage</div>
          <div class="lead-card-block-value"><span class="badge badge-l">${trueStageLabel}</span></div>
        </div>
        <div>
          <div class="lead-card-block-label"><i class="ti ti-briefcase" aria-hidden="true"></i> Partner</div>
          <div class="lead-card-block-value">${l.rewire_partners ? l.rewire_partners.partner_name : '<span class="sub">— Direct</span>'}</div>
        </div>
        <div>
          <div class="lead-card-block-label"><i class="ti ti-users-group" aria-hidden="true"></i> Team</div>
          <div class="lead-card-block-value">PE: ${l.pe ? l.pe.name : '—'}<br><span class="sub">Mgr: ${l.manager ? l.manager.name : '—'}</span></div>
        </div>
        ${l.val_vehicle_number ? `<div>
          <div class="lead-card-block-label"><i class="ti ti-car" aria-hidden="true"></i> Vehicle</div>
          <div class="lead-card-block-value">${l.val_vehicle_number}<br><span class="sub">${l.val_make || ''} ${l.val_model_variant || ''} · ${l.val_rc_type || ''}</span></div>
        </div>` : ''}
        ${(l.ud_total_offer_price || l.pn_total_offer_price) ? `<div>
          <div class="lead-card-block-label"><i class="ti ti-currency-rupee" aria-hidden="true"></i> Offer Price${l.ud_total_offer_price ? ' <span class="sub">(Final)</span>' : ''}</div>
          <div class="lead-card-block-value">₹${l.ud_total_offer_price || l.pn_total_offer_price}</div>
        </div>` : ''}
        ${l.pn_payment_type ? `<div>
          <div class="lead-card-block-label"><i class="ti ti-credit-card" aria-hidden="true"></i> Payment Type</div>
          <div class="lead-card-block-value">${l.pn_payment_type}</div>
        </div>` : ''}
        ${l.pn_deal_type ? `<div>
          <div class="lead-card-block-label"><i class="ti ti-file-description" aria-hidden="true"></i> Deal Type</div>
          <div class="lead-card-block-value">${l.pn_deal_type}</div>
        </div>` : ''}
        <!-- Payment Details -- once Upload Delivery is filled, ud_* fields
             are the FINAL confirmed split (can differ from what PN
             originally negotiated — Ramvir: "delivery ke time jo price
             hoga wahi final hoga"), so each line prefers its ud_
             equivalent and only falls back to the pn_ value pre-Delivery.
             ud_trader_payment is Delivery's COD-equivalent field (see
             JS-Wiring.html — it's literally prefilled from pn_cod_payment),
             so it's the right final source for the "COD" line too. -->
        ${(l.ud_customer_payment || l.pn_customer_payment || l.ud_broker_payment || l.pn_broker_payment || l.ud_trader_payment || l.pn_cod_payment || l.ud_cash_commission || l.pn_cash_commission) ? `<div>
          <div class="lead-card-block-label"><i class="ti ti-receipt" aria-hidden="true"></i> Payment Details${l.ud_status === 'Complete' ? ' <span class="sub">(Final)</span>' : ''}</div>
          <div class="lead-card-block-value">${[
            (l.ud_customer_payment || l.pn_customer_payment) ? `Customer: ₹${l.ud_customer_payment || l.pn_customer_payment}` : null,

            (l.ud_trader_payment || l.pn_cod_payment) ? `COD: ₹${l.ud_trader_payment || l.pn_cod_payment}` : null,
            (l.ud_cash_commission || l.pn_cash_commission) ? `Cash: ₹${l.ud_cash_commission || l.pn_cash_commission}` : null,

  }).join('') : '<div style="text-align:center;color:var(--color-text-tertiary);padding:24px;">No leads in the Qualified pipeline yet.</div>';
  renderPaginationControls('paginationQual', qualPage, qualTotal, (p) => loadQualTab(p));
}

// ---- CLOSED LOST ----
async function loadLostTab(page = 0) {
  lostPage = page;
  initTableFilterBar('lost', () => loadLostTab(0));
  const lf = tableFilterState.lost || {};
  let query = sb.from('rewire_master_data').select(LEAD_SELECT, { count: 'exact' })
    .eq('overall_status', 'Closed Lost')
    .order('created_at', { ascending: false })
    .range(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE - 1);
  if (lf.pe) query = query.eq('pe_id', lf.pe);
  if (lf.manager) query = query.eq('manager_id', lf.manager);
  if (lf.from) query = query.gte('created_at', istDayStart(lf.from));
  if (lf.to) query = query.lte('created_at', istDayEnd(lf.to));
  query = withSearch(query, ['customer_name', 'lead_no', 'phone', 'val_vehicle_number'], lostSearch);
  const { data, error, count } = await query;
  if (error) { console.error(error); return; }
  lostPageCache = data || [];
  lostTotal = count || 0;
  renderLostTable();
}

function renderLostTable() {
  document.getElementById('countLost').textContent = lostTotal + ' entries';
  const tbody = document.getElementById('tbodyLost');
  tbody.innerHTML = lostPageCache.length ? lostPageCache.map(l => `<tr>
    <td><button class="ab ab-edit" onclick="openEditLead('${l.id}')"><i class="ti ti-edit" style="font-size:11px;" aria-hidden="true"></i> Edit</button></td>
    <td><span class="lid" style="cursor:pointer;" onclick="viewLeadDetails('${l.id}')" title="Click for full details">${l.lead_no}</span></td>
    <td style="font-weight:500;">${l.customer_name}</td><td>${l.phone}</td><td>${l.city}</td><td>${l.lead_type}</td>
    <td>${l.rewire_partners ? l.rewire_partners.partner_name : '—'}</td>
    <td><span class="badge badge-l">${l.lead_status}</span></td>
    <td>${l.sub_status || '—'}</td>
    <td>${l.pe ? l.pe.name : '—'}</td>
    <td><span class="badge badge-na">${l.lost_at_stage || '—'}</span></td>
    <td>${new Date(l.last_update || l.created_at).toLocaleString()}</td>
  </tr>`).join('') : '<tr><td colspan="12" style="text-align:center;color:var(--color-text-tertiary);padding:24px;">No lost leads.</td></tr>';
  renderPaginationControls('paginationLost', lostPage, lostTotal, (p) => loadLostTab(p));
}

function onSearchLost(val) {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => { lostSearch = val.trim(); loadLostTab(0); }, 350);
}

// ---- Shared pagination control renderer ----
function renderPaginationControls(containerId, page, total, onPageChange) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const from = total === 0 ? 0 : page * PAGE_SIZE + 1;
  const to = Math.min(total, (page + 1) * PAGE_SIZE);
  window['_pgCb_' + containerId] = onPageChange;
  el.innerHTML = `
    <span class="pagi-info">Showing ${from}–${to} of ${total}</span>
    <div class="pagi-btns">
      <button class="pb" ${page <= 0 ? 'disabled style="opacity:.4;cursor:not-allowed;"' : ''} onclick="window['_pgCb_${containerId}'](${page - 1})">Previous</button>
      <button class="pb active">${page + 1} / ${totalPages}</button>
      <button class="pb" ${page + 1 >= totalPages ? 'disabled style="opacity:.4;cursor:not-allowed;"' : ''} onclick="window['_pgCb_${containerId}'](${page + 1})">Next</button>
    </div>`;
}

function findLeadInAnyPage(leadId) {
  return naPageCache.find(l => l.id === leadId)
    || qualPageCache.find(l => l.id === leadId)
    || lostPageCache.find(l => l.id === leadId)
    || null;
}

// DASHBOARD
// ------------------------------------------------------------
// PE role sees an "own leads only" dashboard: top-line stats, monthly
// summary and stage distribution are computed directly from
// rewire_master_data filtered by pe_id (bypassing the org-wide RPC
// functions), and the two inherently multi-PE comparison panels
// (PE-wise Lead Count bar, Detailed Stage Breakdown by PE) are hidden
// since a single-PE version of "compare PE against PE" isn't meaningful.
async function getPeScopedStats(peId) {
  const base = () => sb.from('rewire_master_data').select('id', { count: 'exact', head: true }).eq('pe_id', peId);
  const [total, na, qual, lost, completed] = await Promise.all([
    base(),
    base().eq('lead_status', 'Need Analysis'),
    base().eq('lead_status', 'Qualified').eq('overall_status', 'Active'),
    base().eq('overall_status', 'Closed Lost'),
    base().eq('ud_status', 'Complete').neq('overall_status', 'Closed Lost'),
  ]);
  return {
    total_leads: total.count || 0, need_analysis: na.count || 0, qualified_active: qual.count || 0,
    closed_lost: lost.count || 0, completed: completed.count || 0,
  };
}

// Total Purchase / CoD / Incentive / Conveyance summary cards for the
// Performance tab — own numbers for a PE, team totals for a Manager,
// org-wide totals for Admin/everyone else (Ramvir, Oct 2026 — these used
// to only show for PE/Manager, Ramvir wanted Admin to see them too).
// Scoped to `perfMonth` ('YYYY-MM' or null for All Time) so it matches
// whatever the Performance tab's own Month filter is set to.
// Incentive/Conveyance figures come straight from
// rewire_incentive_records / rewire_conveyance_trips (JS-Incentive.html /
// JS-Conveyance.html own this data) rather than recomputing them here.
async function renderPePerformanceCards(isPE, isManager, perfMonth) {
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  const isOrgWide = !isPE && !isManager;
  let peIds = [];
  if (isPE) peIds = [currentProfile.id];
  else if (isManager) peIds = (allActiveUsers || []).filter(u => u.manager_id === currentProfile.id).map(u => u.id);
  // else (Admin/others): peIds stays [] — unused, org-wide branches below skip the .in() filter entirely.

  // Total Purchase + CoD — straight from rewire_master_data, month-filtered
  // on ud_filled_on (same field Incentive's own monthly calc uses) when a
  // month is picked, else all-time.
  let purchaseQ = sb.from('rewire_master_data').select('id, ud_trader_payment', { count: 'exact' }).eq('ud_status', 'Complete').neq('overall_status', 'Closed Lost');
  if (isPE) purchaseQ = purchaseQ.eq('pe_id', currentProfile.id);
  else if (isManager) purchaseQ = purchaseQ.in('pe_id', peIds.length ? peIds : ['__none__']);
  if (perfMonth) { purchaseQ = purchaseQ.gte('ud_filled_on', perfMonth + '-01').lt('ud_filled_on', nextMonthStr(perfMonth) + '-01'); }
  const { data: purchaseRows, count: purchaseCount } = await purchaseQ;
  const codCount = (purchaseRows || []).filter(r => (parseFloat(r.ud_trader_payment) || 0) > 0).length;
  set('dashPerfTotalPurchase', purchaseCount ?? (purchaseRows || []).length);
  set('dashPerfCod', codCount);

  // Incentive — sum of final_amount from rewire_incentive_records. All-time
  // sums across every period_month when no month is picked (period_month is
  // always the 1st of a month, so an exact-month query is a straight .eq).
  // Org-wide (Admin/others) sums every PE + Manager row for the month —
  // no role/person filter.
  let incQ = sb.from('rewire_incentive_records').select('final_amount');
  if (isPE) incQ = incQ.eq('role', 'PE').eq('person_id', currentProfile.id);
  else if (isManager) incQ = incQ.eq('role', 'Manager').eq('person_id', currentProfile.id);
  if (perfMonth) incQ = incQ.eq('period_month', perfMonth + '-01');
  const { data: incRows } = await incQ;
  const incTotal = (incRows || []).reduce((s, r) => s + (Number(r.final_amount) || 0), 0);
  set('dashPerfIncentive', '₹' + incTotal.toLocaleString('en-IN'));

  // Conveyance — PE-only concept (Manager doesn't log trips), sum of
  // amount from rewire_conveyance_trips for this PE / this PE's team / all
  // PEs org-wide.
  let convQ = sb.from('rewire_conveyance_trips').select('amount');
  if (isPE) convQ = convQ.eq('pe_id', currentProfile.id);
  else if (isManager) convQ = convQ.in('pe_id', peIds.length ? peIds : ['__none__']);
  if (perfMonth) { convQ = convQ.gte('trip_date', perfMonth + '-01').lt('trip_date', nextMonthStr(perfMonth) + '-01'); }
  const { data: convRows } = await convQ;
  const convTotal = (convRows || []).reduce((s, r) => s + (Number(r.amount) || 0), 0);
  set('dashPerfConveyance', '₹' + convTotal.toLocaleString('en-IN'));
}

function nextMonthStr(monthStr) {
  const d = new Date(monthStr + '-01T00:00:00Z');
  d.setUTCMonth(d.getUTCMonth() + 1);
  return d.toISOString().slice(0, 7);
}

async function renderDashboard(preserveTab) {
  // All numbers now come from Postgres aggregate functions (see
  // performance-functions.sql) instead of looping over a full
  // client-side lead list — stays fast no matter how much data exists.
  // Exception: PE role, which is scoped to just their own leads via
  // direct filtered queries (getPeScopedStats etc. below) since the org
  // -wide RPCs don't take a per-PE filter.

  const isPE = currentProfile && currentProfile.role === 'PE';
  // Manager dashboard (Ramvir, Sept 2026) — was identical to Admin's full
  // org-wide view; now scoped to just the Manager's own team (leads with
  // manager_id = them, same scoping the Leads tab's Qualified Pipeline
  // query already used) so it doesn't show every OTHER manager's numbers
  // mixed in. Every RPC below that takes a manager_id_filter defaults it
  // to NULL, so Admin (isManager and isPE both false) is completely
  // unaffected — same org-wide behavior as before this change.
  const isManager = currentProfile && currentProfile.role === 'Manager';

  // Dashboard sub-tab visibility (Overview/Purchases/PE-Team Performance)
  // is now driven by the ordinary data-role-gate/Permissions Editor system
  // (dashboard-overview/dashboard-purchases/dashboard-performance — see
  // PERMISSION_GATE_REGISTRY, JS-Core.html) instead of being hardcoded
  // here to hide Performance for every PE regardless of what Admin grants.
  // Always land back on Overview on re-render (e.g. after a role/profile
  // switch) rather than leaving a stale tab selected. BUT skip this when
  // preserveTab is true — used by call sites that re-render the dashboard
  // while the user is actively looking at a specific tab (background data
  // refresh, or the Performance month filter's onchange) so we don't yank
  // them back to Overview mid-interaction (Ramvir, Sept 2026 bug report:
  // "PE / Team Performance me month select karte hi Overview tab me move
  // ho jata hai").
  if (!preserveTab && typeof showDashboardTab === 'function') showDashboardTab('overview');

  // Inventory dashboard sub-tab hidden for PE (Ramvir, Oct 2026) — stock/
  // material-level numbers aren't a PE's own data, so nothing for them to
  // act on there. Hardcoded here (not data-role-gate) since it's a flat
  // PE-only rule, not something Admin needs to toggle per-role.
  const dashMaterialNav = document.getElementById('dashnav-material');
  if (dashMaterialNav) dashMaterialNav.style.display = isPE ? 'none' : '';
  // CoD Trading dashboard tab (Ramvir, Oct 2026) — moved out of the Overview
  // pane into its own sub-tab, same hide rule as Material/Inventory above:
  // Back Office/Accounts-level data, not something a PE acts on.
  const dashCodTradingNav = document.getElementById('dashnav-codtrading');
  if (dashCodTradingNav) dashCodTradingNav.style.display = isPE ? 'none' : '';

  if (currentProfile) {
    const hour = new Date().getHours();
    const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    document.getElementById('dashGreeting').textContent = `${greeting}, ${currentProfile.name.split(' ')[0]} 👋`;
    document.getElementById('dashGreetingSub').textContent = isPE ? `Here's your own leads overview` : isManager ? `Here's your team's overview` : `Here's your REWIRE DMS overview`;
    document.getElementById('dashRoleBadge').textContent = currentProfile.role + ' Access';
  }

  // Header strip text (Ramvir, Sept 2026) — "<N> vehicles purchased · as of
  // <today>", shared by both the PE and org-wide stats branches below.
  const setDashHeaderInfo = (completedCount) => {
    const el = document.getElementById('dashHeaderInfo');
    if (el) el.textContent = `${completedCount ?? '–'} vehicles purchased · as of ${new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })}`;
  };

  // 1. Top-line stats
  if (isPE) {
    const stats = await getPeScopedStats(currentProfile.id);
    document.getElementById('dashTotalLeads').textContent = stats.total_leads;
    document.getElementById('dashNA').textContent = stats.need_analysis;
    document.getElementById('dashQual').textContent = stats.qualified_active;
    document.getElementById('dashLost').textContent = stats.closed_lost;
    document.getElementById('dashCompleted').textContent = stats.completed;
    setDashHeaderInfo(stats.completed);
    // Partners/Team/RC/Payments/COD are shared operational data, not
    // per-lead — left as "–" for PE rather than showing org-wide figures
    // that don't belong to "only apna" and that PE can't act on anyway.
    document.getElementById('dashPartnerCount').textContent = '–';
    document.getElementById('dashUserCount').textContent = '–';
    document.getElementById('dashRcPending').textContent = '–';
    document.getElementById('dashPaymentsPending').textContent = '–';
    document.getElementById('dashCodPending').textContent = '–';
  } else {
    // manager_id_filter scopes every count to just this Manager's team when
    // isManager — NULL (Admin/Head/Back Office/Accounts) keeps the exact
    // same org-wide numbers as before. Partners/Users stay org-wide either
    // way (see the RPC's own comment — neither table has a per-team concept).
    const { data: stats, error: statsErr } = await sb.rpc('get_dashboard_stats', { manager_id_filter: isManager ? currentProfile.id : null });
    if (statsErr) { console.error(statsErr); } else {
      document.getElementById('dashTotalLeads').textContent = stats.total_leads;
      document.getElementById('dashNA').textContent = stats.need_analysis;
      document.getElementById('dashQual').textContent = stats.qualified_active;
      document.getElementById('dashLost').textContent = stats.closed_lost;
      document.getElementById('dashCompleted').textContent = stats.completed;
      setDashHeaderInfo(stats.completed);
      document.getElementById('dashPartnerCount').textContent = stats.partners_count;
      document.getElementById('dashUserCount').textContent = stats.users_count;
      document.getElementById('dashRcPending').textContent = stats.rc_pending;
      document.getElementById('dashPaymentsPending').textContent = stats.payments_pending ?? '–';
      document.getElementById('dashCodPending').textContent = stats.cod_cvs_pending ?? '–';
    }
  }

  // 2. Monthly summary — last 6 months
  const now = new Date();
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ year: d.getFullYear(), month: d.getMonth() + 1, label: d.toLocaleString('en', { month: 'short' }) });
  }
  let monthCounts;
  if (isPE || isManager) {
    // Same own-rows approach for both — Manager's WHERE clause just keys
    // off manager_id instead of pe_id. No RPC needed since it's one simple
    // filtered select, same as the PE branch already did.
    const rangeStart = new Date(months[0].year, months[0].month - 1, 1).toISOString();
    let ownQuery = sb.from('rewire_master_data').select('created_at').gte('created_at', rangeStart);
    ownQuery = isPE ? ownQuery.eq('pe_id', currentProfile.id) : ownQuery.eq('manager_id', currentProfile.id);
    const { data: ownRows } = await ownQuery;
    monthCounts = months.map(m => (ownRows || []).filter(r => {
      const d = new Date(r.created_at);
      return d.getFullYear() === m.year && (d.getMonth() + 1) === m.month;
    }).length);
  } else {
    const { data: monthlyRows } = await sb.rpc('get_monthly_summary', { months_back: 6 });
    monthCounts = months.map(m => {
      const row = (monthlyRows || []).find(r => r.yr === m.year && r.mo === m.month);
      return row ? Number(row.cnt) : 0;
    });
  }
  const monthTotal = monthCounts.reduce((s, c) => s + c, 0);
  document.getElementById('dashMonthTotal').textContent = 'Total: ' + monthTotal;
  document.getElementById('dashMonthGrid').innerHTML = months.map((m, i) => {
    const isCurrent = i === months.length - 1;
    return `<div onclick="showMonthDetails(${m.year},${m.month},'${m.label}')" style="background:${isCurrent ? '#dbeafe' : '#f8fafc'};border:1.5px solid ${isCurrent ? '#1d4ed8' : 'var(--color-border-tertiary)'};border-radius:8px;padding:12px 8px;text-align:center;cursor:pointer;">
      <div style="font-size:10px;font-weight:700;color:${isCurrent ? '#1d4ed8' : 'var(--color-text-tertiary)'};text-transform:uppercase;letter-spacing:.05em;">${m.label}</div>
      <div style="font-size:20px;font-weight:700;margin:4px 0;color:${isCurrent ? '#1d4ed8' : 'var(--color-text-primary)'};">${monthCounts[i]}</div>
      <div style="font-size:9px;color:var(--color-text-tertiary);">leads</div>
    </div>`;
  }).join('');

  // 2b. Total Purchase Summary (vehicle-type breakdown) — org-wide for
  // Admin, scoped to just their own purchases for PE, scoped to their
  // team's purchases for Manager (Ramvir, Sept 2026).
  await renderPurchaseSummaryCards(isPE ? currentProfile.id : null, isManager ? currentProfile.id : null);

  // 2b-2. GVUPL-style Purchase Analytics widget (category tabs + filters +
  // KPI cards + monthly chart + PE-grouped table) — org-wide comparison
  // across every PE, so hidden for PE same as the Performance tab (nothing
  // to compare against for a single PE). Manager/Admin both see it,
  // unscoped for now — a manager_id filter can be added later the same way
  // the other widgets got one, if Ramvir wants team-only scoping here too.
  const paCard = document.getElementById('paCard');
  if (paCard) {
    if (isPE) { paCard.style.display = 'none'; }
    else { paCard.style.display = ''; await loadPurchaseAnalytics(); }
  }

  // 2c/2d. Location Wise Summary + CVS vs COD Monthly Summary — both
  // genuinely org-wide operational data (where vehicles are physically
  // parked; company-wide COD/CVS paperwork gap), not something an
  // individual PE acts on day-to-day. Hidden entirely for PE to declutter
  // their dashboard (Ramvir, Sept 2026) — Admin and Manager both still see
  // them (Manager keeps the full org-wide view here deliberately, per
  // Ramvir: these two are "optional, keep as-is" for Manager).
  const locationSummaryCard = document.getElementById('dashLocationSummaryCard');
  const cvsVsCodCard = document.getElementById('dashCvsVsCodSummaryCard');
  if (isPE) {
    if (locationSummaryCard) locationSummaryCard.style.display = 'none';
    if (cvsVsCodCard) cvsVsCodCard.style.display = 'none';
  } else {
    if (locationSummaryCard) locationSummaryCard.style.display = '';
    if (cvsVsCodCard) cvsVsCodCard.style.display = '';
    await renderLocationWiseSummary();
    // renderCvsVsCodMonthlySummary() lives in JS-Payments.html since
    // that's already home to the CVS vs COD Excel export it complements.
    if (typeof renderCvsVsCodMonthlySummary === 'function') renderCvsVsCodMonthlySummary('dashCvsVsCodSummary');
    // CoD Trading widget (renderCodTradesSummaryWidget, in JS-CodTrading.html)
    // moved out of this eager Overview render — it now lives on its own
    // "CoD Trading" dashboard sub-tab, lazily rendered by showDashboardTab()
    // in JS-Wiring.html, same pattern as the Material/Inventory tab.
  }

  // 3. PE-wise bar chart + Detailed Stage Breakdown by PE — both compare
  // PE against PE, so hidden entirely for PE role (nothing to compare
  // themselves against). Shown for Manager too now, but SCOPED to just
  // their own team's PEs (manager_id_filter) instead of Admin's full
  // org-wide top-10/every-PE view.
  const peBarsCard = document.getElementById('dashPeBarsCard');
  const breakdownCard = document.getElementById('dashBreakdownCard');

  // Month filter (Ramvir, Sept 2026) — populated once with the last 12
  // months (label + 'YYYY-MM' value), same pattern as Purchase Analytics'
  // own month dropdown. Re-read on every render so the selection survives
  // a re-render triggered by its own onchange. Moved above the isPE/else
  // split (Ramvir, Oct 2026) so the new PE/Team summary cards below — which
  // show for PE too, unlike peBarsCard/breakdownCard — can use the same
  // month selection instead of each needing their own filter.
  const perfMonthSelect = document.getElementById('dashPerfMonthFilter');
  if (perfMonthSelect && perfMonthSelect.options.length <= 1) {
    const now = new Date();
    let opts = '<option value="">All Time</option>';
    for (let i = 0; i < 12; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      const label = d.toLocaleString('en', { month: 'short', year: 'numeric' });
      opts += `<option value="${value}">${label}</option>`;
    }
    perfMonthSelect.innerHTML = opts;
  }
  const perfMonth = perfMonthSelect ? (perfMonthSelect.value || null) : null;

  // Total Purchase / CoD / Incentive / Conveyance summary cards — own
  // numbers for a PE, team totals for a Manager, org-wide totals for
  // Admin/everyone else. Added (Ramvir, Oct 2026) because the Performance
  // tab used to show NOTHING meaningful for a PE whose leads are all
  // already completed, and Ramvir wanted these visible for Admin/Manager
  // too, not just PE.
  const perfCardsWrap = document.getElementById('dashPePerfCards');
  if (perfCardsWrap) {
    perfCardsWrap.style.display = 'grid';
    await renderPePerformanceCards(isPE, isManager, perfMonth);
  }

  // PE-wise bar chart + Detailed Stage Breakdown — PE-vs-PE comparisons
  // for Admin/Manager (team-scoped), but now also shown for a PE scoped to
  // just themselves via pe_id_filter (Ramvir, Oct 2026 — "pending wali
  // summary" below the cards wasn't showing for PE at all before this).
  if (peBarsCard) peBarsCard.style.display = '';
  if (breakdownCard) breakdownCard.style.display = '';
  {
    const managerFilter = isManager ? currentProfile.id : null;
    const peIdFilter = isPE ? currentProfile.id : null;
    const peBarsLabel = document.getElementById('dashPeBarsLabel');
    if (peBarsLabel) peBarsLabel.textContent = isPE ? 'My Lead Count' : isManager ? 'My Team — PE-wise Lead Count' : 'PE-wise Lead Count';
    const breakdownLabel = document.getElementById('dashBreakdownLabel');
    if (breakdownLabel) breakdownLabel.textContent = isPE ? 'My Detailed Stage Breakdown (Pending)' : isManager ? 'My Team — Detailed Stage Breakdown by PE (Pending)' : 'Detailed Stage Breakdown by PE (Pending)';

    // Assigned vs Purchased per PE, with a conversion % — was previously
    // just raw assigned-lead count, which said nothing about actual
    // performance/output per PE. No longer capped to top 10 here (that cap
    // now only applies to the bar chart below) since the Detailed Stage
    // Breakdown table needs Assign Lead/Purchased Vehicle for every PE, not
    // just the top 10 by assigned count.
    const { data: peRows } = await sb.rpc('get_pe_lead_counts', { manager_id_filter: managerFilter, month_filter: perfMonth, pe_id_filter: peIdFilter });
    const peEntriesAll = (peRows || []).map(r => ({ name: r.pe_name, assigned: Number(r.assigned), purchased: Number(r.purchased) }));
    const peCountsByName = {};
    peEntriesAll.forEach(e => { peCountsByName[e.name] = e; });
    const peEntries = peEntriesAll.slice(0, 10);
    const maxAssigned = Math.max(1, ...peEntries.map(e => e.assigned));
    document.getElementById('dashPeBars').innerHTML = peEntries.length ? peEntries.map(e => {
      const pct = e.assigned > 0 ? ((e.purchased / e.assigned) * 100).toFixed(1) : '0.0';
      return `
      <div style="margin-bottom:11px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;">
          <span style="font-size:11px;color:var(--color-text-secondary);">${e.name}</span>
          <span style="font-size:11px;"><span style="font-weight:700;">${e.purchased}</span><span style="color:var(--color-text-tertiary);"> / ${e.assigned} (${pct}%)</span></span>
        </div>
        <div style="background:#f1f5f9;border-radius:4px;height:8px;overflow:hidden;position:relative;">
          <div style="position:absolute;inset:0;border-radius:4px;width:${(e.assigned/maxAssigned*100)}%;background:#e2e8f0;"></div>
          <div style="position:absolute;inset:0;border-radius:4px;width:${(e.purchased/maxAssigned*100)}%;background:#1d4ed8;"></div>
        </div>
      </div>`;
    }).join('') : '<div style="color:var(--color-text-tertiary);font-size:12px;">No leads yet</div>';

    const { data: breakdown } = await sb.rpc('get_pe_stage_breakdown', { manager_id_filter: managerFilter, month_filter: perfMonth, pe_id_filter: peIdFilter });
    const rows = breakdown || [];
    // Total (Ramvir, Sept 2026 rework) = sum of only the 6 stage columns
    // still shown here (val, pn, kyc, ud, vz, acc) — Mgr Approval and Head
    // Approval leads are no longer displayed as their own columns (per his
    // "ye pending me nahi hai" — once handed to Manager/Head, it's off the
    // PE's plate) and are now excluded from Total too, so Total always
    // equals the sum of the visible columns. RC Track stays independent as
    // before (rc_status isn't tied to current_stage, so it's informational,
    // not part of Total). Assign Lead / Purchased Vehicle come from
    // peCountsByName (get_pe_lead_counts, fetched above) rather than this
    // RPC, matched by pe_name.
    const grand = rows.reduce((g, r) => ({
      val: g.val + Number(r.val_count), pn: g.pn + Number(r.pn_count),
      kyc: g.kyc + Number(r.kyc_count), ud: g.ud + Number(r.ud_count), vz: g.vz + Number(r.vz_count),
      acc: g.acc + Number(r.acc_count), rc: g.rc + Number(r.rc_count),
    }), { val: 0, pn: 0, kyc: 0, ud: 0, vz: 0, acc: 0, rc: 0 });
    let grandAssigned = 0, grandPurchased = 0;
    // Grand Total's Avg Days Pending is a weighted average across every PE's
    // pending leads (not a plain average of the per-PE averages, which would
    // over-weight PEs with few pending leads) — accumulated below as we loop
    // rows, using each row's rowTotal as the weight.
    let avgDaysWeightedSum = 0, avgDaysWeight = 0;
    // Every non-zero cell (including Total) is clickable — opens a popup
    // listing the actual leads behind that count via
    // get_pe_stage_breakdown_detail() (Ramvir, Sept 2026 request), which
    // re-implements the exact same bucketing logic as this RPC so the
    // drill-down list always matches the number shown here. peName is
    // escaped into a data attribute (not inlined into the onclick string)
    // since PE names can contain characters (apostrophes) that would
    // otherwise break the handler.
    // managerFilter passed via a data attribute (not inlined into the
    // onclick string) too — inlining a UUID string there would need its
    // own quotes nested inside the double-quoted onclick="...", which
    // breaks the attribute; reading it back out of dataset sidesteps that
    // entirely. dataset gives back the literal string 'null' when there's
    // no manager filter, hence the explicit check in showPeStageDetailPopup().
    const cellAttrs = (peName, bucketKey) => `data-pe="${String(peName).replace(/"/g, '&quot;')}" data-bucket="${bucketKey}" data-mgr="${managerFilter || ''}" onclick="showPeStageDetailPopup(this.dataset.pe, this.dataset.bucket, this.dataset.mgr)"`;
    const cell = (v, peName, bucketKey) => v > 0 ? `<span ${cellAttrs(peName, bucketKey)} style="cursor:pointer;background:#dbeafe;color:#1d4ed8;padding:2px 7px;border-radius:4px;font-weight:700;font-size:11px;" title="Click to view leads">${v}</span>` : '<span style="color:var(--color-text-tertiary);">—</span>';
    const plain = (v) => v > 0 ? `<span style="font-weight:700;">${v}</span>` : '<span style="color:var(--color-text-tertiary);">—</span>';
    // Purchased Vehicle count — clickable like the stage-count cells above,
    // opens showPeVehiclePopup() (Ramvir, Sept 2026 request) which lists the
    // actual vehicles purchased via get_pe_purchased_detail(), scoped to the
    // same Month filter (ud_filled_on) that drives the count itself so the
    // list can never disagree with the number shown.
    const purchasedCell = (v, peName) => v > 0 ? `<span data-pe="${String(peName).replace(/"/g, '&quot;')}" data-mgr="${managerFilter || ''}" data-month="${perfMonth || ''}" onclick="showPeVehiclePopup(this.dataset.pe, this.dataset.mgr, this.dataset.month)" style="cursor:pointer;background:#dcfce7;color:#15803d;padding:2px 7px;border-radius:4px;font-weight:700;font-size:11px;" title="Click to view purchased vehicles">${v}</span>` : '<span style="color:var(--color-text-tertiary);">—</span>';
    document.getElementById('dashBreakdownBody').innerHTML =
      (rows.length ? rows.map(r => {
        const peCounts = peCountsByName[r.pe_name] || { assigned: 0, purchased: 0 };
        grandAssigned += peCounts.assigned; grandPurchased += peCounts.purchased;
        const rowTotal = Number(r.val_count) + Number(r.pn_count) + Number(r.kyc_count) + Number(r.ud_count) + Number(r.vz_count) + Number(r.acc_count);
        const avgDays = r.avg_days_pending !== null && r.avg_days_pending !== undefined ? Number(r.avg_days_pending) : null;
        if (avgDays !== null && rowTotal > 0) { avgDaysWeightedSum += avgDays * rowTotal; avgDaysWeight += rowTotal; }
        // >30 days pending flagged amber, >60 red — quick visual triage of which PE's backlog is going stale.
        const avgDaysColor = avgDays === null ? 'var(--color-text-tertiary)' : avgDays > 60 ? '#dc2626' : avgDays > 30 ? '#d97706' : 'var(--color-text-secondary)';
        return `<tr>
        <td style="padding:9px 12px;font-weight:600;border-bottom:0.5px solid #f1f5f9;">${r.pe_name}</td>
        <td style="padding:9px 12px;text-align:center;border-bottom:0.5px solid #f1f5f9;border-right:1px solid #f1f5f9;">${plain(peCounts.assigned)}</td>
        <td style="padding:9px 12px;text-align:center;border-bottom:0.5px solid #f1f5f9;">${cell(Number(r.val_count), r.pe_name, 'val')}</td>
        <td style="padding:9px 12px;text-align:center;border-bottom:0.5px solid #f1f5f9;">${cell(Number(r.pn_count), r.pe_name, 'pn')}</td>
        <td style="padding:9px 12px;text-align:center;border-bottom:0.5px solid #f1f5f9;">${cell(Number(r.kyc_count), r.pe_name, 'kyc')}</td>
        <td style="padding:9px 12px;text-align:center;border-bottom:0.5px solid #f1f5f9;">${cell(Number(r.ud_count), r.pe_name, 'ud')}</td>
        <td style="padding:9px 12px;text-align:center;border-bottom:0.5px solid #f1f5f9;">${cell(Number(r.vz_count), r.pe_name, 'vz')}</td>
        <td style="padding:9px 12px;text-align:center;border-bottom:0.5px solid #f1f5f9;">${cell(Number(r.acc_count), r.pe_name, 'acc')}</td>
        <td style="padding:9px 12px;text-align:center;border-bottom:0.5px solid #f1f5f9;border-left:1px solid #f1f5f9;">${cell(Number(r.rc_count), r.pe_name, 'rc')}</td>
        <td style="padding:9px 12px;text-align:center;border-bottom:0.5px solid #f1f5f9;border-left:1px solid #f1f5f9;">${purchasedCell(peCounts.purchased, r.pe_name)}</td>
        <td style="padding:9px 12px;text-align:center;border-bottom:0.5px solid #f1f5f9;border-left:1px solid #f1f5f9;font-weight:600;color:${avgDaysColor};">${avgDays === null ? '—' : avgDays + 'd'}</td>
        <td style="padding:9px 12px;text-align:center;border-bottom:0.5px solid #f1f5f9;border-left:1px solid #f1f5f9;font-weight:700;">${rowTotal || '—'}</td>
      </tr>`;
      }).join('') : '<tr><td colspan="12" style="text-align:center;color:var(--color-text-tertiary);padding:16px;">No leads yet</td></tr>') +
      `<tr style="background:#1d4ed8;color:#fff;">
        <td style="padding:10px 12px;font-weight:700;">Grand Total</td>
        <td style="padding:10px 12px;text-align:center;font-weight:700;border-right:1px solid #334155;">${grandAssigned}</td>
        <td style="padding:10px 12px;text-align:center;font-weight:700;">${grand.val}</td>
        <td style="padding:10px 12px;text-align:center;font-weight:700;">${grand.pn}</td>
        <td style="padding:10px 12px;text-align:center;font-weight:700;">${grand.kyc}</td>
        <td style="padding:10px 12px;text-align:center;font-weight:700;">${grand.ud}</td>
        <td style="padding:10px 12px;text-align:center;font-weight:700;">${grand.vz}</td>
        <td style="padding:10px 12px;text-align:center;font-weight:700;">${grand.acc}</td>
        <td style="padding:10px 12px;text-align:center;font-weight:700;border-left:1px solid #334155;">${grand.rc}</td>
        <td style="padding:10px 12px;text-align:center;font-weight:700;border-left:1px solid #334155;">${grandPurchased}</td>
        <td style="padding:10px 12px;text-align:center;font-weight:700;border-left:1px solid #334155;">${avgDaysWeight > 0 ? Math.round((avgDaysWeightedSum / avgDaysWeight) * 10) / 10 + 'd' : '—'}</td>
        <td style="padding:10px 12px;text-align:center;font-weight:700;border-left:1px solid #334155;">${grand.val + grand.pn + grand.kyc + grand.ud + grand.vz + grand.acc}</td>
      </tr>`;
  }

  // 4. Stage distribution dots — org-wide via RPC for Admin, or a direct
  // filtered current_stage count for PE (own leads) / Manager (own team)
  // (0=Valuation,1=Price Neg.,2=Bank KYC,3=Upload Delivery — matches the
  // reordered pipeline below).
  document.getElementById('dashStageDotsLabel').textContent = isPE ? 'My Stage Distribution' : isManager ? "My Team's Stage Distribution" : 'Stage Distribution';
  const stageDefs = [
    { key: 'valuation', label: 'Valuation', color: '#1d4ed8' },
    { key: 'price_negotiation', label: 'Price Neg.', color: '#7c3aed' },
    { key: 'bank_kyc', label: 'Bank KYC', color: '#059669' },
    { key: 'delivery', label: 'Delivery', color: '#d97706' },
  ];
  let stageCounts;
  if (isPE || isManager) {
    const stageBase = () => {
      let q = sb.from('rewire_master_data').select('id', { count: 'exact', head: true })
        .eq('lead_status', 'Qualified').eq('overall_status', 'Active');
      return isPE ? q.eq('pe_id', currentProfile.id) : q.eq('manager_id', currentProfile.id);
    };
    const [val, pn, kyc, ud] = await Promise.all([
      stageBase().eq('current_stage', 0), stageBase().eq('current_stage', 1),
      stageBase().eq('current_stage', 2), stageBase().eq('current_stage', 3),
    ]);
    stageCounts = [val.count || 0, pn.count || 0, kyc.count || 0, ud.count || 0];
  } else {
    const { data: dist } = await sb.rpc('get_stage_distribution');
    stageCounts = stageDefs.map(s => dist ? Number(dist[s.key] || 0) : 0);
  }
  const maxStage = Math.max(1, ...stageCounts);
  const stageTotal = stageCounts.reduce((s, c) => s + c, 0) || 1;
  document.getElementById('dashStageDots').innerHTML = stageDefs.map((s, i) => {
    const pct = ((stageCounts[i] / stageTotal) * 100).toFixed(0);
    return `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;">
      <span style="font-size:11px;color:var(--color-text-secondary);flex:1;">${s.label}</span>
      <div style="width:90px;height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden;"><div style="height:100%;border-radius:3px;width:${(stageCounts[i]/maxStage*100)}%;background:${s.color};"></div></div>
      <span style="font-size:10px;color:var(--color-text-tertiary);width:56px;text-align:right;">${stageCounts[i]} (${pct}%)</span>
    </div>`;
  }).join('');
}

// ------------------------------------------------------------
// TOTAL PURCHASE SUMMARY — Dashboard card grid + detail modal
// ------------------------------------------------------------
const VEHICLE_TYPE_META = {
  'M (Cars)': { color: '#1d4ed8' },
  'L (2W)': { color: '#059669' },
  'N (Commercial Vehicles)': { color: '#92400e', short: 'N (Comm.)' },
  'O (Other)': { color: '#991b1b' },
};
let _purchaseSummaryRows = [];
let _psActiveYear = null, _psActiveMonth = null, _psActiveLabel = '';

async function renderPurchaseSummaryCards(peId, managerId) {
  const { data, error } = await sb.rpc('get_purchase_summary_by_month', { months_back: 4, pe_id_filter: peId || null, manager_id_filter: managerId || null });
  if (error) { console.error(error); return; }
  _purchaseSummaryRows = data || [];
  // Card heading/total label switch to "My ..."/"My Team's ..." when
  // scoped, so it doesn't read like the whole company's numbers.
  const heading = document.getElementById('dashPurchaseHeading');
  if (heading) heading.textContent = peId ? 'My Purchase Summary' : managerId ? "My Team's Purchase Summary" : 'Total Purchase Summary';

  const now = new Date();
  const months = [];
  for (let i = 3; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ year: d.getFullYear(), month: d.getMonth() + 1, label: d.toLocaleString('en', { month: 'short', year: '2-digit' }) });
  }

  let grandTotal = 0;
  document.getElementById('dashPurchaseGrid').innerHTML = months.map(m => {
    const rows = _purchaseSummaryRows.filter(r => r.yr === m.year && r.mo === m.month);
    const monthTotal = rows.reduce((s, r) => s + Number(r.cnt), 0);
    grandTotal += monthTotal;
    const types = ['M (Cars)', 'L (2W)', 'N (Commercial Vehicles)', 'O (Other)'];
    const quads = types.map((t, i) => {
      const row = rows.find(r => r.vehicle_type === t);
      const meta = VEHICLE_TYPE_META[t];
      const brdr = (i % 2 === 0 ? 'border-right:1px solid #e5e7eb;' : '') + (i < 2 ? 'border-bottom:1px solid #e5e7eb;' : '');
      return `<div style="padding:10px;${brdr}">
        <div style="font-size:20px;font-weight:700;color:${meta.color};">${row ? row.cnt : 0}</div>
        <div style="font-size:11px;color:var(--color-text-secondary);">${meta.short || t}</div>
        <div style="font-size:10px;color:var(--color-text-tertiary);">Avg/kg: ${row && row.avg_per_kg ? row.avg_per_kg : 0}</div>
      </div>`;
    }).join('');
    return `<div style="border:1px solid #cbd5e1;border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);" onclick="openPurchaseSummaryDetail(${m.year},${m.month},'${m.label}')">
      <div style="background:#1d4ed8;color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-weight:700;font-size:13px;">${m.label}</span>
        <span style="background:rgba(255,255,255,.2);padding:2px 8px;border-radius:10px;font-size:11px;">Total: ${monthTotal}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;">${quads}</div>
    </div>`;
  }).join('');
  document.getElementById('dashPurchaseGrandTotal').textContent = 'Grand Total: ' + grandTotal + ' vehicles';
}

async function openPurchaseSummaryDetail(year, month, label) {
  _psActiveYear = year; _psActiveMonth = month; _psActiveLabel = label;
  const start = new Date(year, month - 1, 1).toISOString();
  const end = new Date(year, month, 1).toISOString();

  let psQuery = sb.from('rewire_master_data')
    .select(`customer_name, phone, val_vehicle_type, val_vehicle_number, val_make, val_model_variant,
      val_kerb_weight_kg, pn_total_offer_price, pn_deal_type, ud_customer_payment, ud_broker_payment, ud_trader_payment,
      ud_cash_commission, ud_total_offer_price, ud_filled_on,
      pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(name)`)
    .eq('ud_status', 'Complete')
    .neq('overall_status', 'Closed Lost')
    .gte('ud_filled_on', start).lt('ud_filled_on', end)
    .order('ud_filled_on', { ascending: false });
  // Same scoping as the summary cards themselves (renderPurchaseSummaryCards)
  // — without this, a PE/Manager clicking their own month card would still
  // see every OTHER PE's/team's purchases in the drill-down popup.
  if (currentProfile && currentProfile.role === 'PE') psQuery = psQuery.eq('pe_id', currentProfile.id);
  if (currentProfile && currentProfile.role === 'Manager') psQuery = psQuery.eq('manager_id', currentProfile.id);
  const { data, error } = await psQuery;
  if (error) { notify('Error loading details: ' + error.message, { icon: 'error' }); return; }

  _purchaseSummaryDetailRows = data || [];
  document.getElementById('psModalTitle').textContent = `${label} — ${_purchaseSummaryDetailRows.length} vehicles`;

  const peNames = [...new Set(_purchaseSummaryDetailRows.map(r => r.pe ? r.pe.name : 'Unassigned'))];
  document.getElementById('psPeFilter').innerHTML = '<option value="">All PE</option>' + peNames.map(n => `<option value="${n}">${n}</option>`).join('');
  const codInput = document.getElementById('psCodDeduction'); if (codInput) codInput.value = '';
  // Column filters are keyed by table id ('psTable', fixed) not by which
  // month is open — without clearing here, a filter left on from a
  // previously-viewed month would silently carry over and hide rows in
  // this one too (Ramvir, Sept 2026 fix, found while fixing the stats-row
  // column-filter bug above).
  const psTableEl = document.getElementById('psTable');
  if (psTableEl && typeof clearColumnFiltersForTable === 'function') clearColumnFiltersForTable(psTableEl);

  renderPurchaseSummaryTable();
  openModal('purchaseSummaryModal');
}

// Split out of openPurchaseSummaryDetail() (Ramvir, Sept 2026 fix) — the
// M/L/N/O count cards used to only ever get computed once, off the FULL
// unfiltered row set, and never again. Picking a PE from the dropdown re-
// rendered the table below with that PE's vehicles but left these cards
// showing the whole month's totals — so "how many M(Cars)/L(2W)/etc. did
// Khemraj specifically buy" had no answer anywhere in this popup. Now
// called every time the PE filter changes, off whatever the filtered rows
// actually are.
function renderPsStatsRow(rows) {
  const el = document.getElementById('psStatsRow');
  if (!el) return;
  const typeCounts = {};
  rows.forEach(r => { const t = r.val_vehicle_type || 'O (Other)'; typeCounts[t] = (typeCounts[t] || 0) + 1; });
  el.innerHTML = Object.entries(VEHICLE_TYPE_META).map(([t, meta]) => `
    <div style="flex:1;text-align:center;padding:12px;border-right:0.5px solid var(--color-border-tertiary);">
      <div style="font-size:22px;font-weight:700;color:${meta.color};">${typeCounts[t] || 0}</div>

}

// Fired by JS-Core.html's generic column-filter engine (applyColumnFilters)
// via psTable's data-col-filter-hook attribute, every time a per-column
// funnel filter is applied/changed/cleared — see _psTableRenderedRows above
// for why index-matching the <tr>s back to source rows works here.
function psOnColumnFilterChange(table) {
  const tbody = table.querySelector('tbody');
  if (!tbody) return;
  const trs = Array.from(tbody.children).filter(r => r.tagName === 'TR' && !r.querySelector('td[colspan]'));
  const visibleRows = trs.map((tr, i) => (tr.dataset.twColFiltered !== '1' && tr.dataset.twFiltered !== '1') ? _psTableRenderedRows[i] : null).filter(Boolean);
  renderPsStatsRow(visibleRows);
}
