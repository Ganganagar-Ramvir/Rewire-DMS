// ------------------------------------------------------------
// LOCATION WISE SUMMARY — days-since-delivery aging matrix, split by
// parking location (ud_vehicle_parking). Same data scope as Total
// Purchase Summary (ud_status = 'Complete'). "Days" = today minus
// ud_filled_on (when the Upload Delivery form — which records the
// parking location — was completed). Click a non-zero cell to see the
// underlying vehicles, same click-through idea as Total Purchase Summary.
// ------------------------------------------------------------
const AGING_BUCKETS = [
  { label: '<7 days', min: 0, max: 6 },
  { label: '7 to 15 days', min: 7, max: 14 },
  { label: '15 to 30 days', min: 15, max: 29 },
  { label: '30 to 60 days', min: 30, max: 59 },
  { label: '>60 days', min: 60, max: Infinity },
];
let _locationSummaryRows = [];

// Same physical location can be typed with different casing/spacing
// (e.g. "Ajmer" vs "AJMER") — normalizing here so they merge into one
// column instead of showing up as two separate ones in the table.
const normLoc = (v) => (v && v.trim()) ? v.trim().toUpperCase().replace(/\s+/g, ' ') : 'No Location';
// Sub Location kept in its original casing (it's a real place/yard name,
// not typed freely enough elsewhere to need normalizing) — 'Not Specified'
// for the (currently: every) vehicle whose Sub Location hasn't been filled
// in yet via Upload Delivery / Location Tracking's Update flow.
const normSubLoc = (v) => (v && v.trim()) ? v.trim() : 'Not Specified';

// Location Wise Summary reworked (Ramvir, Sept 2026) from a flat
// bucket-rows/location-columns matrix into Location rows that expand to
// reveal a Sub Location breakdown underneath — same expand/collapse
// pattern as Purchase Analytics' PE -> Category -> Deal Type hierarchy
// (togglePaDealType etc., this same file). Kept as 2 functions: this one
// fetches once, renderLocationSummaryTable() does the actual (re-)render
// so toggling a row's expand state doesn't need a fresh Supabase round
// trip every click.
let expandedLocationSummaryRows = new Set();

function toggleLocationSummaryRow(loc) {
  if (expandedLocationSummaryRows.has(loc)) expandedLocationSummaryRows.delete(loc);
  else expandedLocationSummaryRows.add(loc);
  renderLocationSummaryTable();
}

async function renderLocationWiseSummary() {
  const container = document.getElementById('dashLocationSummaryTable');
  if (!container) return;
  // Every delivered vehicle ever, no date bound — will silently drop the
  // oldest rows past Supabase's 1000-row cap once delivered-vehicle count
  // grows past that (same class of bug fixed everywhere else this session).
  // overall_status = 'Purchased' (not just ud_status = 'Complete') — same
  // reasoning as get_purchase_summary_by_month() (Sept 2026): a delivered
  // vehicle still awaiting Head Approval, or one Closed Lost after
  // delivery, isn't a completed purchase yet.
  const data = await fetchAllRows((from, to) => sb.from('rewire_master_data')
    .select('id, lead_no, customer_name, phone, val_vehicle_type, val_vehicle_number, val_make, val_model_variant, ud_vehicle_parking, ud_vehicle_sub_parking, ud_filled_on')
    .eq('ud_status', 'Complete')
    .eq('overall_status', 'Purchased')
    .not('ud_filled_on', 'is', null)
    // Scrapped / "Scrapped - Provisionally" stay out. Jaipur Plant is back IN (Ramvir, Oct 2026) so the
    // summary shows how many vehicles sit at Jaipur Plant and its Yard-2 / Yard-3 sub-locations.
    .not('ud_vehicle_parking', 'in', '(Scrapped,Scrapped - Provisionally)')
    .range(from, to))
    .catch(err => { console.error(err); return []; });
  _locationSummaryRows = data || [];
  renderLocationSummaryTable();
}

function renderLocationSummaryTable() {
  const container = document.getElementById('dashLocationSummaryTable');
  if (!container) return;
  if (!_locationSummaryRows.length) { container.innerHTML = '<div style="text-align:center;color:var(--color-text-tertiary);padding:16px;">No delivered vehicles with a recorded parking location yet.</div>'; return; }

  const now = new Date();
  const bucketOf = (dateStr) => {
    const days = Math.floor((now - new Date(dateStr)) / 86400000);
    const b = AGING_BUCKETS.find(bb => days >= bb.min && days <= bb.max);
    return b ? b.label : null;
  };
  const rowTotal = (counts) => AGING_BUCKETS.reduce((s, b) => s + (counts[b.label] || 0), 0);

  // byLoc[loc] = { total: {bucketLabel: count}, subs: { subLoc: {bucketLabel: count} } }
  const byLoc = {};
  _locationSummaryRows.forEach(r => {
    const bucket = bucketOf(r.ud_filled_on);
    if (!bucket) return;
    const loc = normLoc(r.ud_vehicle_parking);
    const sub = normSubLoc(r.ud_vehicle_sub_parking);
    byLoc[loc] = byLoc[loc] || { total: {}, subs: {} };
    byLoc[loc].total[bucket] = (byLoc[loc].total[bucket] || 0) + 1;
    byLoc[loc].subs[sub] = byLoc[loc].subs[sub] || {};
    byLoc[loc].subs[sub][bucket] = (byLoc[loc].subs[sub][bucket] || 0) + 1;
  });
  const locations = Object.keys(byLoc).sort();

  // Bucket cell's onclick stops propagation so clicking a number opens the
  // detail popup WITHOUT also toggling the row's expand state (the row's
  // own onclick is on the whole <tr>, same as Purchase Analytics' rows).
  // Gridlines added (Ramvir, Sept 2026) — border on every cell, matching
  // the app's other data tables, instead of just a border-top on rows.
  const gridBorder = 'border:1px solid var(--color-border-tertiary);';
  const bucketCells = (counts, loc, sub) => AGING_BUCKETS.map(b => {
    const c = counts[b.label] || 0;
    const locEsc = loc.replace(/'/g, "\\'");
    const subArg = sub ? `,'${sub.replace(/'/g, "\\'")}'` : '';
    return `<td style="text-align:center;padding:6px 10px;${gridBorder}${c ? 'cursor:pointer;color:#1d4ed8;font-weight:600;' : 'color:#cbd5e1;'}" ${c ? `onclick="event.stopPropagation();openLocationSummaryDetail('${locEsc}','${b.label}'${subArg})"` : ''}>${c || 0}</td>`;
  }).join('');

  let grandTotal = 0;
  const grandBucketTotals = {};
  const rowsHtml = locations.map(loc => {
    const entry = byLoc[loc];
    const total = rowTotal(entry.total);
    grandTotal += total;
    AGING_BUCKETS.forEach(b => { grandBucketTotals[b.label] = (grandBucketTotals[b.label] || 0) + (entry.total[b.label] || 0); });
    const expanded = expandedLocationSummaryRows.has(loc);
    const locEsc = loc.replace(/'/g, "\\'");
    // "Not Specified" sorted to the bottom of each Location's own
    // sub-rows — real yard names first, the not-yet-filled-in bucket last.
    const subKeys = Object.keys(entry.subs).sort((a, b) => (a === 'Not Specified') - (b === 'Not Specified') || a.localeCompare(b));
    const subRows = expanded ? subKeys.map(sub => {
      const subCounts = entry.subs[sub];
      return `<tr style="background:var(--color-background-secondary,#f8fafc);">
        <td style="padding:6px 10px 6px 30px;color:var(--color-text-secondary);position:sticky;left:0;background:var(--color-background-secondary,#f8fafc);z-index:1;font-size:11.5px;${gridBorder}">${sub}</td>
        ${bucketCells(subCounts, loc, sub)}
        <td style="text-align:center;padding:6px 10px;font-weight:600;${gridBorder}">${rowTotal(subCounts)}</td>
      </tr>`;
    }).join('') : '';
    return `<tr style="cursor:pointer;" onclick="toggleLocationSummaryRow('${locEsc}')">
      <td style="padding:6px 10px;font-weight:600;position:sticky;left:0;background:#fff;z-index:1;${gridBorder}"><i class="ti ${expanded ? 'ti-chevron-down' : 'ti-chevron-right'}" style="font-size:11px;" aria-hidden="true"></i> ${loc}</td>
      ${bucketCells(entry.total, loc)}
      <td style="text-align:center;padding:6px 10px;font-weight:700;${gridBorder}">${total}</td>
    </tr>${subRows}`;
  }).join('');

  const totalRow = `<tr style="background:#1d4ed8;color:#fff;font-weight:700;"><td style="padding:8px 10px;position:sticky;left:0;background:#1d4ed8;z-index:1;${gridBorder}">Total</td>${AGING_BUCKETS.map(b => `<td style="text-align:center;padding:8px 10px;${gridBorder}">${grandBucketTotals[b.label] || 0}</td>`).join('')}<td style="text-align:center;padding:8px 10px;${gridBorder}">${grandTotal}</td></tr>`;

  container.innerHTML = `<table id="locationSummaryTable" style="width:100%;border-collapse:collapse;font-size:12px;">
    <thead><tr style="background:#1d4ed8;color:#fff;">
      <th style="padding:8px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;position:sticky;left:0;background:#1d4ed8;z-index:2;${gridBorder}">Location</th>
      ${AGING_BUCKETS.map(b => `<th style="padding:8px 10px;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.04em;${gridBorder}">${b.label}</th>`).join('')}
      <th style="padding:8px 10px;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.04em;${gridBorder}">Total</th>
    </tr></thead>
    <tbody>${rowsHtml}${totalRow}</tbody>
  </table>`;
}

// Mirrors copyPurchaseSummaryTable() below — selects the rendered table
// node and copies it via the browser's own copy command, so it pastes
// into Excel/Sheets as a real table (not just plain text).
function copyLocationSummaryTable() {

function openLocationSummaryDetail(loc, bucketLabel, subLoc) {
  const now = new Date();
  const bucket = AGING_BUCKETS.find(b => b.label === bucketLabel);
  if (!bucket) return;
  const rows = _locationSummaryRows.filter(r => {
    const rloc = normLoc(r.ud_vehicle_parking);
    if (rloc !== loc) return false;
    // subLoc is only passed when the click came from an expanded
    // Sub Location row — plain Location-row clicks (subLoc undefined)
    // keep showing every vehicle under that Location, same as before.
    if (subLoc && normSubLoc(r.ud_vehicle_sub_parking) !== subLoc) return false;
    const days = Math.floor((now - new Date(r.ud_filled_on)) / 86400000);
    return days >= bucket.min && days <= bucket.max;
  });
  document.getElementById('lsModalTitle').textContent = `${loc}${subLoc ? ' → ' + subLoc : ''} — ${bucketLabel} (${rows.length} vehicles)`;
  document.getElementById('lsTableBody').innerHTML = rows.length ? rows.map(r => {
    const days = Math.floor((now - new Date(r.ud_filled_on)) / 86400000);
    return `<tr>
      <td><span class="lid">${r.lead_no}</span></td>
      <td style="font-weight:500;">${r.customer_name}</td>
      <td>${r.phone}</td>
      <td>${r.val_vehicle_type || '—'}</td>
      <td>${r.val_vehicle_number || '—'}</td>
      <td>${r.val_make || ''} ${r.val_model_variant || ''}</td>
      <td>${days} days</td>
    </tr>`;
  }).join('') : '<tr><td colspan="7" style="text-align:center;color:var(--color-text-tertiary);padding:20px;">No vehicles.</td></tr>';
  openModal('locationSummaryModal');
}

// ------------------------------------------------------------
// PURCHASE ANALYTICS (Ramvir, Sept 2026) — GVUPL-style category tabs +
// filter row + KPI cards + monthly chart + PE-grouped table, all on the
// Dashboard's Purchases tab (#paCard, Sections.html). One fetch of every
// Purchased vehicle (paRows) via loadPurchaseAnalytics(); every filter
// change after that just re-filters paRows client-side and re-renders —
// no re-fetching, so it stays instant even with a few thousand rows.
//
// Field mapping (each one confirmed against actual data/RPC logic, not
// guessed):
//   Category tabs (All/L/M/N) -> val_vehicle_type, which already stores
//     exactly 'L (2W)' / 'M (Cars)' / 'N (Commercial Vehicles)' /
//     'O (Other Vehicles)' — no new field needed.
//   Purchase Month -> ud_filled_on (Delivery/Unloading date), same field
//     get_purchase_summary_by_month() already keys off.
//   Deal Category (Trader COD / Customer COD / No COD) and Deal Type
//     (Broker / Direct) -> BOTH come from the single field
//     rewire_master_data.pn_deal_type, whose real stored values look like
//     "Customer Keeping the COD / Broker Deal" — confirmed by querying
//     distinct values for Purchased rows (Ramvir corrected an earlier
//     mistake here where pn_payment_type, i.e. "Post Delivery / Advance
//     Payment / Omini Pay / Instant Payments" — a different field shown
//     under its own "Payment Type" column elsewhere in this app — had
//     been wired to "Deal Type" instead). paParseDealType() below splits
//     the raw string into the two dropdown dimensions; the table's 3rd
//     grouping level shows the raw pn_deal_type string as-is, matching
//     GVUPL's own table exactly.
//   Lead Status -> fixed to "Purchased" (this whole card only ever loads
//     overall_status='Purchased' rows — shown as a disabled field for
//     visual parity with the reference, not a real filter).
//   CoD Deduction Post 15-Aug (₹) -> per Ramvir's confirmation, a flat
//     amount subtracted from Net Value for every vehicle whose
//     ud_filled_on falls after Aug 15 (current year) — NOT stored
//     anywhere, purely a live what-if figure the viewer types in.
// ------------------------------------------------------------
let paRows = [];
let paCategory = ''; // '' = All, else 'L'/'M'/'N'/'O' (vehicle type, tab-driven only)
let paChartInstance = null;
let paExpandedPe = new Set();
let paRerenderTimer = null, paTableRerenderTimer = null;

// Splits the raw pn_deal_type string (e.g. "Customer Keeping the COD /
// Broker Deal") into the two independent filter dimensions GVUPL exposes
// as separate dropdowns. Tolerant of the minor wording inconsistencies
// actually present in the data (e.g. "Customer Keeping COD" vs "Customer
// Keeping the COD").
function paParseDealType(pn) {
  const s = (pn || '').toLowerCase();
  let codCategory = 'No COD';
  if (s.includes('customer')) codCategory = 'Customer COD';
  else if (s.includes('trader')) codCategory = 'Trader COD';
  let dealType = 'Unspecified';
  if (s.includes('broker')) dealType = 'Broker';
  else if (s.includes('direct')) dealType = 'Direct';
  return { codCategory, dealType };
}

// The CoD Deduction number field and the PE search box both fired a full
// re-render (incl. destroying/recreating the Chart.js instance) on every
// single keystroke — typing "35000" meant 5 chart rebuilds back to back,
// which is what made this feel like it was hanging (Ramvir, Sept 2026).
// Debounced the same way every other live-search field in this app already
// is (see searchDebounceTimer elsewhere).
function debouncePaRerender() {
  clearTimeout(paRerenderTimer);
  paRerenderTimer = setTimeout(renderPurchaseAnalytics, 300);
}
function debouncePaTableRerender() {
  clearTimeout(paTableRerenderTimer);
  paTableRerenderTimer = setTimeout(renderPurchaseAnalyticsTable, 300);
}

const PA_CATEGORY_LABELS = { L: 'L (2W)', M: 'M (Cars)', N: 'N (Commercial Vehicles)', O: 'O (Other Vehicles)' };

// ₹517.7L / ₹1.2Cr style compact formatting — GVUPL's own Net Value card
// uses this, and nothing in this codebase already provides it.
function paFormatRupeesCompact(n) {
  const v = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (v >= 1e7) return `${sign}₹${(v / 1e7).toFixed(1)}Cr`;
  if (v >= 1e5) return `${sign}₹${(v / 1e5).toFixed(1)}L`;
  return `${sign}₹${Math.round(v).toLocaleString('en-IN')}`;
}

async function loadPurchaseAnalytics() {
  // val_model_variant (Vehicle Model column) and the Manager join added
  // Sept 2026 — table now groups Manager > PE > Category > Deal Type >
  // Lead instead of just PE > Category > Deal Type > Lead.
  paRows = await fetchAllRows((from, to) => sb.from('rewire_master_data')
    .select(`id, lead_no, customer_name, val_vehicle_number, val_vehicle_type, val_model_variant, val_kerb_weight_kg, ud_total_offer_price, ud_filled_on, pn_deal_type,
      pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(name), manager:rewire_user_profiles!rewire_master_data_manager_id_fkey(name), rewire_partners(partner_name)`)
    .eq('overall_status', 'Purchased').range(from, to))
    .catch(err => { console.error(err); return []; });

  paCategory = ''; // reset to "All" on every fresh load (role switch, tab re-open)
  renderPaCategoryTabs();

  // Month filter options — every distinct YYYY-MM present in the data,
  // newest first.
  const months = [...new Set(paRows.filter(r => r.ud_filled_on).map(r => r.ud_filled_on.slice(0, 7)))].sort().reverse();
  const monthSel = document.getElementById('paMonthFilter');
  if (monthSel) {
    monthSel.innerHTML = '<option value="">All Months</option>' +
      months.map(m => `<option value="${m}">${new Date(m + '-01').toLocaleString('en', { month: 'short', year: 'numeric' })}</option>`).join('');
  }

  // "Deal Category" dropdown = who keeps the CoD (Trader COD / Customer
  // COD / No COD) and "Deal Type" dropdown = Broker / Direct — both parsed
  // out of pn_deal_type, per Ramvir's correction (Sept 2026).
  const codCatCounts = {}, dealTypeCounts = {};
  paRows.forEach(r => {
    const { codCategory, dealType } = paParseDealType(r.pn_deal_type);
    codCatCounts[codCategory] = (codCatCounts[codCategory] || 0) + 1;
    dealTypeCounts[dealType] = (dealTypeCounts[dealType] || 0) + 1;
  });
  const catSel = document.getElementById('paCategoryFilter');
  if (catSel) {
    catSel.innerHTML = '<option value="">All Categories</option>' +
      ['Trader COD', 'Customer COD', 'No COD'].filter(k => codCatCounts[k]).map(k => `<option value="${k}">${k}</option>`).join('');
    catSel.value = '';
  }
  const dealTypeSel = document.getElementById('paDealTypeFilter');
  if (dealTypeSel) {
    dealTypeSel.innerHTML = '<option value="">All Types</option>' +
      ['Broker', 'Direct'].filter(k => dealTypeCounts[k]).map(k => `<option value="${k}">${k}</option>`).join('');
    dealTypeSel.value = '';
  }

  const codInput = document.getElementById('paCodDeduction'); if (codInput) codInput.value = 0;
  const searchInput = document.getElementById('paTableSearch'); if (searchInput) searchInput.value = '';
  paExpandedPe = new Set();
  if (typeof paExpandedManager !== 'undefined') paExpandedManager = new Set();
  if (typeof paExpandedCat !== 'undefined') paExpandedCat = new Set();
  if (typeof paExpandedDealType !== 'undefined') paExpandedDealType = new Set();

  renderPurchaseAnalytics();
}

function renderPaCategoryTabs() {
  const el = document.getElementById('paCategoryTabs');
  if (!el) return;
  const counts = { L: 0, M: 0, N: 0, O: 0 };
  paRows.forEach(r => { const c = (r.val_vehicle_type || '')[0]; if (counts[c] !== undefined) counts[c]++; });
  const badge = (n) => `<span style="background:var(--color-background-secondary,#f1f5f9);color:var(--color-text-tertiary);border-radius:10px;padding:1px 7px;font-size:10.5px;margin-left:5px;">${n}</span>`;
  const tabHtml = (key, label, count) => `<div class="tab ${paCategory === key ? 'active' : ''}" onclick="setPaCategory('${key}')">${label}${badge(count)}</div>`;
  el.innerHTML = tabHtml('', 'All', paRows.length) +
    Object.keys(PA_CATEGORY_LABELS).filter(k => counts[k] > 0).map(k => tabHtml(k, PA_CATEGORY_LABELS[k], counts[k])).join('');
}

function setPaCategory(key) {
  paCategory = key;
  renderPaCategoryTabs();
  renderPurchaseAnalytics();
}

function paFilteredRows() {
  const month = (document.getElementById('paMonthFilter') || {}).value || '';
  const dealCategory = (document.getElementById('paCategoryFilter') || {}).value || '';
  const dealType = (document.getElementById('paDealTypeFilter') || {}).value || '';
  const cat = paCategory;
  return paRows.filter(r => {
    if (cat && (r.val_vehicle_type || '')[0] !== cat) return false;
    if (month && (!r.ud_filled_on || r.ud_filled_on.slice(0, 7) !== month)) return false;
    if (dealCategory || dealType) {
      const parsed = paParseDealType(r.pn_deal_type);
      if (dealCategory && parsed.codCategory !== dealCategory) return false;
      if (dealType && parsed.dealType !== dealType) return false;
    }
    return true;
  });
}

function renderPurchaseAnalytics() {

  const rows = paFilteredRows();
  const deduction = parseFloat((document.getElementById('paCodDeduction') || {}).value) || 0;
  const cutoff = new Date(new Date().getFullYear(), 7, 15); // Aug = month index 7, per Ramvir's confirmed per-vehicle deduction rule

  let totalWeight = 0, netValue = 0;
  rows.forEach(r => {
    totalWeight += parseFloat(r.val_kerb_weight_kg) || 0;
    let val = parseFloat(r.ud_total_offer_price) || 0;
    // Only Trader COD deals actually carry this deduction (Ramvir, Sept
    // 2026) — Customer COD / No COD vehicles must show ₹0 here regardless
    // of which Deal Category tab/filter is currently active (including
    // "All"), since a filtered view mixing categories together was
    // silently deducting this amount from Customer COD / No COD rows too.
    if (deduction > 0 && r.ud_filled_on && new Date(r.ud_filled_on) > cutoff
      && paParseDealType(r.pn_deal_type).codCategory === 'Trader COD') val -= deduction;
    netValue += val;
  });
  const perKg = totalWeight > 0 ? netValue / totalWeight : 0;

  const setText = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  setText('paShowingText', `Showing ${rows.length.toLocaleString('en-IN')} vehicle${rows.length === 1 ? '' : 's'}`);
  setText('paKpiVehicles', rows.length.toLocaleString('en-IN'));
  setText('paKpiWeight', (totalWeight / 1000).toFixed(1) + ' MT');
  setText('paKpiWeightKg', Math.round(totalWeight).toLocaleString('en-IN') + ' kg');
  setText('paKpiNetValue', paFormatRupeesCompact(netValue));
  setText('paKpiPerKg', '₹' + perKg.toFixed(1));

  renderPaMonthlyChart(rows);
  renderPurchaseAnalyticsTable();
}

function renderPaMonthlyChart(rows) {
  const canvas = document.getElementById('paMonthlyChart');
  if (!canvas) return;
  const byMonth = {};
  rows.forEach(r => {
    if (!r.ud_filled_on) return;
    const m = r.ud_filled_on.slice(0, 7);
    const cat = (r.val_vehicle_type || '')[0] || 'O';
    if (!byMonth[m]) byMonth[m] = { L: 0, M: 0, N: 0, O: 0, weight: 0, value: 0 };
    byMonth[m][cat] = (byMonth[m][cat] || 0) + 1;
    byMonth[m].weight += parseFloat(r.val_kerb_weight_kg) || 0;
    byMonth[m].value += parseFloat(r.ud_total_offer_price) || 0;
  });
  const months = Object.keys(byMonth).sort();

  if (paChartInstance) { paChartInstance.destroy(); paChartInstance = null; }
  if (typeof Chart === 'undefined' || !months.length) return;

  const labels = months.map(m => new Date(m + '-01').toLocaleString('en', { month: 'short', year: '2-digit' }));
  const perKgSeries = months.map(m => byMonth[m].weight > 0 ? +(byMonth[m].value / byMonth[m].weight).toFixed(1) : 0);

  paChartInstance = new Chart(canvas, {
    data: {
      labels,
      datasets: [
        { type: 'bar', label: 'Cat L', data: months.map(m => byMonth[m].L), backgroundColor: '#3b82f6', yAxisID: 'y' },
        { type: 'bar', label: 'Cat M', data: months.map(m => byMonth[m].M), backgroundColor: '#ec4899', yAxisID: 'y' },
        { type: 'bar', label: 'Cat N', data: months.map(m => byMonth[m].N), backgroundColor: '#10b981', yAxisID: 'y' },
        { type: 'line', label: 'Net ₹/kg', data: perKgSeries, borderColor: '#f59e0b', backgroundColor: '#f59e0b', yAxisID: 'y1', tension: 0.3, pointRadius: 3 },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      // animation off + no resize-observer feedback loop (fixed-height
      // wrapper in Sections.html handles that) — re-rendering on every
      // filter change should feel instant, not re-animate from zero each
      // time (Ramvir's "hang" report, Sept 2026).
      animation: false,
      resizeDelay: 100,
      interaction: { mode: 'index', intersect: false },
      scales: {
        y: { position: 'left', beginAtZero: true, title: { display: false } },
        y1: { position: 'right', beginAtZero: true, grid: { drawOnChartArea: false }, ticks: { callback: (v) => '₹' + v } },
      },
      plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 10 } } } },
    },
  });
}

// 4-level table (Ramvir, Sept 2026, matching his GVUPL screenshots): PE ->
// Category (val_vehicle_type) -> Deal Type (raw pn_deal_type string, e.g.
// "Customer Keeping the COD / Broker Deal" — corrected from an earlier
// mistake that used pn_payment_type here) -> individual lead.
// paExpandedPe/paExpandedCat/paExpandedDealType are Sets of keys
// ("<peName>" / "<peName>||<catKey>" / "<peName>||<catKey>||<dealType>")
// tracking which rows are currently expanded, so re-rendering after any
// filter change preserves what the viewer had open.
let paExpandedCat = new Set();
let paExpandedDealType = new Set();
let paExpandedManager = new Set();

const PA_CAT_DOT_COLOR = { L: '#3b82f6', M: '#ec4899', N: '#10b981', O: '#94a3b8' };

function togglePaManager(managerKey) {
  if (paExpandedManager.has(managerKey)) paExpandedManager.delete(managerKey); else paExpandedManager.add(managerKey);
  renderPurchaseAnalyticsTable();
}
function togglePaPe(peKey) {
  if (paExpandedPe.has(peKey)) paExpandedPe.delete(peKey); else paExpandedPe.add(peKey);
  renderPurchaseAnalyticsTable();
}
function togglePaCat(catId) {
  if (paExpandedCat.has(catId)) paExpandedCat.delete(catId); else paExpandedCat.add(catId);
  renderPurchaseAnalyticsTable();
}
function togglePaDealType(dealTypeId) {
  if (paExpandedDealType.has(dealTypeId)) paExpandedDealType.delete(dealTypeId); else paExpandedDealType.add(dealTypeId);
  renderPurchaseAnalyticsTable();
}

// Shared with renderPurchaseAnalytics()'s KPI-card math — same rule,
// pulled out into one place (Ramvir, Sept 2026 fix) since the Manager/PE/
// Category/Lead breakdown table below used to just read raw
// ud_total_offer_price everywhere, completely ignoring the "CoD Deduction
// Post 15-Aug" field. So the top KPI cards (Net Value, Avg ₹/kg) already
// reflected the deduction, but every row of this table still showed the
// pre-deduction figures — the two numbers on screen didn't agree with each
// other. Rule (unchanged, just centralized): only Trader COD vehicles
// delivered after Aug 15 (current year) get the flat amount subtracted.
function paEffectiveOffer(r, deduction, cutoff) {
  let val = parseFloat(r.ud_total_offer_price) || 0;
  if (deduction > 0 && r.ud_filled_on && new Date(r.ud_filled_on) > cutoff
    && paParseDealType(r.pn_deal_type).codCategory === 'Trader COD') val -= deduction;
  return val;
}

function paAggregate(list, deduction, cutoff) {
  const count = list.length;
  const wt = list.reduce((s, r) => s + (parseFloat(r.val_kerb_weight_kg) || 0), 0);
  const offer = list.reduce((s, r) => s + paEffectiveOffer(r, deduction, cutoff), 0);
  return { count, wt, offer, perKg: wt > 0 ? offer / wt : 0 };
}

// Grouping order (Ramvir, Sept 2026): Manager > PE > Category (L/M/N) >
// Deal Type > Lead — Manager added as the new top level (previously PE
// was the top level with no Manager grouping at all). Search still
// matches on PE name only (unchanged), but now also expands that PE's
// parent Manager row automatically so a search result isn't hidden
// inside a collapsed Manager group.
function renderPurchaseAnalyticsTable() {
  const tbody = document.getElementById('paTableBody');
  if (!tbody) return;
  const rows = paFilteredRows();
  const search = ((document.getElementById('paTableSearch') || {}).value || '').toLowerCase();
  // Same deduction + cutoff read as renderPurchaseAnalytics()'s KPI cards —
  // see paEffectiveOffer()/paAggregate() above.
  const deduction = parseFloat((document.getElementById('paCodDeduction') || {}).value) || 0;
  const cutoff = new Date(new Date().getFullYear(), 7, 15);

  const byManager = {};
  rows.forEach(r => {
    const managerName = r.manager ? r.manager.name : 'Unassigned';
    (byManager[managerName] = byManager[managerName] || []).push(r);
  });
  // Filter by PE-name search, but keep a Manager group in the list as
  // long as ANY of its PEs match — the PE-level filtering itself still
  // happens where byPe is built below.
  const managerNames = Object.keys(byManager).filter(mgrName => {
    if (!search) return true;
    return byManager[mgrName].some(r => (r.pe ? r.pe.name : 'Unassigned').toLowerCase().includes(search));
  }).sort();

  if (!managerNames.length) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--color-text-tertiary);padding:16px;">No vehicles match.</td></tr>';
    return;
  }

  tbody.innerHTML = managerNames.map(managerName => {
    const managerList = byManager[managerName];
    const managerAgg = paAggregate(managerList, deduction, cutoff);
    const managerKey = managerName.replace(/'/g, "\\'");
    // Auto-expand a Manager whose PE search matched, same reasoning as
    // the comment above — otherwise a search result would be invisible.
    const managerExpanded = paExpandedManager.has(managerName) || (!!search && managerList.some(r => (r.pe ? r.pe.name : 'Unassigned').toLowerCase().includes(search)));

    let peRowsHtml = '';
    if (managerExpanded) {
      const byPe = {};
      managerList.forEach(r => {
        const peName = r.pe ? r.pe.name : 'Unassigned';
        (byPe[peName] = byPe[peName] || []).push(r);
      });
      const peNames = Object.keys(byPe).filter(n => !search || n.toLowerCase().includes(search)).sort();

      peRowsHtml = peNames.map(peName => {
        const list = byPe[peName];
        const { count, wt, offer, perKg } = paAggregate(list, deduction, cutoff);
        const peId = managerName + '||' + peName;
        const peIdEsc = peId.replace(/'/g, "\\'");
        const peExpanded = paExpandedPe.has(peId);

        let catRowsHtml = '';
        if (peExpanded) {
          const byCat = {};
          list.forEach(r => { const c = (r.val_vehicle_type || '')[0] || 'O'; (byCat[c] = byCat[c] || []).push(r); });
          catRowsHtml = Object.keys(byCat).sort().map(catKey => {
            const catList = byCat[catKey];
            const catAgg = paAggregate(catList, deduction, cutoff);
            const catId = peId + '||' + catKey;
            const catExpanded = paExpandedCat.has(catId);
            const catIdEsc = catId.replace(/'/g, "\\'");
            const dot = `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${PA_CAT_DOT_COLOR[catKey] || '#94a3b8'};margin-right:6px;"></span>`;

            let dealTypeRowsHtml = '';
            if (catExpanded) {
              const byDealType = {};
              catList.forEach(r => { const dt = (r.pn_deal_type && r.pn_deal_type.trim()) || 'Unspecified'; (byDealType[dt] = byDealType[dt] || []).push(r); });
              dealTypeRowsHtml = Object.keys(byDealType).sort().map(dealType => {
                const dtList = byDealType[dealType];
                const dtAgg = paAggregate(dtList, deduction, cutoff);
                const dtId = catId + '||' + dealType;
                const dtExpanded = paExpandedDealType.has(dtId);
                const dtIdEsc = dtId.replace(/'/g, "\\'");

                const leadRows = dtExpanded ? dtList.map(r => {
                  const rowOffer = paEffectiveOffer(r, deduction, cutoff);
                  const rowPerKg = (parseFloat(r.val_kerb_weight_kg) > 0) ? (rowOffer / r.val_kerb_weight_kg).toFixed(1) : '—';
                  const month = r.ud_filled_on ? new Date(r.ud_filled_on).toLocaleString('en', { month: 'short', year: 'numeric' }) : '—';
                  const broker = r.rewire_partners ? r.rewire_partners.partner_name : 'Direct';
                  return `<tr style="background:var(--color-background-secondary,#f8fafc);">
                    <td style="padding:6px 10px 6px 88px;font-size:11px;color:#2563eb;font-weight:600;">${r.lead_no || '—'}</td>
                    <td style="padding:6px 10px;font-size:11px;">${r.customer_name || '—'}</td>
                    <td style="padding:6px 10px;font-size:11px;">${r.val_vehicle_number || '—'}</td>
                    <td style="padding:6px 10px;font-size:11px;">${r.val_model_variant || '—'}</td>
                    <td style="padding:6px 10px;font-size:11px;">${broker}</td>
                    <td style="padding:6px 10px;text-align:center;font-size:11px;">1</td>
                    <td style="padding:6px 10px;text-align:right;font-size:11px;">${Math.round(r.val_kerb_weight_kg || 0).toLocaleString('en-IN')}</td>
                    <td style="padding:6px 10px;text-align:right;font-size:11px;">₹${Math.round(rowOffer || 0).toLocaleString('en-IN')}</td>
                    <td style="padding:6px 10px;text-align:right;font-size:11px;color:#059669;">${rowPerKg}</td>
                    <td style="padding:6px 10px;font-size:11px;">${month}</td>
                  </tr>`;
                }).join('') : '';

                return `<tr style="cursor:pointer;background:var(--color-background-secondary,#f8fafc);border-top:0.5px solid var(--color-border-tertiary);" onclick="togglePaDealType('${dtIdEsc}')">
                  <td style="padding:7px 10px 7px 68px;font-weight:600;font-size:11.5px;"><i class="ti ${dtExpanded ? 'ti-chevron-down' : 'ti-chevron-right'}" style="font-size:10px;" aria-hidden="true"></i> ${dealType}</td>
                  <td colspan="3"></td>
                  <td style="padding:7px 10px;"></td>
                  <td style="padding:7px 10px;text-align:center;font-size:11.5px;">${dtAgg.count}</td>
                  <td style="padding:7px 10px;text-align:right;font-size:11.5px;">${Math.round(dtAgg.wt).toLocaleString('en-IN')}</td>
                  <td style="padding:7px 10px;text-align:right;font-size:11.5px;">₹${Math.round(dtAgg.offer).toLocaleString('en-IN')}</td>
                  <td style="padding:7px 10px;text-align:right;font-size:11.5px;color:#059669;">${dtAgg.perKg.toFixed(1)}</td>
                  <td></td>
                </tr>${leadRows}`;
              }).join('');
            }

            return `<tr style="cursor:pointer;background:var(--color-background-secondary,#f8fafc);border-top:0.5px solid var(--color-border-tertiary);" onclick="togglePaCat('${catIdEsc}')">
              <td style="padding:7px 10px 7px 48px;font-weight:600;font-size:11.5px;"><i class="ti ${catExpanded ? 'ti-chevron-down' : 'ti-chevron-right'}" style="font-size:10px;" aria-hidden="true"></i> ${dot}${PA_CATEGORY_LABELS[catKey] || catKey}</td>
              <td colspan="3"></td>
              <td style="padding:7px 10px;"></td>
              <td style="padding:7px 10px;text-align:center;font-size:11.5px;">${catAgg.count}</td>
              <td style="padding:7px 10px;text-align:right;font-size:11.5px;">${Math.round(catAgg.wt).toLocaleString('en-IN')}</td>
              <td style="padding:7px 10px;text-align:right;font-size:11.5px;">₹${Math.round(catAgg.offer).toLocaleString('en-IN')}</td>
              <td style="padding:7px 10px;text-align:right;font-size:11.5px;color:#059669;">${catAgg.perKg.toFixed(1)}</td>
              <td></td>
            </tr>${dealTypeRowsHtml}`;
          }).join('');
        }

        return `<tr style="cursor:pointer;background:var(--color-background-secondary,#f8fafc);border-top:0.5px solid var(--color-border-tertiary);" onclick="togglePaPe('${peIdEsc}')">
          <td style="padding:8px 10px 8px 28px;font-weight:600;"><i class="ti ${peExpanded ? 'ti-chevron-down' : 'ti-chevron-right'}" style="font-size:11px;" aria-hidden="true"></i> ${peName}</td>
          <td colspan="3"></td>
          <td style="padding:8px 10px;"></td>
          <td style="padding:8px 10px;text-align:center;">${count}</td>
          <td style="padding:8px 10px;text-align:right;">${Math.round(wt).toLocaleString('en-IN')}</td>
          <td style="padding:8px 10px;text-align:right;">₹${Math.round(offer).toLocaleString('en-IN')}</td>
          <td style="padding:8px 10px;text-align:right;color:#059669;font-weight:600;">${perKg.toFixed(1)}</td>
          <td style="padding:8px 10px;"></td>
        </tr>${catRowsHtml}`;
      }).join('');
    }

    return `<tr style="cursor:pointer;border-top:0.5px solid var(--color-border-tertiary);" onclick="togglePaManager('${managerKey}')">
      <td style="padding:8px 10px;font-weight:700;"><i class="ti ${managerExpanded ? 'ti-chevron-down' : 'ti-chevron-right'}" style="font-size:11px;" aria-hidden="true"></i> ${managerName}</td>
      <td colspan="3"></td>
      <td style="padding:8px 10px;"></td>
      <td style="padding:8px 10px;text-align:center;">${managerAgg.count}</td>
      <td style="padding:8px 10px;text-align:right;">${Math.round(managerAgg.wt).toLocaleString('en-IN')}</td>
      <td style="padding:8px 10px;text-align:right;">₹${Math.round(managerAgg.offer).toLocaleString('en-IN')}</td>
      <td style="padding:8px 10px;text-align:right;color:#059669;font-weight:600;">${managerAgg.perKg.toFixed(1)}</td>
      <td style="padding:8px 10px;"></td>
    </tr>${peRowsHtml}`;
  }).join('');
}

// Dashboard "Material" tab (Ramvir, Sept 2026) — one card per Material
// Category showing Available vs Sold counts, sourced the same way the Sale
// sidebar section computes eligibility (fetchMaterialEligibleLeadsWithMat(),
// JS-Tracking.html) crossed with rewire_material_sales' per-category status
// rows (a missing row = still Available, same convention used everywhere
// else this table is read).
async function renderDashboardMaterialTab() {
  const container = document.getElementById('dashMaterialCards');
  if (!container) return;
  container.innerHTML = 'Loading…';
  if (typeof fetchMaterialEligibleLeadsWithMat !== 'function' || typeof MATERIAL_CATEGORIES === 'undefined') {
    container.innerHTML = '<div style="color:var(--color-text-tertiary);">Material module not loaded.</div>';
    return;
  }
  const leads = await fetchMaterialEligibleLeadsWithMat();
  // fetchAllRows: a plain select is capped at 1000 rows by PostgREST and this table has ~2000, which undercounted Sold.
  const allSales = await fetchAllRows((from, to) => sb.from('rewire_material_sales').select('lead_id, category_key, status').range(from, to)).catch(() => []);
  const soldSet = new Set((allSales || []).filter(s => s.status === 'Sold').map(s => s.lead_id + '||' + s.category_key));
  const emptySet = new Set((allSales || []).filter(s => s.status === 'Empty').map(s => s.lead_id + '||' + s.category_key));

  container.innerHTML = MATERIAL_CATEGORIES.map(([key, label]) => {
    const filledLeads = leads.filter(l => typeof isMaterialCategoryFilled === 'function' && isMaterialCategoryFilled(l.mat, key));
    const sold = filledLeads.filter(l => soldSet.has(l.id + '||' + key)).length;
    const emptyCnt = filledLeads.filter(l => emptySet.has(l.id + '||' + key)).length;
    const available = filledLeads.length - sold - emptyCnt;
    // Ramvir, Sept 2026 — these cards used a 0.5px near-invisible border with
    // no shadow, so on a white page they read as plain floating text, not
    // cards ("accha nahi lag raha"). Now: a real 1px border + soft shadow +
    // a colored top accent strip (indigo, matching the app's brand color) so
    // each category is a clearly-bounded, distinct block. "Sold" is now red
    // to match the same Available=green/Sold=red convention already used on
    // the Sale tab's own Status column, instead of blue (which reads as a
    // link/neutral color here, not a status).
    return `<div style="background:#fff;border:1px solid var(--color-border-secondary,#cbd5e1);border-top:3px solid #1d4ed8;border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(15,23,42,0.06);">
      <div style="font-size:12.5px;font-weight:700;margin-bottom:12px;color:var(--color-text-primary,#0f172a);">${label}</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
        <span style="font-size:11px;color:var(--color-text-tertiary);font-weight:600;text-transform:uppercase;letter-spacing:.03em;">Available</span>
        <span style="font-size:18px;font-weight:700;color:#059669;">${available}</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <span style="font-size:11px;color:var(--color-text-tertiary);font-weight:600;text-transform:uppercase;letter-spacing:.03em;">Sold</span>
        <span style="font-size:18px;font-weight:700;color:#dc2626;">${sold}</span>
      </div>
    </div>`;
  }).join('');
}

// "Detailed Stage Breakdown by PE" drill-down (Ramvir, Sept 2026) — every
// non-zero count in that table is clickable (see cellAttrs()/cell() above)
// and opens this popup with the actual leads behind it, plus a "Copy"
// button so the list can be pasted into WhatsApp/Excel/etc. Pulled via
// get_pe_stage_breakdown_detail(), which mirrors the exact bucketing logic
// of get_pe_stage_breakdown() itself so this list can never disagree with
// the number that was clicked.
const PE_BUCKET_LABELS = {
  total: 'Total (All Pending Stages)', val: 'Valuation', pn: 'Price Negotiation', kyc: 'Bank KYC',
  ud: 'Upload Delivery', vz: 'Verification & Zoho', ma: 'Manager Approval', acc: 'Accessories Check',
  ha: 'Head Approval', rc: 'RC Tracking (Pending)',
};
async function showPeStageDetailPopup(peName, bucketKey, managerFilterStr) {
  const managerFilter = managerFilterStr || null;
  Swal.fire({ title: 'Loading…', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
  const { data, error } = await sb.rpc('get_pe_stage_breakdown_detail', {
    pe_name_filter: peName, bucket_filter: bucketKey, manager_id_filter: managerFilter,
  });
  if (error) { Swal.fire('Error', error.message, 'error'); return; }
  const rows = data || [];
  const bucketLabel = PE_BUCKET_LABELS[bucketKey] || bucketKey;
  const tsvLines = [['Lead No', 'Customer', 'Vehicle No.', 'Phone', 'Stage', 'Payment Type'].join('\t')]
    .concat(rows.map(r => [r.lead_no, r.customer_name || '', r.val_vehicle_number || '', r.phone || '', r.current_stage, r.pn_payment_type || ''].join('\t')));
  window._peStageDetailTsv = tsvLines.join('\n');
  const tableHtml = rows.length
    ? `<div style="max-height:360px;overflow:auto;border:1px solid #e2e8f0;border-radius:8px;">
        <table style="width:100%;border-collapse:collapse;font-size:12px;text-align:left;">
          <thead style="position:sticky;top:0;background:#f8fafc;">
            <tr>
              <th style="padding:7px 10px;border-bottom:1px solid #e2e8f0;">Lead No</th>
              <th style="padding:7px 10px;border-bottom:1px solid #e2e8f0;">Customer</th>
              <th style="padding:7px 10px;border-bottom:1px solid #e2e8f0;">Vehicle No.</th>
              <th style="padding:7px 10px;border-bottom:1px solid #e2e8f0;">Phone</th>
              <th style="padding:7px 10px;border-bottom:1px solid #e2e8f0;">Payment Type</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => `<tr>
              <td style="padding:6px 10px;border-bottom:0.5px solid #f1f5f9;font-weight:600;">${r.lead_no}</td>
              <td style="padding:6px 10px;border-bottom:0.5px solid #f1f5f9;">${r.customer_name || '—'}</td>
              <td style="padding:6px 10px;border-bottom:0.5px solid #f1f5f9;">${r.val_vehicle_number || '—'}</td>
              <td style="padding:6px 10px;border-bottom:0.5px solid #f1f5f9;">${r.phone || '—'}</td>
              <td style="padding:6px 10px;border-bottom:0.5px solid #f1f5f9;">${r.pn_payment_type || '—'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`
    : '<div style="color:var(--color-text-tertiary);padding:16px;text-align:center;">No leads found.</div>';
  Swal.fire({
    title: `${peName} — ${bucketLabel}`,
    html: `<div style="text-align:left;">
      <div style="font-size:12px;color:var(--color-text-tertiary);margin-bottom:8px;">${rows.length} lead(s)</div>
      ${tableHtml}
    </div>`,
    width: 640,
    showCancelButton: true,
    confirmButtonText: '<i class="ti ti-copy" aria-hidden="true"></i> Copy List',
    cancelButtonText: 'Close',
    confirmButtonColor: '#1d4ed8',
  }).then((result) => {
    if (result.isConfirmed && window._peStageDetailTsv) {
      navigator.clipboard.writeText(window._peStageDetailTsv)
        .then(() => notify('Copied ' + rows.length + ' lead(s) to clipboard.'))
        .catch(() => notify('Could not copy — clipboard access blocked.', { icon: 'error' }));
    }
  });
}

// "Purchased Vehicle" drill-down (Ramvir, Sept 2026 request) — clicking the
// count in the Detailed Stage Breakdown table's Purchased Vehicle column
// lists exactly which vehicles that PE has purchased, scoped to the same
// Month filter (ud_filled_on) and Manager filter that produced the count,
// via get_pe_purchased_detail() — mirrors get_pe_lead_counts()'s own
// "purchased" predicate so this list can never disagree with the number.
async function showPeVehiclePopup(peName, managerFilterStr, monthFilterStr) {
  const managerFilter = managerFilterStr || null;
  const monthFilter = monthFilterStr || null;
  Swal.fire({ title: 'Loading…', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
  const { data, error } = await sb.rpc('get_pe_purchased_detail', {
    pe_name_filter: peName, manager_id_filter: managerFilter, month_filter: monthFilter,
  });
  if (error) { Swal.fire('Error', error.message, 'error'); return; }
  const rows = data || [];
  const tsvLines = [['Lead No', 'Customer', 'Vehicle No.', 'Make/Model', 'Phone', 'Purchase Date', 'Offer Price'].join('\t')]
    .concat(rows.map(r => [r.lead_no, r.customer_name || '', r.val_vehicle_number || '', [r.val_make, r.val_model_variant].filter(Boolean).join(' '), r.phone || '', r.ud_filled_on || '', r.pn_total_offer_price || ''].join('\t')));
  window._peVehicleTsv = tsvLines.join('\n');
  const tableHtml = rows.length
    ? `<div style="max-height:360px;overflow:auto;border:1px solid #e2e8f0;border-radius:8px;">
        <table style="width:100%;border-collapse:collapse;font-size:12px;text-align:left;">
          <thead style="position:sticky;top:0;background:#f8fafc;">
            <tr>
              <th style="padding:7px 10px;border-bottom:1px solid #e2e8f0;">Lead No</th>
              <th style="padding:7px 10px;border-bottom:1px solid #e2e8f0;">Customer</th>
              <th style="padding:7px 10px;border-bottom:1px solid #e2e8f0;">Vehicle No.</th>
              <th style="padding:7px 10px;border-bottom:1px solid #e2e8f0;">Make/Model</th>
              <th style="padding:7px 10px;border-bottom:1px solid #e2e8f0;">Purchase Date</th>
              <th style="padding:7px 10px;border-bottom:1px solid #e2e8f0;">Offer Price</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => `<tr>
              <td style="padding:6px 10px;border-bottom:0.5px solid #f1f5f9;font-weight:600;">${r.lead_no}</td>
              <td style="padding:6px 10px;border-bottom:0.5px solid #f1f5f9;">${r.customer_name || '—'}</td>
              <td style="padding:6px 10px;border-bottom:0.5px solid #f1f5f9;">${r.val_vehicle_number || '—'}</td>
              <td style="padding:6px 10px;border-bottom:0.5px solid #f1f5f9;">${[r.val_make, r.val_model_variant].filter(Boolean).join(' ') || '—'}</td>
              <td style="padding:6px 10px;border-bottom:0.5px solid #f1f5f9;">${r.ud_filled_on ? new Date(r.ud_filled_on).toLocaleDateString('en-IN') : '—'}</td>
              <td style="padding:6px 10px;border-bottom:0.5px solid #f1f5f9;">${r.pn_total_offer_price ? Number(r.pn_total_offer_price).toLocaleString('en-IN') : '—'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`
    : '<div style="color:var(--color-text-tertiary);padding:16px;text-align:center;">No purchased vehicles found.</div>';
  Swal.fire({
    title: `${peName} — Purchased Vehicles`,
    html: `<div style="text-align:left;">
      <div style="font-size:12px;color:var(--color-text-tertiary);margin-bottom:8px;">${rows.length} vehicle(s)</div>
      ${tableHtml}
    </div>`,
    width: 720,
    showCancelButton: true,
    confirmButtonText: '<i class="ti ti-copy" aria-hidden="true"></i> Copy List',
    cancelButtonText: 'Close',
    confirmButtonColor: '#1d4ed8',
  }).then((result) => {
    if (result.isConfirmed && window._peVehicleTsv) {
      navigator.clipboard.writeText(window._peVehicleTsv)
        .then(() => notify('Copied ' + rows.length + ' vehicle(s) to clipboard.'))
        .catch(() => notify('Could not copy — clipboard access blocked.', { icon: 'error' }));
    }
  });
}

</script>
