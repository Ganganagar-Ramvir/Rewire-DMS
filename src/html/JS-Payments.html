<script>
// PAYMENTS: Payments section, Reports tab CSV/Excel exports, and the Commission tab (Pay Number of Person feature).
// ------------------------------------------------------------
// PAYMENTS SECTION — Customer + Broker rows per vehicle, Accounts workflow
// ------------------------------------------------------------
// PAYMENTS SOP (Payment Module SOP v1.0, 7 Sept 2026 — 5 tabs, each its
// own status bucket):
//   Pending             — status 'Pending' only. Actions: Hold, or Send
//                         for Payment (-> status 'To be Sent for Payment',
//                         moves to that tab — does NOT dispatch anything
//                         by itself, just queues it).
//   Hold                — status 'Hold'. Actions: back to Pending, Send
//                         for Payment (-> 'To be Sent for Payment'), or
//                         Rejected (dummy UTR, straight to Archive — see
//                         rejectPayment()).
//   To be Sent for       status 'To be Sent for Payment'. Checkbox
//   Payment              multi-select tab — the actual CSV+email dispatch
//                         to Cashier/Procurement Managers only happens
//                         here, on selected rows (see
//                         sendForPaymentAndNotify()), moving them to
//                         Pending UTR. Rejected/Mark Hold are also bulk
//                         actions here (bulkRejectToBeSent()/
//                         bulkHoldToBeSent()).
//   Pending UTR         — status 'Pending UTR' (reached ONLY via a
//                         successful dispatch from "To be Sent for
//                         Payment" above), PLUS every Instant Payment row
//                         regardless of its raw status (Instant Payments
//                         skip Pending/Hold/To be Sent for Payment
//                         entirely). UTR entry + Complete only.
//   Archive             — status 'Completed' or 'Rejected'. Terminal,
//                         read-only.
let paymentsCache = [];
let paymentsHoldCache = [];
let toBeSentCache = [];
let pendingUtrCache = [];
let toBeSentSelectedIds = new Set();

// Shared raw fetch — the regular Payments list, Hold, To be Sent for
// Payment, Pending UTR AND the "Send for Payment" eligibility check all
// read off the same rewire_payments table (a DB trigger auto-generates a
// Customer + Broker row per lead once it qualifies, regardless of payment
// type), they just apply a different status/pn_payment_type filter on
// top. One query, five views, instead of hitting the DB separately for
// each.
//
// PERFORMANCE: this used to run a completely fresh, unpaginated-but-
// paginated-internally fetch of the WHOLE rewire_payments table (4700+
// rows, ~5 sequential page requests, plus the embedded lead/pe/manager/
// partner join on every one of those rows) EVERY single time any of the
// 5 callers above ran — and refreshPaymentsSections() calls 4 of them
// back-to-back after every single status change/reject/send, meaning one
// click could trigger ~20 network round-trips against the same data. This
// was very likely the single biggest contributor to "DMS load is slow".
// Fixed with a short-lived shared cache: the FIRST call in a burst does
// the real fetch, every other call within the next few seconds (i.e. the
// other 3-4 render calls that immediately follow it) reuses that same
// result instead of re-fetching. invalidatePaymentsRawCache() (called at
// the top of refreshPaymentsSections()) forces the next call to do a real
// fetch again, so nothing goes stale after an actual write.
let paymentsRawCache = null;
let paymentsRawCacheAt = 0;
const PAYMENTS_RAW_CACHE_TTL_MS = 8000;
function invalidatePaymentsRawCache() { paymentsRawCache = null; }
async function fetchPaymentsRaw() {
  if (paymentsRawCache && (Date.now() - paymentsRawCacheAt) < PAYMENTS_RAW_CACHE_TTL_MS) return paymentsRawCache;
  // Goes through fetchAllRows() (JS-Core.html) — this had the exact same
  // gap as the Health Check / "Find Missing Payment Rows" bugs: a plain
  // .select() with no .range() silently caps at Supabase's default 1000
  // rows, and rewire_payments has 4700+. Sorted newest-first, so any
  // OLDER row past the first 1000 (like L7101673's, created back on
  // Sept 1) never reached the client at all — it wasn't being filtered
  // out by any of the eligibility checks, it just never arrived to be
  // checked in the first place. Every eligibility check downstream of
  // this (paymentsCache, paymentsHoldCache, toBeSentCache, pendingUtrCache)
  // was otherwise correct.
  const data = await fetchAllRows((from, to) => sb.from('rewire_payments')
    .select(`*, lead:rewire_master_data!rewire_payments_lead_id_fkey(lead_no, customer_name, phone, email, ud_vehicle_parking, ud_vehicle_sub_parking,
      val_vehicle_type, val_vehicle_number, val_make, val_model_variant, pn_deal_type, pn_payment_type, pn_partner_name,
      pn_customer_payment, pn_broker_payment, pn_omni_pay_to, ha_status, payment_release_status,
      pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(id,name),
      manager:rewire_user_profiles!rewire_master_data_manager_id_fkey(id,name,manager_email),
      kyc_account_holder_name, kyc_bank_name, kyc_account_number, kyc_ifsc_code, kyc_branch_name, rewire_partners(partner_name))`)
    .order('created_at', { ascending: false })
    .range(from, to)).catch(err => { console.error(err); return []; });
  paymentsRawCache = data || [];
  paymentsRawCacheAt = Date.now();
  return paymentsRawCache;
}

async function renderPaymentsSection() {
  initTableFilterBar('payments', () => renderPaymentsTable(getPaymentsFilteredRows(), 'tbodyPayments', 'pending'));
  const data = await fetchPaymentsRaw();

  // A lead auto-generates both a Customer and a Broker row here regardless
  // of whether either side actually owes anything, and Omini Pay / Instant
  // Payment deals land here too even though each has its own separate tab
  // now. Filter those out — Payments should only ever show a row that's a
  // real, ordinary (non-Omini-Pay, non-Instant-Payment) amount someone
  // needs to act on. Also: these rows are created back at Verification &
  // Zoho (stage 5), well before Manager/Accessories/Head Approval —
  // surfacing them that early meant Accounts could see (and be tempted to
  // act on) a payment before the deal was actually fully approved. Now
  // held back until Head Approval is done, same gate as the Purchased tab
  // uses.
  //
  // PENDING tab specifically = status 'Pending' ONLY now — "Send for
  // Payment" moves a row straight into the new "To be Sent for Payment"
  // tab (see updatePaymentStatus()) instead of staying here with a
  // different status value, per the new SOP's 5-tab structure. Hold/To be
  // Sent for Payment/Pending UTR/Rejected/Completed all have their own
  // tabs now.
  paymentsCache = data.filter(p => {
    // If the embedded lead is missing, it's almost always an RLS gap
    // hiding rewire_master_data from this role (see
    // supabase-batch40-master-data-accounts-read-fix.sql) rather than a
    // genuinely orphaned row — exclude it instead of showing it
    // ungated, since there's no way to check ha_status/
    // payment_release_status without it.
    if (!p.lead) return false;
    if (p.status !== 'Pending') return false;
    // "Omini/InstantPay To" (pn_omni_pay_to: Customer/Broker/Both) decides
    // which side actually gets routed through the Omini Pay tab instead of
    // here — only THAT party's row is excluded, the other party (if any)
    // is a normal bank-transfer payment and belongs in this tab like any
    // other lead's row. Older leads saved before this field existed have
    // pn_omni_pay_to blank — treated as 'Customer' (the original/only
    // behavior before Broker/Both existed), so Broker still shows normally
    // for those instead of vanishing with no way to pay it.
    if (p.lead.pn_payment_type === 'Omini Pay') {
      const omniTo = p.lead.pn_omni_pay_to || 'Customer';
      if (omniTo === 'Both' || omniTo === p.payment_type) return false;
    }
    if (p.lead.pn_payment_type === 'Instant Payments') return false; // bypasses Pending/Hold entirely — see renderPendingUtrSection
    // Credit (Ramvir, Sept 2026) — follows Post Delivery's stage order but
    // never enters the normal Pending/Hold/To be Sent/Pending UTR queue at
    // all; it goes straight to its own "Credit Payment" tab once approved
    // and is marked Complete directly from there (no UTR step) — see
    // renderCreditPaymentSection() below.
    if (p.lead.pn_payment_type === 'Credit') return false;
    // Post Delivery: gated on the (single) final Head Approval, as before.
    // Advance Payment: gated on the EARLY Payment Release approval — the
    // whole point of that step is the deal shows here well before Delivery/
    // Accessories Check/the final Head Approval are done.
    const gate = p.lead.pn_payment_type === 'Advance Payment' ? p.lead.payment_release_status === 'Approved' : p.lead.ha_status === 'Approved';
    if (!gate) return false;
    // A row with its own amount > 0 is real money to pay even if the PN field for that side is blank/mismatched
    // (e.g. L7103534, L7102515) - otherwise Accounts never sees it. Rows with amount 0 stay hidden.
    if (Number(p.amount) > 0) return true;
    if (p.payment_type === 'Customer') return (p.lead.pn_customer_payment || 0) > 0;
    if (p.payment_type === 'Broker') return (p.lead.pn_broker_payment || 0) > 0;
    return true;
  });

  document.getElementById('badgePayments').textContent = paymentsCache.length;
  const filtered = getPaymentsFilteredRows();
  document.getElementById('countPayments').textContent = filtered.length + ' pending payments';
  renderPaymentsTable(filtered, 'tbodyPayments', 'pending');
}

function getPaymentsFilteredRows() {
  return filterRowsByTableFilter(paymentsCache, 'payments',
    p => (p.lead && p.lead.pe) ? p.lead.pe.id : null,
    p => (p.lead && p.lead.manager) ? p.lead.manager.id : null,
    p => p.created_at ? p.created_at.slice(0, 10) : null);
}

// HOLD tab — payments Accounts has put on hold. From here: back to
// Pending, straight to "To be Sent for Payment" (new — SOP now allows
// Hold to queue for dispatch directly, without bouncing back through
// Pending first), or Rejected (auto-fills a dummy UTR and moves straight
// to Archive — see rejectPayment()).
async function renderPaymentsHoldSection() {
  initTableFilterBar('paymentshold', () => renderPaymentsTable(getPaymentsHoldFilteredRows(), 'tbodyPaymentsHold', 'hold'));
  const data = await fetchPaymentsRaw();
  paymentsHoldCache = data.filter(p => {
    if (!p.lead) return false;
    if (p.status !== 'Hold') return false;
    // "Omini/InstantPay To" (pn_omni_pay_to: Customer/Broker/Both) decides
    // which side actually gets routed through the Omini Pay tab instead of
    // here — only THAT party's row is excluded, the other party (if any)
    // is a normal bank-transfer payment and belongs in this tab like any
    // other lead's row. Older leads saved before this field existed have
    // pn_omni_pay_to blank — treated as 'Customer' (the original/only
    // behavior before Broker/Both existed), so Broker still shows normally
    // for those instead of vanishing with no way to pay it.
    if (p.lead.pn_payment_type === 'Omini Pay') {
      const omniTo = p.lead.pn_omni_pay_to || 'Customer';
      if (omniTo === 'Both' || omniTo === p.payment_type) return false;
    }
    if (p.lead.pn_payment_type === 'Instant Payments') return false;
    if (p.lead.pn_payment_type === 'Credit') return false; // own tab — see renderCreditPaymentSection()
    return true;
  });
  const filtered = getPaymentsHoldFilteredRows();
  document.getElementById('countPaymentsHold').textContent = filtered.length + ' on hold';
  renderPaymentsTable(filtered, 'tbodyPaymentsHold', 'hold');
}

function getPaymentsHoldFilteredRows() {
  return filterRowsByTableFilter(paymentsHoldCache, 'paymentshold',
    p => (p.lead && p.lead.pe) ? p.lead.pe.id : null,
    p => (p.lead && p.lead.manager) ? p.lead.manager.id : null,
    p => p.created_at ? p.created_at.slice(0, 10) : null);
}

// TO BE SENT FOR PAYMENT tab (new — SOP v1.0) — status 'To be Sent for
// Payment'. This is the actual dispatch queue: rows sit here (reviewable,
// checkbox-selectable) until "Send for Payment" is clicked on selected
// row(s), which is the ONLY point the CSV+email actually goes out (see
// sendForPaymentAndNotify()). Bulk Reject/Mark Hold are also available
// here from the header buttons.
async function renderToBeSentSection() {
  initTableFilterBar('tobesent', () => renderPaymentsTable(getToBeSentFilteredRows(), 'tbodyToBeSent', 'tobesent'));
  const data = await fetchPaymentsRaw();
  toBeSentCache = data.filter(p => {
    if (!p.lead) return false;
    if (p.status !== 'To be Sent for Payment') return false;
    // "Omini/InstantPay To" (pn_omni_pay_to: Customer/Broker/Both) decides
    // which side actually gets routed through the Omini Pay tab instead of
    // here — only THAT party's row is excluded, the other party (if any)
    // is a normal bank-transfer payment and belongs in this tab like any
    // other lead's row. Older leads saved before this field existed have
    // pn_omni_pay_to blank — treated as 'Customer' (the original/only
    // behavior before Broker/Both existed), so Broker still shows normally
    // for those instead of vanishing with no way to pay it.
    if (p.lead.pn_payment_type === 'Omini Pay') {
      const omniTo = p.lead.pn_omni_pay_to || 'Customer';
      if (omniTo === 'Both' || omniTo === p.payment_type) return false;
    }
    if (p.lead.pn_payment_type === 'Instant Payments') return false;
    if (p.lead.pn_payment_type === 'Credit') return false; // own tab — see renderCreditPaymentSection()
    return true;
  });
  // A row can vanish from this tab (Sent/Rejected/Held elsewhere) between
  // renders — drop any selected id that's no longer actually here so the
  // bulk-action buttons don't silently try to act on a stale id.
  const stillHere = new Set(toBeSentCache.map(p => p.id));
  toBeSentSelectedIds.forEach(id => { if (!stillHere.has(id)) toBeSentSelectedIds.delete(id); });
  const filtered = getToBeSentFilteredRows();
  document.getElementById('countToBeSent').textContent = filtered.length + ' queued for dispatch';
  renderPaymentsTable(filtered, 'tbodyToBeSent', 'tobesent');
  updateToBeSentActionButtons();
}

function getToBeSentFilteredRows() {
  return filterRowsByTableFilter(toBeSentCache, 'tobesent',
    p => (p.lead && p.lead.pe) ? p.lead.pe.id : null,
    p => (p.lead && p.lead.manager) ? p.lead.manager.id : null,
    p => p.created_at ? p.created_at.slice(0, 10) : null);
}

function toggleToBeSentRow(id, checked) {
  if (checked) toBeSentSelectedIds.add(id); else toBeSentSelectedIds.delete(id);
  updateToBeSentActionButtons();
}
function toggleToBeSentSelectAll(checkboxEl) {
  document.querySelectorAll('.chkToBeSentRow').forEach(el => {
    const _tr = el.closest('tr');
    if (_tr && (_tr.dataset.twColFiltered === '1' || _tr.dataset.twFiltered === '1')) { el.checked = false; toBeSentSelectedIds.delete(el.value); return; } // hidden by a filter — Excel-style: only visible rows
    el.checked = checkboxEl.checked;
    if (checkboxEl.checked) toBeSentSelectedIds.add(el.value); else toBeSentSelectedIds.delete(el.value);
  });
  updateToBeSentActionButtons();
}
function updateToBeSentActionButtons() {
  const n = toBeSentSelectedIds.size;
  ['btnToBeSentSend', 'btnToBeSentHold', 'btnToBeSentReject'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.disabled = n === 0;
  });
  const countEl = document.getElementById('toBeSentSelectedCount');
  if (countEl) countEl.textContent = n;
}

// A payment only ever lives in exactly ONE of Pending/Hold/To be Sent for
// Payment/Pending UTR/Archive at a time (unlike a lead, which can
// genuinely sit in several operational tabs at once — see
// getOperationalLocations(), JS-Core.html). So when a local "Search by
// lead no / customer" box on any one of these 5 tabs comes up empty, the
// payment is almost certainly just sitting in a DIFFERENT one of the 5 —
// this checks the other 4 and auto-redirects there instead of leaving the
// person staring at "No payments here right now" for a payment that's
// actually just one click away. Recurses at most once: it calls the
// target tab's own filter function directly, which will find results
// there and stop (or, if truly nowhere, also come up empty and do
// nothing further since currentTab === targetTab).
const PAYMENT_TAB_META = {
  pending: { section: 'payments', searchId: 'searchPayments', label: 'Pending' },
  hold: { section: 'payments-hold', searchId: 'searchPaymentsHold', label: 'Hold' },
  tobesent: { section: 'payments-tobesent', searchId: 'searchToBeSent', label: 'To be Sent for Payment' },
  utr: { section: 'pending-utr', searchId: 'searchPendingUtr', label: 'Pending UTR' },
  credit: { section: 'credit-payment', searchId: 'searchCreditPayment', label: 'Credit Payment' },
  archive: { section: 'payments-archive', searchId: 'searchPaymentsArchive', label: 'Archive' },
};
async function searchAcrossPaymentTabs(query, currentTab) {
  const q = (query || '').trim();
  if (q.length < 2) return;
  const esc = q.replace(/'/g, "''");
  const { data: leads, error: leadsErr } = await sb.from('rewire_master_data')
    .select('id')
    .or(`lead_no.ilike.%${esc}%,customer_name.ilike.%${esc}%,val_vehicle_number.ilike.%${esc}%`)
    .limit(5);
  if (leadsErr) { console.error('searchAcrossPaymentTabs: lead lookup failed', leadsErr); return; }
  if (!leads || !leads.length) return; // no such lead at all — genuinely nothing to find
  const leadIds = leads.map(l => l.id);
  // pn_payment_type pulled in too now (Ramvir, Sept 2026 Credit addition) —
  // a Credit row's raw `status` is still whatever create_payment_rows()
  // inserted ('Pending'), even though renderPaymentsSection() now excludes
  // it from that tab entirely. Without checking payment_type FIRST, a
  // Credit row would get misrouted to the (empty-for-it) Pending tab
  // instead of its own Credit Payment tab.
  const [{ data: liveRows, error: liveErr }, { data: archRows, error: archErr }] = await Promise.all([
    sb.from('rewire_payments').select('status, lead:rewire_master_data!rewire_payments_lead_id_fkey(pn_payment_type)').in('lead_id', leadIds),
    sb.from('rewire_payments_archive').select('lead_id').in('lead_id', leadIds),
  ]);
  if (liveErr) console.error('searchAcrossPaymentTabs: live lookup failed', liveErr);
  if (archErr) console.error('searchAcrossPaymentTabs: archive lookup failed', archErr);
  let targetTab = null;
  if (archRows && archRows.length) targetTab = 'archive';
  else if (liveRows && liveRows.length) {
    if (liveRows.some(r => r.lead && r.lead.pn_payment_type === 'Credit' && r.status !== 'Completed' && r.status !== 'Rejected')) targetTab = 'credit';
    else if (liveRows.some(r => r.status === 'Hold')) targetTab = 'hold';
    else if (liveRows.some(r => r.status === 'Pending UTR')) targetTab = 'utr';
    else if (liveRows.some(r => r.status === 'To be Sent for Payment')) targetTab = 'tobesent';
    else if (liveRows.some(r => r.status === 'Pending')) targetTab = 'pending';
    else if (liveRows.some(r => r.status === 'Rejected')) targetTab = 'archive'; // safety net if the archive-move trigger hasn't fired for Rejected yet — see supabase-batch90
  }
  if (!targetTab || targetTab === currentTab) return; // not a payments-eligible lead, or genuinely not here either
  const meta = PAYMENT_TAB_META[targetTab];
  // Clear any stale PE/Manager/date filter sitting on the destination tab —
  // a specific lead search should never come back empty just because that
  // tab happened to have an unrelated filter active from earlier browsing.
  // (filterFns below for pending/hold/tobesent/utr/credit run through
  // getXFilteredRows(), which applies tableFilterState; archive's own
  // filter reads the raw cache directly and isn't affected, but resetting
  // it too keeps behavior consistent.)
  const filterPrefix = { pending: 'payments', hold: 'paymentshold', tobesent: 'tobesent', utr: 'pendingutr', credit: 'creditpayment', archive: 'paymentsarchive' }[targetTab];
  if (filterPrefix && tableFilterState[filterPrefix]) tableFilterState[filterPrefix] = { pe: '', manager: '', from: '', to: '' };
  notify(`Found in ${meta.label} — redirecting…`);
  // skipRender:true — otherwise showSection() ALSO fires this same tab's
  // render function internally (unawaited), racing against the awaited
  // renderFns[targetTab]() call right below against the same table. Whichever
  // finished last used to win and silently re-render the FULL unfiltered
  // table, undoing the search filter set further down — this was the actual
  // cause of "lead search doesn't match even though it's in Archive": the
  // search briefly succeeded, then got wiped out by the redundant render.
  showSection(meta.section, { skipRender: true });
  const renderFns = { pending: renderPaymentsSection, hold: renderPaymentsHoldSection, tobesent: renderToBeSentSection, utr: renderPendingUtrSection, credit: renderCreditPaymentSection, archive: renderPaymentsArchiveSection };
  await renderFns[targetTab]();
  const filterFns = { pending: filterPaymentsTable, hold: filterPaymentsHoldTable, tobesent: filterToBeSentTable, utr: filterPendingUtrTable, credit: filterCreditPaymentTable, archive: filterPaymentsArchiveTable };
  const el = document.getElementById(meta.searchId);
  if (el) el.value = q;
  filterFns[targetTab](q);
}

function filterPaymentsHoldTable(v) {
  const q = v.toLowerCase();
  const results = getPaymentsHoldFilteredRows().filter(p =>
    (p.lead && p.lead.lead_no.toLowerCase().includes(q)) || (p.lead && p.lead.customer_name.toLowerCase().includes(q))
    || (p.lead && (p.lead.val_vehicle_number || '').toLowerCase().includes(q)));
  renderPaymentsTable(results, 'tbodyPaymentsHold', 'hold');
  if (!results.length) searchAcrossPaymentTabs(v, 'hold');
}

function filterToBeSentTable(v) {
  const q = v.toLowerCase();
  const results = getToBeSentFilteredRows().filter(p =>
    (p.lead && p.lead.lead_no.toLowerCase().includes(q)) || (p.lead && p.lead.customer_name.toLowerCase().includes(q))
    || (p.lead && (p.lead.val_vehicle_number || '').toLowerCase().includes(q)));
  renderPaymentsTable(results, 'tbodyToBeSent', 'tobesent');
  if (!results.length) searchAcrossPaymentTabs(v, 'tobesent');
}

// Admin-only recovery tool ("Find Missing Payment Rows" button, Payments
// page header) — this is what L7102349 needed manual SQL for
// (supabase-batch63-force-L7102349-into-payments.sql): a lead that's
// genuinely approved (Head Approval, or Payment Release for Advance
// Payment/Omini Pay) can end up with NO rewire_payments row at all if
// it went through a manual SQL correction that never re-fired whatever
// creates that row normally. Rather than writing a fresh one-off SQL
// script for every future occurrence of this, this scans for the gap
// and lets Admin fix it from the app itself.
//
// "Should exist" = approved per the same gate JS-Payments.html's own
// sections use; "amount" = Delivery's number if entered, else Price
// Negotiation's (same rule used on the Purchased tab and in batch63).
async function scanMissingPayments() {
  // Both fetches go through fetchAllRows() (JS-Core.html) — a plain
  // .select() with no .range() silently caps at 1000 rows, and
  // rewire_payments alone has 4700+, so most existing rows were
  // invisible here and got flagged as "missing" (same bug hit the
  // Health Check's identical logic — see there for the full note).
  // NOT scoping the rewire_payments fetch by .in('lead_id', eligibleIds)
  // — eligible can run into the thousands, and cramming that many UUIDs
  // into one query's URL blew past the URL length limit ("TypeError:
  // Failed to fetch", the request never even reaching the server).
  // Paginating the whole table instead is bounded either way (~5
  // requests for 4700 rows).
  // Also checking rewire_payments_archive, not just the live table — a
  // payment already marked Completed moves there (see
  // updatePaymentStatus/completePayment above), so a lead whose Broker
  // or Customer side was already fully paid had NO row left in the live
  // table at all. Without this, "already paid and archived" looked
  // identical to "genuinely never created" and this inserted a brand new
  // duplicate row on top of the archived one.
  let eligible, existing, existingArchived;
  try {
    eligible = await fetchAllRows((from, to) => sb.from('rewire_master_data')
      .select('id, lead_no, customer_name, pn_customer_payment, pn_broker_payment, ud_customer_payment, ud_broker_payment')
      .neq('overall_status', 'Closed Lost')
      .or('ha_status.eq.Approved,payment_release_status.eq.Approved')
      .range(from, to));
    existing = await fetchAllRows((from, to) => sb.from('rewire_payments').select('lead_id, payment_type').range(from, to));
    existingArchived = await fetchAllRows((from, to) => sb.from('rewire_payments_archive').select('lead_id, payment_type').range(from, to));
  } catch (e) {
    notify('Scan failed: ' + e.message, { icon: 'error' });
    return;
  }
  const haveCustomer = new Set(), haveBroker = new Set();
  [...(existing || []), ...(existingArchived || [])].forEach(r => {
    if (r.payment_type === 'Customer') haveCustomer.add(r.lead_id);
    if (r.payment_type === 'Broker') haveBroker.add(r.lead_id);
  });

  const gaps = [];
  (eligible || []).forEach(l => {
    const custAmt = l.ud_customer_payment || l.pn_customer_payment || 0;
    const brokAmt = l.ud_broker_payment || l.pn_broker_payment || 0;
    if (custAmt > 0 && !haveCustomer.has(l.id)) gaps.push({ leadId: l.id, leadNo: l.lead_no, customerName: l.customer_name, type: 'Customer', amount: custAmt });
    if (brokAmt > 0 && !haveBroker.has(l.id)) gaps.push({ leadId: l.id, leadNo: l.lead_no, customerName: l.customer_name, type: 'Broker', amount: brokAmt });
  });

  if (!gaps.length) {
    notify('No missing payment rows found — every approved lead already has its Customer/Broker row.');
    return;
  }

  const listHtml = gaps.map(g =>
    `<div style="text-align:left;font-size:13px;padding:5px 0;border-bottom:1px solid var(--color-border-tertiary);">${g.leadNo} — ${g.customerName} — ${g.type} — ₹${g.amount}</div>`
  ).join('');
  const result = await Swal.fire({
    icon: 'warning',
    title: `${gaps.length} missing payment row(s) found`,
    html: `<div style="max-height:280px;overflow-y:auto;">${listHtml}</div>`,
    showCancelButton: true,
    confirmButtonText: 'Create All',
    confirmButtonColor: '#1d4ed8',
    cancelButtonColor: '#94a3b8',
  });
  if (!result.isConfirmed) return;

  const rows = gaps.map(g => ({ lead_id: g.leadId, payment_type: g.type, amount: g.amount, status: 'Pending' }));
  const { error: insErr } = await sb.from('rewire_payments').insert(rows);
  if (insErr) { notify('Failed to create rows: ' + insErr.message, { icon: 'error' }); return; }
  notify(`Created ${rows.length} payment row(s).`);
  await refreshPaymentsSections();
}

// ------------------------------------------------------------
// PENDING UTR SECTION — two sources feed this tab at the same time:
//   1. Regular payments that went through "Send for Payment & Notify" on
//      the Pending tab (status = 'Pending UTR' — see
//      sendForPaymentAndNotify() below). Marking a row "Send for Payment"
//      alone does NOT land it here — only a successful notification does.
//   2. Every Instant Payment row that isn't Completed yet, regardless of
//      its raw status column — Instant Payments bypass Pending/Hold
//      entirely per the SOP (Instant Payment -> Pending UTR -> UTR Entry
//      -> Completed -> Archive). These already got a notification email
//      sent out at Price Negotiation time (see submitPriceNegotiation() in
//      JS-Pipeline.html) — this is where the actual transfer gets recorded
//      once it's genuinely been made.
// No status dropdown here (see renderPaymentsTable's 'utr' mode) — just
// UTR entry + Complete, which moves the row to Payments Archive.
// ------------------------------------------------------------
async function renderPendingUtrSection() {
  initTableFilterBar('pendingutr', () => renderPaymentsTable(getPendingUtrFilteredRows(), 'tbodyPendingUtr', 'utr'));
  const data = await fetchPaymentsRaw();
  pendingUtrCache = data.filter(p => {
    if (!p.lead) return false;
    // Same gap as the Pending tab — see the note there. A row marked
    // Completed/Rejected should have moved to Archive; filter it out here
    // too in case the archive-move trigger didn't actually delete it.
    if (p.status === 'Completed' || p.status === 'Rejected') return false;
    if (p.lead.pn_payment_type === 'Credit') return false; // own tab — see renderCreditPaymentSection()
    if (p.lead.pn_payment_type === 'Instant Payments') {
      // Instant Payments auto-releases (payment_release_status='Approved')
      // right when PN is saved — that, not the final Head Approval (which
      // only happens later after Delivery/Accessories Check), is what
      // should surface it here, regardless of its own status column.
      if (p.lead.payment_release_status !== 'Approved') return false;
    } else {
      if (p.status !== 'Pending UTR') return false;
      // "Omini/InstantPay To" (pn_omni_pay_to: Customer/Broker/Both) decides
      // which side actually gets routed through the Omini Pay tab instead
      // of here — see the identical note on the Pending tab above.
      if (p.lead.pn_payment_type === 'Omini Pay') {
        const omniTo = p.lead.pn_omni_pay_to || 'Customer';
        if (omniTo === 'Both' || omniTo === p.payment_type) return false;
      }
    }
    // A row with its own amount > 0 is real money to pay even if the PN field for that side is blank/mismatched
    // (e.g. L7103534, L7102515) - otherwise Accounts never sees it. Rows with amount 0 stay hidden.
    if (Number(p.amount) > 0) return true;
    if (p.payment_type === 'Customer') return (p.lead.pn_customer_payment || 0) > 0;
    if (p.payment_type === 'Broker') return (p.lead.pn_broker_payment || 0) > 0;
    return true;
  });
  const filtered = getPendingUtrFilteredRows();
  document.getElementById('countPendingUtr').textContent = filtered.length + ' awaiting UTR';
  renderPaymentsTable(filtered, 'tbodyPendingUtr', 'utr');
}

function getPendingUtrFilteredRows() {
  return filterRowsByTableFilter(pendingUtrCache, 'pendingutr',
    p => (p.lead && p.lead.pe) ? p.lead.pe.id : null,
    p => (p.lead && p.lead.manager) ? p.lead.manager.id : null,
    p => p.created_at ? p.created_at.slice(0, 10) : null);
}

function filterPendingUtrTable(v) {
  const q = v.toLowerCase();
  const results = getPendingUtrFilteredRows().filter(p =>
    (p.lead && p.lead.lead_no.toLowerCase().includes(q)) || (p.lead && p.lead.customer_name.toLowerCase().includes(q))

  if (!results.length) searchAcrossPaymentTabs(v, 'utr');
}

// CREDIT PAYMENT tab (new — Ramvir, Sept 2026). Credit follows the exact

// html, treats it identically all the way through Head Approval) — it only

    // A row with its own amount > 0 is real money to pay even if the PN field for that side is blank/mismatched

    if (Number(p.amount) > 0) return true;

// Direct Complete — deliberately no UTR requirement (unlike completePayment
// above), since a Credit row isn't a bank transfer being made right now;
// per Ramvir, it's completed directly from this tab once the credit
// arrangement is actually settled with the party.
async function completeCreditPayment(id) {
  const ok = await confirmDialog('Mark this credit payment Completed and move it to Archive?');
  if (!ok) return;
  const { error } = await sb.from('rewire_payments').update({ status: 'Completed', completed_on: new Date().toISOString(), updated_by: currentProfile.id }).eq('id', id);
  if (error) { notify('Error completing payment: ' + error.message, { icon: 'error' }); return; }
  notify('Credit payment marked Completed and moved to Archive.');
  refreshPaymentsSections();
}

// Exports exactly what's sitting in the "Sent for Payment" bucket right
// now on the main Payments list — the moment Accounts has pushed a batch
// out for processing but before it's Completed, which is the point
// someone typically wants a snapshot to hand off/print.
// Shared by both the local .xlsx download and the "Send to Google Sheet"
// button below — same filter, same row shape, two different destinations.
// A lead can have both a Customer payment and a Broker payment row
// (p.payment_type tells which). Customer rows show the customer's own
// Bank KYC details; Broker rows need the BROKER's bank details instead —
// looked up by matching pn_partner_name (the broker picked in Price
// Negotiation) against the Partners directory already cached client-side.
// (Moved above the two export functions below, which now call it too.)
function getPaymentBankDetails(p) {
  if (!p.lead) return null;
  if (p.payment_type === 'Broker') {
    const brokerName = (p.lead.pn_partner_name || '').trim().toLowerCase();
    if (!brokerName) return null;
    const partner = allPartners.find(x => x.partner_name.trim().toLowerCase() === brokerName);
    if (!partner) return null;
    return { holder: partner.account_holder_name, bank: partner.bank_name, branch: partner.branch_name, acct: partner.account_number, ifsc: partner.ifsc_code, email: partner.email };
  }
  if (!p.lead.kyc_bank_name) return null;
  return { holder: p.lead.kyc_account_holder_name, bank: p.lead.kyc_bank_name, branch: p.lead.kyc_branch_name, acct: p.lead.kyc_account_number, ifsc: p.lead.kyc_ifsc_code };
}

// Does its OWN fresh fetch rather than reading the paymentsCache global —
// the earlier version read paymentsCache directly and reported "no rows"
// even with rows visibly sitting on screen, because at the moment the
// button was clicked, this ran against whatever paymentsCache happened to
// hold right then (stale, or momentarily reset by an in-flight re-render)
// instead of the table's actual current contents. Re-fetching here every
// time removes that dependency entirely — it always reflects what's
// really in the database at click time.
//
// Only status === 'Send for Payment' rows belong in this export — that's
// the intended queue (rows Accounts has already screened and flagged
// ready), not every Pending row on the Payments tab. The REAL bug behind
// "pura data hi nahi aa raha" was the approval gate below: it required
// ha_status === 'Approved' unconditionally, but Advance Payment leads are
// released early via payment_release_status instead (ha_status stays
// unset for them until much later) — so every genuinely-eligible Advance
// Payment "Send for Payment" row was being silently dropped from the
// export while still showing correctly in the on-screen table (which
// already branches this gate correctly in renderPaymentsSection). Fixed
// to branch the same way here.
// Raw (unmapped) rows — status === 'To be Sent for Payment', same
// eligibility gate as the other tabs. Shared by the Excel/Sheet export
// below AND by sendForPaymentAndNotify() (which needs the real .id per
// row to move them to Pending UTR afterward, not just the flattened
// export shape).
async function fetchSentForPaymentEligible() {
  const data = await fetchPaymentsRaw();
  return data.filter(p => {
    if (!p.lead) return false;
    // "Omini/InstantPay To" (pn_omni_pay_to: Customer/Broker/Both) decides
    // which side actually gets routed through the Omini Pay tab instead of
    // here — only THAT party's row is excluded, the other party (if any)
    // is a normal bank-transfer payment and belongs in this tab like any
    // other lead's row. Older leads saved before this field existed have
    // pn_omni_pay_to blank — treated as 'Customer' (the original/only
    // behavior before Broker/Both existed), so Broker still shows normally
    // for those instead of vanishing with no way to pay it.
    if (p.lead.pn_payment_type === 'Omini Pay') {
      const omniTo = p.lead.pn_omni_pay_to || 'Customer';
      if (omniTo === 'Both' || omniTo === p.payment_type) return false;
    }
    if (p.lead.pn_payment_type === 'Instant Payments') return false;
    if (p.lead.pn_payment_type === 'Credit') return false; // own tab — see renderCreditPaymentSection()
    if (p.status !== 'To be Sent for Payment') return false;
    const gate = p.lead.pn_payment_type === 'Advance Payment' ? p.lead.payment_release_status === 'Approved' : p.lead.ha_status === 'Approved';
    if (!gate) return false;
    // A row with its own amount > 0 is real money to pay even if the PN field for that side is blank/mismatched
    // (e.g. L7103534, L7102515) - otherwise Accounts never sees it. Rows with amount 0 stay hidden.
    if (Number(p.amount) > 0) return true;
    if (p.payment_type === 'Customer') return (p.lead.pn_customer_payment || 0) > 0;
    if (p.payment_type === 'Broker') return (p.lead.pn_broker_payment || 0) > 0;
    return true;
  });
}

async function fetchSentForPaymentRows() {
  const eligible = await fetchSentForPaymentEligible();
  // Same PE/Manager/date filter the Payments table itself is currently

  const filtered = filterRowsByTableFilter(eligible, 'payments',

      phone: p.lead ? p.lead.phone : '',
      location: p.lead ? p.lead.ud_vehicle_parking : '',
      vehicle_no: p.lead ? p.lead.val_vehicle_number : '',
      make: p.lead ? p.lead.val_make : '',
      model: p.lead ? p.lead.val_model_variant : '',
      partner: p.lead && p.lead.rewire_partners ? p.lead.rewire_partners.partner_name : '',
      pe: p.lead && p.lead.pe ? p.lead.pe.name : '',
      manager: p.lead && p.lead.manager ? p.lead.manager.name : '',
      type: p.payment_type,
      bank_holder: bd ? bd.holder || '' : '',
      bank_name: bd ? bd.bank || '' : '',
      bank_branch: bd ? bd.branch || '' : '',
      bank_account_no: bd ? bd.acct || '' : '',
      bank_ifsc: bd ? bd.ifsc || '' : '',
      amount: p.amount,
      status: p.status,
      utr_no: p.utr_no,
      created_at: p.created_at,
    };
  });
}

// Builds the CSV attachment in the bank's own NEFT/RTGS bulk-upload
// column layout (see "RBI File Format - NEFT RTGS new.xlsx", the template
// Ramvir shared) — one row per payment, in the exact 28-column order/
// header text the bank expects (including its own "Bracnh"/"Emai Id"
// spelling — kept exactly as the template has it, not "corrected", since
// this is presumably validated by the bank on the literal header text).
// CSV instead of .xlsx now (Payment Module SOP v1.0 explicitly calls for
// a CSV attachment) — the ONE thing that has to survive that switch
// correctly is the Beneficiary Account Number: a .csv has no per-cell
// type/format the way .xlsx did (there's no cell.z='@' equivalent), so a
// plain digit string in a CSV is only ever as safe as whatever opens it
// afterward. If a bank account number starts with 0 (e.g. "00123456") or
// runs past ~15 digits, Excel's own CSV importer auto-detects it as a
// NUMBER on open and will (a) silently drop the leading zero(s), and (b)
// for anything past 15 significant digits, round it into scientific
// notation — permanently, if the file then gets re-saved. Guarded here
// with the same ="..." formula-text trick already used elsewhere in this
// file (see downloadCsv's comment above) — Excel evaluates that as a
// formula whose result is the literal text, so it never gets reinterpreted
// as a number regardless of length or leading zeros. The raw .csv file on
// disk always has the correct exact digits either way; this only protects
// against what happens the moment someone double-clicks it open in Excel.
// If the bank's own system parses this CSV programmatically instead
// (rather than a human opening it in Excel), confirm with them whether
// the ="..." wrapping is fine to leave in or needs to be a plain
// unwrapped value — that's an open item from the SOP either way (exact
// HDFC/bank column schema still needs sign-off from the Cashier team).
// One field is still a placeholder:
//   - Transaction Type ('N') / Beneficiary Code ('01') — hardcoded to
//     match the template's own example row.
// Bene Emai Id (AB) — was the lead's Manager's email
// (rewire_user_profiles.manager_email, batch97) but per Ramvir (Sept
// 2026) the Manager has nothing to do with WHO is being paid: it's now
// the actual beneficiary's own email — the customer's (rewire_master_data
// .email, also editable at Bank KYC as of this same change) for a
// Customer payment row, the broker's (rewire_partners.email, via
// getPaymentBankDetails' Broker branch) for a Broker payment row.
//
// Column-specific rules per Ramvir (Sept 2026):
//   - Beneficiary Name (E) — the customer's name for a Customer payment,
//     the broker's/partner's name (pn_partner_name) for a Broker payment.
//     NOT the bank KYC/partner "account holder name" — that's a bank-side
//     field and can legitimately differ from the actual payee's name.
//   - Beneficiary Name (E) and Payment details 3 (Q) — bank field length
//     cap, truncated to under 30 characters.
//   - Cheque Date (W) — today's date, formatted dd/mm/yyyy (this is a
//     NEFT/RTGS file, so there's no real cheque; the bank's template
//     still wants something here, so it's the date the file was
//     generated, zero-padded since the bank format is strict about it).
//   - Bene Bank Bracnh (AA) — commas stripped; a branch name with a
//     comma in it (e.g. "Kota, Rajasthan") risks being misread as two
//     fields by whatever un-quotes this CSV on the bank's end.
const CSV_FIELD_MAX = 29; // strictly under 30 chars
const capFieldLen = (v) => (v || '').toString().slice(0, CSV_FIELD_MAX);
// dd/mm/yyyy, zero-padded — toLocaleDateString('en-IN') does NOT
// reliably zero-pad (e.g. "9/7/2026" instead of "09/07/2026"), which is
// what the bank template's Cheque Date column (W) needs.
const formatDDMMYYYY = (d) => {
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return `${dd}/${mm}/${d.getFullYear()}`;
};
function buildNeftRtgsCsv(rows) {
  const header = [
    'Transaction  Type', 'Beneficiary Code', 'Beneficiary \nAccount Number', 'Instrument\n Amount',
    'Beneficiary\n Name', 'Drawee\n Location', 'Print \nLocation', 'Bene \nAddress 1', 'Bene \nAddress 2',
    'Bene \nAddress 3', 'Bene \nAddress 4', 'Bene \nAddress 5', 'Instruction\n Reference Number',
    'Customer \nReference Number', 'Payment \ndetails 1', 'Payment \ndetails 2', 'Payment \ndetails 3',
    'Payment \ndetails 4', 'Payment \ndetails 5', 'Payment \ndetails 6', 'Payment \ndetails 7',
    'Cheque \nNumber', 'Cheque \nDate', 'MICR NO', 'IFSC COD', 'BENE BANK', 'Bene Bank Bracnh', 'Bene Emai Id',
  ];
  const ACCOUNT_NO_COL = 2; // Beneficiary Account Number — the one column that must never be number-parsed
  const escapeCsvCell = (v, forceText) => {
    const s = (v === null || v === undefined) ? '' : String(v);
    const quoted = '"' + s.replace(/"/g, '""') + '"';
    return (forceText && s !== '') ? '="' + s.replace(/"/g, '""') + '"' : quoted;
  };
  const rowsToLines = (cols) => cols.map((v, i) => escapeCsvCell(v, i === ACCOUNT_NO_COL)).join(',');
  const todayStr = formatDDMMYYYY(new Date());
  const lines = [header.map(h => escapeCsvCell(h)).join(',')];
  rows.forEach(p => {
    const bd = getPaymentBankDetails(p);
    // AB — Bene Emai Id: the actual beneficiary's own email, not the
    // Manager's — Customer's (lead.email) for a Customer row, Broker's
    // (bd.email, from the Partners directory) for a Broker row.
    const beneEmail = p.payment_type === 'Broker' ? (bd ? bd.email || '' : '') : (p.lead ? p.lead.email || '' : '');
    // E — Beneficiary Name: the actual payee's name, NOT the bank's
    // registered account-holder name (bd.holder) — those can legitimately
    // differ (e.g. a broker's account held in a family member's name), and
    // the bank notification should show who is actually being paid.
    const beneficiaryName = p.payment_type === 'Broker'
      ? (p.lead ? p.lead.pn_partner_name || '' : '')
      : (p.lead ? p.lead.customer_name || '' : '');
    lines.push(rowsToLines([
      'N', '01',
      bd ? bd.acct || '' : '',
      p.amount || 0,
      capFieldLen(beneficiaryName), // E — Beneficiary Name, <30 chars
      '', '', '', '', '', '', '',
      p.lead ? p.lead.lead_no : '', // M — Instruction Reference Number, now Lead No.
      p.lead ? p.lead.val_vehicle_number || '' : '', // N — Customer Reference Number, now Vehicle No.
      p.lead ? p.lead.val_vehicle_number || '' : '',
      p.lead ? p.lead.customer_name || '' : '',
      capFieldLen(p.lead ? p.lead.pn_partner_name : ''), // Q — Payment details 3, <30 chars
      p.lead && p.lead.pe ? p.lead.pe.name : '',
      p.payment_type,
      '', '',
      '', todayStr, // W — Cheque Date, today
      '',
      bd ? bd.ifsc || '' : '',
      bd ? bd.bank || '' : '',
      (bd && bd.branch ? bd.branch.replace(/,/g, '') : ''), // AA — Bene Bank Bracnh, commas stripped
      beneEmail, // AB — Bene Emai Id, the actual beneficiary (Customer or Broker)
    ]));
  });
  // \r\n — standard CSV/Windows line ending, matches what a bank's own
  // bulk-upload portal typically expects from this kind of file.
  return lines.join('\r\n');
}

// "Send for Payment" (To be Sent for Payment tab, checkbox-selected rows
// only — SOP v1.0 makes bulk selection mandatory on this specific tab).
// Nothing is emailed or moved until this button is actually clicked on at
// least one selected row. On click: ONE email goes to Bank/Cashier with
// every SELECTED row in the bank's own NEFT/RTGS CSV format attached, and
// only once that email genuinely sends do those rows move to the Pending
// UTR tab (status -> 'Pending UTR'). If the email fails, nothing moves —
// rows stay in "To be Sent for Payment" exactly as they were, so this is
// safe to retry.
async function sendForPaymentAndNotify() {
  // Manager has view-only access to Payments (see applyRoleBasedUI/
  // window.isViewOnlyRole, JS-Core.html) — this mutates payment status and
  // sends a real email, not just an export, so it's blocked here too even
  // though the button itself isn't separately role-gated in the header.
  if (window.isViewOnlyRole) { notify('View-only access — cannot send payment notifications.', { icon: 'error' }); return; }
  if (!toBeSentSelectedIds.size) { notify('Select at least one payment to send.', { icon: 'info' }); return; }
  const filtered = toBeSentCache.filter(p => toBeSentSelectedIds.has(p.id));
  if (!filtered.length) { notify('Selected payment(s) are no longer in this tab — refresh and try again.', { icon: 'info' }); return; }
  const ok = await confirmDialog(`Send bank/cashier notification for ${filtered.length} selected payment(s) and move them to Pending UTR?`);
  if (!ok) return;

  const csvContent = buildNeftRtgsCsv(filtered);
  const ids = filtered.map(p => p.id);

  google.script.run
    .withSuccessHandler(async () => {
      const { error } = await sb.from('rewire_payments').update({ status: 'Pending UTR', updated_by: currentProfile.id }).in('id', ids);
      if (error) { notify('Email sent, but failed to move rows to Pending UTR: ' + error.message, { icon: 'error' }); return; }
      notify(`Notified Bank/Cashier and moved ${ids.length} payment(s) to Pending UTR.`);
      toBeSentSelectedIds.clear();
      refreshPaymentsSections();
    })
    .withFailureHandler((err) => notify('Failed to send notification email: ' + err.message, { icon: 'error' }))
    .sendPaymentNotificationEmail({ csvContent, count: filtered.length, senderName: currentProfile ? currentProfile.name : '' });
}

// Bulk Mark Hold — "To be Sent for Payment" tab, selected rows only.
async function bulkHoldToBeSent() {
  if (window.isViewOnlyRole) { notify('View-only access.', { icon: 'error' }); return; }
  if (!toBeSentSelectedIds.size) { notify('Select at least one payment first.', { icon: 'info' }); return; }
  const ids = Array.from(toBeSentSelectedIds);
  const ok = await confirmDialog(`Move ${ids.length} selected payment(s) to Hold?`);
  if (!ok) return;
  const { error } = await sb.from('rewire_payments').update({ status: 'Hold', updated_by: currentProfile.id }).in('id', ids);
  if (error) { notify('Error moving to Hold: ' + error.message, { icon: 'error' }); return; }
  notify(`${ids.length} payment(s) moved to Hold.`);
  toBeSentSelectedIds.clear();
  refreshPaymentsSections();
}

// Bulk Rejected — "To be Sent for Payment" tab, selected rows only. Each
// row gets its OWN sequential Dummy UTR (see getNextDummyUtr()), fetched
// one at a time in sequence (not in parallel) specifically so two rows in
// the same batch can't race each other for the same number.
async function bulkRejectToBeSent() {
  if (window.isViewOnlyRole) { notify('View-only access.', { icon: 'error' }); return; }
  if (!toBeSentSelectedIds.size) { notify('Select at least one payment first.', { icon: 'info' }); return; }
  const ids = Array.from(toBeSentSelectedIds);
  const ok = await confirmDialog(`Reject ${ids.length} selected payment(s)? A dummy UTR will be filled in for each and they'll move to Archive.`);
  if (!ok) return;
  let failed = 0;
  for (const id of ids) {
    const dummyUtr = await getNextDummyUtr();
    const { error } = await sb.from('rewire_payments').update({
      status: 'Rejected', utr_no: dummyUtr, completed_on: new Date().toISOString(), updated_by: currentProfile.id,
    }).eq('id', id);
    if (error) failed++;
  }
  notify(failed ? `${ids.length - failed} rejected, ${failed} failed — see console.` : `${ids.length} payment(s) rejected and moved to Archive.`, failed ? { icon: 'error' } : undefined);
  toBeSentSelectedIds.clear();
  refreshPaymentsSections();
}

//                (value 'To be Sent for Payment' under the hood). No UTR
//                column, no Complete button (nothing to complete yet).
//   'hold'     — Status select offers Hold/Pending/Send for Payment/
//                Rejected. Same — no UTR/Complete here either.
//   'tobesent' — NO per-row Status dropdown — SOP makes this tab
//                checkbox-multi-select + bulk actions only (leading
//                checkbox column; Send for Payment/Mark Hold/Reject all
//                live as header buttons acting on whatever's checked, see
//                Sections.html).
//   'utr'      — No Status dropdown at all. UTR entry + Complete button
//                only (Complete moves the row to Archive).
//   'credit'   — Credit Payment tab (new). No Status dropdown, no UTR
//                column at all — just a plain Complete button that moves
//                the row straight to Archive, no UTR required (see
//                completeCreditPayment() — this tab never handles a real
//                bank transfer, the amount is settled/adjusted with the
//                party separately).

  const colCount = (mode === 'tobesent' ? 21 : 20) + 1; // +1 for Sub Location (Ramvir, Sept 2026)

  tbody.innerHTML = (rows && rows.length) ? rows.map(p => { const bd = getPaymentBankDetails(p); return `<tr>
    ${checkboxCell(p)}

    <td>${p.lead ? p.lead.ud_vehicle_parking || '—' : '—'}</td>
    <td>${p.lead ? p.lead.ud_vehicle_sub_parking || '—' : '—'}</td>

    <td>${p.lead ? p.lead.val_model_variant || '—' : '—'}</td>
    <td>${p.lead && p.lead.rewire_partners ? p.lead.rewire_partners.partner_name : '—'}</td>
    <td>${p.lead && p.lead.pe ? p.lead.pe.name : '—'}</td>
    <td>${p.lead && p.lead.manager ? p.lead.manager.name : '—'}</td>
    <td>${p.lead ? p.lead.pn_deal_type || '—' : '—'}</td>

    <td>${viewOnly ? (p.amount ? '₹' + p.amount : '—') : `<input type="number" min="0" onwheel="this.blur()" value="${p.amount || ''}" style="width:110px;border:0.5px solid var(--color-border-secondary);border-radius:5px;padding:4px 7px;font-size:12px;" onchange="updatePaymentAmount('${p.id}', this.value)" />`}</td>

async function updatePaymentAmount(id, value) {

// A row's id doesn't say which of the 4 live tabs it came from, so every
// action below just refreshes all 4 — only the one that's actually
// visible re-renders anything a person notices, and re-fetching the
// others is cheap at this app's scale. (Archive isn't refreshed here —
// nothing above ever writes there directly; it only ever gains rows via
// the Completed/Rejected DB-side archive-move.)
async function refreshPaymentsSections() {
  invalidatePaymentsRawCache(); // force ONE fresh fetch, shared by all 5 renders below — see fetchPaymentsRaw()
  await renderPaymentsSection();
  await renderPaymentsHoldSection();
  await renderToBeSentSection();
  await renderPendingUtrSection();

}

async function updatePaymentStatus(id, value) {
  // HOLD -> Rejected is its own flow (dummy UTR + confirmation) — see
  // rejectPayment() below, not a plain status write.
  if (value === 'Rejected') { await rejectPayment(id); return; }
  // The "Complete" button already blocks completing a payment without a
  // UTR (see completePayment below) — but this Status dropdown used to be
  // a second way to reach "Completed" that bypassed that check entirely.
  // Kept here for safety even though the dropdown no longer offers
  // "Completed" as an option in any mode (see renderPaymentsTable) —
  // Completed is only reachable via the Complete button now.
  if (value === 'Completed') {
    const row = paymentsCache.find(p => p.id === id) || paymentsHoldCache.find(p => p.id === id) || toBeSentCache.find(p => p.id === id) || pendingUtrCache.find(p => p.id === id);
    if (!row || !row.utr_no) {
      notify('Enter a UTR number before marking this payment Completed.', { icon: 'error', title: 'UTR required' });
      refreshPaymentsSections(); // reset the dropdown back to its actual saved status
      return;
    }
  }
  const payload = { status: value, updated_by: currentProfile.id };
  if (value === 'Completed') payload.completed_on = new Date().toISOString();
  const { error } = await sb.from('rewire_payments').update(payload).eq('id', id);
  if (error) { notify('Error updating status: ' + error.message, { icon: 'error' }); return; }
  if (value === 'Completed') notify('Payment marked Completed and moved to Archive.');
  refreshPaymentsSections(); // Pending<->Hold<->To be Sent for Payment all move the row to a different tab
}
async function updatePaymentUtr(id, value) {
  value = (value || '').trim();
  await sb.from('rewire_payments').update({ utr_no: value, updated_by: currentProfile.id }).eq('id', id);
  // keep whichever local cache has this row in sync so the Status-dropdown UTR check sees it immediately
  const row = paymentsCache.find(p => p.id === id) || paymentsHoldCache.find(p => p.id === id) || pendingUtrCache.find(p => p.id === id);
  if (row) row.utr_no = value;
}
async function completePayment(id) {
  const { data: row } = await sb.from('rewire_payments').select('utr_no').eq('id', id).single();
  if (!row || !row.utr_no) { notify('Enter a UTR number before marking this payment Completed.', { icon: 'error', title: 'UTR required' }); return; }
  const { error } = await sb.from('rewire_payments').update({ status: 'Completed', completed_on: new Date().toISOString(), updated_by: currentProfile.id }).eq('id', id);
  if (error) { notify('Error completing payment: ' + error.message, { icon: 'error' }); return; }
  notify('Payment marked Completed and moved to Archive.');
  refreshPaymentsSections();
}

// Sequential Dummy UTR — "DUM-00001" style, per Payment Module SOP v1.0
// ("prefix DUM- followed by a system-generated sequential number").
// Computed client-side as (highest existing DUM-nnnnn in the Archive) + 1
// rather than via a DB sequence/RPC — this whole app has no precedent
// anywhere of a custom Postgres function (everything else is plain table
// reads/writes via sb.from()), so a sequence+RPC would be genuinely new
// infrastructure I have no way to test from here. This has a narrow
// theoretical race condition if two Rejects somehow land in the exact
// same instant, but Reject is a rare, manual, one-row-or-one-batch-at-a-
// time action in practice, not a high-frequency automated one — an
// acceptable trade-off to stay consistent with how the rest of this app
// is built. Zero-padded to 5 digits, so plain string ordering
// (.order('utr_no', {ascending:false})) already sorts correctly. Existing
// older archive rows using the previous "REJECTED-<LeadNo>-<Type>" format
// are left as-is — only new rejections from now on use this format.
async function getNextDummyUtr() {
  const { data } = await sb.from('rewire_payments_archive')
    .select('utr_no').like('utr_no', 'DUM-%').order('utr_no', { ascending: false }).limit(1);
  let next = 1;
  if (data && data.length && data[0].utr_no) {
    const m = data[0].utr_no.match(/^DUM-(\d+)$/);
    if (m) next = parseInt(m[1], 10) + 1;
  }
  return 'DUM-' + String(next).padStart(5, '0');
}

// HOLD -> Rejected: a real UTR never existed here (nothing was actually
// paid), so a dummy value is auto-filled and the row is marked Rejected.
// Written the exact same way completePayment() marks a row Completed
// (plain status+utr_no update, no explicit archive insert) — trusting the
// same DB-side trigger that already moves Completed rows into
// rewire_payments_archive to do the same for Rejected. If that trigger
// turns out to be keyed specifically to status = 'Completed' only, a
// Rejected row will still be correctly marked here but won't actually
// move to the Archive tab — worth confirming once against the DB (see
// the diagnostic SQL shared alongside this).
async function rejectPayment(id) {
  const row = paymentsHoldCache.find(p => p.id === id);
  const label = row && row.lead ? `${row.lead.lead_no} — ${row.payment_type}` : 'this payment';
  const ok = await confirmDialog(`Reject ${label}? A dummy UTR will be filled in and it will move to Archive.`);
  if (!ok) { refreshPaymentsSections(); return; } // reset the dropdown back to Hold
  const dummyUtr = await getNextDummyUtr();
  const { error } = await sb.from('rewire_payments').update({
    status: 'Rejected', utr_no: dummyUtr, completed_on: new Date().toISOString(), updated_by: currentProfile.id,
  }).eq('id', id);
  if (error) { notify('Error rejecting payment: ' + error.message, { icon: 'error' }); return; }
  notify('Payment marked Rejected and moved to Archive.');
  refreshPaymentsSections();
}

// ------------------------------------------------------------
// REPORTS — CSV export (client-side, no server round-trip needed)
// ------------------------------------------------------------
// textColumns (optional): field names that must round-trip through Excel
// as TEXT, not a number — the CSV file itself already stores these
// correctly as plain quoted strings, but Excel auto-detects any
// numeric-looking quoted value when OPENING a .csv (same as typing it
// into a cell) and silently re-parses it as a floating-point Number.
// Doubles only carry ~15-17 significant digits reliably, so a 16-digit
// bank account number ending in a different last digit than another
// (e.g. ...4650 vs ...4656) can come out LOOKING IDENTICAL once Excel's
// rounded them both — which is exactly what made 2 different partners'
// account numbers appear to match when this file was opened, even though
// the underlying data was never actually duplicated (see batch87/88).
// Fixed the standard way for a value Excel must not reinterpret: wrap it
// as ="value" — Excel evaluates that as a formula whose result is the
// literal text, so it never gets coerced to a number.
function downloadCsv(filename, rows, textColumns) {
  if (!rows || !rows.length) { notify('No data to export.', { icon: 'info' }); return; }
  const headers = Object.keys(rows[0]);
  const escape = (v, forceText) => {
    if (v === null || v === undefined) return '';
    const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
    const quoted = '"' + s.replace(/"/g, '""') + '"';
    return forceText && s !== '' ? '="' + s.replace(/"/g, '""') + '"' : quoted;
  };
  const textSet = new Set(textColumns || []);
  const csv = [headers.join(',')].concat(rows.map(r => headers.map(h => escape(r[h], textSet.has(h))).join(','))).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// Genuine .xlsx export (SheetJS) — used by the Commission date-range
// export. downloadCsv() above stays CSV for the existing Reports tab.
// textColumns (optional): field names that must stay TEXT in the sheet —
// SheetJS's json_to_sheet auto-detects any numeric-looking string as a
// number, which silently strips leading zeros (e.g. "0012345678" becomes
// 12345678) and, for anything past ~15 digits, loses precision/renders in
// scientific notation (a bank account number is exactly this shape). Force
// those columns' cells back to type 's' with a text number format so the
// original digits survive untouched.
// A shared save step — builds the actual Blob and clicks a temporary
// <a download> link, same mechanism downloadCsv() above already uses.
// downloadXlsx/downloadXlsxMulti used to hand off to XLSX.writeFile()
// instead, which picks its own save strategy per-browser (on some setups
// that includes the newer File System Access "Save As" picker) — inside
// the Apps Script web app's sandboxed googleusercontent.com iframe that
// picker call can get intercepted by Google's own permission-dialog
// plumbing (console shows it as a failed request to
// "userCodeAppPanel?createOAuthDialog=true" + a 500), which silently
// aborted the export with nothing shown in the app itself. Building the
// Blob ourselves and clicking a plain download link avoids that path
// entirely, and the try/catch means a failure now at least shows a
// notify() instead of only a console error.
function saveWorkbook(wb, filename) {
  try {
    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    const blob = new Blob([wbout], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  } catch (e) {
    notify('Export failed while saving the file: ' + e.message, { icon: 'error' });
  }
}

function downloadXlsx(filename, rows, sheetName, textColumns) {
  if (!rows || !rows.length) { notify('No data to export.', { icon: 'info' }); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  if (textColumns && textColumns.length) {
    const headers = Object.keys(rows[0]);
    textColumns.forEach(col => {
      const colIdx = headers.indexOf(col);
      if (colIdx === -1) return;
      for (let r = 0; r < rows.length; r++) {
        const cellRef = XLSX.utils.encode_cell({ r: r + 1, c: colIdx }); // +1 skips the header row
        const cell = ws[cellRef];
        if (cell && cell.v !== '' && cell.v !== null && cell.v !== undefined) {
          cell.t = 's';
          cell.v = String(cell.v);
          cell.z = '@';
        }
      }
    });
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Sheet1');
  saveWorkbook(wb, filename);
}

// Multi-sheet .xlsx export — sheets = [{ name: 'Details', rows: [...] }, ...]
function downloadXlsxMulti(filename, sheets) {
  const usable = (sheets || []).filter(s => s.rows && s.rows.length);
  if (!usable.length) { notify('No data to export.', { icon: 'info' }); return; }
  const wb = XLSX.utils.book_new();
  usable.forEach(s => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(s.rows), s.name.slice(0, 31)));
  saveWorkbook(wb, filename);
}

// Shared "Download Excel" helper for a *_COLUMNS definition array
// ({key,label,get}) run against a tab's already-rendered page cache.
// (Ramvir, Oct 2026) — this was called from Logistics/Location Tracking/
// Vehicle Disposal (Pending)/Received at Plant and a number of other tabs'
// Download Excel buttons, but was never actually defined anywhere in the
// app — every one of those buttons was throwing "exportTableColumnsToExcel
// is not defined" in the browser console. Added here as the real fix, next
// to the other shared xlsx helpers, rather than as a one-off per tab.
function exportTableColumnsToExcel(tabKey, rowsCache, columnsDef, filename, sheetName) {
  if (!rowsCache || !rowsCache.length) { notify('No data to export.', { icon: 'info' }); return; }
  // "Download Excel exports what's on screen" (Ramvir, Oct 2026): rows are
  // already narrowed by the date range at render time; here we also drop rows
  // hidden by the column-header filters / search box. Rows map 1:1 to the
  // table's data <tr>s, so we only apply this when the counts match.
  const tbl = document.querySelector('table.crm-table[data-filter-prefix="' + tabKey + '"]');
  if (tbl && tbl.tBodies[0]) {
    const trs = Array.from(tbl.tBodies[0].children).filter(r => r.tagName === 'TR' && !r.querySelector('td[colspan]'));
    if (trs.length === rowsCache.length) {
      rowsCache = rowsCache.filter((_, i) => trs[i].dataset.twColFiltered !== '1' && trs[i].dataset.twFiltered !== '1');
      if (!rowsCache.length) { notify('No rows match the current filters.', { icon: 'info' }); return; }
    }
  }
  const rows = rowsCache.map(r => {
    const obj = {};
    columnsDef.forEach(c => { obj[c.label] = c.get(r); });
    return obj;
  });
  downloadXlsxMulti(filename, [{ name: sheetName, rows }]);
}

async function generateCommissionExcel() {
  const from = document.getElementById('commissionFromDate').value;
  const to = document.getElementById('commissionToDate').value;
  if (!from || !to) { notify('Please select both From and To dates.', { icon: 'error', title: 'Missing dates' }); return; }

  // Paginated — a busy date range could plausibly exceed 1000 pending
  // commission rows, which would otherwise silently under-export AND
  // under-mark-as-Paid with no error (same class of bug fixed everywhere
  // else this session).
  const data = await fetchAllRows((rangeFrom, rangeTo) => sb.from('rewire_commission')
    .select(`*, lead:rewire_master_data!rewire_commission_lead_id_fkey(${COMM_XL_SELECT})`)
    .eq('status', 'Pending')
    .gte('created_at', istDayStart(from))
    .lte('created_at', istDayEnd(to))
    .range(rangeFrom, rangeTo))
    .catch(err => { notify('Export failed: ' + err.message, { icon: 'error' }); return null; });
  if (data === null) return;

  // Leads with a commission but NO payee entered (no rewire_commission row)
  // are listed on screen as "No Payee" — include them in the Excel too, with
  // a blank Person Name (Ramvir, Oct 2026: they were silently left out).
  // They have no commission row, so a Paid row is inserted for them after
  // the download (see below).
  const haveRowIds = new Set((await fetchAllRows((rf, rt) => sb.from('rewire_commission').select('lead_id').range(rf, rt)).catch(() => [])).map(r => r.lead_id));
  const noPayeeAll = await fetchAllRows((rf, rt) => sb.from('rewire_master_data')
    .select(COMM_XL_SELECT)
    .gt('pn_cash_commission', 0).neq('overall_status', 'Closed Lost').range(rf, rt)).catch(() => []);
  const noPayee = (noPayeeAll || []).filter(l => {
    if (haveRowIds.has(l.id)) return false;
    const d = (l.pn_filled_on || l.created_at || '').slice(0, 10);
    return d && d >= from && d <= to;
  });

  if ((!data || !data.length) && !noPayee.length) {
    notify('No pending commission records in this date range (already exported, or none exist).', { icon: 'info' });
    return;
  }

  const rows = (data || []).map(c => commExcelRow(c, c.lead)).concat(noPayee.map(l => commExcelRow(null, l)));
  downloadXlsx(`commission-${from}-to-${to}.xlsx`, rows, 'Commission');

  // Lock these exact records — flip to Paid so this range can't be
  // exported (as pending) a second time.
  const ids = (data || []).map(c => c.id);
  const paidOn = new Date().toISOString();
  if (ids.length) {
    const { error: updErr } = await sb.from('rewire_commission').update({
      status: 'Paid', paid_by: currentProfile.id, paid_on: paidOn,
    }).in('id', ids);
    if (updErr) { notify('Excel generated, but marking records as Paid failed: ' + updErr.message, { icon: 'error' }); return; }
  }
  // No-payee leads also move to Paid (Ramvir, Oct 2026): they have no
  // commission row, so insert one already marked Paid (blank person name,
  // amount = the lead's PN cash commission) — this is what takes them off
  // the Pending list and puts them in View Paid.
  if (noPayee.length) {
    const newRows = noPayee.map(l => ({
      lead_id: l.id, person_name: '', amount: l.pn_cash_commission, status: 'Paid',
      created_by: currentProfile.id, paid_by: currentProfile.id, paid_on: paidOn,
    }));
    for (let i = 0; i < newRows.length; i += 200) {
      const { error: insErr } = await sb.from('rewire_commission').insert(newRows.slice(i, i + 200));
      if (insErr) { notify('Excel generated, but moving no-payee leads to Paid failed: ' + insErr.message, { icon: 'error' }); return; }
    }
  }

  notify('Excel generated and ' + (ids.length + noPayee.length) + ' commission record(s) moved to Paid.');
  await renderCommissionSection();
}

// Guards every Reports tab Download button against double-click (which
// previously could fire the same export twice in parallel — harmless for
// a read-only export, but confusing: two file-save prompts / two
// downloads with no indication anything was happening in between).
// Disables the button and swaps its label to "Downloading..." for the
// duration of the export, restoring it in a finally so a thrown error
// still leaves the button clickable again instead of stuck disabled.
async function runReportExport(btn, fn) {
  if (!btn || btn.disabled) return;
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = 'Downloading...';
  try {
    await fn();
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

// Supabase's .in() puts every id straight into the URL querystring — with
// 2,000+ leads that would blow past a normal URL length limit. Chunking
// avoids that (same reasoning as this project's other chunked imports).
async function fetchInChunks(table, selectCols, idCol, ids, chunkSize = 150) {
  const out = [];
  for (let i = 0; i < ids.length; i += chunkSize) {
    const chunk = ids.slice(i, i + chunkSize);
    if (!chunk.length) continue;
    const { data, error } = await sb.from(table).select(selectCols).in(idCol, chunk);
    if (error) throw error;
    out.push(...(data || []));
  }
  return out;
}
async function resolveReportRows(rows) {
  if (!rows || !rows.length) return rows;
  const [{ data: users, error: usersErr }, { data: partners, error: partnersErr }] = await Promise.all([
    sb.from('rewire_user_profiles').select('id, name'),
    sb.from('rewire_partners').select('id, partner_name'),
  ]);
  if (usersErr) console.error(usersErr);
  if (partnersErr) console.error(partnersErr);
  const userMap = {}; (users || []).forEach(u => userMap[u.id] = u.name);
  const partnerMap = {}; (partners || []).forEach(p => partnerMap[p.id] = p.partner_name);

  const leadIds = rows.map(r => r.id).filter(Boolean);
  let payMap = {};
  try {
    const [liveP, archP] = await Promise.all([
      fetchInChunks('rewire_payments', 'lead_id, payment_type, status', 'lead_id', leadIds),
      fetchInChunks('rewire_payments_archive', 'lead_id, payment_type, status', 'lead_id', leadIds),
    ]);
    // Archive rows are the final state — applied second so they win over
    // any stale live row a lead might still (incorrectly) also have.
    [...liveP, ...archP].forEach(p => {
      payMap[p.lead_id] = payMap[p.lead_id] || {};
      payMap[p.lead_id][p.payment_type] = p.status;
    });
  } catch (e) { console.error('Payment status lookup failed: ', e); }

  return rows.map(r => {
    const out = { ...r };
    REPORT_USER_ID_COLS.forEach(col => {
      if (col in out) out[col] = out[col] ? (userMap[out[col]] || out[col]) : '';
    });
    if ('partner_id' in out) out.partner_id = out.partner_id ? (partnerMap[out.partner_id] || out.partner_id) : '';
    // Distinguishes "genuinely pending" from "no payment was ever due" —
    // Ramvir flagged that "Customer: Pending" alone was ambiguous (does it
    // mean overdue, or does this lead just not have a customer payment at
    // all?). pn_customer_payment/pn_broker_payment (>0 = a payment of that
    // type is actually due, same signal the Payments tab itself uses to
    // decide whether a payment row should exist — see the gap-detection
    // logic in scanMissingPayments()/getPaymentBankDetails() above) now
    // gate an explicit "N/A" instead of silently omitting the type, and
    // the amount is shown alongside the status so scale is clear too.
    const pay = payMap[r.id] || {};
    const paymentStatusPart = (label, dueAmount, status) => {
      const due = Number(dueAmount) || 0;
      if (due <= 0) return `${label}: N/A`;
      if (!status) return `${label}: Not Yet Initiated (₹${due})`;
      return `${label}: ${status} (₹${due})`;
    };
    out['Payment Status'] = [
      paymentStatusPart('Customer', r.pn_customer_payment, pay['Customer']),
      paymentStatusPart('Broker', r.pn_broker_payment, pay['Broker']),
    ].join(' | ');
    out['Vehicle Park Location'] = r.ud_vehicle_parking || '';
    return out;
  });
}

// Match/Shortage/Excess), plus the deduction amount actually applied,

// Check/Head Approval already show on screen.
// ------------------------------------------------------------
async function exportAccessoriesRegisterReport() {
  const leads = await fetchAllRows((from, to) => applyReportDateFilter(
    sb.from('rewire_master_data')
      .select(`id, lead_no, customer_name, val_vehicle_type, val_vehicle_number, val_make, val_model_variant,

        val_speakers, ud_speakers, ud_speakers_photo_url,
        val_tool_kit, ud_tool_kit, ud_tool_kit_photo_url,
        val_battery, ud_battery, ud_battery_photo_url,
        val_alloy_wheel, ud_alloy_wheel, ud_alloy_wheel_photo_url,
        val_fuel_type, ud_cylinder_type, ud_cylinder_photo_url,
        val_vehicle_operational, ud_vehicle_operational, val_vehicle_accidental, ud_vehicle_accidental,
        accessories_check_status, accessories_check_on, accessories_deduction_amount, accessories_deduction_reason`)
      .eq('ud_status', 'Complete'), 'accessories_check_on'
  ).range(from, to)).catch(e => { notify('Export failed: ' + e.message, { icon: 'error' }); return null; });
  if (leads === null) return;
  if (!leads.length) { notify('No delivered vehicles to export.', { icon: 'info' }); return; }

  // Accessories are checked at 2 separate stages — this Manager-Approval-
  // stage check (accessories_check_status, compared above via
  // computeAccessoryComparisons) AND a second, independent check when the
  // vehicle physically arrives at the plant (rewire_vehicle_receipt's
  // plant_* columns, filled via openPlantAccessoriesCheck/
  // PLANT_ACCESSORY_ITEMS — JS-Operations.html). This report previously
  // only reflected the first — added the Received at Plant half so a
  // single "Item" row shows both stages' findings side by side, not just
  // Valuation vs Delivery. Paginating the whole receipts table (not
  // .in('lead_id', leadIds)) for the same "URL too long" reason already
  // documented on renderReceivedPlantSection.
  const receipts = await fetchAllRows((from, to) => sb.from('rewire_vehicle_receipt').select('*').range(from, to))
    .catch(err => { console.error(err); return []; });
  const receiptByLead = {};
  (receipts || []).forEach(r => { receiptByLead[r.lead_id] = r; });
  const plantKeyByLabel = {};
  PLANT_ACCESSORY_ITEMS.forEach(([label, , , plantKey]) => { plantKeyByLabel[label] = plantKey; });

  const details = [];
  leads.forEach(l => {
    const receipt = receiptByLead[l.id];
    const rows = computeAccessoryComparisons(l);
    rows.forEach(r => {
      const plantKey = plantKeyByLabel[r.label];
      const plantVal = plantKey && receipt ? receipt[plantKey] : null;
      details.push({
        'Lead No.': l.lead_no, 'Customer': l.customer_name, 'Vehicle No.': l.val_vehicle_number,
        'Make': l.val_make, 'Model': l.val_model_variant, 'Item': r.label,
        'At Valuation': r.valVal || '—', 'At Delivery': r.udVal || '—', 'Result': r.kind,
        'Accessories Check Status': l.accessories_check_status || 'Pending',
        'Checked On': l.accessories_check_on || '', 'Debit Amount': l.accessories_deduction_amount || 0,
        'Debit Reason': l.accessories_deduction_reason || '',
        'At Plant': plantVal || (plantKey ? 'Pending' : '—'),
        'Received at Plant Status': receipt && receipt.accessories_filled_on ? 'Done' : 'Pending',
        'Plant Checked On': (receipt && receipt.accessories_filled_on) || '',
        'Plant Debit Amount': (receipt && receipt.plant_debit_amount) || 0,
        'Plant Debit Reason': (receipt && receipt.plant_debit_reason) || '',
      });
    });
  });
  const summary = leads.map(l => {
    const mismatches = computeAccessoryComparisons(l).filter(r => r.kind !== 'match');
    const receipt = receiptByLead[l.id];
    return {
      'Lead No.': l.lead_no, 'Vehicle No.': l.val_vehicle_number,
      'Mismatches': mismatches.length, 'Shortages': mismatches.filter(m => m.kind === 'shortage').length,
      'Excess': mismatches.filter(m => m.kind === 'excess').length,
      'Debit Amount': l.accessories_deduction_amount || 0, 'Status': l.accessories_check_status || 'Pending',
      'Received at Plant Status': receipt && receipt.accessories_filled_on ? 'Done' : 'Pending',
      'Plant Debit Amount': (receipt && receipt.plant_debit_amount) || 0,
    };
  });

  downloadXlsxMulti('rewire-dms-accessories-register.xlsx', [{ name: 'Summary by Lead', rows: summary }, { name: 'Details (All Items)', rows: details }]);
}
