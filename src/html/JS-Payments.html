// DEBIT REGISTER (Ramvir, Sept 2026) — read-only summary of every debit
// entered at the Accessories Check stage and, separately, at Received at
// Plant. Own sidebar item ('debit-register' gate) with 2 sub-tabs, kept
// deliberately independent of the Reports section and of the 'accessories'/
// 'pipeline-accessories' gates that control the operational forms — see
// showDebitRegisterTab()/routeToDebitRegister() (JS-Wiring.html). Both
// tabs only list rows where a debit was actually entered (> 0), not every
// lead — this is an audit list, not a general register. View-only: nothing
// here writes anywhere, debits are still only ever entered from the real
// Accessories Check / Received at Plant forms.
//
// Scoping (Ramvir's explicit instruction): PE sees only their own leads,
// Manager sees only their own team, Admin/Head/other privileged roles see
// everything. rewire_master_data's RLS already restricts PE's SELECT to
// pe_id = self automatically, so no extra filter is needed for PE there —
// but RLS lets EVERY Manager see EVERY row org-wide (see master_select
// policy), so Manager needs an explicit .eq('manager_id', ...) filter here,
// same pattern already used for Dashboard's managerFilter. For the plant
// tab, rewire_vehicle_receipt has its own new PE-scoped read-only RLS
// policy (vehicle_receipt_pe_select_own, added alongside this feature)
// since PE previously had zero access to that table at all; Manager again
// needs the explicit filter since that table's RLS doesn't scope Manager
// by team either.
function debitRegisterScope() {
  const isPE = currentProfile && currentProfile.role === 'PE';
  const isManager = currentProfile && currentProfile.role === 'Manager';
  return { isPE, isManager, managerId: isManager ? currentProfile.id : null };
}

// Small shared helper — fetches just the id/name we need for a set of
// "who did this" user IDs, rather than pulling the whole rewire_user_profiles
// table. Works for any role (Admin/Back Office/etc. can perform these
// checks too, not just PE/Manager), unlike reusing allPEs/allManagers which
// only cover those 2 roles.
async function lookupProfileNames(ids) {
  const uniqueIds = Array.from(new Set((ids || []).filter(Boolean)));
  if (!uniqueIds.length) return {};
  const { data } = await sb.from('rewire_user_profiles').select('id, name').in('id', uniqueIds);
  const byId = {};
  (data || []).forEach(p => { byId[p.id] = p.name; });
  return byId;
}

const fmtInr = (v) => v ? Number(v).toLocaleString('en-IN') : '0';
const fmtDrDate = (v) => v ? new Date(v).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';

// Debit Reason enrichment (Ramvir, Sept 2026 request) — the reason text is
// free-typed at Accessories Check / Received at Plant time and, when the
// deduction comes out of the broker's share, starts with "Broker Payment: …"
// without naming which broker. Slots the actual broker name in right after
// the label: "Broker Payment (Suresh Traders): -₹1000 — …". Broker name
// comes from lead.pn_partner_name (the broker actually picked at Price
// Negotiation — same field resendInstantPaymentEmail() etc. already use).
// Customer Payment is deliberately left untouched (Ramvir, Sept 2026
// follow-up correction) — the Customer column right next to Lead No. in
// this same table already shows the customer's name, so repeating it
// inside the reason text is redundant.
function enrichDebitReason(reason, customerName, brokerName) {
  if (!reason) return reason;
  let out = reason;
  if (brokerName) out = out.replace(/Broker Payment/i, `Broker Payment (${brokerName})`);
  return out;
}

// Delivery-vs-Plant comparison (Ramvir, Sept 2026 request) — a DIFFERENT
// stage pair than computeAccessoryComparisons() (which is Valuation-vs-
// Delivery): the Received at Plant debit is decided by whether an item
// that was present at Delivery/Upload actually arrived at the plant, not
// by the earlier Valuation-vs-Delivery check. Mirrors PLANT_ACCESSORY_ITEMS'
// per-item value semantics (yesno/count/count15) exactly as
// openPlantAccessoriesCheck() interprets them, so "Shortage" here always
// matches what that live form would show.
function computePlantVsDeliveryComparisons(lead, receipt) {
  return PLANT_ACCESSORY_ITEMS.map(([label, valKey, udKey, plantKey, optType]) => {
    const udVal = lead[udKey], plantVal = receipt ? receipt[plantKey] : null;
    let udHas, plantHas;
    if (optType === 'count' || optType === 'count15') {
      const udCount = parseInt(udVal, 10), plantCount = parseInt(plantVal, 10);
      udHas = !isNaN(udCount) && udCount > 0;
      plantHas = !isNaN(plantCount) && plantCount > 0;
    } else if (label === 'Cylinder Type') {
      // ud_cylinder_type stores CNG/LPG (see computeAccessoryComparisons);
      // plant_cylinder_type is a plain Yes/No field (its PLANT_ACCESSORY_ITEMS
      // optType is 'yesno', so openPlantAccessoriesCheck renders a Yes/No
      // dropdown for it, not a CNG/LPG one) — the two sides use different
      // value vocabularies on purpose, so they need separate "has" checks.
      udHas = udVal === 'CNG' || udVal === 'LPG';
      plantHas = plantVal === 'Yes';
    } else if (label === 'Vehicle Accidental') {
      // Same inversion as computeAccessoryComparisons — "No" (not
      // accidental) is the good state on both sides.
      udHas = udVal === 'No';
      plantHas = plantVal === 'No';
    } else {
      udHas = udVal === 'Yes';
      plantHas = plantVal === 'Yes';
    }
    let kind = 'match';
    if (udHas && !plantHas) kind = 'shortage';
    else if (!udHas && plantHas) kind = 'excess';
    return { label, valVal: lead[valKey], udVal, plantVal, kind };
  });
}

// ------------------------------------------------------------
// CVS vs COD REPORT — raw entries plus a comparison summary (CVS vs
// COD counts, and pending vs completed within each). Was "COD vs CVS
// Report" — renamed and column/type order swapped (CVS first, then COD)
// per Ramvir's request (Sept 2026). Replaces the old plain "COD / CVS"
// report card — that CSV export is now removed since this one already
// covers the same data plus a summary breakdown.
// ------------------------------------------------------------
async function exportCvsVsCodReport() {
  const data = await fetchAllRows((from, to) => applyReportDateFilter(
    sb.from('rewire_cod_cvs').select('*'), 'filled_on'
  ).range(from, to)).catch(e => { notify('Export failed: ' + e.message, { icon: 'error' }); return null; });
  if (data === null) return;
  if (!data.length) { notify('No COD/CVS data to export.', { icon: 'info' }); return; }

  // "Mon-YY" label, same style cvsVsCodFyBuckets() uses for its bucket
  // labels — kept as its own column (not just the raw date) so the sheet
  // can be grouped/filtered by month directly in Excel (Ramvir, Sept 2026).
  const monthLabel = (dateStr) => {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d)) return '';
    return d.toLocaleString('en', { month: 'short' }) + '-' + String(d.getFullYear()).slice(-2);
  };

  const details = data.map(r => ({
    'Registration No.': r.registration_number, 'Type': r.upload_type, 'CVS/COD Date': r.cod_cvs_date,
    'Month': monthLabel(r.cod_cvs_date),
    'CVS Number': r.cvs_number, 'COD Number': r.cod_number,
    // uploaded_in_dms_rewire holds the actual DMS/Rewire reference number
    // (text), not a boolean — show the real value, not a Yes/No coercion.
    'DMS Rewire No.': r.uploaded_in_dms_rewire || 'Pending', 'Filled On': r.filled_on,
  }));
  const types = ['CVS', 'COD'];
  const summary = types.map(type => {
    const rows = data.filter(r => r.upload_type === type);
    return {
      'Type': type, 'Total': rows.length,
      'Completed (Uploaded in DMS)': rows.filter(r => r.uploaded_in_dms_rewire).length,
      'Pending': rows.filter(r => !r.uploaded_in_dms_rewire).length,
    };
  });

  // "COD vs CVS Gap" sheet (Ramvir, Sept 2026) — one row per vehicle
  // (registration_number), showing COD No. / CVS No. / DMS Rewire No.
  // side by side so a missing CVS-for-a-COD (or vice versa) is visible
  // at a glance, instead of having to cross-reference two separate rows
  // in the Details sheet. rewire_cod_cvs isn't linked by lead_id — only
  // by registration_number/val_vehicle_number (same join already used by
  // exportCodVsPurchasedReport/exportCodPendingReport below) — so the
  // DMS Rewire No. (lead_no) is looked up from rewire_master_data here.
  const byReg = {};
  data.forEach(r => {
    const reg = (r.registration_number || '').trim().toUpperCase();
    if (!reg) return;
    byReg[reg] = byReg[reg] || { cod: null, cvs: null };
    if (r.upload_type === 'COD') byReg[reg].cod = r;
    else if (r.upload_type === 'CVS') byReg[reg].cvs = r;
  });
  const allRegNos = Object.keys(byReg);
  const leadByReg = {};
  const gapChunkSize = 150;
  for (let i = 0; i < allRegNos.length; i += gapChunkSize) {
    const chunk = allRegNos.slice(i, i + gapChunkSize);
    const { data: leadRows, error: leadErr } = await sb.from('rewire_master_data')
      .select('lead_no, val_vehicle_number').in('val_vehicle_number', chunk);
    if (leadErr) { console.error(leadErr); continue; }
    (leadRows || []).forEach(l => { leadByReg[(l.val_vehicle_number || '').trim().toUpperCase()] = l.lead_no; });
  }
  const gapReport = allRegNos.map(reg => {
    const { cod, cvs } = byReg[reg];
    let gap = 'OK';
    if (cod && !cvs) gap = 'CVS Missing';
    else if (!cod && cvs) gap = 'COD Missing';
    // Month = whichever date is actually present (COD's own date takes
    // priority since a "CVS Missing" row only has a COD date anyway).
    const dateForMonth = (cod && cod.cod_cvs_date) || (cvs && cvs.cod_cvs_date) || null;
    return {
      'Vehicle No.': reg,
      'DMS Rewire No.': leadByReg[reg] || 'Not Found in DMS',
      'COD No.': cod ? (cod.cod_number || '') : '',
      'COD Date': cod ? (cod.cod_cvs_date || '') : '',
      'CVS No.': cvs ? (cvs.cvs_number || '') : '',
      'CVS Date': cvs ? (cvs.cod_cvs_date || '') : '',
      'Month': monthLabel(dateForMonth),
      'Gap': gap,
    };
  }).sort((a, b) => (a['Gap'] === 'OK' ? 1 : 0) - (b['Gap'] === 'OK' ? 1 : 0) || a['Vehicle No.'].localeCompare(b['Vehicle No.']));
  const gapMissingCount = gapReport.filter(r => r['Gap'] !== 'OK').length;
  gapReport.push({
    'Vehicle No.': '', 'DMS Rewire No.': '', 'COD No.': '', 'COD Date': '', 'CVS No.': '', 'CVS Date': '', 'Month': '',
    'Gap': `Total: ${gapReport.length} vehicles | ${gapMissingCount} with a gap`,
  });

  // Month-wise sheet (Ramvir, Sept 2026) — same FY (Apr-Mar) bucketing as
  // the on-screen "CVS vs COD — Monthly Summary" widget (Dashboard +
  // Reports tab, cvsVsCodFyBuckets() above), so the Excel export and the
  // live widget always agree. Uses THIS export's own already-fetched
  // `data` (respects the From/To date filter) rather than re-fetching via
  // loadCvsVsCodRows(), which deliberately ignores that filter for the
  // always-current live widget.
  const monthlyBuckets = cvsVsCodFyBuckets();
  const inBucket = (d, b) => (b.start === null || d >= b.start) && d < b.end;
  // Ramvir, Sept 2026 (2nd pass) — CoDs/CvS/GAP are all now anchored to the
  // COD's own month using the same "byReg" match built above for the
  // "COD vs CVS Gap" sheet: CoDs = COD rows dated in this bucket, CvS = how
  // many of THOSE have a matching CVS (so CvS can never exceed CoDs), GAP =
  // the rest. The old version tallied CoDs and CvS independently by each
  // row's own date, which let a month show more CVS than CODs (e.g.
  // Apr-26: 327 CODs vs 570 CVS) — see identical fix in
  // renderCvsVsCodMonthlySummary() (this file) for the full reasoning.
  const hasMatchingCvsM = (r) => {
    const reg = (r.registration_number || '').trim().toUpperCase();
    const entry = byReg[reg];
    return !!(entry && entry.cvs);
  };
  let grandCodM = 0, grandCvsM = 0, grandGapM = 0;
  const monthlySummary = monthlyBuckets.map(b => {
    const codRowsInBucketM = data.filter(r => r.upload_type === 'COD' && r.cod_cvs_date && inBucket(new Date(r.cod_cvs_date), b));
    const codCount = codRowsInBucketM.length;
    const cvsCount = codRowsInBucketM.filter(hasMatchingCvsM).length;
    const gap = codCount - cvsCount;
    grandCodM += codCount; grandCvsM += cvsCount; grandGapM += gap;
    return { 'Month': b.label, 'CoDs': codCount, 'CvS': cvsCount, 'GAP': gap };
  });
  monthlySummary.push({ 'Month': 'Total', 'CoDs': grandCodM, 'CvS': grandCvsM, 'GAP': grandGapM });

  downloadXlsxMulti('rewire-dms-cvs-vs-cod-report.xlsx', [
    { name: 'COD vs CVS Gap', rows: gapReport },
    { name: 'Monthly Summary', rows: monthlySummary },
    { name: 'Summary (CVS vs COD)', rows: summary },
    { name: 'Details', rows: details },
  ]);
}

// ------------------------------------------------------------
// CVS vs COD — MONTHLY SUMMARY (on-screen widget, Dashboard + Reports
// tab). Ramvir wanted this as a live table matching his own monthly
// tracker sheet (Sept 2026): Month / CoDs / CvS / GAP, bucketed by
// India's financial year (April-March) with an "Older than April
// {FY start}" row at the top and a Total row at the bottom, numbers
// clickable to a detail popup, plus a Copy button (same pattern as
// copyTableById()/renderLocationWiseSummary() in JS-Dashboard.html).
// Bucketed by rewire_cod_cvs.cod_cvs_date (the actual COD/CVS date,
// not filled_on — same field the "Details" sheet in the Excel export
// above calls "CVS/COD Date"). Both COD and CVS rows always have this
// set (verified — 0 nulls), so nothing is silently dropped.
//
// Called from two places (renderDashboard() in JS-Dashboard.html, and
// showSection('reports') below) into two different container ids —
// the underlying data/buckets are identical, only the DOM target
// differs, so one function serves both rather than duplicating it.
// ------------------------------------------------------------
let _cvsVsCodRows = [];

function cvsVsCodFyBuckets() {
  const now = new Date();
  // India's FY runs Apr-Mar. If today is Jan-Mar, we're still in the FY
  // that started last April.
  const fyStartYear = (now.getMonth() + 1) >= 4 ? now.getFullYear() : now.getFullYear() - 1;
  const buckets = [{
    key: 'older', label: `Older than April ${fyStartYear}`, start: null, end: new Date(fyStartYear, 3, 1),
  }];
  for (let i = 0; i < 12; i++) {
    const start = new Date(fyStartYear, 3 + i, 1);
    const end = new Date(fyStartYear, 3 + i + 1, 1);
    buckets.push({
      key: `${start.getFullYear()}-${start.getMonth() + 1}`,
      label: start.toLocaleString('en', { month: 'short' }) + '-' + String(start.getFullYear()).slice(-2),
      start, end,
    });
  }
  return buckets;
}

async function loadCvsVsCodRows() {
  const data = await fetchAllRows((from, to) => sb.from('rewire_cod_cvs')
    .select('registration_number, upload_type, cod_cvs_date, cod_number, cvs_number, uploaded_in_dms_rewire')
    .in('upload_type', ['COD', 'CVS'])
    .range(from, to))
    .catch(e => { console.error(e); return []; });
  _cvsVsCodRows = data || [];
  return _cvsVsCodRows;
}

async function renderCvsVsCodMonthlySummary(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const tableId = containerId + 'Tbl';
  const rows = await loadCvsVsCodRows();
  const buckets = cvsVsCodFyBuckets();
  const inBucket = (d, b) => (b.start === null || d >= b.start) && d < b.end;

  // Ramvir, Sept 2026 fix (2nd pass) — the first fix only corrected GAP,
  // but left CODS/CVS as two independent monthly tallies (every COD dated
  // this month vs every CVS dated this month, regardless of whose COD
  // they belong to). That's how a month could show CVS > CODs (e.g. Apr-26:
  // 327 CODs but 570 CVS) — a CVS is routinely filed weeks/months after its
  // COD, so a lot of April's CVS work was actually clearing OLDER months'
  // CODs, not April's own. Since "how many vehicles bought this month
  // already have their CVS" is what CODS/CVS/GAP are actually meant to
  // answer, every column is now anchored to the COD's own month:
  //   CODS = vehicles whose COD is dated in this month
  //   CVS  = of THOSE SAME vehicles, how many already have a CVS (whenever
  //          it was filed — could be next month, doesn't matter)
  //   GAP  = CODS - CVS (still can't go negative, since CVS here is a
  //          subset of CODS by construction, not a second independent count)
  // A CVS with no COD at all (the rare "COD Missing" anomaly) has no COD
  // month to belong to, so it doesn't appear in this cohort view — it's
  // still fully covered by the Excel export's "COD vs CVS Gap" sheet.
  const byReg = {};
  rows.forEach(r => {
    const reg = (r.registration_number || '').trim().toUpperCase();
    if (!reg) return;
    byReg[reg] = byReg[reg] || { cod: null, cvs: null };
    if (r.upload_type === 'COD') byReg[reg].cod = r;
    else if (r.upload_type === 'CVS') byReg[reg].cvs = r;
  });
  const hasMatchingCvs = (r) => {
    const reg = (r.registration_number || '').trim().toUpperCase();
    const entry = byReg[reg];
    return !!(entry && entry.cvs);
  };

  let grandCod = 0, grandCvs = 0, grandGap = 0;
  const bodyRows = buckets.map(b => {
    const codRowsInBucket = rows.filter(r => r.upload_type === 'COD' && inBucket(new Date(r.cod_cvs_date), b));
    const codCount = codRowsInBucket.length;
    const cvsCount = codRowsInBucket.filter(hasMatchingCvs).length;
    const gap = codCount - cvsCount;
    grandCod += codCount; grandCvs += cvsCount; grandGap += gap;
    // Gridlines added (Ramvir, Sept 2026) — border on every cell, matching
    // the app's other data tables, instead of just a border-top on rows.
    const gridBorder = 'border:1px solid var(--color-border-tertiary);';
    const cell = (n, type) => n > 0
      ? `<td style="text-align:center;padding:7px 10px;cursor:pointer;color:#1d4ed8;font-weight:700;${gridBorder}" onclick="openCvsVsCodDetail('${b.key}','${type}')">${n}</td>`
      : `<td style="text-align:center;padding:7px 10px;color:#cbd5e1;${gridBorder}">0</td>`;
    // GAP cell is clickable too (Ramvir, Sept 2026) whenever there's
    // anything to show, even if the raw count happens to be 0 (equal
    // CoD/CVS counts don't guarantee every individual vehicle matched).
    const gapCell = `<td style="text-align:center;padding:7px 10px;cursor:pointer;font-weight:700;${gridBorder}${gap > 0 ? 'color:#dc2626;' : ''}" onclick="openCvsVsCodDetail('${b.key}','GAP')">${gap}</td>`;
    return `<tr>
      <td style="padding:7px 10px;font-weight:500;${gridBorder}">${b.label}</td>
      ${cell(codCount, 'COD')}
      ${cell(cvsCount, 'CVS')}
      ${gapCell}
    </tr>`;
  }).join('');

  const gb = 'border:1px solid var(--color-border-tertiary);';
  const totalRow = `<tr style="background:#1d4ed8;color:#fff;font-weight:700;">
    <td style="padding:8px 10px;${gb}">Total</td>
    <td style="text-align:center;padding:8px 10px;${gb}">${grandCod}</td>
    <td style="text-align:center;padding:8px 10px;${gb}">${grandCvs}</td>
    <td style="text-align:center;padding:8px 10px;${gb}">${grandGap}</td>
  </tr>`;

  container.innerHTML = `<table id="${tableId}" style="width:100%;border-collapse:collapse;font-size:12px;">
    <thead><tr style="background:#1d4ed8;color:#fff;">
      <th style="padding:8px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;${gb}">Month</th>
      <th style="padding:8px 10px;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.04em;${gb}">CoDs</th>
      <th style="padding:8px 10px;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.04em;${gb}">CvS</th>
      <th style="padding:8px 10px;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.04em;${gb}">GAP</th>
    </tr></thead>
    <tbody>${bodyRows}${totalRow}</tbody>
  </table>`;
}

function openCvsVsCodDetail(bucketKey, type) {
  const b = cvsVsCodFyBuckets().find(x => x.key === bucketKey);
  if (!b) return;
  const inBucket = (d) => (b.start === null || d >= b.start) && d < b.end;
  const head4 = document.getElementById('cvsVsCodDetailHead4');

  // Ramvir, Sept 2026 (2nd pass) — every click-through here is now anchored
  // to the SAME COD-cohort logic as the summary table itself (CODS = COD
  // rows dated in this bucket; CVS/GAP are both derived from THAT set, not
  // independently re-filtered by their own date) — otherwise the popups
  // would show different vehicles than what the on-screen numbers actually
  // count, the exact confusion this whole redesign was meant to fix.
  const byReg = {};
  _cvsVsCodRows.forEach(r => {
    const reg = (r.registration_number || '').trim().toUpperCase();
    if (!reg) return;
    byReg[reg] = byReg[reg] || { cod: null, cvs: null };
    if (r.upload_type === 'COD') byReg[reg].cod = r;
    else if (r.upload_type === 'CVS') byReg[reg].cvs = r;
  });
  const codRowsInBucket = _cvsVsCodRows.filter(r => r.upload_type === 'COD' && inBucket(new Date(r.cod_cvs_date)));

  if (type === 'GAP') {
    const gapRows = codRowsInBucket.filter(r => {
      const reg = (r.registration_number || '').trim().toUpperCase();
      return !(byReg[reg] && byReg[reg].cvs);
    });
    if (head4) head4.textContent = 'Gap';
    document.getElementById('cvsVsCodDetailTitle').textContent = `Gap — ${b.label} (${gapRows.length})`;
    document.getElementById('cvsVsCodDetailBody').innerHTML = gapRows.length ? gapRows.map(r => `<tr>
      <td>${r.registration_number}</td>
      <td>${r.cod_number || '—'}</td>
      <td>${r.cod_cvs_date}</td>
      <td style="color:#dc2626;font-weight:600;">CVS Missing</td>
    </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--color-text-tertiary);padding:16px;">No gap — every COD from this month already has a CVS.</td></tr>';
    openModal('cvsVsCodDetailModal');
    return;
  }

  if (type === 'CVS') {
    // The CVS column is now "of this month's CODs, how many have a CVS" —
    // so its detail popup shows those matched CVS rows (not CVS entries
    // that merely happen to be DATED in this bucket, which could belong to
    // a completely different month's COD cohort).
    const matched = codRowsInBucket
      .map(r => ({ reg: (r.registration_number || '').trim().toUpperCase(), codRow: r }))
      .filter(({ reg }) => byReg[reg] && byReg[reg].cvs)
      .map(({ reg }) => byReg[reg].cvs);
    if (head4) head4.textContent = 'DMS/Rewire No.';
    document.getElementById('cvsVsCodDetailTitle').textContent = `CVS — ${b.label} (${matched.length})`;
    document.getElementById('cvsVsCodDetailBody').innerHTML = matched.length ? matched.map(r => `<tr>
      <td>${r.registration_number}</td>
      <td>${r.cvs_number || '—'}</td>
      <td>${r.cod_cvs_date}</td>
      <td>${r.uploaded_in_dms_rewire || 'Pending'}</td>
    </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--color-text-tertiary);padding:16px;">No entries.</td></tr>';
    openModal('cvsVsCodDetailModal');
    return;
  }

  // type === 'COD' — unchanged: every COD dated in this bucket.
  if (head4) head4.textContent = 'DMS/Rewire No.';
  document.getElementById('cvsVsCodDetailTitle').textContent = `COD — ${b.label} (${codRowsInBucket.length})`;
  document.getElementById('cvsVsCodDetailBody').innerHTML = codRowsInBucket.length ? codRowsInBucket.map(r => `<tr>
    <td>${r.registration_number}</td>
    <td>${r.cod_number || '—'}</td>
    <td>${r.cod_cvs_date}</td>
    <td>${r.uploaded_in_dms_rewire || 'Pending'}</td>
  </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--color-text-tertiary);padding:16px;">No entries.</td></tr>';
  openModal('cvsVsCodDetailModal');
}

// ------------------------------------------------------------
// COD vs PURCHASED REPORT — every Purchased vehicle, whether a COD entry
// exists for it yet (rewire_cod_cvs isn't linked by lead_id, only by
// registration_number/val_vehicle_number, so this is a client-side join
// same as renderCodCvsSection()/Vehicle Disposal's COD Date column),
// with a Done/Pending summary.
// ------------------------------------------------------------
async function exportCodVsPurchasedReport() {
  const leads = await fetchAllRows((from, to) => applyReportDateFilter(
    sb.from('rewire_master_data')
      .select(`lead_no, customer_name, val_vehicle_type, val_vehicle_number, val_make, val_model_variant,
        ud_filled_on, pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(name)`)
      .eq('overall_status', 'Purchased').not('val_vehicle_number', 'is', null), 'ud_filled_on'
  ).range(from, to)).catch(e => { notify('Export failed: ' + e.message, { icon: 'error' }); return null; });
  if (leads === null) return;
  if (!leads.length) { notify('No Purchased vehicles to export.', { icon: 'info' }); return; }

  // Only upload_type='COD' rows count as a COD entry here — a vehicle can
  // also have CVS/DMS-Rewire rows under the same registration number.
  const regNos = [...new Set(leads.map(l => (l.val_vehicle_number || '').toUpperCase()).filter(Boolean))];
  const codRows = [];
  const codChunkSize = 150;
  for (let i = 0; i < regNos.length; i += codChunkSize) {
    const chunk = regNos.slice(i, i + codChunkSize);
    const { data: chunkRows, error: chunkErr } = await sb.from('rewire_cod_cvs')
      .select('registration_number, cod_number, cod_voucher_no, cod_amount, cod_cvs_date')
      .eq('upload_type', 'COD').in('registration_number', chunk);
    if (chunkErr) { console.error(chunkErr); continue; }
    codRows.push(...(chunkRows || []));
  }
  const codByReg = {};
  codRows.forEach(r => { codByReg[r.registration_number.toUpperCase()] = r; });

  const details = leads.map(l => {
    const reg = (l.val_vehicle_number || '').toUpperCase();
    const cod = codByReg[reg];
    return {
      'Lead No.': l.lead_no, 'Customer': l.customer_name, 'PE': l.pe ? l.pe.name : '',
      'Vehicle Type': l.val_vehicle_type, 'Vehicle No.': l.val_vehicle_number, 'Make': l.val_make, 'Model': l.val_model_variant,
      'Delivered On': l.ud_filled_on, 'COD Status': cod ? 'Done' : 'Pending',
      'COD No.': cod ? cod.cod_number : '', 'Voucher No.': cod ? cod.cod_voucher_no : '',
      'Amount': cod ? cod.cod_amount : '', 'COD Issue Date': cod ? cod.cod_cvs_date : '',
    };
  });
  const done = details.filter(d => d['COD Status'] === 'Done').length;
  const summary = [{
    'Total Purchased': leads.length, 'COD Done': done, 'COD Pending': leads.length - done,
    '% Done': leads.length ? ((done / leads.length) * 100).toFixed(1) + '%' : '0%',
  }];

  downloadXlsxMulti('rewire-dms-cod-vs-purchased-report.xlsx', [{ name: 'Summary', rows: summary }, { name: 'Details', rows: details }]);
}

// ------------------------------------------------------------
// COD PENDING REPORT — vehicles where PAYMENT is fully done (every
// payment type actually due for the lead — Customer if pn_customer_payment
// > 0, Broker if pn_broker_payment > 0 — is 'Completed' in rewire_payments/
// rewire_payments_archive) but the COD entry (rewire_cod_cvs, upload_type
// = 'COD', matched by registration number — same join as
// exportCodVsPurchasedReport above) is still missing. Month Wise Summary
// buckets by the month payment was completed in (the later of the due
// types' completed_on).
// ------------------------------------------------------------
async function exportCodPendingReport() {
  // (Ramvir, Oct 2026 — fixed double date-filter) — this used to ALSO run
  // the leads query through applyReportDateFilter on ud_filled_on
  // (Delivery date), while separately re-filtering the eligible list below
  // on paymentCompletedOn against that same From/To range. Two different
  // date columns both being AND-ed against one picked range meant a
  // vehicle delivered outside the range got dropped before its payment
  // date was ever checked — even though this report's own Month Wise
  // Summary buckets purely by paymentCompletedOn, confirming that's the
  // one date dimension this report actually means. Leads are now fetched
  // unfiltered here; the paymentCompletedOn check further down (which
  // already existed and is correct) is the only date filter that applies.
  const leads = await fetchAllRows((from, to) =>
    sb.from('rewire_master_data')
      .select(`id, lead_no, customer_name, val_vehicle_type, val_vehicle_number, val_make, val_model_variant, ud_filled_on,
        pn_customer_payment, pn_broker_payment,
        pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(name), manager:rewire_user_profiles!rewire_master_data_manager_id_fkey(name)`)
      .not('val_vehicle_number', 'is', null)
      .range(from, to)
  ).catch(e => { notify('Export failed: ' + e.message, { icon: 'error' }); return null; });
  if (leads === null) return;
  if (!leads.length) { notify('No vehicles to check.', { icon: 'info' }); return; }

  const leadIds = leads.map(l => l.id);
  let payRows = [];
  try {
    const [liveP, archP] = await Promise.all([
      fetchInChunks('rewire_payments', 'lead_id, payment_type, status, completed_on', 'lead_id', leadIds),
      fetchInChunks('rewire_payments_archive', 'lead_id, payment_type, status, completed_on', 'lead_id', leadIds),
    ]);
    payRows = [...liveP, ...archP];
  } catch (e) { notify('Export failed: ' + e.message, { icon: 'error' }); return; }
  const payMap = {};
  payRows.forEach(p => {
    payMap[p.lead_id] = payMap[p.lead_id] || {};
    // Archive rows are the final state — a lead that also has a stale live
    // row should show the archived (Completed) one, so only overwrite if
    // this row is itself Completed or nothing's been recorded yet.
    const existing = payMap[p.lead_id][p.payment_type];
    if (!existing || p.status === 'Completed') payMap[p.lead_id][p.payment_type] = p;
  });

  const regNos = [...new Set(leads.map(l => (l.val_vehicle_number || '').toUpperCase()).filter(Boolean))];
  const codRows = [];
  const codChunkSize = 150;
  for (let i = 0; i < regNos.length; i += codChunkSize) {
    const chunk = regNos.slice(i, i + codChunkSize);
    const { data: chunkRows, error: chunkErr } = await sb.from('rewire_cod_cvs')
      .select('registration_number').eq('upload_type', 'COD').in('registration_number', chunk);
    if (chunkErr) { console.error(chunkErr); continue; }
    codRows.push(...(chunkRows || []));
  }
  const codDoneRegs = new Set(codRows.map(r => r.registration_number.toUpperCase()));

  const fromDate = document.getElementById('reportFromDate').value;
  const toDate = document.getElementById('reportToDate').value;

  const eligible = [];
  leads.forEach(l => {
    const due = [];
    if (Number(l.pn_customer_payment) > 0) due.push('Customer');
    if (Number(l.pn_broker_payment) > 0) due.push('Broker');
    if (!due.length) return; // nothing was ever payable for this lead
    const pay = payMap[l.id] || {};
    const allCompleted = due.every(type => pay[type] && pay[type].status === 'Completed');
    if (!allCompleted) return; // payment itself still pending — out of scope for this report

    const reg = (l.val_vehicle_number || '').toUpperCase();
    if (codDoneRegs.has(reg)) return; // COD already done — not pending

    const completedDates = due.map(type => pay[type].completed_on).filter(Boolean).sort();
    const paymentCompletedOn = completedDates.length ? completedDates[completedDates.length - 1] : null;

    // Same IST-vs-UTC boundary bug as istDayStart/istDayEnd (JS-Core.html)
    // fix elsewhere — paymentCompletedOn comes back from Supabase as a UTC
    // ISO string, so comparing it against a bare, offset-less fromDate/toDate
    // string silently dropped/leaked rows right at the day boundary. new
    // Date(...).toISOString() here converts the IST day boundary to the
    // correct UTC instant first, same as openPurchaseSummaryDetail() does.
    if (fromDate && paymentCompletedOn && paymentCompletedOn < new Date(istDayStart(fromDate)).toISOString()) return;
    if (toDate && paymentCompletedOn && paymentCompletedOn > new Date(istDayEnd(toDate)).toISOString()) return;

    eligible.push({ lead: l, paymentCompletedOn });
  });

  if (!eligible.length) { notify('No vehicles found where payment is done but COD is pending.', { icon: 'info' }); return; }

  const details = eligible.map(({ lead: l, paymentCompletedOn }) => ({
    'Lead No.': l.lead_no, 'Customer': l.customer_name, 'PE': l.pe ? l.pe.name : '', 'Manager': l.manager ? l.manager.name : '',
    'Vehicle Type': l.val_vehicle_type, 'Vehicle No.': l.val_vehicle_number, 'Make': l.val_make, 'Model': l.val_model_variant,
    'Payment Completed On': paymentCompletedOn || '—', 'COD Status': 'Pending',
  }));

  const monthCounts = {};
  eligible.forEach(({ paymentCompletedOn }) => {
    const key = paymentCompletedOn ? paymentCompletedOn.slice(0, 7) : 'Unknown';
    monthCounts[key] = (monthCounts[key] || 0) + 1;
  });
  const monthSummary = Object.entries(monthCounts).sort((a, b) => a[0].localeCompare(b[0])).map(([month, count]) => ({
    'Month': month === 'Unknown' ? 'Unknown' : new Date(month + '-01').toLocaleString('en', { month: 'long', year: 'numeric' }),
    'Vehicles (Payment Done, COD Pending)': count,
  }));
  monthSummary.push({ 'Month': 'Total', 'Vehicles (Payment Done, COD Pending)': eligible.length });

  downloadXlsxMulti('rewire-dms-cod-pending-report.xlsx', [{ name: 'Month Wise Summary', rows: monthSummary }, { name: 'Details', rows: details }]);
}

// ------------------------------------------------------------
// LOCATION TRACKING REPORT — where delivered vehicles are parked, based
// on the Vehicle Parking field captured at Upload Delivery, plus a
// per-location count summary.
// ------------------------------------------------------------
async function exportLocationTrackingReport() {
  const data = await fetchAllRows((from, to) => applyReportDateFilter(
    sb.from('rewire_master_data')
      .select(`lead_no, customer_name, phone, val_vehicle_type, val_vehicle_number, val_make, val_model_variant,
        ud_vehicle_parking, ud_vehicle_sub_parking, transportation_type, ud_filled_on, rewire_partners(partner_name)`)
      .eq('ud_status', 'Complete'), 'ud_filled_on'
  ).range(from, to)).catch(e => { notify('Export failed: ' + e.message, { icon: 'error' }); return null; });
  if (data === null) return;
  if (!data.length) { notify('No delivered vehicles to export.', { icon: 'info' }); return; }

  // Sub Location added next to Location in both sheets (Ramvir, Sept 2026)
  // — was previously left out of this report entirely, even though the
  // live Location Tracking tab (renderLocationTrackingSection(),
  // JS-Operations.html) already shows it; this export had just never been
  // updated to match.
  const details = data.map(l => ({
    'Lead No.': l.lead_no, 'Customer': l.customer_name, 'Phone': l.phone,
    'Vehicle Type': l.val_vehicle_type, 'Vehicle No.': l.val_vehicle_number, 'Make': l.val_make, 'Model': l.val_model_variant,
    'Partner': l.rewire_partners ? l.rewire_partners.partner_name : '',
    'Vehicle Parking Location': l.ud_vehicle_parking || 'Not recorded',
    'Sub Location': l.ud_vehicle_sub_parking || '',
    'Transportation Type': l.transportation_type, 'Delivered On': l.ud_filled_on,
  }));
  const locCounts = {};
  data.forEach(l => {
    const loc = l.ud_vehicle_parking || 'Not recorded';
    const sub = l.ud_vehicle_sub_parking || '—';
    const key = loc + '||' + sub;
    if (!locCounts[key]) locCounts[key] = { location: loc, subLocation: sub, count: 0 };
    locCounts[key].count++;
  });
  const summary = Object.values(locCounts).sort((a, b) => b.count - a.count)
    .map(({ location, subLocation, count }) => ({ 'Location': location, 'Sub Location': subLocation, 'Vehicle Count': count }));

  downloadXlsxMulti('rewire-dms-location-tracking-report.xlsx', [{ name: 'Summary by Location', rows: summary }, { name: 'Details', rows: details }]);
}

// ------------------------------------------------------------
// TRANSPORTER PAYMENTS REPORT — every dispatched vehicle, with Bill No.,
// Received at Plant status (rst_no on rewire_vehicle_receipt), Debit
// Amount (from the plant Accessories Check), and Final Amount — mirrors
// exactly what renderLogisticsPaymentsSection() shows on screen.
// ------------------------------------------------------------
async function exportTransporterPaymentsReport() {
  const leads = await fetchAllRows((from, to) => applyReportDateFilter(
    sb.from('rewire_master_data')
      .select(`id, lead_no, customer_name, val_vehicle_number, logistics_transporter_name, logistics_transporter_vehicle_no,
        logistics_dispatch_date, logistics_freight_amount, logistics_bill_no, logistics_payment_status, logistics_final_amount,
        pe:rewire_user_profiles!rewire_master_data_pe_id_fkey(name), manager:rewire_user_profiles!rewire_master_data_manager_id_fkey(name)`)
      .eq('logistics_status', 'Sent to Plant').not('logistics_transporter_name', 'is', null), 'logistics_dispatch_date'
  ).range(from, to)).catch(e => { notify('Export failed: ' + e.message, { icon: 'error' }); return null; });
  if (leads === null) return;
  if (!leads.length) { notify('No dispatched vehicles to export.', { icon: 'info' }); return; }

  const receipts = await fetchAllRows((from, to) => sb.from('rewire_vehicle_receipt').select('lead_id, rst_no, plant_debit_amount').range(from, to));
  const receiptByLead = {};
  (receipts || []).forEach(r => { receiptByLead[r.lead_id] = r; });

  const details = leads.map(l => {
    const receipt = receiptByLead[l.id];
    const receivedAtPlant = !!(receipt && receipt.rst_no);
    const debitAmount = receipt && receipt.plant_debit_amount ? Number(receipt.plant_debit_amount) : 0;
    const freightAmount = l.logistics_freight_amount ? Number(l.logistics_freight_amount) : null;
    const finalAmount = l.logistics_payment_status === 'Paid' ? l.logistics_final_amount : (freightAmount !== null ? freightAmount - debitAmount : null);
    return {
      'Lead No.': l.lead_no, 'Customer': l.customer_name, 'Vehicle No.': l.val_vehicle_number,
      'Transporter': l.logistics_transporter_name, 'Vehicle/Truck No.': l.logistics_transporter_vehicle_no,
      'Dispatch Date': l.logistics_dispatch_date, 'Freight Amount': l.logistics_freight_amount || '',
      'Bill No.': l.logistics_bill_no || '', 'Received at Plant': receivedAtPlant ? 'Received' : 'Pending',
      'Debit Amount': debitAmount, 'Final Amount': finalAmount !== null ? finalAmount : '',
      'Payment Status': l.logistics_payment_status || 'Pending',
      'PE': l.pe ? l.pe.name : '', 'Manager': l.manager ? l.manager.name : '',
    };
  });
  const paid = details.filter(d => d['Payment Status'] === 'Paid').length;
  const summary = [{
    'Total Dispatches': leads.length, 'Paid': paid, 'Pending': leads.length - paid,
    'Received at Plant': details.filter(d => d['Received at Plant'] === 'Received').length,
    'Total Debit Amount': details.reduce((s, d) => s + (Number(d['Debit Amount']) || 0), 0),
  }];

  downloadXlsxMulti('rewire-dms-transporter-payments-report.xlsx', [{ name: 'Summary', rows: summary }, { name: 'Details', rows: details }]);
}

// ------------------------------------------------------------
// COMPANY/DEALERSHIP WISE REPORT — every lead tagged with a Company/
// Dealership Name (captured at New Lead Entry — optional field), showing
// its current pipeline stage + status, plus a per-company count summary.
// ------------------------------------------------------------
async function exportCompanyDealershipReport() {
  const data = await fetchAllRows((from, to) => applyReportDateFilter(
    sb.from('rewire_master_data')
      .select(`lead_no, customer_name, phone, city, company_dealership_name, current_stage, overall_status, lead_status, sub_status,
        val_vehicle_type, val_vehicle_number, val_make, val_model_variant, pe_id, created_at,
        rewire_partners(partner_name)`)
      .not('company_dealership_name', 'is', null)
      .order('company_dealership_name'), 'created_at'
  ).range(from, to)).catch(e => { notify('Export failed: ' + e.message, { icon: 'error' }); return null; });
  if (data === null) return;
  if (!data.length) { notify('No leads with a Company/Dealership Name to export.', { icon: 'info' }); return; }

  const peMap = {};
  (allPEs || []).forEach(p => { peMap[p.id] = p.name; });

  const details = data.map(l => ({
    'Company/Dealership': l.company_dealership_name, 'Lead No.': l.lead_no, 'Customer': l.customer_name,
    'Phone': l.phone, 'City': l.city, 'Current Stage': STAGE_LABELS[l.current_stage] || 'Lead Entry',
    'Overall Status': l.overall_status || '—', 'Lead Status': l.lead_status || '—', 'Sub Status': l.sub_status || '—',
    'Vehicle Type': l.val_vehicle_type || '', 'Vehicle No.': l.val_vehicle_number || '', 'Make': l.val_make || '', 'Model': l.val_model_variant || '',
    'Partner': l.rewire_partners ? l.rewire_partners.partner_name : '', 'PE': peMap[l.pe_id] || '', 'Created On': l.created_at,
  }));

  const grouped = {};
  data.forEach(l => { (grouped[l.company_dealership_name] = grouped[l.company_dealership_name] || []).push(l); });
  const summary = Object.entries(grouped).map(([company, rows]) => ({
    'Company/Dealership': company, 'Total Leads': rows.length,
    'Purchased (Complete)': rows.filter(r => r.overall_status === 'Purchased' || r.current_stage >= 4).length,
    'Closed Lost': rows.filter(r => r.overall_status === 'Closed Lost').length,
    'In Progress': rows.filter(r => r.overall_status !== 'Closed Lost' && !(r.overall_status === 'Purchased' || r.current_stage >= 4)).length,
  }));

  downloadXlsxMulti('rewire-dms-company-dealership-report.xlsx', [{ name: 'Summary', rows: summary }, { name: 'Details', rows: details }]);
}
