      const dispatchMode = document.getElementById('rcDispatchMode').value || 'Courier';
      payload.rc_dispatch_mode = dispatchMode;
      if (dispatchMode !== 'Courier') {   // By Hand / Driver / Crane: just who carries it
        payload.rc_carried_by = document.getElementById('rcCarriedByField').value.trim();
        payload.rc_dispatch_date = document.getElementById('rcHandDateField').value || null;
        // Clear any stale courier-mode values so a lead switched from
        // Courier to By Hand doesn't keep showing an old courier name.
        payload.rc_courier_name = null;
        payload.rc_pod_no = null;
      } else {
        payload.rc_courier_name = document.getElementById('rcCourierName').value.trim();
        payload.rc_pod_no = document.getElementById('rcPodNoField').value.trim();
        payload.rc_dispatch_date = document.getElementById('rcCourierDateField').value || null;
        const imgFile = document.getElementById('rcPodImageField');
        if (imgFile && imgFile.files.length) {
          payload.rc_pod_image_url = await uploadFile(imgFile.files[0], getVehicleFolderName(), 'POD_Image');
        }
        payload.rc_carried_by = null;
      }
      payload.rc_dispatched_by = currentProfile.id;
      payload.rc_dispatched_on = new Date().toISOString();
    }
    const { error } = await sb.from('rewire_master_data').update(payload).eq('id', activeLeadId);
    if (error) { notify('Error saving RC status: ' + error.message, { icon: 'error' }); return; }
  }

  // Back Office section — confirm receipt
  const received = document.getElementById('rcReceivedStatus').value;
  if (received === 'Received') {
    const { error } = await sb.from('rewire_rc_tracking').insert({
      lead_id: activeLeadId,
      received_status: 'Received',
      received_by: currentProfile.id,
      received_on: new Date().toISOString(),
      remarks: document.getElementById('rcRemarks').value.trim(),
      tracked_by: currentProfile.id,
    });
    if (error) { notify('Error confirming receipt: ' + error.message, { icon: 'error' }); return; }
  }

  notify('RC Tracking saved.');
  closeModal('rcModal');
  await refreshLeadsTable();
  if (typeof renderRcTrackingSection === 'function' && document.getElementById('section-rc-tracking').style.display !== 'none') {
    renderRcTrackingSection(rcTrackPage);
  }
}

async function submitEditLead() {
  if (!activeLeadId) { notify('No lead selected', { icon: 'error' }); return; }
  const stVal = document.getElementById('stEdit').value;

  // (Ramvir, Oct 2026) — block reverting a lead to "Need Analysis" once its
  // Valuation form has actually been filled (val_status='Complete'). Found
  // on L7103484: status was manually set back to "Need Analysis" here
  // while the lead had already gone all the way through Valuation, Price
  // Negotiation AND Bank KYC (current_stage=3, all three *_status
  // 'Complete') — this save never touched those stage columns, so the
  // lead ended up stuck half "unqualified", half "Bank KYC done", and the
  // Edit button kept offering "Edit — Bank KYC" on a lead that looked
  // unqualified in the list. current_stage alone isn't a safe check here —
  // every lead starts at current_stage=1 by default before Valuation is
  // even opened, so that's normal and not reverted; val_status='Complete'
  // is the real signal that pipeline work has actually been done.
  if (stVal === 'Need Analysis') {
    const { data: stageRow } = await sb.from('rewire_master_data').select('val_status').eq('id', activeLeadId).single();
    if (stageRow && stageRow.val_status === 'Complete') {
      notify('This lead\'s Valuation form is already filled, so it can\'t be set back to "Need Analysis" — that would leave the pipeline stage and the status out of sync. Use "Closed Lost" instead if this deal is actually dead.', { icon: 'error', title: 'Cannot revert status' });
      return;
    }
  }

  const custLocked = document.querySelector('#editModal [data-field="e_customer_name"]').disabled;
  const payload = {
    lead_status: stVal === 'CLR' ? 'Closed Lost with Reason' : stVal === 'CLC' ? 'Closed Lost to Competitor' : stVal,
    sub_status: document.getElementById('sdSelEdit').value || null,
    last_updated_by: currentProfile.id,
  };
  if (!custLocked) {
    payload.customer_name = document.querySelector('#editModal [data-field="e_customer_name"]').value.trim();
    payload.phone = document.querySelector('#editModal [data-field="e_phone"]').value.trim();
    payload.email = document.querySelector('#editModal [data-field="e_email"]').value.trim();
    payload.address = document.querySelector('#editModal [data-field="e_address"]').value.trim();
    payload.city = document.querySelector('#editModal [data-field="e_city"]').value.trim();
    payload.lead_source = document.querySelector('#editModal [data-field="e_lead_source"]').value;
  }
  if (stVal === 'CLR' || stVal === 'CLC') payload.overall_status = 'Closed Lost';

  const peSel = document.getElementById('editPeId');
  if (peSel && peSel.closest('#editReassignSection').style.display !== 'none' && peSel.value) {
    payload.pe_id = peSel.value;
  }
  const mgrSelEdit = document.getElementById('editManagerId');
  if (mgrSelEdit && mgrSelEdit.closest('#editManagerField').style.display !== 'none' && mgrSelEdit.value) {
    payload.manager_id = mgrSelEdit.value;
  }

  const { error } = await sb.from('rewire_master_data').update(payload).eq('id', activeLeadId);
  if (error) { notify('Error updating lead: ' + error.message, { icon: 'error' }); return; }

  notify('Lead updated.');
  closeModal('editModal');
  await refreshLeadsTable();
}
