async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    document.body.innerHTML =
      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Inter,sans-serif;gap:16px;">' +
      '<div style="font-size:15px;color:#475569;">You\'re not signed in.</div>' +
      '<button onclick="window.top.location.href=APP_URL+\'?page=login\'" ' +
      'style="padding:10px 20px;background:#1d4ed8;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Go to Login</button>' +
      '</div>';
    return;
  }
  if (!(await loadCurrentProfile())) return;
  // These 6 loaders are mutually independent (each fetches its own table into
  // its own cache var) — loadPeAndManagerOptions only reads currentProfile
  // (already set above), it doesn't depend on the other 5. Running them in
  // parallel instead of one-by-one cuts app-bootstrap network round-trips
  // from 7 sequential awaits down to 2, which was a real contributor to the
  // "DMS load hone me bahut time laga rha hai" slowness complaint.
  await Promise.all([
    loadPartners(),
    loadCommissionPersons(),
    loadPeAndManagerOptions(),
    loadDynamicDropdowns(),
    loadCraneVendors(),
    loadTransporters(),
  ]);
  await refreshLeadsTable();
  if (typeof renderDashboard === 'function') renderDashboard();
  wireTableEnhancements();
  if (typeof initSidebarGroups === 'function') initSidebarGroups();
  // All Leads report's "Columns" picker (JS-TableExport.html) — has no
  // live table to toggle visibility on (Reports is just download cards),
  // it only needs to exist so exportLeadsReport() can read the selection.
  if (typeof initColumnPicker === 'function' && typeof ALL_LEADS_COLUMNS !== 'undefined') {
    initColumnPicker('allLeads', ALL_LEADS_COLUMNS, 'allLeadsColumnPicker', 'no-such-table-allLeads');
  }
}

// ------------------------------------------------------------
// TABLE ENHANCEMENTS — applies to every <table class="crm-table"> in the
// app automatically, with no per-table wiring needed:
//   1) Click any column header to sort by it (click again to reverse).
//   2) Client-side pagination at 50 rows/page (Prev/Next under the table).
// Works generically off the rendered DOM (header text + cell text), so it
// doesn't matter how each section builds its rows. A MutationObserver on
// each table's <tbody> re-applies pagination automatically whenever a
// section's render function replaces the rows (new data, a filter, etc.)
// — sections never need to call anything here themselves.
// ------------------------------------------------------------
const TW_PAGE_SIZE = 50;

function wireTableEnhancements() {
  let twCounter = 0;
  // table[data-no-enhance] opts a table out entirely — for small fixed
  // reference tables inside a modal (e.g. plantAccessoriesModal's
  // Item/Valuation/Delivery/Present-at-Plant comparison table) where
  // sort/column-filter/pagination/frozen-columns make no sense and were
  // actively getting in the way (unwanted filter icons cluttering the
  // modal, and the tbody-replacement MutationObserver re-running on every
  // modal open interfering with the row's own click handlers).
  document.querySelectorAll('table.crm-table:not([data-no-enhance])').forEach(table => {
    try { wireOneTable(table, twCounter++); } catch (e) { console.error('wireTableEnhancements failed for a table:', e); }
  });
}

function wireOneTable(table, twCounter) {
    if (table.dataset.twEnhanced) return;
    table.dataset.twEnhanced = '1';
    if (!table.id) table.id = 'twTable' + (twCounter++) + '_' + Math.random().toString(36).slice(2, 7);

    const thead = table.querySelector('thead');
    if (thead) {
      thead.querySelectorAll('th').forEach((th, colIndex) => {
        // Skip header cells that hold a real control (e.g. the Logistics
        // "select all" checkbox) — sorting doesn't apply to those, and
        // overwriting their textContent for the sort arrow would delete
        // the control.
        if (th.querySelector('input, select, button, a')) return;
        // Wrap the header's label text in its own <span> — sortTableByColumn
        // needs somewhere to write/clear the ▲▼ arrow, but doing that via
        // th.textContent (as before) wipes out ANY other child element,
        // including the column-filter icon wireColumnFilters appends right
        // after this loop. Sorting one column used to silently delete every
        // table's filter icons the first time it ran. Everything now reads
        // and writes only this span, leaving sibling elements alone.
        const label = document.createElement('span');
        label.className = 'th-sort-label';
        label.textContent = th.textContent;
        th.textContent = '';
        th.appendChild(label);
        th.style.cursor = 'pointer';
        th.style.userSelect = 'none';
        th.title = 'Click to sort';
        th.addEventListener('click', () => sortTableByColumn(table, colIndex, th));
      });
    }
    wireColumnFilters(table);
    wireStickyColumns(table);

    // Generic search box — only added when this table's filter-row doesn't
    // already have one of its own (most sections already wired a
    // purpose-built search input; this just fills the gap for the rest,
    // e.g. Logistics, Omini Pay, Commission, Received at Plant).
    const filterRow = table.closest('.table-area') ? table.closest('.table-area').querySelector('.filter-row') : null;
    if (filterRow && !filterRow.querySelector('.search-field, input[type="search"]')) {
      const wrap = document.createElement('div');
      wrap.className = 'search-field';
      wrap.innerHTML = '<i class="ti ti-search" aria-hidden="true"></i><input placeholder="Search…" />';
      filterRow.insertBefore(wrap, filterRow.firstChild);
      wrap.querySelector('input').addEventListener('input', (e) => filterTableGeneric(table, e.target.value));
    }

    const tbody = table.querySelector('tbody');
    if (tbody) {
      // Column widths are re-measured on every tbody change, not just once —
      // wireOneTable() runs at app bootstrap while most sections (and their
      // tables) are still display:none, where getBoundingClientRect() would
      // measure 0 width. By the time a section's render function actually
      // populates real rows (this observer firing), that section is visible
      // and widths are measurable, so this is also effectively the "first
      // real" placement for frozen columns, not just a resync.
      new MutationObserver(() => { applyColumnFilters(table); paginateTable(table, 0); applyStickyColumnOffsets(table); applyStickyHeaderOffset(table); }).observe(tbody, { childList: true });
      applyColumnFilters(table);
      paginateTable(table, 0);
    }
}

// ------------------------------------------------------------
// FROZEN FIRST COLUMNS — "last column tak scroll karte hi pata nahi chalta
// kis customer ka row hai" on wide tables (Purchased, Payments, Crane
// Charges, etc.). Detects the "Lead No." + "Customer" header pair by TEXT
// rather than hardcoding column 1/2, since several tables lead with a
// checkbox or an "Edit" action column instead (Logistics, To be Sent for
// Payment, Closed Lost) — freezing literal columns 1-2 there would pin the
// checkbox and scroll Customer out of view, missing the entire point.
// Falls back to literal columns 1-2 only for a wide table with neither
// column (there are none today, but keeps this safe for future tables).
// Column widths are real content-driven pixel widths, not fixed, so they're
// measured via getBoundingClientRect() and re-applied whenever a table's
// data changes (piggy-backed on the same tbody MutationObserver used for
// filters/pagination above) or the window resizes.
// ------------------------------------------------------------
function wireStickyColumns(table) {
  const headRow = table.querySelector('thead tr');
  if (!headRow) return;
  const ths = Array.from(headRow.children);
  const norm = s => (s || '').replace(/\s+/g, ' ').trim().toLowerCase();
  const idxLead = ths.findIndex(th => norm(th.textContent).indexOf('lead no') === 0);
  let start, count;
  if (idxLead !== -1 && ths[idxLead + 1] && norm(ths[idxLead + 1].textContent) === 'customer') {
    start = idxLead; count = 2;
    // A "select all" checkbox column right before Lead No. (Logistics,
    // To be Sent for Payment, Closed Lost) was deliberately left
    // unfrozen before — but the whole point of scrolling right on these
    // tables is to check Location/Vehicle details BEFORE deciding what to
    // select, and losing the checkbox off-screen while doing that defeats
    // that (Ramvir, screenshot — Logistics tab). Pin it along with Lead
    // No./Customer whenever it's there.
    if (idxLead > 0 && ths[idxLead - 1].querySelector('input[type="checkbox"]')) {
      start = idxLead - 1; count = 3;
    }
  } else if (ths.length > 6) {
    start = 0; count = 2; // fallback for a wide table with no Lead No./Customer pair
  } else {
    return; // narrow table (e.g. COD/CVS, directory tables) — nothing worth freezing
  }
  table.dataset.freezeStart = String(start);
  table.dataset.freezeCount = String(count);
}

function applyStickyColumnOffsets(table) {
  if (table.dataset.freezeStart === undefined) return;
  const startIdx = parseInt(table.dataset.freezeStart, 10);
  const count = parseInt(table.dataset.freezeCount, 10);
  const headRow = table.querySelector('thead tr');
  if (!headRow || !headRow.children.length) return;
  let running = 0;
  for (let i = 0; i < startIdx; i++) {
    const cell = headRow.children[i];
    if (cell) running += cell.getBoundingClientRect().width;
  }
  if (startIdx > 0 && running === 0) return; // table not laid out yet (still display:none) — skip, next data change will retry
  const offsets = [];
  for (let i = startIdx; i < startIdx + count; i++) {
    offsets.push(running);
    const cell = headRow.children[i];
    running += cell ? cell.getBoundingClientRect().width : 0;
  }
  const rows = [headRow, ...Array.from(table.querySelectorAll('tbody > tr'))];
  rows.forEach(row => {
    for (let k = 0; k < count; k++) {
      const idx = startIdx + k;
      const cell = row.children[idx];
      if (!cell) continue;
      cell.style.position = 'sticky';
      cell.style.left = offsets[k] + 'px';
      cell.classList.add('frozen-col');
      cell.classList.toggle('frozen-col-last', k === count - 1);
    }
  });
}

// A sticky thead alone left the filter-row above it (search box, date
// range, Filter/Clear buttons — see .table-area>.filter-row in
// Stylesheet.html) scrolling away, since only the <th> cells had
// position:sticky. That filter-row is now ALSO sticky at top:0, so this
// pushes the thead's own sticky offset down to sit right below it instead
// of underneath/behind it. Measured via getBoundingClientRect() rather
// than assumed, since the row can wrap to 2 lines on a narrow screen —
// re-run on every data change (same MutationObserver as the column
// freezing above) and on resize, for the same reason.
function applyStickyHeaderOffset(table) {
  const area = table.closest('.table-area');
  const filterRow = area ? area.querySelector(':scope > .filter-row') : null;
  const offset = filterRow ? Math.ceil(filterRow.getBoundingClientRect().height) : 0;
  table.querySelectorAll('thead th').forEach(th => { th.style.top = offset + 'px'; });
}

window.addEventListener('resize', () => {
  clearTimeout(window._stickyColResizeTimer);
  window._stickyColResizeTimer = setTimeout(() => {
    document.querySelectorAll('table.crm-table[data-freeze-start]').forEach(applyStickyColumnOffsets);
    document.querySelectorAll('table.crm-table').forEach(applyStickyHeaderOffset);
  }, 150);
});

// ------------------------------------------------------------
// COLUMN HEADER FILTERS ("Option A" — Excel-style per-column dropdown
// filters), requested to replace the old per-table PE/Manager <select>
// dropdowns (removed from Sections.html) so filtering by PE, Manager, or
// ANY other column works the same way, from that column's own header.
//
// Applied generically to every table.crm-table via wireOneTable() above —
// same DOM-text-reading approach already used for sort/search/pagination,
// so no per-table code is needed. Qualified Pipeline and All Leads render
// as card grids (lead-cards-grid), not <table>, so they're automatically
// untouched by this — matches the explicit request to leave Qualified
// Pipeline out of this feature.
//
// State is stored in columnFilterState, keyed by the table's
// data-filter-prefix attribute (set in Sections.html to match that
// section's existing tableFilterState prefix) so it survives the table's
// tbody being fully replaced on every re-render (status changes, search,
// etc.). Tables with no prefix (Crane Vendors/Transporters/Commission
// Persons/Bulk Update preview) fall back to the table's own auto-assigned
// id, which is stable across re-renders too.
// ------------------------------------------------------------
let columnFilterState = {}; // { [tableKey]: { [colIndex]: Set(allowedValues) } }

function tableFilterKey(table) {
  return table.dataset.filterPrefix || table.id;
}

function wireColumnFilters(table) {
  const thead = table.querySelector('thead');
  if (!thead) return;
  thead.querySelectorAll('th').forEach((th, colIndex) => {
    if (th.querySelector('input, select, button, a')) return; // checkbox/action columns — nothing to filter
    if (th.dataset.colFilterWired) return;
    th.dataset.colFilterWired = '1';
    const icon = document.createElement('i');
    icon.className = 'ti ti-filter col-filter-icon';
    icon.setAttribute('aria-hidden', 'true');
    icon.style.cssText = 'font-size:11px;margin-left:5px;opacity:0.5;cursor:pointer;';
    icon.title = 'Filter this column';
    icon.addEventListener('click', (e) => {
      e.stopPropagation(); // don't also trigger this header's sort-click
      openColumnFilterMenu(table, colIndex, icon);
    });
    th.appendChild(icon);
  });
}

function applyColumnFilters(table) {
  const state = columnFilterState[tableFilterKey(table)];
  const tbody = table.querySelector('tbody');
  if (!tbody) return;
  Array.from(tbody.children).filter(r => r.tagName === 'TR').forEach(row => {
    if (row.querySelector('td[colspan]')) { row.dataset.twColFiltered = ''; return; } // "Loading…" / empty-state row
    let hide = false;
    if (state) {
      for (const colIndex in state) {
        const allowed = state[colIndex];
        if (!allowed || !allowed.size) continue;
        const cell = row.children[colIndex];
        if (!allowed.has(cell ? cell.textContent.trim() : '')) { hide = true; break; }
      }
    }
    row.dataset.twColFiltered = hide ? '1' : '';
  });
  updateFilteredCountBadge(table);
  // Optional per-table hook (Ramvir, Sept 2026) — a table can name a global
  // function via data-col-filter-hook="fnName" to be notified whenever its
  // column filters change, e.g. to recompute a summary/stats row that sits
  // above the table and isn't itself part of this generic engine (see
  // psOnColumnFilterChange, JS-Dashboard.html, wired to psTable).
  const hookName = table.dataset.colFilterHook;
  if (hookName && typeof window[hookName] === 'function') window[hookName](table);
  if (typeof pruneHiddenDisposalSelection === 'function') pruneHiddenDisposalSelection(table);
}

// The count text next to each table (e.g. "404 vehicles", "847 vehicles
// waiting") is set once by the render function from the raw, UNfiltered
// server response — a column-header filter (openColumnFilterMenu above)
// only ever hides/shows <tr>s client-side afterward, so that number never
// moved even while a filter was narrowing what's actually on screen.
// Appends a small "· Filtered: N" suffix onto the same .filter-count
// element (found via the table's closest .table-area wrapper, same DOM
// shape every table in Sections.html uses) whenever a column filter is
// active for this table, showing the true count of currently-visible
// rows; removes the suffix the moment no filter is active again.
function updateFilteredCountBadge(table) {
  const area = table.closest('.table-area');
  const countEl = area ? area.querySelector('.filter-count') : null;
  if (!countEl) return;
  const key = tableFilterKey(table);
  const state = columnFilterState[key];
  const hasActiveFilter = state && Object.keys(state).length > 0;
  let suffix = countEl.querySelector('.col-filter-count-suffix');
  if (!hasActiveFilter) {
    if (suffix) suffix.remove();
    return;
  }
  const tbody = table.querySelector('tbody');
  const allRows = tbody ? Array.from(tbody.children).filter(r => r.tagName === 'TR' && !r.querySelector('td[colspan]')) : [];
  const visible = allRows.filter(r => r.dataset.twColFiltered !== '1' && r.dataset.twFiltered !== '1').length;
  if (!suffix) {
    suffix = document.createElement('span');
    suffix.className = 'col-filter-count-suffix';
    suffix.style.cssText = 'color:#1d4ed8;font-weight:600;margin-left:6px;';
    countEl.appendChild(suffix);
  }
  suffix.textContent = `· Filtered: ${visible}`;
}

function markColumnFilterIcon(table, colIndex, active) {
  const th = table.querySelectorAll('thead th')[colIndex];
  const icon = th ? th.querySelector('.col-filter-icon') : null;
  if (!icon) return;
  icon.style.opacity = active ? '1' : '0.5';
  icon.style.color = active ? '#1d4ed8' : '';
}

function clearColumnFiltersForTable(table) {
  delete columnFilterState[tableFilterKey(table)];
  table.querySelectorAll('thead th .col-filter-icon').forEach(icon => { icon.style.opacity = '0.5'; icon.style.color = ''; });
  applyColumnFilters(table);
  paginateTable(table, 0);
}

function closeColumnFilterMenu() {
  const existing = document.getElementById('colFilterMenu');
  if (existing) existing.remove();
  document.removeEventListener('mousedown', onColFilterDocClick);
}
function onColFilterDocClick(e) {
  const menu = document.getElementById('colFilterMenu');
  if (menu && !menu.contains(e.target)) closeColumnFilterMenu();
}

function openColumnFilterMenu(table, colIndex, anchorEl) {
  closeColumnFilterMenu();
  const tbody = table.querySelector('tbody');
  const rows = tbody ? Array.from(tbody.children).filter(r => r.tagName === 'TR' && !r.querySelector('td[colspan]')) : [];
  const values = new Set();
  rows.forEach(r => { const c = r.children[colIndex]; if (c) values.add(c.textContent.trim()); });
  const sorted = Array.from(values).sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
  const key = tableFilterKey(table);
  const activeSet = (columnFilterState[key] && columnFilterState[key][colIndex]) || null; // null = all selected, no filter

  const menu = document.createElement('div');
  menu.id = 'colFilterMenu';
  menu.style.cssText = 'position:fixed;z-index:9999;background:#fff;border:0.5px solid #d1d5db;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);width:220px;max-height:320px;display:flex;flex-direction:column;font-size:12px;font-family:inherit;';
  menu.innerHTML = `
    <div style="padding:8px;border-bottom:0.5px solid #e5e7eb;"><input type="text" id="colFilterSearch" placeholder="Search values…" style="width:100%;box-sizing:border-box;border:0.5px solid #d1d5db;border-radius:6px;padding:5px 8px;font-size:12px;" /></div>
    <div style="padding:6px 8px;border-bottom:0.5px solid #f1f5f9;display:flex;gap:12px;">
      <a href="javascript:void(0)" id="colFilterSelectAll" style="font-size:11px;color:#1d4ed8;text-decoration:none;">Select All</a>
      <a href="javascript:void(0)" id="colFilterClearAll" style="font-size:11px;color:#dc2626;text-decoration:none;">Clear</a>
    </div>
    <div id="colFilterOptions" style="overflow-y:auto;flex:1;padding:4px 8px;"></div>
    <div style="padding:8px;border-top:0.5px solid #e5e7eb;display:flex;justify-content:flex-end;gap:8px;">
      <button class="btn" id="colFilterCancelBtn" style="padding:4px 10px;font-size:12px;">Cancel</button>
      <button class="btn btn-primary" id="colFilterApplyBtn" style="padding:4px 10px;font-size:12px;">Apply</button>
    </div>`;
  document.body.appendChild(menu);

  const renderOptions = (q) => {
    const wrap = menu.querySelector('#colFilterOptions');
    const ql = (q || '').toLowerCase();
    const shown = sorted.filter(v => !ql || v.toLowerCase().includes(ql));
    wrap.innerHTML = shown.length ? shown.map(v => {
      const checked = !activeSet || activeSet.has(v);
      return `<label style="display:flex;align-items:center;gap:6px;padding:3px 2px;cursor:pointer;"><input type="checkbox" value="${v.replace(/"/g, '&quot;')}" ${checked ? 'checked' : ''} style="flex-shrink:0;" /><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${v || '(blank)'}</span></label>`;
    }).join('') : '<div style="color:#94a3b8;padding:8px 2px;">No values</div>';
  };
  renderOptions('');

  menu.querySelector('#colFilterSearch').addEventListener('input', (e) => renderOptions(e.target.value));
  menu.querySelector('#colFilterSelectAll').addEventListener('click', () => menu.querySelectorAll('#colFilterOptions input[type="checkbox"]').forEach(cb => cb.checked = true));
  menu.querySelector('#colFilterClearAll').addEventListener('click', () => menu.querySelectorAll('#colFilterOptions input[type="checkbox"]').forEach(cb => cb.checked = false));
  menu.querySelector('#colFilterCancelBtn').addEventListener('click', closeColumnFilterMenu);
  menu.querySelector('#colFilterApplyBtn').addEventListener('click', () => {
    // Only checkboxes matching the CURRENT search text exist in the DOM
    // right now — start from the previous selection (or "everything" if no
    // filter was active) and apply just the checked/unchecked deltas for
    // values that are visible, so typing a search then toggling doesn't
    // silently drop values hidden by that search text.
    const selected = activeSet ? new Set(activeSet) : new Set(sorted);
    menu.querySelectorAll('#colFilterOptions input[type="checkbox"]').forEach(cb => {
      if (cb.checked) selected.add(cb.value); else selected.delete(cb.value);
    });
    const isFilterActive = selected.size > 0 && selected.size < sorted.length;
    if (!columnFilterState[key]) columnFilterState[key] = {};
    if (!isFilterActive && selected.size !== 0) delete columnFilterState[key][colIndex]; // "everything" selected == no filter
    else columnFilterState[key][colIndex] = selected; // includes the "nothing selected" (show 0 rows) case
    markColumnFilterIcon(table, colIndex, !!columnFilterState[key][colIndex]);
    applyColumnFilters(table);
    paginateTable(table, 0);
    closeColumnFilterMenu();
  });

  const r = anchorEl.getBoundingClientRect();
  menu.style.left = r.left + 'px';
  menu.style.top = (r.bottom + 4) + 'px';
  requestAnimationFrame(() => {
    const mw = menu.offsetWidth, mh = menu.offsetHeight;
    let left = r.left, top = r.bottom + 4;
    if (left + mw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - mw - 8);
    if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
  });
  setTimeout(() => document.addEventListener('mousedown', onColFilterDocClick), 0);
}

function filterTableGeneric(table, query) {
  const tbody = table.querySelector('tbody');
  if (!tbody) return;
  const q = query.trim().toLowerCase();
  Array.from(tbody.children).filter(r => r.tagName === 'TR').forEach(row => {
    if (row.querySelector('td[colspan]')) return; // "Loading…" / "No data" placeholder row
    row.dataset.twFiltered = (q && !row.textContent.toLowerCase().includes(q)) ? '1' : '';
  });
  paginateTable(table, 0);
}

function sortTableByColumn(table, colIndex, th) {
  const tbody = table.querySelector('tbody');
  if (!tbody) return;
  const allRows = Array.from(tbody.children).filter(r => r.tagName === 'TR');
  if (allRows.length < 2 || (allRows.length === 1 && allRows[0].querySelector('td[colspan]'))) return;

  const currentDir = th.getAttribute('data-sort-dir') || 'none';
  const newDir = currentDir === 'asc' ? 'desc' : 'asc';
  // Read/write only the .th-sort-label span (added in wireOneTable above),
  // never th.textContent directly — that used to also wipe out the
  // column-filter icon appended alongside it as a sibling.
  table.querySelectorAll('thead th').forEach(h => {
    h.removeAttribute('data-sort-dir');
    const lbl = h.querySelector('.th-sort-label');
    if (lbl) lbl.textContent = lbl.textContent.replace(/ [▲▼]$/, '');
  });
  th.setAttribute('data-sort-dir', newDir);
  const thLbl = th.querySelector('.th-sort-label');
  if (thLbl) thLbl.textContent = thLbl.textContent.replace(/ [▲▼]$/, '') + (newDir === 'asc' ? ' ▲' : ' ▼');

  const getText = (row) => (row.children[colIndex] ? row.children[colIndex].textContent.trim() : '');
  const parseNum = (s) => { const c = s.replace(/[₹,%\s]/g, ''); return c !== '' && !isNaN(c) ? parseFloat(c) : null; };
  const parseDate = (s) => { const d = new Date(s); return isNaN(d.getTime()) ? null : d.getTime(); };

  allRows.sort((a, b) => {
    const va = getText(a), vb = getText(b);
    const na = parseNum(va), nb = parseNum(vb);
    let cmp;
    if (na !== null && nb !== null) cmp = na - nb;
    else { const da = parseDate(va), db = parseDate(vb);
      cmp = (da !== null && db !== null) ? da - db : va.localeCompare(vb, undefined, { sensitivity: 'base', numeric: true }); }
    return newDir === 'asc' ? cmp : -cmp;
  });
  allRows.forEach(r => tbody.appendChild(r)); // triggers the MutationObserver, which re-paginates from page 0
}

function paginateTable(table, page) {
  const tbody = table.querySelector('tbody');
  if (!tbody) return;
  const allRows = Array.from(tbody.children).filter(r => r.tagName === 'TR');
  const isPlaceholder = allRows.length <= 1 && allRows[0] && allRows[0].querySelector('td[colspan]');
  const bar = getOrCreatePaginationBar(table);
  if (isPlaceholder) {
    allRows.forEach(r => r.style.display = '');
    bar.style.display = 'none';
    return;
  }
  // Rows knocked out by the search box (filterTableGeneric) or by an active
  // column-header filter (applyColumnFilters, see below) stay hidden and
  // don't count toward pagination at all.
  const isHidden = r => r.dataset.twFiltered === '1' || r.dataset.twColFiltered === '1';
  const filteredOut = allRows.filter(isHidden);
  filteredOut.forEach(r => r.style.display = 'none');
  const rows = allRows.filter(r => !isHidden(r));

  if (rows.length === 0 && filteredOut.length > 0) {
    // Search matched nothing — nothing else to show, no pagination bar.
    bar.style.display = 'none';
    return;
  }
  if (rows.length <= TW_PAGE_SIZE) {
    rows.forEach(r => r.style.display = '');
    bar.style.display = 'none';
    return;
  }
  const totalPages = Math.max(1, Math.ceil(rows.length / TW_PAGE_SIZE));
  page = Math.min(Math.max(0, page), totalPages - 1);
  rows.forEach((row, i) => { row.style.display = (i >= page * TW_PAGE_SIZE && i < (page + 1) * TW_PAGE_SIZE) ? '' : 'none'; });
  bar.style.display = 'flex';
  bar.innerHTML = `
    <button class="btn btn-outline" style="padding:3px 10px;font-size:12px;" ${page === 0 ? 'disabled' : ''} onclick="paginateTable(document.getElementById('${table.id}'), ${page - 1})">Prev</button>
    <span>Page ${page + 1} of ${totalPages} · ${rows.length} rows</span>
    <button class="btn btn-outline" style="padding:3px 10px;font-size:12px;" ${page >= totalPages - 1 ? 'disabled' : ''} onclick="paginateTable(document.getElementById('${table.id}'), ${page + 1})">Next</button>`;
}

// ------------------------------------------------------------
// BULK UPDATE (Settings → Bulk Update, Admin only) — generic CSV/XLSX
// driven bulk update: works on any table, any columns. First column in
// the uploaded file is the match key (id / lead_no / whatever is unique
// per row); every other column present in the file gets written to the
// matching row via .update({...}).eq(keyCol, keyValue) — one request per
// row, run sequentially so the results list stays accurate and a single
// bad row doesn't abort the whole batch.
// ------------------------------------------------------------
let bulkUpdateRows = null;
let bulkUpdateHeader = null;

function resetBulkUpdate() {
  bulkUpdateRows = null;
  bulkUpdateHeader = null;
  const fileInput = document.getElementById('buFile');
  if (fileInput) fileInput.value = '';
  const previewArea = document.getElementById('buPreviewArea');
  if (previewArea) previewArea.style.display = 'none';
  const resultsArea = document.getElementById('buResultsArea');
  if (resultsArea) { resultsArea.style.display = 'none'; resultsArea.innerHTML = ''; }
  const sqlResultsArea = document.getElementById('buSqlResultsArea');
  if (sqlResultsArea) { sqlResultsArea.style.display = 'none'; sqlResultsArea.innerHTML = ''; }
  showBulkUpdateMode('file');
}

function showBulkUpdateMode(mode) {

// Runs a hand-written SQL statement (typically a single-column UPDATE)
// via the exec_admin_sql() DB function — a SECURITY DEFINER function that
// bypasses RLS the same way Supabase Studio's own SQL editor does, so it
// works even on tables like rewire_omini_pay_archive that only have a
// read policy for the app's normal client-side calls.
async function runBulkUpdateSql() {
  const sqlText = document.getElementById('buSqlText').value.trim();
  const resultsArea = document.getElementById('buSqlResultsArea');
  if (!sqlText) { notify('Write a SQL statement first.', { icon: 'error' }); return; }
  if (!confirm('This runs directly against the database with no undo. Continue?\n\n' + sqlText)) return;

  const { data, error } = await sb.rpc('exec_admin_sql', { sql_text: sqlText });
  resultsArea.style.display = '';
  if (error) {
    resultsArea.innerHTML = `<div class="info-banner" style="background:#fef2f2;border-color:#fecaca;"><i class="ti ti-alert-triangle" aria-hidden="true"></i><span style="color:#dc2626;">${error.message}</span></div>`;
    notify('SQL failed: ' + error.message, { icon: 'error' });
  } else {
    const rowsAffected = data && data.rows_affected !== undefined ? data.rows_affected : JSON.stringify(data);
    resultsArea.innerHTML = `<div class="info-banner"><i class="ti ti-circle-check" aria-hidden="true"></i><span><strong>${rowsAffected}</strong> row(s) affected.</span></div>`;
    notify(`SQL ran — ${rowsAffected} row(s) affected.`);
  }
}

function bulkUpdateFileSelected(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const resultsArea = document.getElementById('buResultsArea');
  if (resultsArea) { resultsArea.style.display = 'none'; resultsArea.innerHTML = ''; }

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (!json.length) { notify('File has no data rows.', { icon: 'error' }); return; }
      // SheetJS names any column whose header cell is blank "__EMPTY",
      // "__EMPTY_1", etc — a common leftover from Excel formatting (extra
      // bordered/merged cells with no real header). Those aren't real
      // columns in the DB and would fail the update with "Could not find
      // the '__EMPTY' column ... in the schema cache" — drop them here so
      // the file doesn't need manual cleanup before every bulk update.
      const rawHeader = Object.keys(json[0]);
      bulkUpdateHeader = rawHeader.filter(h => !/^__EMPTY/.test(h));
      bulkUpdateRows = json;
      renderBulkUpdatePreview();
    } catch (err) {
      notify('Could not read file: ' + err.message, { icon: 'error' });
    }
  };
  reader.readAsArrayBuffer(file);
}

function renderBulkUpdatePreview() {
  const previewArea = document.getElementById('buPreviewArea');
  const head = document.getElementById('buPreviewHead');
  const body = document.getElementById('buPreviewBody');
  if (!bulkUpdateRows || !bulkUpdateRows.length) { previewArea.style.display = 'none'; return; }

  head.innerHTML = '<tr>' + bulkUpdateHeader.map(h => `<th>${h}</th>`).join('') + '</tr>';
  const showRows = bulkUpdateRows.slice(0, 200); // preview cap — full file still runs on update
  body.innerHTML = showRows.map(r => '<tr>' + bulkUpdateHeader.map(h => `<td>${r[h] === '' || r[h] === undefined ? '—' : r[h]}</td>`).join('') + '</tr>').join('');
  document.getElementById('buPreviewCount').textContent = bulkUpdateRows.length + ' row(s) parsed'
    + (bulkUpdateRows.length > 200 ? ' (showing first 200)' : '') + ' — key column: ' + bulkUpdateHeader[0];
  previewArea.style.display = '';
}

async function runBulkUpdate() {
  const tableName = getBulkUpdateTableName();
  const keyColumn = document.getElementById('buKeyColumn').value.trim();
  if (!tableName) { notify('Enter the table name.', { icon: 'error', title: 'Missing table' }); return; }
  if (!keyColumn) { notify('Enter the match key column.', { icon: 'error', title: 'Missing key column' }); return; }
  if (!bulkUpdateRows || !bulkUpdateRows.length) { notify('Upload a file first.', { icon: 'error' }); return; }
  if (!bulkUpdateHeader.includes(keyColumn)) { notify(`Key column "${keyColumn}" is not a column in the uploaded file.`, { icon: 'error' }); return; }
  const updateCols = bulkUpdateHeader.filter(h => h !== keyColumn);
  if (!updateCols.length) { notify('File only has the key column — nothing to update.', { icon: 'error' }); return; }

  if (!confirm(`This will update ${bulkUpdateRows.length} row(s) in "${tableName}" (columns: ${updateCols.join(', ')}), matched by "${keyColumn}". This cannot be undone in bulk. Continue?`)) return;

  let success = 0, failed = [];
  for (const row of bulkUpdateRows) {
    const keyVal = row[keyColumn];
    if (keyVal === '' || keyVal === undefined) { failed.push({ key: '(blank)', error: 'Blank key value — row skipped' }); continue; }
    const payload = {};
    updateCols.forEach(c => { payload[c] = (row[c] === '' ? null : row[c]); });
    // .select() after .update() is required to actually see whether a row
    // came back — without it, Supabase returns no error even when RLS (or
    // a bad key value) silently matched zero rows, which looks exactly
    // like success but nothing was written.
    const { data, error } = await sb.from(tableName).update(payload).eq(keyColumn, keyVal).select();
    if (error) failed.push({ key: keyVal, error: error.message });
    else if (!data || data.length === 0) failed.push({ key: keyVal, error: 'No row updated — either no row matches this key, or a permission/RLS policy on this table is silently blocking the write.' });
    else success++;
  }

  const resultsArea = document.getElementById('buResultsArea');
  resultsArea.style.display = '';
  resultsArea.innerHTML = `
    <div class="info-banner" style="margin-bottom:10px;${failed.length ? 'background:#fef2f2;border-color:#fecaca;' : ''}">
      <i class="ti ti-${failed.length ? 'alert-triangle' : 'circle-check'}" aria-hidden="true"></i>
      <span><strong>${success}</strong> row(s) updated successfully${failed.length ? `, <strong>${failed.length}</strong> failed (see below)` : '.'}</span>
    </div>
    ${failed.length ? `<table class="crm-table"><thead><tr><th>${keyColumn}</th><th>Error</th></tr></thead><tbody>${
      failed.map(f => `<tr><td>${f.key}</td><td style="color:#dc2626;">${f.error}</td></tr>`).join('')
    }</tbody></table>` : ''}`;
  notify(`Bulk update done: ${success} succeeded, ${failed.length} failed.`, { icon: failed.length ? 'error' : 'success' });
}

function getOrCreatePaginationBar(table) {
  let bar = table.nextElementSibling;
  if (!bar || !bar.classList.contains('tw-pagination')) {

async function loadCurrentProfile() {
  // Retries (a transient network/auth-refresh hiccup used to leave currentProfile = null and every
  // section then crashed with "Cannot read properties of null (reading 'role')" - Ramvir, Oct 2026).
  let lastErr = null;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const { data: { user }, error: uErr } = await sb.auth.getUser();
      if (uErr) throw uErr;
      if (!user) { lastErr = new Error('Session expired - please log in again.'); break; }
      const { data, error } = await sb.from('rewire_user_profiles').select('*').eq('id', user.id).single();
      if (error) throw error;
      currentProfile = data;
      document.getElementById('userNameLabel').textContent = data.name + ' (' + data.role + ')';
      document.getElementById('userAvatar').textContent = data.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
      await applyRoleBasedUI(data.role);
      if (data.role === 'CRE') { currentSectionName = 'calling-today'; if (typeof showSection === 'function') setTimeout(() => showSection('calling-today'), 0); }
      return currentProfile;
    } catch (e) {
      lastErr = e; console.error('loadCurrentProfile attempt ' + attempt + ' failed', e);
      await new Promise(r => setTimeout(r, 700 * attempt));
    }
  }
  const msg = (lastErr && lastErr.message) ? lastErr.message : 'Unknown error';
  document.body.innerHTML =
    '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Inter,sans-serif;gap:14px;text-align:center;padding:20px;">' +
    '<div style="font-size:15px;color:#475569;">Could not load your profile.</div>' +
    '<div style="font-size:12px;color:#b91c1c;max-width:520px;">' + String(msg).replace(/</g, '&lt;') + '</div>' +
    '<div style="display:flex;gap:10px;"><button onclick="location.reload()" style="padding:10px 20px;background:#1d4ed8;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Retry</button>' +
    '<button onclick="window.top.location.href=APP_URL+\'?page=login\'" style="padding:10px 20px;background:#fff;color:#1d4ed8;border:1px solid #1d4ed8;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Login again</button></div></div>';
  return null;
}

// Set of gate keys the CURRENT logged-in user's role is allowed to see.
// Populated by applyRoleBasedUI() below. Admin is represented as the
// special value '*' (never fetched from the DB — see comment above).
let currentAllowedGates = new Set();

// Returns true if the current user's role has access to `key`. Use this
// (instead of re-deriving from roleAccess, which no longer exists) for any
// JS logic that needs to branch on role access outside of a plain
// data-role-gate DOM toggle — e.g. "smart routing" to whichever COD/CVS
// tab or RC Tracking view the role actually has.
function hasGateAccess(key) {
  return currentAllowedGates.has('*') || currentAllowedGates.has(key);
}

async function applyRoleBasedUI(role) {
  if (role === 'Admin') {
    // Admin is hardcoded — never touches rewire_role_permissions, so a
    // mistaken edit in the Permissions Editor can never lock Admin out.
    currentAllowedGates = new Set(['*']);
  } else {
    const { data, error } = await sb.from('rewire_role_permissions').select('gate_key').eq('role', role);
    if (error) {
      console.error('Failed to load role permissions:', error);
      currentAllowedGates = new Set();
    } else {
      currentAllowedGates = new Set((data || []).map(r => r.gate_key));
    }
    // Calling access switch (Settings > Users) — lets a PE (or any role) also use the Calling module without changing their role
    if (currentProfile && currentProfile.calling_access) ['calling-today', 'calling-leads', 'calling-other', 'calling-performance'].forEach(g => currentAllowedGates.add(g));
  }
  document.querySelectorAll('[data-role-gate]').forEach(el => {
    if (el.hasAttribute('data-disabled')) { el.style.display = 'none'; return; } // Crane Charges retired (Oct 2026)
    const need = el.getAttribute('data-role-gate');
    el.style.display = hasGateAccess(need) ? '' : 'none';
  });

  // Stock Bulk Update (Ramvir, Sept 2026) — hardcoded Admin-only, deliberately
  // NOT wired through rewire_role_permissions like the rest of this
  // function: this writes Material/Stock data directly in bulk, so it
  // should never be grantable to another role via the Permissions Editor.
  const stockBulkBtn = document.getElementById('stockBulkUpdateBtn');
  if (stockBulkBtn) stockBulkBtn.style.display = (role === 'Admin') ? '' : 'none';

  // Manager sees Purchased/Payments/Commission but view-only for the
  // commission LEDGER itself — "Generate Excel" (which flips pending
  // records to Paid) is hidden. Manage Payees stays visible since Manager
  // is the one who adds/maintains the payee list. The Payments table
  // itself swaps its inputs for plain text at render time (see
  // renderPaymentsTable in JS-Payments.html) based on this same check.
  window.isViewOnlyRole = (role === 'Manager');
  const commissionExport = document.getElementById('commissionExportControls');
  if (commissionExport) commissionExport.style.display = window.isViewOnlyRole ? 'none' : '';
}

// the Cash Commission payout picker in Price Negotiation. Deliberately
// separate from allPartners/rewire_partners since GST/bank details are
// not required here (per business requirement).
// ------------------------------------------------------------
async function loadCommissionPersons() {
  allCommissionPersons = await fetchAllRows((from, to) => sb.from('rewire_commission_persons').select('*').order('name').range(from, to))
    .catch(err => { console.error(err); return []; });
}
function filterCommissionPS(idx, v) {
  openPSD('psdComm' + idx);
  const el = document.getElementById('pListComm' + idx);
  if (!el) return;
  const q = v.toLowerCase().trim();
  const filtered = q ? allCommissionPersons.filter(p => p.name.toLowerCase().includes(q)) : allCommissionPersons;
  let html = filtered.map(p => `<div class="ps-item" onclick="selectCommissionPerson(${idx},'${p.id}','${p.name.replace(/'/g,"\\'")}')">
    <div class="ps-item-avatar">${p.name.charAt(0)}</div>
    <div><div class="ps-item-name">${p.name}</div></div>
  </div>`).join('');
  if (q && !allCommissionPersons.some(p => p.name.toLowerCase() === q)) {
    html += `<div class="ps-add" onclick="selectCommissionPerson(${idx},'','${v.replace(/'/g,"\\'")}')"><i class="ti ti-plus" style="font-size:14px;" aria-hidden="true"></i> Add "${v}" as new person</div>`;
  }
  el.innerHTML = html || '<div class="ps-item" style="color:var(--color-text-tertiary);font-size:12px;">Type a name to search or add</div>';
}
function selectCommissionPerson(idx, id, name) {
  const input = document.getElementById('pnCommissionName' + idx);
  if (!input) return;
  input.value = name;
  input.dataset.personId = id || '';
  const dd = document.getElementById('psdComm' + idx);
  if (dd) dd.classList.remove('open');
}

// Payment Mode dropdown (UPI/Bank) — UPI shows Phone Number + QR Code,
// Bank shows the existing Bank Details section. Neither section shows
// until a mode is picked, matching how the PN form's Customer/Broker
// bank sections stay hidden until their own trigger field is set.
function handleCpPaymentMode(v){
  document.getElementById('cpUpiSection').style.display = (v === 'UPI') ? '' : 'none';
  document.getElementById('cpBankSection').style.display = (v === 'Bank') ? '' : 'none';
}

async function submitNewCommissionPerson() {
  const paymentMode = document.getElementById('cpPaymentMode').value;
  const payload = readFields('#commissionPersonRegModal', {
    name: 'cp_name', mobile: 'cp_mobile', location: 'cp_location',
    account_holder_name: 'cp_account_holder_name', bank_name: 'cp_bank_name', branch_name: 'cp_branch_name',
    account_number: 'cp_account_number', ifsc_code: 'cp_ifsc_code',
    upi_phone_number: 'cp_upi_phone',
  });
  if (!payload.name) { notify('Name is required'); return; }
  payload.payment_mode = paymentMode || null;
  // Only keep the fields belonging to the selected mode — clears whichever
  // half wasn't shown instead of saving stale/blank values either way.
  if (paymentMode !== 'UPI') payload.upi_phone_number = null;
  if (paymentMode !== 'Bank') {
    payload.account_holder_name = null; payload.bank_name = null; payload.branch_name = null;
    payload.account_number = null; payload.ifsc_code = null;
  }

  const chequeFile = document.querySelector('#commissionPersonRegModal [data-field="cp_cheque_photo"]');
  payload.cheque_photo_url = (paymentMode === 'Bank' && chequeFile && chequeFile.files.length) ? await uploadFile(chequeFile.files[0], payload.name, 'Cancelled_Cheque') : null;
  const qrFile = document.querySelector('#commissionPersonRegModal [data-field="cp_upi_qr"]');
  payload.upi_qr_code_url = (paymentMode === 'UPI' && qrFile && qrFile.files.length) ? await uploadFile(qrFile.files[0], payload.name, 'UPI_QR_Code') : null;
  payload.created_by = currentProfile.id;

  const { error } = await sb.from('rewire_commission_persons').insert(payload);
  if (error) { notify('Error saving payee: ' + error.message, { icon: 'error' }); return; }

  notify('Payee saved.');
  closeModal('commissionPersonRegModal');
  document.querySelectorAll('#commissionPersonRegModal input[data-field]').forEach(el => {
    if (el.type === 'file') el.value = ''; else el.value = '';
  });
  document.getElementById('cpPaymentMode').value = '';
  handleCpPaymentMode('');
  await loadCommissionPersons();
  if (typeof renderCommissionPersonsSection === 'function') renderCommissionPersonsSection();
}

const PS_INPUT_MAP = { Add: 'pInputAdd', Edit: 'pInputEdit', Pn: 'pnBroker' };

function renderPartnerList(listId, partners, suffix) {
  const el = document.getElementById(listId);
  if (!el) return;
  suffix = suffix || (listId.includes('Add') ? 'Add' : listId.includes('Edit') ? 'Edit' : listId.replace('pList', ''));
  if (!partners.length) {
    el.innerHTML = '<div class="ps-item" style="color:var(--color-text-tertiary);font-size:12px;">No partners yet</div>';
    return;
  }
  el.innerHTML = partners.map(p => `<div class="ps-item" onclick="selectPartner('${suffix}','${p.id}','${p.partner_name.replace(/'/g,"\\'")}')">
    <div class="ps-item-avatar">${p.partner_name.charAt(0)}</div>
    <div><div class="ps-item-name">${p.partner_name}</div><div class="ps-item-phone">${p.mobile}${p.account_number ? ' · A/C ' + p.account_number : ''}</div></div>
    <div class="ps-item-loc"><i class="ti ti-map-pin" style="font-size:11px;" aria-hidden="true"></i>${p.location || ''}</div>
  </div>`).join('');
}
function filterPS(suffix, v) {
  openPSD('psd' + suffix);
  const filtered = allPartners.filter(p =>
    p.partner_name.toLowerCase().includes(v.toLowerCase()) || p.mobile.includes(v));
  renderPartnerList('pList' + suffix, filtered);
}
function selectPartner(suffix, id, name) {
  selectedPartnerId = id;
  const inputId = PS_INPUT_MAP[suffix] || ('pInput' + suffix);
  document.getElementById(inputId).value = name;
  document.getElementById('psd' + suffix).classList.remove('open');
  if (suffix === 'Pn') showPnBrokerBankDetails(id);
}

// Read-only reference — Price Negotiation's Broker field just picked a
// partner, so pull their bank details straight from the already-cached
// Partners directory (no extra query) and show them in the small

  document.getElementById('pnBrokerAccountHolder').value = partner.account_holder_name || '—';
  document.getElementById('pnBrokerBankName').value = partner.bank_name || '—';
  document.getElementById('pnBrokerBranchName').value = partner.branch_name || '—';
  document.getElementById('pnBrokerAccountNumber').value = partner.account_number || '—';
  document.getElementById('pnBrokerIfsc').value = partner.ifsc_code || '—';
  wrap.style.display = '';
}

// Renders one row in the "Attached Documents" section of the Partner
// View popup — a clickable "View" link (reuses viewAccessoryPhoto, which
// already handles both images and PDFs, falling back to opening the raw
// Drive URL in a new tab if it can't preview it) or "Not uploaded" if
// that document was never attached.
function docLink(label, url) {
  return `<div class="vd-row"><span class="vd-label">${label}</span>${isRealFileUrl(url)
    ? `<a href="javascript:void(0)" onclick="viewAccessoryPhoto('${url}','${label}')" style="color:#1d4ed8;text-decoration:underline;font-size:12px;">View</a>`
    : '<span class="vd-value">Not uploaded</span>'}</div>`;
}

function viewPartner(id) {
  const p = allPartners.find(x => x.id === id);
  if (!p) return;
  const isAdmin = currentProfile && currentProfile.role === 'Admin';
  document.getElementById('vpName').textContent = p.partner_name;
  // `upper` (5th arg) auto-uppercases PAN/GST/bank-detail fields as
  // Admin edits them inline here, matching the same behavior on the
  // Register New Partner form these values were originally entered on.
  const field = (label, key, value, upper) => isAdmin
    ? `<div class="vd-row"><span class="vd-label">${label}</span><input id="vpEdit_${key}" value="${value || ''}" ${upper ? `oninput="this.value=this.value.toUpperCase()"` : ''} style="border:0.5px solid var(--color-border-secondary);border-radius:5px;padding:4px 8px;font-size:12px;flex:1;" /></div>`
    : `<div class="vd-row"><span class="vd-label">${label}</span><span class="vd-value">${value || '—'}</span></div>`;

  document.getElementById('vpBody').innerHTML = `
    <div class="vd-section">Basic Information</div>
    <div class="vd-card">
      ${field('Mobile', 'mobile', p.mobile)}
      ${field('Email', 'email', p.email)}
      ${field('Location', 'location', p.location)}
    </div>
    <div class="vd-section">KYC &amp; Tax</div>
    <div class="vd-card">
      ${field('PAN Number', 'pan_number', p.pan_number, true)}
      ${field('GST Number', 'gst_number', p.gst_number, true)}
    </div>
    <div class="vd-section">Bank Details</div>
    <div class="vd-card">
      ${field('Account Holder Name', 'account_holder_name', p.account_holder_name, true)}
      ${field('Bank Name', 'bank_name', p.bank_name, true)}
      ${field('Branch', 'branch_name', p.branch_name, true)}
      ${field('Account No.', 'account_number', p.account_number)}
      ${field('IFSC', 'ifsc_code', p.ifsc_code, true)}
      ${isAdmin ? field('KYC Status', 'kyc_status', p.kyc_status) : ''}
    </div>
    <div class="vd-section">Attached Documents</div>
    <div class="vd-card">
      ${docLink('PAN Card', p.pan_card_url)}
      ${docLink('GST Certificate', p.gst_certificate_url)}
      ${docLink('Cancelled Cheque', p.cancelled_cheque_url)}
    </div>
    ${isAdmin ? `<button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;" onclick="withLoading(this, () => savePartnerEdit('${p.id}'))"><i class="ti ti-device-floppy" style="font-size:13px;"></i> Save Changes</button>` : ''}`;
  openModal('viewPartnerModal');
}

// Account Number must be unique across partners — Mobile is deliberately
// NOT checked here, since the same phone number can legitimately belong
// to more than one partner account (e.g. family members sharing a
// number); a bank account number, on the other hand, belongs to exactly
// one person, so that's the real duplicate signal. excludeId lets an
// edit-save skip matching against the partner's own existing row.
function findDuplicatePartnerByAccountNumber(accountNumber, excludeId) {
  const val = (accountNumber || '').trim().toLowerCase();
  if (!val) return null; // blank account number — nothing to compare
  return allPartners.find(p => p.id !== excludeId && (p.account_number || '').trim().toLowerCase() === val) || null;
}

async function loadPeAndManagerOptions() {
  const { data, error } = await sb.from('rewire_user_profiles').select('id, name, role, manager_id').eq('active', true);
  if (error) { console.error(error); return; }
  const pes = data.filter(u => u.role === 'PE');
  // A Manager entering a lead themselves needs their own name in the
  // "Select PE" list too — they aren't role PE, so the plain filter above
  // never includes them. Added only into this dropdown's own option list
  // (and mirrored into allPEs so pe_id -> name lookups elsewhere, e.g. lead
  // cards, resolve correctly instead of showing blank) — real PE-only
  // filters/reports that query the DB by role are unaffected.
  if (currentProfile && currentProfile.role === 'Manager') {
    const selfAsPe = data.find(u => u.id === currentProfile.id);
    if (selfAsPe && !pes.some(p => p.id === selfAsPe.id)) pes.push(selfAsPe);
  }
  const mgrs = data.filter(u => u.role === 'Manager');
  allManagers = mgrs;
  allPEs = pes; // now carries manager_id too, so a PE's manager can be looked up when a different PE is picked (see updateManagerForSelectedPE)
  allActiveUsers = data.slice().sort((a, b) => a.name.localeCompare(b.name));
  const peSel = document.getElementById('peAdd');
  const mgrSel = document.getElementById('mgrAdd');
  if (peSel) peSel.innerHTML = '<option value="">Select PE</option>' + pes.map(p => `<option value="${p.id}">${p.name}${p.role === 'Manager' ? ' (You)' : ''}</option>`).join('');
  if (mgrSel) mgrSel.innerHTML = '<option value="">Select Manager</option>' + mgrs.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
  if (peSel) peSel.onchange = () => { selectedPEId = peSel.value; updateManagerForSelectedPE(); };
  if (mgrSel) mgrSel.onchange = () => selectedManagerId = mgrSel.value;
}

// Keeps the Manager field in sync with whichever PE is currently selected
// in the peAdd dropdown — a PE can pick a colleague's name to enter a lead
// on their behalf, and the Manager shown must be THAT PE's manager, not
// the logged-in PE's own manager.
// For PE role this fills the read-only mgrAddDisplay field (they don't
// pick their own manager). For Manager/Admin — who get the normal mgrAdd
// <select> instead — this used to do nothing at all, so picking a PE never
// pre-filled Manager and it had to be looked up and set by hand every
// single time. Now it pre-selects the matching option in that dropdown
// too, while leaving it a normal, still-editable select so a genuine
// exception (lead handled by a different manager) can still be picked.
function updateManagerForSelectedPE() {
  const pe = allPEs.find(p => p.id === selectedPEId);
  // A Manager entering a lead as their own PE (the "(You)" option added
  // in loadPeAndManagerOptions above) IS the manager for that lead too —
  // there's nobody else to resolve, and pe.manager_id is always null for
  // a Manager (they don't report to another Manager). Previously that
  // fell straight through to the normal PE->Manager lookup below, which
  // found nothing and left Manager as null/"Not assigned" every time a
  // Manager self-handled a lead — this is exactly what produced 336 real
  // Purchased leads with manager_id null (they landed in the Dashboard's
  // Purchase Analytics "Unassigned" bucket instead of under that
  // Manager's own name; fixed with a one-time SQL backfill, Sept 2026).
  // Self-reference here going forward so it never recurs.
  const mgr = pe
    ? (pe.role === 'Manager' ? pe : allManagers.find(m => m.id === pe.manager_id))
    : null;
  // Only ever write an ID that actually resolved to a real Manager-role
  // user — previously this trusted pe.manager_id blindly, so a stale
  // mapping (e.g. pointing at someone whose role was later changed away
  // from Manager) got silently written into the new lead even while the
  // display correctly showed "Not assigned".
  selectedManagerId = mgr ? mgr.id : null;

  const mgrDisplay = document.getElementById('mgrAddDisplay');
  if (mgrDisplay && mgrDisplay.style.display !== 'none') {
    mgrDisplay.value = mgr ? mgr.name : 'Not assigned';
    return;
  }
  const mgrSel = document.getElementById('mgrAdd');
  if (mgrSel) mgrSel.value = selectedManagerId || '';
}

// ------------------------------------------------------------
// SHARED TABLE FILTER BAR — PE / Manager / Date range, reused across
// Purchased, Payments, Omini Pay, Commission, Crane Charges, Accessories
// Check. Each table gets its own state under tableFilterState[prefix] and
// its own re-render callback under tableFilterCallbacks[prefix] — Apply/
// Clear just update the state then call that table's own render function
// again, same as a search box triggering a re-render.
// ------------------------------------------------------------
let tableFilterState = {};
let tableFilterCallbacks = {};

// Call once from each table's render function, passing that table's own
// re-render function as the callback. Safe to call every render — it just
// repopulates the PE/Manager options (in case allPEs/allManagers weren't
// ready yet the first time) and re-applies whatever's already selected, so
// it never resets the user's filter mid-use.
function initTableFilterBar(prefix, renderCallback) {
  tableFilterCallbacks[prefix] = renderCallback;
  if (!tableFilterState[prefix]) tableFilterState[prefix] = { pe: '', manager: '', from: '', to: '' };
  const st = tableFilterState[prefix];
  const peSel = document.getElementById(prefix + 'FilterPe');
  const mgrSel = document.getElementById(prefix + 'FilterMgr');
  if (peSel && peSel.options.length <= 1) {
    peSel.innerHTML = '<option value="">All PE</option>' + allPEs.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  }
  if (mgrSel && mgrSel.options.length <= 1) {
    mgrSel.innerHTML = '<option value="">All Manager</option>' + allManagers.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
  }
  if (peSel) peSel.value = st.pe;
  if (mgrSel) mgrSel.value = st.manager;
  const fromEl = document.getElementById(prefix + 'FilterFrom');
  const toEl = document.getElementById(prefix + 'FilterTo');
  if (fromEl) fromEl.value = st.from;
  if (toEl) toEl.value = st.to;
}

function applyTableFilter(prefix) {
  const st = tableFilterState[prefix] || (tableFilterState[prefix] = { pe: '', manager: '', from: '', to: '' });
  const peEl = document.getElementById(prefix + 'FilterPe');
  const mgrEl = document.getElementById(prefix + 'FilterMgr');
  const fromEl = document.getElementById(prefix + 'FilterFrom');
  const toEl = document.getElementById(prefix + 'FilterTo');
  st.pe = peEl ? peEl.value : '';
  st.manager = mgrEl ? mgrEl.value : '';
  st.from = fromEl ? fromEl.value : '';
  st.to = toEl ? toEl.value : '';
  if (tableFilterCallbacks[prefix]) tableFilterCallbacks[prefix]();
}

function clearTableFilter(prefix) {
  tableFilterState[prefix] = { pe: '', manager: '', from: '', to: '' };
  ['FilterPe', 'FilterMgr', 'FilterFrom', 'FilterTo'].forEach(suffix => {
    const el = document.getElementById(prefix + suffix);
    if (el) el.value = '';
  });
  // Also reset this table's Excel-style column-header filters (Option A) —
  // the old PE/Manager <select> dropdowns above are gone from most tables
  // now, but "Clear" should still reset whatever filtering is active,
  // including a column filter someone set on PE/Manager/anything else.
  const table = document.querySelector('table.crm-table[data-filter-prefix="' + prefix + '"]');
  if (table) clearColumnFiltersForTable(table);
  if (tableFilterCallbacks[prefix]) tableFilterCallbacks[prefix]();
}

// Client-side filter for tables that fetch their full result set in one go
// (no server pagination) — Payments/Omini Pay/Commission/Crane Charges/
// Accessories Check all work this way already. getPeId/getMgrId/getDateStr
// are small accessor functions since each table's row shape is different
// (some have pe_id directly, some have it nested under a joined lead).
function filterRowsByTableFilter(rows, prefix, getPeId, getMgrId, getDateStr) {
  const st = tableFilterState[prefix];
  if (!st || (!st.pe && !st.manager && !st.from && !st.to)) return rows;
  return rows.filter(r => {
    if (st.pe && getPeId(r) !== st.pe) return false;
    if (st.manager && getMgrId(r) !== st.manager) return false;
    if (st.from || st.to) {
      const d = getDateStr(r); // expects 'YYYY-MM-DD' or null
      if (!d) return false;
      if (st.from && d < st.from) return false;
      if (st.to && d > st.to) return false;
    }
    return true;
  });
}

// ------------------------------------------------------------
// FILE UPLOAD HELPER — uploads to Google Drive (via Code.gs), returns
// the file's shareable view URL, which we store as a link in Supabase.
// folderName = vehicle number (or partner name) so all files for that
// vehicle/partner land in the same Drive folder across every stage.
// ------------------------------------------------------------
// Downscales + re-compresses photos client-side before upload (phone camera
// shots are often 3-8MB; that's what was making every upload form slow —
// the base64 payload has to cross the google.script.run bridge, which is
// slow for big files). Non-image files (PDF, etc.) pass through untouched.
function compressImage(file, maxDimension, quality) {
  return new Promise((resolve) => {
    if (!file.type.startsWith('image/') || file.type === 'image/gif') { resolve(file); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDimension || height > maxDimension) {
          if (width > height) { height = Math.round(height * maxDimension / width); width = maxDimension; }
          else { width = Math.round(width * maxDimension / height); height = maxDimension; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          if (!blob || blob.size >= file.size) { resolve(file); return; } // never upsize a small file
          resolve(new File([blob], file.name, { type: 'image/jpeg' }));
        }, 'image/jpeg', quality);
      };
      img.onerror = () => resolve(file);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(file);
    reader.readAsDataURL(file);
  });
}

// Uploads: max 2 at a time + up to 3 tries each. The Delivery form fires up to 11 uploads at once and
// Apps Script/Drive rejected some of them; the failed ones came back null and were silently dropped
// (L7103589: only Battery + Delivery photo got saved) - Ramvir, Oct 2026.
let _upActive = 0; const _upQueue = [];
function _upAcquire() { return new Promise(r => { if (_upActive < 2) { _upActive++; r(); } else _upQueue.push(r); }); }
function _upRelease() { const n = _upQueue.shift(); if (n) n(); else _upActive--; }
function _uploadFileOnce(file, folderName, fileLabel) {
  return compressImage(file, 1600, 0.72).then((upFile) => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = function () {
      const base64 = reader.result.split(',')[1];
      google.script.run
        .withSuccessHandler((url) => resolve({ url: url || null, err: url ? null : 'No file URL returned' }))
        .withFailureHandler((err) => resolve({ url: null, err: (err && err.message) || String(err) }))
        .uploadFileToDrive(base64, `${fileLabel}_${Date.now()}_${file.name}`, upFile.type, folderName);
    };
    reader.onerror = () => resolve({ url: null, err: 'Failed to read file' });
    reader.readAsDataURL(upFile);
  }));
}
async function uploadFile(file, folderName, fileLabel) {
  await _upAcquire();
  try {
    let last = null;
    for (let attempt = 1; attempt <= 3; attempt++) {
      const r = await _uploadFileOnce(file, folderName, fileLabel);
      if (r.url) return r.url;
      last = r.err;
      await new Promise(res => setTimeout(res, 900 * attempt));
    }
    notify('Upload failed (' + (fileLabel || 'file') + '): ' + last, { icon: 'error' });
    return null;
  } finally { _upRelease(); }
}

// The Drive folder for a lead's uploads is its vehicle number (once known
// from Valuation) — falls back to the Lead No before that's been entered.
function getVehicleFolderName() {

function readFields(scopeSelector, fieldMap) {
  const out = {};
  for (const [dbCol, selector] of Object.entries(fieldMap)) {
    const el = document.querySelector(`${scopeSelector} [data-field="${selector}"]`);
    if (!el) { out[dbCol] = null; continue; }
    if (el.type === 'file') { out[dbCol] = null; continue; } // files handled separately
    // Trim so stray leading/trailing spaces (common on mobile keyboards /
    // copy-paste) never reach the database — e.g. "Ramesh " and "Ramesh"
    // should always be treated and stored as the same name.
    const v = typeof el.value === 'string' ? el.value.trim() : el.value;
    out[dbCol] = v || null;
  }
  return out;
}

// Reverse of readFields() — given the same {dbCol: selector} map, pushes
// saved values from a lead row INTO the matching [data-field] inputs.
// Used when reopening an already-completed stage form for "one stage
// back" editing, so existing data shows up instead of a blank form.
function writeFields(scopeSelector, fieldMap, data) {
  if (!data) return;
  for (const [dbCol, selector] of Object.entries(fieldMap)) {
    const el = document.querySelector(`${scopeSelector} [data-field="${selector}"]`);
    if (!el || el.type === 'file') continue; // file inputs can't be repopulated
    el.value = data[dbCol] != null ? data[dbCol] : '';
  }
}

// Generic "all fields mandatory" checker for stage forms (Valuation, Bank
// KYC, Upload Delivery). Given a scope selector and a list of
// {selector, label} entries (selector = a CSS selector for the field,
// resolved first inside scope then document-wide for fields addressed by
// id), returns the label of the first missing/empty field, or null if
// everything is filled in. A field is skipped (not required right now) if
// it — or an ancestor — is currently display:none (conditional sections
// like the Cylinder Photo field) or the element itself is disabled
// (e.g. Price-Negotiation-style gated dropdowns). Plain <input>/<select>/
// <textarea> only — file inputs need per-form existing-URL fallback
// handling and are checked separately where this is called.
function findMissingRequiredField(scopeSelector, fields) {
  for (const f of fields) {
    const el = document.querySelector(`${scopeSelector} ${f.selector}`) || document.querySelector(f.selector);
    if (!el) continue;
    if (el.disabled) continue;
    if (el.offsetParent === null) continue; // hidden via display:none somewhere up the tree
    const val = (el.value || '').toString().trim();
    if (!val) return f.label;
  }
  return null;
}

// Resets every input/select/textarea inside a modal to blank/default.
// Called before a form modal is (re)opened so stale values left over
// from whoever/whichever-lead last used this same modal never carry
// into the next lead's form.
function clearModalFields(scopeSelector) {
  document.querySelectorAll(`${scopeSelector} input, ${scopeSelector} select, ${scopeSelector} textarea`).forEach(el => {
    if (el.type === 'file') { el.value = ''; return; }
    if (el.tagName === 'SELECT') { el.selectedIndex = 0; return; }
    el.value = '';
  });
  document.querySelectorAll(`${scopeSelector} .status-dep`).forEach(el => el.classList.remove('show'));
}

async function submitNewLead() {
  if (!currentProfile) { notify('Please log in first'); return; }
  // Catches an already-dead session BEFORE the user fills the whole form
  // and only finds out at the very end via a confusing RLS error (see the
  // insert's own error handling below for the full explanation).
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    notify('Your login session has expired. Please refresh the page and log in again before adding this lead.', { icon: 'error', title: 'Session Expired — Please Re-login' });
    return;
  }

  const payload = readFields('#addModal', {
    customer_name: 'customer_name', phone: 'phone', email: 'email',
    address: 'address', city: 'city', lead_source: 'lead_source',
    company_dealership_name: 'company_dealership_name',
  });
  payload.lead_type   = document.getElementById('ltAdd').value;
  payload.partner_id  = payload.lead_type === 'Partner' ? selectedPartnerId : null;
  // Every new lead starts at Need Analysis — the PE (or Manager/Admin)
  // later qualifies it or marks it Lost via Edit Lead, so there's no
  // Lead Status field on this form anymore.
  payload.lead_status = 'Need Analysis';
  payload.sub_status  = null;
  payload.pe_id       = selectedPEId || (currentProfile.role === 'PE' ? currentProfile.id : null);
  payload.manager_id  = selectedManagerId || null;
  payload.created_by  = currentProfile.id;

  const required = ['customer_name','phone','address','city','lead_source','lead_type'];
  for (const f of required) {
    if (!payload[f]) { notify(`Please fill: ${f.replace('_',' ')}`); return; }
  }
  // PE and Manager must both be set before a lead can be saved — previously
  // only enforced implicitly (a PE always gets themselves + their derived
  // Manager auto-filled, so this rarely bit that role), but a Manager/Admin
  // adding a lead on someone's behalf could leave both blank with no error,
  // silently creating an orphaned lead nobody's dashboard would show.
  if (!payload.pe_id) { notify('Please select a PE (Sales Executive).', { icon: 'error', title: 'Missing field' }); return; }
  if (!payload.manager_id) { notify('Please select/assign a Manager for this lead.', { icon: 'error', title: 'Missing field' }); return; }
  if (payload.city && !isValidMasterValue('location', payload.city)) {
    notify('"' + payload.city + '" is not in the Location master list. Ask Admin to add it in Settings → Master Data, or pick an existing option.', { icon: 'error', title: 'Invalid City' });
    return;
  }
  if (payload.city) payload.city = normalizeMasterValue('location', payload.city);
  // Company/Dealership Name is OPTIONAL — only validated against the
  // master list when the user actually typed something in.
  if (payload.company_dealership_name && !isValidMasterValue('company_dealership', payload.company_dealership_name)) {
    notify('"' + payload.company_dealership_name + '" is not in the Company/Dealership master list. Ask Admin to add it in Settings → Master Data, or pick an existing option, or leave this field blank.', { icon: 'error', title: 'Invalid Company/Dealership' });
    return;
  }
  payload.company_dealership_name = payload.company_dealership_name ? normalizeMasterValue('company_dealership', payload.company_dealership_name) : null;

  // Duplicate-phone SOFT warning (Ramvir, Sept 2026) — downgraded from a
  // hard block. One phone number legitimately sits on multiple active
  // leads in a bulk deal (same customer, several vehicles), so phone alone
  // can no longer refuse the save outright. Vehicle Number is the real
  // duplicate/fraud guard (see the hard block in JS-Pipeline.html's
  // Valuation submit — a vehicle number is genuinely 1:1 with a lead) and
  // stays a hard block, unchanged. This just warns the PE and lets them
  // confirm it's intentional (a new vehicle for a known customer) rather
  // than a genuine accidental re-entry.
  const { data: dupPhoneLeads, error: dupPhoneErr } = await sb.from('rewire_master_data')
    .select('lead_no, ud_status, ha_status, overall_status')
    .eq('phone', payload.phone);
  if (dupPhoneErr) { notify('Could not check for duplicate phone number: ' + dupPhoneErr.message, { icon: 'error' }); return; }
  const activePhoneLeads = (dupPhoneLeads || []).filter(l => {
    const isPurchased = l.ud_status === 'Complete' && l.ha_status === 'Approved';
    const isLost = l.overall_status === 'Closed Lost';
    return !isPurchased && !isLost;
  });
  if (activePhoneLeads.length) {
    const leadList = activePhoneLeads.map(l => l.lead_no).join(', ');
    const ok = await confirmDialog(`This phone number is already on ${activePhoneLeads.length > 1 ? 'active leads' : 'an active lead'} (${leadList}). If this is the same customer with another vehicle (bulk deal), continue. Otherwise cancel and double-check the number.`);
    if (!ok) return;
  }

  // Row-level-security-policy INSERT failure here almost never means the
  // user's ROLE is disallowed (PE/Manager/Admin/Back Office Head can all
  // insert per the DB policy) — it means the browser's Supabase session
  // itself was invalid at the moment of this request (expired/failed
  // silent token refresh, or the shared login session got cleared by
  // signing out in another tab of the same browser). auth.uid() then
  // reads as NULL server-side, so my_role() returns NULL and matches
  // nothing. Translating the raw Postgres error into something actionable
  // (Ramvir, Sept 2026 — traced from Manager Aditya Agarwal's "Error
  // saving lead: new row violates row-level security policy" report; his
  // profile/role were confirmed correct in the DB, so it wasn't a
  // permissions problem).
  const { data, error } = await sb.from('rewire_master_data').insert(payload).select().single();
  if (error) {
    if (error.message && error.message.toLowerCase().includes('row-level security')) {
      notify('Your login session has expired or is no longer valid, so the save was rejected — not a permissions problem. Please refresh the page (or log out and log back in) and try again.', { icon: 'error', title: 'Session Expired — Please Re-login' });
    } else {
      notify('Error saving lead: ' + error.message);
    }
    return;
  }

  notify(`Lead saved: ${data.lead_no}`);
  // WhatsApp "your request has been registered" confirmation to the
  // customer (WhatsApp.gs, customer_lead_registration template) --
  // fire-and-forget: a WhatsApp failure (bad number, template not yet
  // approved, etc.) must never block or roll back the lead that's
  // already saved, so this only logs to console on failure, no notify().
  if (payload.phone && typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withFailureHandler((err) => console.error('WhatsApp lead-confirmation send failed:', err))
      .notifyCustomerLeadCreated(payload.phone, payload.customer_name);
  }
  closeModal('addModal');
  resetAddLeadForm();
  await refreshLeadsTable();
}


</script>
