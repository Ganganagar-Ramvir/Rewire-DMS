// Payment Type "alt flow" check (Ramvir, Sept 2026 Credit addition) — every
// stage-progression gate across this app (VZ/Manager Approval/Accessories/
// Head Approval thresholds, Purchased-tab stage labels, Access Control edit
// gates, the PE stage-breakdown DB function) branches on whether a lead's
// pn_payment_type is the "normal" Post Delivery flow or one of the
// "alt" flows (Advance Payment/Omini Pay/Instant Payments, which reorder
// Delivery/VZ/Manager Approval relative to each other). Credit was added
// as a payment type that must go through the EXACT SAME stage order as
// Post Delivery — it only differs afterward, at the Payments stage, where
// it lands in its own "Credit Payment" tab instead of the normal queue
// (see renderCreditPaymentSection(), JS-Payments.html). So every one of
// those isAltFlow checks needs 'Credit' treated the same as 'Post
// Delivery' — this shared helper is the single source of truth for that,
// used everywhere instead of each call site repeating its own
// `!== 'Post Delivery'` check (which is how this logic used to be written,
// duplicated ~10 times — a single centralized check here means a future
// third "still follows Post Delivery order" payment type only needs to
// change in one place).
function isAltFlowPaymentType(pt) {
  return !!pt && pt !== 'Post Delivery' && pt !== 'Credit';
}

// Durable record of the Instant Payment notification email. The actual send
// happens via google.script.run -> GmailApp, which is fire-and-forget — its
// only other signal is an ephemeral toast that nobody may be looking at when
// it fires (modal's already closed, table's already refreshed, user's
// already moved on). This writes the real outcome onto the lead itself so a
// failure is a durable, query-able fact instead of a missed toast — this is
// what makes L7103090-style "email silently didn't go, found out days
// later" cases catchable going forward. Called from both the auto-send in
// submitVerificationZoho() and the manual resendInstantPaymentEmail().
async function markInstantEmailResult(leadId, status, errorMsg) {
  try {
    await sb.from('rewire_master_data').update({
      pn_instant_email_status: status,
      pn_instant_email_sent_at: status === 'Sent' ? new Date().toISOString() : null,
      pn_instant_email_error: status === 'Failed' ? (errorMsg || 'Unknown error') : null,
    }).eq('id', leadId);
  } catch (e) { console.error('markInstantEmailResult failed', e); }
}

// Fetches EVERY row matching a query, paging past PostgREST/Supabase's
// default row cap (1000) — a plain .select() with no .range() silently
// truncates at that cap with no error, which is easy to miss on a small
// table and only bites once a table grows past it. Bit this exact way:
// the "Approved lead missing its Payment row" Health Check and the
// Payments tab's "Find Missing Payment Rows" button both queried
// rewire_payments (4700+ rows) with no .range() at all, so most existing
// rows were invisible to the gap-check and got flagged as "missing"
// (675 false positives) — trying to insert them then failed on
// rewire_payments' unique (lead_id, payment_type) constraint, since a
// row already existed. queryFn(from, to) must return a supabase query
// (already filtered, NOT yet .range()'d) called with that range; this
// loops until a page comes back shorter than pageSize.
// .in('col', hugeList) breaks silently once the list is long (request URL too long -> error ignored ->
// blank columns / missing rows, e.g. DMS/COD/CVS numbers empty in the Purchased export). Run it in chunks.
// Usage: await fetchByIds(chunk => sb.from('t').select('...').in('col', chunk), ids)  ->  { data, error }
async function fetchByIds(buildFn, ids, chunkSize = 120) {
  const list = Array.from(new Set((ids || []).filter(x => x !== null && x !== undefined && x !== '')));
  let out = [], firstError = null;
  for (let i = 0; i < list.length; i += chunkSize) {
    try {
      const { data, error } = await buildFn(list.slice(i, i + chunkSize));
      if (error) { console.error('fetchByIds', error); firstError = firstError || error; continue; }
      out = out.concat(data || []);
    } catch (e) { console.error('fetchByIds', e); firstError = firstError || e; }
  }
  return { data: out, error: firstError };
}

async function fetchAllRows(queryFn, pageSize = 1000) {
  let all = [];
  let from = 0;
  let useIdOrder = true;
  while (true) {
    // Stable paging: PostgREST gives no row-order guarantee without ORDER BY, so rows updated
    // while paging (or queries with no .order) could be skipped/duplicated across pages and the
    // screen showed incomplete data. Add `id` as a final tie-breaker; fall back if a table has no `id`.
    let res;
    if (useIdOrder) {
      try { const q = queryFn(from, from + pageSize - 1); res = typeof q.order === 'function' ? await q.order('id', { ascending: true }) : await q; }
      catch (e) { res = { data: null, error: e }; }
      if (res.error && /column .*\bid\b|"id"|\.id\b/i.test(String(res.error.message || ''))) { useIdOrder = false; res = await queryFn(from, from + pageSize - 1); }
    } else {
      res = await queryFn(from, from + pageSize - 1);
    }
    const { data, error } = res;
    if (error) throw error;
    all = all.concat(data || []);
    if (!data || data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}

// Date-range filter boundaries (Ramvir, Sept 2026 — "date filter laga ke
// export karte time pura data nahi aata" on the Purchased tab). Every
// gte(dateStr)/lte(dateStr+'T23:59:59') pair across this app was sending a
// plain, offset-less timestamp string to a timestamptz column while the DB
// session runs in UTC — but the business (and every date picker here) runs
// in IST (UTC+5:30). A bare "2026-09-01" gte was actually being read as
// 2026-09-01 00:00 UTC, i.e. 2026-09-01 05:30 IST — silently EXCLUDING any
// row from the first 5.5 hours of that IST calendar day. Symmetrically,
// "...T23:59:59" lte was read as 2026-09-01 23:59:59 UTC, i.e. 2026-09-02
// 05:29 IST — silently INCLUDING rows from the first 5.5 hours of the NEXT
// day. Net effect: a "from X to Y" filter both dropped early-morning rows
// on day X and leaked in early-morning rows from the day after Y. Appending
// the explicit +05:30 offset makes Postgres read the boundary as the IST
// calendar day the user actually picked, regardless of session timezone.
// (Contrast with new Date(y,m,1).toISOString() elsewhere, e.g.
// openPurchaseSummaryDetail() in JS-Dashboard.html — that reads the
// browser's own local time first, so it was never affected by this bug.)
function istDayStart(dateStr) { return dateStr + 'T00:00:00+05:30'; }
function istDayEnd(dateStr) { return dateStr + 'T23:59:59+05:30'; }

// ------------------------------------------------------------
// GLOBAL TOPBAR SEARCH — "Search leads, customers, partners…" (App.html).
// This box previously had no handler at all — nothing was wired up, so
// typing into it did nothing. It's separate from every per-tab search
// box (those already search the full table server-side, not just the
// currently loaded page — see withSearch()). This one queries
// rewire_master_data (leads/customers — same table) and rewire_partners
// directly, across the WHOLE table regardless of which tab/page is
// currently open, and shows a dropdown of matches under the search box.
// ------------------------------------------------------------
let globalSearchDebounceTimer = null;
function onGlobalSearchInput(value) {
  clearTimeout(globalSearchDebounceTimer);
  const q = value.trim();
  const dropdown = document.getElementById('globalSearchDropdown');
  if (!dropdown) return;
  if (q.length < 2) { dropdown.style.display = 'none'; dropdown.innerHTML = ''; return; }
  globalSearchDebounceTimer = setTimeout(() => runGlobalSearch(q), 300);
}

// Best-effort "which table/tab is this lead currently sitting in" label
// for a search result — mirrors the membership rules each section's own
// query uses (loadNATab/loadQualTab/loadLostTab/renderPurchasedSection/
// JS-Payments.html's gates), computed client-side from the lead's own
// fields so the search result can say e.g. "Qualified Pipeline · Bank
// KYC" or "Purchased Vehicles" without navigating there first. It's a
// convenience hint, not a live re-check of each section's exact query —
// if a section's own rules ever change, update the matching branch here
// too.
function describeLeadLocation(l) {
  if (l.overall_status === 'Closed Lost') return 'Closed Lost';
  if (l.lead_status === 'Need Analysis') return 'All Leads · Need Analysis';
  if (l.ud_status === 'Complete' && l.ha_status === 'Approved') return 'Purchased Vehicles';
  const isAlt = isAltFlowPaymentType(l.pn_payment_type);
  // Payment Release — Advance Payment/Omini Pay only, current_stage 6,
  // still Pending (see loadQualTab curStage===10).
  if (isAlt && l.pn_payment_type !== 'Instant Payments' && l.current_stage === 6 && (l.payment_release_status || 'Pending') === 'Pending') {
    return 'Qualified Pipeline · Payment Release';
  }
  // Manager Approval / Verification & Zoho for Advance Payment/Omini Pay
  // — these land on current_stage 4 and 3 respectively (Delivery's slot
  // is skipped for them, see submitVerificationZoho/loadQualTab
  // curStage===6), NOT the generic STAGE_LABELS[current_stage+1] numbers
  // the fallback below assumes. Checked explicitly and BEFORE the Upload
  // Delivery check next, since "kyc done, ud not done" is true for this
  // whole window too (Delivery is decoupled/parallel) and would
  // otherwise always win first, masking a lead that's actually waiting
  // on Manager Approval as "still needs Delivery". Instant Payments
  // skips Manager Approval entirely — but NOT Verification & Zoho, which
  // Instant Payments still goes through (loadQualTab curStage===5's
  // altQuery includes all of ALT_PAYMENT_TYPES, Instant Payments included).
  // The Manager Approval half is guarded separately from the VZ half so an
  // Instant Payments lead genuinely due for VZ (current_stage===3) doesn't
  // get excluded by the same guard meant only for Manager Approval — it
  // used to fall through to the Upload Delivery check below instead
  // (kyc done + ud not done is also true during this whole window),
  // mislabeling it "Upload Delivery" instead of "Verification & Zoho".
  if (isAlt && (!l.ma_status || l.ma_status === 'Pending')) {
    if (l.current_stage === 4 && l.pn_payment_type !== 'Instant Payments') return 'Qualified Pipeline · Manager Approval';
    if (l.current_stage === 3) return 'Qualified Pipeline · Verification & Zoho';
  }
  // Upload Delivery — decoupled for Advance Payment/Omini Pay/Instant
  // Payments (fillable any time from Bank KYC done to Delivery done);
  // straightforward current_stage===3 for Post Delivery.
  if (isAlt ? (l.kyc_status === 'Complete' && l.ud_status !== 'Complete') : (l.current_stage === 3)) {
    return 'Qualified Pipeline · Upload Delivery';
  }
  // Accessories Check — due once Manager Approval is done (or Instant
  // Payments, which skips it), Delivery genuinely filled, and not yet
  // Confirmed. For Post Delivery this ALSO requires current_stage===6
  // (matching loadQualTab's real curStage===7 query, JS-Dashboard.html) —
  // just trusting the ma_status flag isn't enough: a lead whose Delivery
  // got reset/reopened after Manager Approval (e.g. the fake-Delivery
  // cleanup batches) can end up back at current_stage 5 (needs Manager
  // Approval again) while ma_status still stale-reads 'Approved' from
  // before the reset. Without the current_stage check this mislabeled it
  // "Accessories Check" even though the real tab correctly excluded it
  // (L7102346/L7102183 case). For Alt types, requiring `ud_filled_on` too
  // (not just ud_status==='Complete') matches the real query's defense
  // against the historical "fake Complete" import artifact — without it,
  // a fake-complete Alt-type lead would be mislabeled here even though
  // both real Accessories Check queries correctly exclude it.
  const maOk = l.ma_status === 'Approved' || l.pn_payment_type === 'Instant Payments';
  const accessoriesDue = isAlt ? (l.ud_status === 'Complete' && !!l.ud_filled_on) : l.current_stage === 6;
  if (maOk && l.accessories_check_status !== 'Confirmed' && accessoriesDue) {
    return 'Qualified Pipeline · Accessories Check';
  }
  // Head Approval — Alt payment types only, checked explicitly here (not
  // reachable via the generic STAGE_LABELS fallback below): current_stage
  // stays parked at 6 for these the whole time Delivery/Accessories Check
  // run in parallel, only advancing once submitHeadApproval() itself runs
  // — so once Delivery + Accessories are BOTH genuinely done but Head
  // Approval hasn't happened yet, current_stage is still 6, and the
  // fallback's `STAGE_LABELS[current_stage+1]` would give 'Accessories
  // Check' again (wrong — accessories is already Confirmed at this point).
  if (isAlt && l.ud_status === 'Complete' && l.ud_filled_on && l.accessories_check_status === 'Confirmed') {
    return 'Qualified Pipeline · Head Approval';
  }
  // Everything else (Valuation/Price Negotiation/Bank KYC/Verification &
  // Zoho/Manager Approval/final Head Approval — Post Delivery only, Alt
  // types are all handled explicitly above) — falls out of the same
  // "next stage after current_stage" numbering every one of those tabs
  // uses, via STAGE_LABELS (JS-Wiring.html).
  const label = (typeof STAGE_LABELS !== 'undefined' && STAGE_LABELS[(l.current_stage || 0) + 1]) || null;
  return label ? ('Qualified Pipeline · ' + label) : (l.lead_status || l.overall_status || '—');
}

// A lead's core Leads-pipeline stage (describeLeadLocation above) is only
// ONE of possibly several places it's sitting right now — Logistics,
// Logistics Payments, Received at Plant, RC Tracking, COD/CVS and
// Payments/Instant Payment/Archive are all separate, PARALLEL modules
// keyed off the same lead (or its vehicle number), not mutually
// exclusive with the pipeline stage or with each other. E.g. a dispatched
// vehicle shows in BOTH "Received at Plant" and "Logistics Payments" at
// the same time. Returns an array of {label, go()} — zero or more extra
// locations, on top of the one describeLeadLocation()/navigateToLeadLocation()
// already give — computed client-side from fields already fetched by
// runGlobalSearch(), mirroring each section's own query filter (see the
// comment above each one in JS-Operations.html/JS-Tracking.html/
// JS-Payments.html).
// Every pushed location now carries a `pending` flag (true = something
// still needs doing there, false = informational/terminal — already done,
// just showing where it ended up). See the ranking note in runGlobalSearch
// for why this replaced the two earlier (wrong) attempts at ranking by
// "most urgent tab" and then by "latest in the sequence" — Ramvir pointed
// out those both mis-highlighted a DONE/terminal location (Received at
// Plant, then Payments Archive) over a genuinely still-pending one (RC
// Tracking, COD/CVS). The only rule that actually holds up: anything still
// pending always outranks anything already done, full stop.
function getOperationalLocations(l, paymentsByLead, archiveByLead, codCvsByReg, receiptByLead, docsByLead, materialsByLead) {
  const locs = [];
  // Logistics — delivered, not yet dispatched to plant.
  // (Ramvir, Oct 2026) — excludes vehicles already in a terminal Vehicle
  // Disposal state (Reserved/Scrapped/Scrapped - Provisionally). Found on
  // DL8CNA6599 (lead L7100499): it's long since Scrapped, but ud_status
  // stayed 'Complete' and logistics_status was never set from its original
  // delivery, so this block still fired and the global search showed
  // "Logistics" instead of "Vehicle Disposal · Scrapped" — the disposal
  // block below (lines ~284-290) already treats those 3 values as final,
  // this condition just didn't know about them.
  const udParkingIsDisposed = l.ud_vehicle_parking === 'Reserved' || l.ud_vehicle_parking === 'Scrapped' || l.ud_vehicle_parking === 'Scrapped - Provisionally';
  // Vehicles already parked AT Jaipur Plant never appear in the Logistics tab (nothing left to send), so don't claim they do.
  if (l.ud_status === 'Complete' && !l.logistics_status && !udParkingIsDisposed && l.ud_vehicle_parking !== 'Jaipur Plant') {
    locs.push({ label: 'Logistics', pending: true, go: () => showSection('logistics') });
  }
  if (l.logistics_status === 'Sent to Plant') {
    // Received at Plant is a WORKING list, not a permanent log — once both
    // halves (Accessories/plant_spare_wheel AND the RST no.) are done for a
    // lead, renderReceivedPlantSection() (JS-Operations.html) drops it from
    // its own "remaining" list entirely (see the comment there). This used
    // to unconditionally show "Received at Plant" for every dispatched
    // vehicle regardless of that — reported on RJ21GB7423, which had long
    // since finished plant processing (and moved on to Scrapped) but still
    // got shown, and even highlighted, as "Received at Plant". Now mirrors
    // the exact same not-both-done check the real tab uses, so it only
    // ever shows here while it's genuinely still pending.
    const receipt = receiptByLead ? receiptByLead[l.id] : null;
    const plantRemaining = !(receipt && receipt.rst_no && receipt.plant_spare_wheel);
    if (plantRemaining) {
      locs.push({ label: 'Vehicle Receiving', pending: true, go: () => showSection('receivedplant') });
    }
    // Logistics Payments, unlike Received at Plant, never drops a row once
    // paid (renderLogisticsPaymentsSection() shows "every dispatched
    // vehicle ever, Paid or not") — so it always shows for a dispatched
    // vehicle, but its pending flag now genuinely tracks whether the
    // freight is actually still owed. Restricted to vehicles that went via
    // a paid transporter (logistics_transporter_name set), matching that
    // tab's own filter — self-carried dispatches never appear there.
    if (l.logistics_transporter_name) {
      const paid = l.logistics_payment_status === 'Paid';
      locs.push({ label: 'Logistics Payments · ' + (paid ? 'Paid' : 'Pending'), pending: !paid, go: () => showSection('logistics-payments') });
    }
  }
  // Vehicle Disposal (Ramvir, Sept 2026 — was missing entirely, reported
  // on RJ21GB7423: it was actually sitting in the Scrapped tab but the
  // global search dropdown never said so). Keyed off the same
  // ud_vehicle_parking value each of the 3 Vehicle Disposal tabs itself
  // filters on (JS-Operations.html) — 'Jaipur Plant' = still pending a
  // disposal decision (pending:true — someone needs to act), 'Reserved'/
  // 'Scrapped'/'Scrapped - Provisionally' are all final outcomes
  // (pending:false — that vehicle's disposal is done, this is just where
  // it physically ended up).
  if (l.ud_vehicle_parking === 'Jaipur Plant' && l.overall_status !== 'Closed Lost') {
    locs.push({ label: 'Vehicle Disposal · Pending', pending: true, go: () => showSection('vehicle-disposal') });
  } else if (l.ud_vehicle_parking === 'Reserved') {
    locs.push({ label: 'Vehicle Disposal · Reserved', pending: false, go: () => showSection('vehicle-disposal-reserved') });
  } else if (l.ud_vehicle_parking === 'Scrapped' || l.ud_vehicle_parking === 'Scrapped - Provisionally') {
    locs.push({ label: 'Vehicle Disposal · ' + l.ud_vehicle_parking, pending: false, go: () => showSection('vehicle-disposal-scrapped') });
  }
  // RC Tracking — Physical RC leads only, still active. Split Pending vs
  // Received (isRcReceived(), JS-Tracking.html) the same way the tab
  // itself splits into two sub-sections — previously this showed
  // "RC Tracking" unconditionally even once the RC was already received,
  // which (like the Received at Plant bug above) could win a ranking it
  // had no business winning.
  if (l.ud_status === 'Complete' && l.ud_rc_received_type === 'Physical RC' && l.overall_status !== 'Closed Lost') {
    const received = typeof isRcReceived === 'function' && isRcReceived(l.rc_status);
    locs.push({
      label: 'RC Tracking · ' + (received ? 'Received' : 'Pending'),
      pending: !received,
      go: () => { showSection(received ? 'rc-tracking-received' : 'rc-tracking'); const el = document.getElementById('searchRc'); if (el) { el.value = l.lead_no; onSearchRc(l.lead_no); } },
    });
  }
  // COD/CVS — keyed by vehicle registration number, not lead_id.
  const codRow = l.val_vehicle_number ? codCvsByReg[l.val_vehicle_number.toUpperCase()] : null;
  if (codRow) {
    const codDone = !!codRow.uploaded_in_dms_rewire;
    locs.push({
      label: 'COD/CVS · ' + (codDone ? 'Completed' : 'Pending'),
      pending: !codDone,
      go: () => { showSection('codcvs'); const el = document.getElementById('searchCod'); if (el) { el.value = l.val_vehicle_number; filterCodCvsTable(l.val_vehicle_number); } },
    });
  }
  // Document Management — same eligibility as renderDocumentsSection()
  // (JS-Tracking.html): parked at Jaipur Plant, still active. Completeness
  // reuses that same tab's own DOCUMENT_ITEMS/isDocItemCollected() logic
  // (13 items) so the count here can never drift out of sync with what the
  // tab itself shows. Added per Ramvir's request — this was missing
  // entirely before, same gap Vehicle Disposal had.
  if (l.ud_vehicle_parking === 'Jaipur Plant' && l.overall_status !== 'Closed Lost' && typeof DOCUMENT_ITEMS !== 'undefined') {
    const doc = docsByLead ? docsByLead[l.id] : null;
    const collected = DOCUMENT_ITEMS.filter(([, , statusKey, , isRcType]) => isDocItemCollected(doc, statusKey, isRcType)).length;
    const complete = collected === DOCUMENT_ITEMS.length;
    locs.push({
      label: `Document Management · ${collected}/${DOCUMENT_ITEMS.length}`,
      pending: !complete,
      go: () => { showSection('documents'); if (typeof showDocumentsTab === 'function') showDocumentsTab(complete ? 'all' : 'incomplete'); },
    });
  }
  // Material — same eligibility as renderMaterialSection() (JS-Tracking.
  // html): ud_status Complete + dispatched to plant + actually received
  // (rst_no filled). Completeness reuses MATERIAL_CATEGORIES/
  // countMaterialCategoriesFilled() (14 categories), same reasoning as
  // Document Management above. Also new — was missing entirely before.
  const receiptForMat = receiptByLead ? receiptByLead[l.id] : null;
  if (l.ud_status === 'Complete' && l.logistics_status === 'Sent to Plant' && receiptForMat && receiptForMat.rst_no && typeof MATERIAL_CATEGORIES !== 'undefined') {
    const mat = materialsByLead ? materialsByLead[l.id] : null;
    const collected = typeof countMaterialCategoriesFilled === 'function' ? countMaterialCategoriesFilled(mat) : 0;
    const complete = collected === MATERIAL_CATEGORIES.length;
    locs.push({
      label: `Material · ${collected}/${MATERIAL_CATEGORIES.length}`,
      pending: !complete,
      go: () => showSection('material'),
    });
  }
  // Instant Payment email — the auto-send at VZ-complete
  // (submitVerificationZoho(), JS-Pipeline.html) is a fire-and-forget
  // google.script.run -> GmailApp call; its only signal used to be an
  // ephemeral toast, which is exactly why this kept needing a manual
  // resend nobody noticed was needed (reported repeatedly, e.g. L7103090).
  // pn_instant_email_status is now written for real by markInstantEmailResult()
  // on both the auto-send and resendInstantPaymentEmail() — surfaced here so
  // "did the email actually go" is something the pending-first search
  // catches on its own instead of relying on someone watching the screen at
  // the exact moment it fires.
  //
  // Split into 2 cases (Ramvir, Sept 2026 — permanent-fix pass, after
  // finding the REAL root cause: rewire_verification_zoho's AFTER INSERT
  // trigger mirrors the new status onto rewire_master_data.vz_status before
  // submitVerificationZoho() ever re-reads it, so its old "was this already
  // Complete" guard always read true — every Instant Payments lead in the
  // DB had pn_instant_email_status = null, a 100% failure rate, not an edge
  // case; fixed at the source in submitVerificationZoho()). A DB sweep at
  // the same time found 168 already-Complete leads stuck with no
  // pn_omni_pay_to recorded at all — for those, "Resend" has nothing to
  // send (it doesn't know Customer/Broker/Both), so this used to hide them
  // from the pending list entirely (the `l.pn_omni_pay_to &&` condition
  // silently excluded them) — now surfaced with their own actionable label
  // instead of vanishing.
  if (l.pn_payment_type === 'Instant Payments' && l.vz_status === 'Complete' && l.pn_instant_email_status !== 'Sent') {
    if (l.pn_omni_pay_to) {
      locs.push({
        label: 'Instant Payment Email · ' + (l.pn_instant_email_status === 'Failed' ? 'Failed' : 'Not Sent'),
        pending: true,
        go: () => { if (typeof resendInstantPaymentEmail === 'function') resendInstantPaymentEmail(l.id); },
      });
    } else {
      locs.push({
        label: 'Instant Payment Email · Missing Omni/InstantPay To',
        pending: true,
        go: () => showSection('leads') && showTab('tab-qual'),
      });
    }
  }
  // Payments — a lead can have a Customer row AND a Broker row open at
  // once, each sitting in a different one of the 4 live tabs (Pending /
  // Hold / To be Sent for Payment / Pending UTR) depending on its own
  // status. Completed/Rejected rows are meant to have moved to Archive
  // already (handled below) — skip here in case the archive-move trigger
  // left a stale copy behind (same defensive filter
  // renderPaymentsSection/renderPendingUtrSection use).
  const isInstant = l.pn_payment_type === 'Instant Payments';
  const isCredit = l.pn_payment_type === 'Credit'; // own tab, never Pending/Hold/To be Sent/Pending UTR — see renderCreditPaymentSection() (JS-Payments.html)
  (paymentsByLead[l.id] || []).forEach(p => {
    if (p.status === 'Completed' || p.status === 'Rejected') return;
    let sectionId, searchInputId, filterFn, tabLabel;
    if (isCredit) {
      sectionId = 'credit-payment'; searchInputId = 'searchCreditPayment'; filterFn = filterCreditPaymentTable;
      tabLabel = 'Credit Payment';
    } else if (isInstant || p.status === 'Pending UTR') {
      sectionId = 'pending-utr'; searchInputId = 'searchPendingUtr'; filterFn = filterPendingUtrTable;
      tabLabel = isInstant ? 'Instant Payment' : 'Pending UTR';
    } else if (p.status === 'Hold') {
      sectionId = 'payments-hold'; searchInputId = 'searchPaymentsHold'; filterFn = filterPaymentsHoldTable;
      tabLabel = 'Payments Hold';
    } else if (p.status === 'To be Sent for Payment') {
      sectionId = 'payments-tobesent'; searchInputId = 'searchToBeSent'; filterFn = filterToBeSentTable;
      tabLabel = 'To be Sent for Payment';
    } else {
      sectionId = 'payments'; searchInputId = 'searchPayments'; filterFn = filterPaymentsTable;
      tabLabel = 'Payments';
    }
    locs.push({
      label: tabLabel + ' · ' + p.payment_type + ' · ' + p.status,
      pending: true, // every live (non-Completed/Rejected) rewire_payments row is, by definition, still owed
      go: () => { showSection(sectionId); const el = document.getElementById(searchInputId); if (el) { el.value = l.lead_no; } filterFn(l.lead_no); },
    });
  });
  if (archiveByLead[l.id]) {
    locs.push({
      label: 'Payments Archive',
      pending: false,
      go: () => { showSection('payments-archive'); const el = document.getElementById('searchPaymentsArchive'); if (el) { el.value = l.lead_no; } filterPaymentsArchiveTable(l.lead_no); },
    });
  }
  return locs;
}

// Actually navigates to wherever describeLeadLocation() said the lead is
// — mirrors that same logic (see there for the "why" on each branch,
// especially the Advance Payment/Omini Pay stage numbers) but calls the
// real navigation functions instead of returning a text label. Lets the
// user land directly on the tab/section itself, rather than only getting
// a text hint and having to go hunt for it — which is what exposed the
// L7102577 case in the first place (search said "Verification & Zoho",
// but nothing in that real tab, or any tab, actually had it — describe
// AND navigate now agree, and the underlying tab-query bug is fixed in
// loadQualTab curStage===6 / supabase-batch64).
let lastGlobalSearchLeads = [];
// Populated fresh on every runGlobalSearch() render — each entry is the
// actual go() closure for one location line in the dropdown (both the
// primary pipeline-stage line and every extra operational-tab line).
// Indices are embedded in the rendered HTML (onmousedown="...
// lastGlobalSearchActions[N]()"), so this array must stay in the exact
// order the HTML was built in — never sorted/mutated after render.
let lastGlobalSearchActions = [];
function navigateToLeadLocation(idx) {
  const l = lastGlobalSearchLeads[idx];
  if (!l) return;
  closeGlobalSearch();
  if (l.overall_status === 'Closed Lost') { showSection('leads'); showTab('tab-lost'); return; }
  if (l.lead_status === 'Need Analysis') { showSection('leads'); showTab('tab-na'); return; }
  if (l.ud_status === 'Complete' && l.ha_status === 'Approved') { showSection('purchased'); return; }
  showSection('leads'); showTab('tab-qual');
  const isAlt = isAltFlowPaymentType(l.pn_payment_type);
  if (isAlt && l.pn_payment_type !== 'Instant Payments' && l.current_stage === 6 && (l.payment_release_status || 'Pending') === 'Pending') {
    setStage(10); return;
  }
  if (isAlt && (!l.ma_status || l.ma_status === 'Pending')) {
    if (l.current_stage === 4 && l.pn_payment_type !== 'Instant Payments') { setStage(6); return; }
    if (l.current_stage === 3) { setStage(5); return; }
  }
  if (isAlt ? (l.kyc_status === 'Complete' && l.ud_status !== 'Complete') : (l.current_stage === 3)) {
    setStage(4); return;
  }
  const maOk = l.ma_status === 'Approved' || l.pn_payment_type === 'Instant Payments';
  const accessoriesDue = isAlt ? (l.ud_status === 'Complete' && !!l.ud_filled_on) : l.current_stage === 6;
  if (maOk && l.accessories_check_status !== 'Confirmed' && accessoriesDue) {
    setStage(7); return;
  }
  if (isAlt && l.ud_status === 'Complete' && l.ud_filled_on && l.accessories_check_status === 'Confirmed') {
    setStage(8); return;
  }
  const idxStage = (l.current_stage || 0) + 1;
  if (idxStage >= 1 && idxStage <= 9) setStage(idxStage);
}

async function runGlobalSearch(q) {
  const dropdown = document.getElementById('globalSearchDropdown');
  if (!dropdown) return;
  const esc = q.replace(/'/g, "''");
  const [{ data: leads, error: leadErr }, { data: partners, error: partnerErr }] = await Promise.all([
    sb.from('rewire_master_data')
      .select(`id, lead_no, customer_name, phone, val_vehicle_number, overall_status, lead_status,
        pn_payment_type, current_stage, kyc_status, ma_status, ud_status, ud_filled_on, accessories_check_status,
        ha_status, payment_release_status, logistics_status, ud_rc_received_type, ud_vehicle_parking,
        logistics_transporter_name, logistics_payment_status, rc_status, vz_status, pn_omni_pay_to,
        pn_instant_email_status, logistics_manifest_id`)
      .or(`lead_no.ilike.%${esc}%,customer_name.ilike.%${esc}%,phone.ilike.%${esc}%,val_vehicle_number.ilike.%${esc}%`)
      .order('created_at', { ascending: false })
      .limit(30),
    sb.from('rewire_partners')
      .select('id, partner_name, mobile')
      .or(`partner_name.ilike.%${esc}%,mobile.ilike.%${esc}%`)
      .limit(10),
  ]);
  // Manifests (Ramvir, Oct 2026): a vehicle's manifest shows as a location line, and typing a manifest no. finds it directly.
  let manifestHits = [], manifestById = {};
  try {
    const mIds = [...new Set((leads || []).map(l => l.logistics_manifest_id).filter(Boolean))];
    const [byId, byNo] = await Promise.all([
      mIds.length ? sb.from('rewire_logistics_manifests').select('id, manifest_no, transport_mode, payment_status, dispatch_date, to_location').in('id', mIds) : Promise.resolve({ data: [] }),
      /[\/]|^gvupl/i.test(q) || q.length >= 5 ? sb.from('rewire_logistics_manifests').select('id, manifest_no, transport_mode, payment_status, dispatch_date, to_location').ilike('manifest_no', `%${esc}%`).limit(8) : Promise.resolve({ data: [] }),
    ]);
    (byId.data || []).forEach(m => { manifestById[m.id] = m; });
    manifestHits = byNo.data || [];
  } catch (e) { console.error('global search manifests', e); }
  if (leadErr) console.error(leadErr);
  if (partnerErr) console.error(partnerErr);
  lastGlobalSearchLeads = leads || [];

  // Extra lookups so a matched lead can show EVERY tab it's currently
  // sitting in (Payments/Instant Payment/Archive, COD/CVS), not just its
  // core Leads-pipeline stage — see getOperationalLocations() above.
  // Scoped to only the leads actually matched here (at most 30), so this
  // stays cheap even though rewire_payments/rewire_cod_cvs are large
  // tables overall.
  const leadIds = lastGlobalSearchLeads.map(l => l.id);
  const vehicleNos = lastGlobalSearchLeads.map(l => l.val_vehicle_number).filter(Boolean);
  let paymentsExtra = [], archiveExtra = [], codCvsExtra = [], receiptExtra = [], docsExtra = [], materialsExtra = [];
  if (leadIds.length) {
    const [{ data: payData, error: payErr }, { data: archData, error: archErr }, { data: receiptData, error: receiptErr },
      { data: docsData, error: docsErr }, { data: materialsData, error: materialsErr }] = await Promise.all([
      sb.from('rewire_payments').select('lead_id, payment_type, status').in('lead_id', leadIds),
      sb.from('rewire_payments_archive').select('lead_id').in('lead_id', leadIds),
      // rst_no + plant_spare_wheel — same "is it actually still in the
      // Received at Plant working list" check renderReceivedPlantSection()
      // itself does (see getOperationalLocations() above).
      sb.from('rewire_vehicle_receipt').select('lead_id, rst_no, plant_spare_wheel').in('lead_id', leadIds),
      // Full rows (select('*')) for Documents/Material — same as their own
      // render functions fetch, since completeness is computed from every
      // one of DOCUMENT_ITEMS'/MATERIAL_CATEGORIES' field names, not a
      // short fixed list.
      sb.from('rewire_documents').select('*').in('lead_id', leadIds),
      sb.from('rewire_materials').select('*').in('lead_id', leadIds),
    ]);
    if (payErr) console.error(payErr);
    if (archErr) console.error(archErr);
    if (receiptErr) console.error(receiptErr);
    if (docsErr) console.error(docsErr);
    if (materialsErr) console.error(materialsErr);
    paymentsExtra = payData || [];
    archiveExtra = archData || [];
    receiptExtra = receiptData || [];
    docsExtra = docsData || [];
    materialsExtra = materialsData || [];
  }
  if (vehicleNos.length) {
    const vEsc = vehicleNos.map(v => v.replace(/'/g, "''"));
    const { data: codData, error: codErr } = await sb.from('rewire_cod_cvs')
      .select('registration_number, uploaded_in_dms_rewire')
      .or(vEsc.map(v => `registration_number.ilike.${v}`).join(','));
    if (codErr) console.error(codErr);
    codCvsExtra = codData || [];
  }
  const paymentsByLead = {};
  paymentsExtra.forEach(p => { (paymentsByLead[p.lead_id] = paymentsByLead[p.lead_id] || []).push(p); });
  const archiveByLead = {};
  archiveExtra.forEach(a => { archiveByLead[a.lead_id] = true; });
  const codCvsByReg = {};
  codCvsExtra.forEach(c => { if (c.registration_number) codCvsByReg[c.registration_number.toUpperCase()] = c; });
  const receiptByLead = {};
  receiptExtra.forEach(r => { receiptByLead[r.lead_id] = r; });
  const docsByLead = {};
  docsExtra.forEach(d => { docsByLead[d.lead_id] = d; });
  const materialsByLead = {};
  materialsExtra.forEach(m => { materialsByLead[m.lead_id] = m; });

  lastGlobalSearchActions = [];
  const rowStyle = 'padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--color-border-tertiary);';
  // Row itself still opens View Lead Details (unchanged) — each location
  // line underneath is its own clickable link (stopPropagation so it
  // doesn't also trigger the row's popup-open) that jumps straight to
  // that tab/section. A lead shows one line per tab it's CURRENTLY
  // sitting in — usually just one (its pipeline stage), but often more
  // (e.g. dispatched + Logistics Payments + a pending Broker payment, all
  // at once) — see getOperationalLocations() above for why.
  //
  // Highlighting the single most "where should I actually look" location
  // (Ramvir, Sept 2026, reported on RJ21GB7423 — it was sitting in Vehicle
  // Disposal · Scrapped, but with 5-6 locations listed with no ranking,
  // that one got lost in the noise). Two earlier attempts both got the
  // rule wrong:
  //   1st attempt — rank by "most urgent tab" (Payments/RC/Logistics all
  //   tied for top): wrongly picked Received at Plant over Scrapped, since
  //   Received at Plant/Logistics/RC Tracking were all lumped into one
  //   top tier regardless of whether they were still genuinely pending.
  //   2nd attempt — rank by "latest in the lifecycle sequence": wrongly
  //   picked Payments Archive (the sequence's very last step) over RC
  //   Tracking · Pending / COD/CVS · Pending, even though Payments being
  //   DONE says nothing about whether those other two are done.
  // The rule that actually holds up, per Ramvir: a location that still has
  // something PENDING always outranks one that's already done/terminal,
  // full stop — never mind sequence order. Every location object from
  // getOperationalLocations() now carries a `pending` boolean for exactly
  // this (see the comment above that function). Among several pending
  // locations, first-in-array wins (they're pushed in a reasonable
  // business-priority order already: Logistics/Plant, Vehicle Disposal,
  // RC Tracking, COD/CVS, Document Management, Material, then Payments).
  // Document Management and Material (also missing from this dropdown
  // entirely before — same gap Vehicle Disposal had) are now included too.
  const leadRows = (lastGlobalSearchLeads).map((l, i) => {
    const locations = [
      { label: describeLeadLocation(l), pending: !(l.ud_status === 'Complete' && l.ha_status === 'Approved'), go: () => navigateToLeadLocation(i) },
      ...getOperationalLocations(l, paymentsByLead, archiveByLead, codCvsByReg, receiptByLead, docsByLead, materialsByLead),
    ];
    const lm = l.logistics_manifest_id ? manifestById[l.logistics_manifest_id] : null;
    if (lm) locations.push({ label: 'Manifest · ' + lm.manifest_no + ' (' + (lm.transport_mode || 'Logistic Carrier') + ' · ' + (lm.payment_status || 'Pending') + ')', pending: false,
      go: () => { closeGlobalSearch(); if (typeof openManifestPopupById === 'function') openManifestPopupById(lm.id); } });
    let topIdx = 0;
    for (let idx = 0; idx < locations.length; idx++) {
      if (locations[idx].pending && !locations[topIdx].pending) { topIdx = idx; break; }
    }
    const locationLines = locations.map((loc, idx) => {
      const actionIdx = lastGlobalSearchActions.push(loc.go) - 1;
      const isTop = idx === topIdx;
      const style = isTop
        ? 'font-size:11px;color:#fff;background:#1d4ed8;font-weight:700;margin-top:4px;padding:3px 8px;border-radius:5px;display:inline-block;'
        : 'font-size:10.5px;color:#1d4ed8;font-weight:600;margin-top:2px;text-decoration:underline;';
      return `<div style="${style}" onmousedown="event.stopPropagation();lastGlobalSearchActions[${actionIdx}]()" title="${isTop ? 'Most likely where you need to look' : 'Go to this tab'}">${loc.label} <i class="ti ti-arrow-right" style="font-size:10px;" aria-hidden="true"></i></div>`;
    }).join('');
    return `
    <div style="${rowStyle}" onmousedown="closeGlobalSearch();viewLeadDetails('${l.id}')">
      <div style="font-weight:600;font-size:12.5px;color:#111827;">${l.customer_name || '—'} <span style="color:#6b7280;font-weight:400;">${l.lead_no}</span></div>
      <div style="font-size:11px;color:#6b7280;">${l.phone || '—'}${l.val_vehicle_number ? ' · ' + l.val_vehicle_number : ''}</div>
      ${locationLines}
    </div>`;
  }).join('');
  const partnerRows = (partners || []).map(p => `
    <div style="${rowStyle}" onmousedown="closeGlobalSearch();showSection('partners');document.getElementById('searchPartners').value='${(p.partner_name || '').replace(/'/g, "\\'")}';filterPartnersTable(document.getElementById('searchPartners').value);">
      <div style="font-weight:600;font-size:12.5px;color:#111827;">${p.partner_name} <span style="color:#6b7280;font-weight:400;">Partner</span></div>
      <div style="font-size:11px;color:#6b7280;">${p.mobile || '—'}</div>
      <div style="font-size:10.5px;color:#1d4ed8;font-weight:600;margin-top:2px;">Partners</div>
    </div>`).join('');

  const manifestRows = manifestHits.map(m => `
    <div style="${rowStyle}" onmousedown="closeGlobalSearch();openManifestPopupById('${m.id}')">
      <div style="font-weight:600;font-size:12.5px;color:#111827;">${m.manifest_no} <span style="color:#6b7280;font-weight:400;">Manifest</span></div>
      <div style="font-size:11px;color:#6b7280;">${m.transport_mode || 'Logistic Carrier'} · ${m.dispatch_date || ''} · ${m.payment_status || 'Pending'}${m.to_location ? ' · to ' + m.to_location : ''}</div>
      <div style="font-size:10.5px;color:#1d4ed8;font-weight:600;margin-top:2px;">Click to see vehicles in this manifest</div>
    </div>`).join('');
  const html = manifestRows + leadRows + partnerRows;
  dropdown.innerHTML = html || '<div style="padding:12px;font-size:12px;color:#6b7280;">No matches found.</div>';
  dropdown.style.display = '';
}

function closeGlobalSearch() {
  const dropdown = document.getElementById('globalSearchDropdown');
  const input = document.getElementById('globalSearchInput');
  if (dropdown) { dropdown.style.display = 'none'; dropdown.innerHTML = ''; }
  if (input) input.value = '';
}

document.addEventListener('click', (e) => {
  const dropdown = document.getElementById('globalSearchDropdown');
  const input = document.getElementById('globalSearchInput');
  if (!dropdown || !input) return;
  if (e.target !== input && !dropdown.contains(e.target)) dropdown.style.display = 'none';
});

// ------------------------------------------------------------
// MASTER DATA — Admin-managed lists (Settings → Master Data), backed by
// rewire_dropdown_options (list_key, value). Two consumption patterns:
//   1. DYNAMIC_DROPDOWNS — fills a plain <select> (e.g. Lead Source).
//   2. The generic MASTER SEARCH widget below — a searchable, but
//      STRICTLY select-from-list field (Make, Location, Company/
//      Dealership, Crane Vendor). Deliberately does NOT accept free
//      typing as a final value — only Admin can add new values (via
//      Master Data / Manage Vendors), so reports never end up with
//      one-off typo'd/inconsistent values. See MASTER SEARCH WIDGET
//      section further below for the input/validation functions.
// Add a new managed list by adding one entry to whichever of the two
// above fits, plus one entry to MASTER_DATA_LISTS (its card on the
// Master Data tab) — no other code changes needed.
// ------------------------------------------------------------
const DYNAMIC_DROPDOWNS = [
  { listKey: 'lead_source', selector: '#addModal [data-field="lead_source"]', placeholder: 'Select source' },
];
const MASTER_DATA_LISTS = [
  { listKey: 'vehicle_make', label: 'Make' },
  { listKey: 'lead_source', label: 'Lead Source' },
  { listKey: 'location', label: 'Location' },
  // Sub-Location (Ramvir, Sept 2026) — a Location can have named
  // Sub-Locations under it (e.g. Udaipur -> TLC Udaipur). Same
  // rewire_dropdown_options table, just with parent_value set to the
  // owning Location's value — parentListKey here tells
  // renderMasterDataSection() to render/manage it as a two-level list
  // instead of a flat one.
  { listKey: 'sub_location', label: 'Sub-Location', parentListKey: 'location' },
  { listKey: 'company_dealership', label: 'Company / Dealership Name' },
  { listKey: 'vehicle_dropping_person', label: 'Vehicle Dropping Person' },
  // Scrap Sold (Ramvir, Sept 2026) — "Commodity Name (Material Category)"
  // with a Sub Category dependent on it, same two-level parentListKey
  // pattern as Location -> Sub-Location above.
  { listKey: 'scrap_commodity_category', label: 'Scrap Commodity Category' },
  { listKey: 'scrap_commodity_subcategory', label: 'Scrap Commodity Sub Category', parentListKey: 'scrap_commodity_category' },
];

async function loadDynamicDropdowns() {
  const { data, error } = await sb.from('rewire_dropdown_options').select('id, list_key, value, parent_value').eq('active', true).order('sort_order').order('value');
  if (error) { console.error(error); return; }
  const grouped = {};
  (data || []).forEach(row => {
    (grouped[row.list_key] = grouped[row.list_key] || []).push({ id: row.id, value: row.value, parentValue: row.parent_value });
  });
  dropdownOptionsCache = grouped;
  DYNAMIC_DROPDOWNS.forEach(({ listKey, selector, placeholder }) => {
    const el = document.querySelector(selector);
    if (!el) return;
    const opts = grouped[listKey] || [];
    const current = el.value;
    el.innerHTML = `<option value="">${placeholder}</option>` + opts.map(o => `<option>${o.value}</option>`).join('');
    if (current) el.value = current;
  });
}

function renderMasterDataSection() {
  const container = document.getElementById('masterDataLists');
  if (!container) return;
  container.innerHTML = MASTER_DATA_LISTS.map(({ listKey, label, parentListKey }) => {
    const opts = dropdownOptionsCache[listKey] || [];
    const chip = (o) => `<span style="display:inline-flex;align-items:center;gap:6px;background:#f1f5f9;border:0.5px solid var(--color-border-secondary);border-radius:20px;padding:5px 10px;font-size:12px;margin:0 6px 6px 0;">${o.value}<i class="ti ti-pencil" style="cursor:pointer;color:#64748b;font-size:12px;" title="Rename" onclick="editDropdownOption('${o.id}','${o.value.replace(/'/g, "\\'")}')"></i><span style="cursor:pointer;color:#94a3b8;font-weight:700;" onclick="deleteDropdownOption('${o.id}')">&times;</span></span>`;

    // Hierarchical list (currently just Sub-Location under Location) —
    // grouped under each parent Location heading instead of one flat chip
    // bag, and the "Add" row needs a parent picked first.
    if (parentListKey) {
      const parentOpts = dropdownOptionsCache[parentListKey] || [];
      const groups = parentOpts.map(p => {
        const children = opts.filter(o => o.parentValue === p.value);
        const chips = children.map(chip).join('');
        return `<div style="margin-bottom:10px;">
          <div style="font-size:11px;font-weight:700;color:var(--color-text-secondary);margin-bottom:5px;">${p.value} <span style="font-weight:400;color:var(--color-text-tertiary);">(${children.length})</span></div>
          <div style="display:flex;flex-wrap:wrap;">${chips || '<span style="font-size:11px;color:var(--color-text-tertiary);">No sub-locations yet</span>'}</div>
        </div>`;
      }).join('');
      // Sub-locations whose parent Location got renamed/deleted after they
      // were added would otherwise silently vanish from view — surface them
      // under an "Unassigned" heading instead of hiding them.
      const orphans = opts.filter(o => !parentOpts.some(p => p.value === o.parentValue));
      const orphanBlock = orphans.length ? `<div style="margin-bottom:10px;">
        <div style="font-size:11px;font-weight:700;color:#dc2626;margin-bottom:5px;">Unassigned (parent Location missing) (${orphans.length})</div>
        <div style="display:flex;flex-wrap:wrap;">${orphans.map(chip).join('')}</div>
      </div>` : '';
      return `<div class="vd-card" style="margin-bottom:16px;">
        <div style="font-weight:700;font-size:13px;margin-bottom:10px;">${label} <span style="font-weight:400;color:var(--color-text-tertiary);">(${opts.length})</span></div>
        <div style="max-height:260px;overflow-y:auto;border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:10px;">${groups}${orphanBlock || (parentOpts.length ? '' : '<span style="font-size:12px;color:var(--color-text-tertiary);">Add a Location first, above.</span>')}</div>
        <div style="display:flex;gap:8px;margin-top:10px;max-width:500px;">
          <select id="ddParent_${listKey}" style="border:0.5px solid var(--color-border-secondary);border-radius:6px;padding:6px 10px;font-size:12px;">
            <option value="">Location…</option>
            ${parentOpts.map(p => `<option value="${p.value.replace(/"/g, '&quot;')}">${p.value}</option>`).join('')}
          </select>
          <input id="ddNew_${listKey}" placeholder="New ${label} value" style="flex:1;border:0.5px solid var(--color-border-secondary);border-radius:6px;padding:6px 10px;font-size:12px;" onkeydown="if(event.key==='Enter')addDropdownOption('${listKey}','${parentListKey}')" />
          <button class="btn btn-primary" onclick="addDropdownOption('${listKey}','${parentListKey}')">Add</button>
        </div>
      </div>`;
    }

    // Chip text is now a click target for rename (pencil icon) instead of
    // plain text — Admin could previously only delete-and-re-add a value,
    // which loses the "this rebrands to that" link (existing records keep
    // showing the OLD text, since delete never rewrites rows that already
    // used it). Editing in place via UPDATE keeps the same row id, so any
    // Master Search widget currently showing this value doesn't break.
    const chips = opts.map(chip).join('');
    return `<div class="vd-card" style="margin-bottom:16px;">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px;">${label} <span style="font-weight:400;color:var(--color-text-tertiary);">(${opts.length})</span></div>
      <div style="display:flex;flex-wrap:wrap;width:100%;box-sizing:border-box;max-height:260px;overflow-y:auto;border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:10px;">${chips || '<span style="font-size:12px;color:var(--color-text-tertiary);">No values yet</span>'}</div>

        <button class="btn btn-primary" onclick="addDropdownOption('${listKey}')">Add</button>
      </div>
    </div>`;
  }).join('');
}

async function addDropdownOption(listKey, parentListKey) {
  const input = document.getElementById('ddNew_' + listKey);
  const value = input ? input.value.trim() : '';
  if (!value) return;
  let parentValue = null;
  if (parentListKey) {
    const parentSelect = document.getElementById('ddParent_' + listKey);
    parentValue = parentSelect ? parentSelect.value : '';
    if (!parentValue) { notify('Pick a Location first.', { icon: 'error', title: 'Missing field' }); return; }

  if (error) { notify('Error adding value: ' + error.message, { icon: 'error' }); return; }

async function editDropdownOption(id, currentValue) {

  if (!trimmed || trimmed === currentValue) return;

  renderMasterDataSection();

async function deleteDropdownOption(id) {
  const ok = await confirmDialog('Remove this value? Records that already used it will keep showing it, only the dropdown loses the option.');
  if (!ok) return;

  if (error) { notify('Error deleting value: ' + error.message, { icon: 'error' }); return; }
  await loadDynamicDropdowns();
  renderMasterDataSection();

// EXISTING-UPLOAD HINT (Ramvir, Sept 2026 — "form edit karte hai to upload
// option dobara mangta hai... pahle se upload hui image bhi dikhni chahiye").
// The actual data was never being lost on re-save for most multi-file edit
// forms (Bank KYC/VZ/Upload Delivery already keep the old URL when no new
// file is picked — see each submit function's `if (url) payload.x = url`
// pattern) — the gap was purely visual: reopening one of these forms showed
// every file input as "No file chosen" with nothing telling the user a file
// is already saved, which reads as "it's gone" even though it isn't. This
// helper is the one fix for that everywhere: call it after prefilling a
// modal's other fields, with a {field: url} map (field = the input's
// data-field value), and it drops a small "Already uploaded" note + View
// link right under each file input that has a saved value, or hides that
// note when there's nothing saved (fresh entry). Doesn't touch save logic
// at all — purely what's shown on screen.
function markExistingUploads(modalSelector, urlsByField) {
  Object.entries(urlsByField).forEach(([field, url]) => {
    const input = document.querySelector(modalSelector + ' [data-field="' + field + '"]');
    if (!input || input.type !== 'file') return;
    let hint = input.nextElementSibling;
    if (!hint || !hint.classList || !hint.classList.contains('upload-existing-hint')) {
      hint = document.createElement('div');
      hint.className = 'upload-existing-hint';
      hint.style.cssText = 'font-size:11px;color:var(--color-text-tertiary);margin-top:4px;';
      input.insertAdjacentElement('afterend', hint);
    }
    if (isRealFileUrl(url)) {
      hint.innerHTML = '<i class="ti ti-circle-check" style="color:#059669;font-size:11px;" aria-hidden="true"></i> Already uploaded — pick a file only to replace it. <a href="javascript:void(0)" onclick="viewAccessoryPhoto(\'' + url.replace(/'/g, "\\'") + '\',\'File\')" style="color:#1d4ed8;text-decoration:underline;">View</a>';
      hint.style.display = '';
    } else {
      hint.style.display = 'none';
    }
  });
}

// ------------------------------------------------------------
// MASTER SEARCH WIDGET — generic searchable-but-strict-select input.
// HTML pattern (put this around any <input>):
//   <div class="partner-search-wrap">
//     <div class="ps-input-row" onclick="toggleMasterSearchDD('someId',event)">
//       <i class="ti ti-search"></i>
//       <input id="someId" data-field="..." data-masterlist="location"
//              placeholder="Search…" oninput="filterMasterSearchInput(this)"
//              onclick="openMasterSearch('someId');event.stopPropagation()" autocomplete="off" />
//       <i class="ti ti-chevron-down"></i>
//     </div>
//     <div class="ps-dropdown" id="msd_someId"><div class="ps-list" id="msl_someId"></div></div>
//   </div>
// data-masterlist can be any rewire_dropdown_options list_key, or the
// special value "crane_vendor" (reads allCraneVendors instead).
// The input's typed text only ever FILTERS the list — the field's real
// value is only ever set by clicking a suggestion (pickMasterSearchValue),
// so free-typed text that doesn't match anything simply won't validate
// at save time (see isValidMasterValue, called from each submit fn).
// ------------------------------------------------------------
function getMasterListValues(listKey) {
  // Send to Plant "To Location" (Oct 2026): Jaipur Plant + Jaipur's own
  // sub-locations (yards) + the From Location's sub-locations (local move).
  // Entries are "Location — Sub-Location" labels, parsed by parseLogisticsTo().
  if (listKey === 'logistics_to') {
    const fromEl = document.getElementById('logisticsFromLocation');
    const from = normalizeMasterValue('location', fromEl ? fromEl.value : '');
    const subsOf = loc => (dropdownOptionsCache.sub_location || []).filter(o => (o.parentValue || '').trim().toLowerCase() === (loc || '').trim().toLowerCase()).map(o => o.value);
    const out = ['Jaipur Plant'];
    subsOf('Jaipur').forEach(sv => out.push('Jaipur — ' + sv));
    if (from && from.toLowerCase() !== 'jaipur' && from.toLowerCase() !== 'jaipur plant') subsOf(from).forEach(sv => out.push(from + ' — ' + sv));
    return out;
  }
  if (listKey === 'crane_vendor') return allCraneVendors.map(v => v.vendor_name);
  if (listKey === 'transporter') return allTransporters.map(t => t.transporter_name);
  return (dropdownOptionsCache[listKey] || []).map(o => o.value);
}
function isValidMasterValue(listKey, value) {
  if (!value) return true;
  return getMasterListValues(listKey).some(v => v.toLowerCase() === value.trim().toLowerCase());
}

// Returns the master list's OWN casing for a value that matches
// case-insensitively (e.g. typed "ALWAR" -> master list's "Alwar"), or the
// trimmed input unchanged if nothing matches. isValidMasterValue() above
// only checks case-insensitively but every save site was still writing the
// user's raw typed casing straight to the DB — that's how "Alwar"/"ALWAR"/
// "alwar" all ended up live as separate values (Ramvir, Sept 2026, Location
// Tracking filter dropdown). Every isValidMasterValue() call that gates a
// save must run its value through this before writing, so only ONE casing
// per master value ever reaches the database again.
function normalizeMasterValue(listKey, value) {
  if (!value) return value;
  const trimmed = value.trim();
  const match = getMasterListValues(listKey).find(v => v.toLowerCase() === trimmed.toLowerCase());
  return match || trimmed;
}

// Sub-Location dependent dropdown (Ramvir, Sept 2026) — a plain <select>
// rather than the searchable Master Search widget above, since its list
// depends on which Location was picked first. Used by the Upload Delivery
// form (udVehicleSubParking) and Location Tracking's Update modal
// (locUpdateSubParking). Call whenever the Location field changes, and
// once more after data loads to restore a saved value.
function refreshSubLocationSelect(selectId, locationValue, currentSubValue) {
  const el = document.getElementById(selectId);
  if (!el) return;
  const loc = (locationValue || '').trim();
  // Case/whitespace-insensitive match (Ramvir, Sept 2026 fix) — this used
  // to be a strict === compare, which silently returned zero Sub-Location
  // options whenever the typed/stored Location differed from the master
  // list's exact casing (e.g. "delhi" typed by hand and blurred without
  // clicking a suggestion, vs the master list's "Delhi") — the location
  // field itself still accepted the value (isValidMasterValue's own check
  // is already case-insensitive), so the mismatch was invisible except for
  // the Sub-Location dropdown quietly showing only "— None —". Matches the
  // same case-insensitive convention isValidMasterValue() uses.
  const locLower = loc.toLowerCase();
  const opts = (dropdownOptionsCache.sub_location || []).filter(o => (o.parentValue || '').trim().toLowerCase() === locLower);
  el.innerHTML = '<option value="">— None —</option>' + opts.map(o => `<option value="${o.value.replace(/"/g, '&quot;')}">${o.value}</option>`).join('');
  el.disabled = !loc;
  if (currentSubValue) {
    const match = opts.find(o => o.value.trim().toLowerCase() === currentSubValue.trim().toLowerCase());
    if (match) el.value = match.value;
  }
}
// Positions a master-search dropdown at fixed (viewport) coordinates
// computed from its input's current on-screen position. Needed because
// some of these widgets render inside .crm-table, which sets
// overflow:hidden for its own rounded corners — that clips a plain
// position:absolute dropdown almost immediately (looks like it "flashes
// and hides"). position:fixed with JS-computed coordinates escapes any
// ancestor's overflow clipping entirely.
function positionMasterDropdown(id) {
  const input = document.getElementById(id);
  const dd = document.getElementById('msd_' + id);
  if (!input || !dd) return;
  const anchor = input.closest('.ps-input-row') || input;
  const rect = anchor.getBoundingClientRect();
  dd.style.position = 'fixed';
  dd.style.right = 'auto';
  dd.style.left = rect.left + 'px';
  dd.style.top = (rect.bottom + 3) + 'px';
  dd.style.width = rect.width + 'px';
}
function openMasterSearch(id) {
  const d = document.getElementById('msd_' + id);
  if (d) {
    // Populate the full list on click/arrow (Ramvir, Oct 2026) — used to
    // stay empty until something was typed.
    const input = document.getElementById(id);
    if (input) renderMasterSearchList(input, true);
    positionMasterDropdown(id); d.classList.add('open');
  }
}
function toggleMasterSearchDD(id, e) {
  e.stopPropagation();
  const d = document.getElementById('msd_' + id);
  if (!d) return;
  const nowOpen = !d.classList.contains('open');
  if (nowOpen) { const inp = document.getElementById(id); if (inp) renderMasterSearchList(inp, true); positionMasterDropdown(id); }
  d.classList.toggle('open', nowOpen);
}
// Open dropdowns are screen-anchored (position:fixed) rather than
// scrolling with their container, so close them on any scroll instead of
// letting them visually drift away from the input. Capture phase so this
// also catches scrolling inside nested scrollable containers (.table-area etc).
//
// Fix (Ramvir, Sept 2026 — Company/Dealership Name and "every searchable
// dropdown": couldn't scroll down the suggestion list, and a value below
// the fold couldn't be picked at all unless typed out in full). Root cause:
// the dropdown's OWN result list (.ps-list) is itself a scrollable region
// when it has more items than fit — scrolling inside it fires a 'scroll'
// event whose target is that list, and since this listener runs in the
// capture phase it still sees that event on its way down to the target
// even though 'scroll' doesn't bubble, closing the dropdown on literally
// the first scroll tick inside its own list. That's why it only ever felt
// selectable when narrowing the filter (by typing enough characters) shrank
// the list to fit without needing to scroll at all. Skipping any scroll
// whose target is INSIDE an already-open dropdown fixes both — the
// close-on-page-scroll behavior this was written for (scrolling the
// modal/table body behind it) is untouched, since that scroll target is
// never inside the dropdown itself.
document.addEventListener('scroll', function (e) {
  document.querySelectorAll('.ps-dropdown.open[id^="msd_"]').forEach(d => {
    if (d.contains(e.target)) return;
    d.classList.remove('open');
  });
}, true);
function filterMasterSearchInput(inputEl) {
  const id = inputEl.id;
  const d = document.getElementById('msd_' + id);
  if (d) { positionMasterDropdown(id); d.classList.add('open'); }
  renderMasterSearchList(inputEl, false);
}
function renderMasterSearchList(inputEl, showAll) {
  const id = inputEl.id;
  const listKey = inputEl.dataset.masterlist;
  let items = getMasterListValues(listKey);
  // Optional data-exclude="Value One|Value Two" on the <input> itself —
  // hides specific master-list values from just THIS field's dropdown
  // without touching the shared master list (other fields using the same
  // listKey still see the full list). Used for Location Tracking's
  // Update Location field: "Jaipur Plant" is reached only via Logistics'
  // own "Send to Plant" flow (which also flips logistics_status, the real
  // gate Vehicle Disposal/Received at Plant key off) — picking it here
  // instead would fake that transition without it, silently misrouting
  // the vehicle into Vehicle Disposal.
  if (inputEl.dataset.exclude) {
    const excluded = inputEl.dataset.exclude.split('|');
    items = items.filter(v => !excluded.includes(v));
  }
  const q = showAll ? '' : inputEl.value.toLowerCase().trim();
  const filtered = q ? items.filter(v => v.toLowerCase().includes(q)) : items;
  const el = document.getElementById('msl_' + id);
  if (!el) return;
  el.innerHTML = filtered.length
    ? filtered.map(v => `<div class="ps-item" onclick="pickMasterSearchValue('${id}','${v.replace(/'/g, "\\'")}')">
        <div class="ps-item-avatar">${v.charAt(0).toUpperCase()}</div>
        <div><div class="ps-item-name">${v}</div></div>
      </div>`).join('')
    : '<div class="ps-item" style="color:var(--color-text-tertiary);font-size:12px;">No match — ask Admin to add it in Master Data</div>';
}
function pickMasterSearchValue(id, value) {
  const input = document.getElementById(id);
  if (input) input.value = value;
  const d = document.getElementById('msd_' + id);
  if (d) d.classList.remove('open');
  // Vehicle Send to = "Logistic Carrier" is the one value that means an
  // actual paid transporter is arranging the move — every other Vehicle
  // Dropping Person value means someone's self-carrying/self-driving it,
  // so the Transporter block only makes sense for that one case.
  if (id === 'logisticsVehicleSendTo' && typeof handleLogisticsVehicleSendTo === 'function') handleLogisticsVehicleSendTo(value);
  // Picking a Location refreshes its paired Sub-Location <select> — see
  // refreshSubLocationSelect() above. Upload Delivery and Location
  // Tracking's Update modal are the two places Location is actually set.
  if (id === 'udVehicleParking') refreshSubLocationSelect('udVehicleSubParking', value);
  if (id === 'locUpdateValue') refreshSubLocationSelect('locUpdateSubValue', value);
  // Price Negotiation's Location field (Modals-Pipeline.html) has the
  // exact same paired Sub-Location <select> as Upload Delivery/Location
  // Tracking, but was missing here — clicking a Location suggestion left
  // pnVehicleSubParking stuck on "— None —" even for a Location (e.g.
  // Udaipur) with 20+ real Sub-Locations configured. The field's onblur
  // handler alone wasn't reliably covering the click-a-suggestion path.
  if (id === 'pnVehicleParking') refreshSubLocationSelect('pnVehicleSubParking', value);
  if (id === 'plantReceiveLocation') refreshSubLocationSelect('plantReceiveSubLocation', value);
  if (id === 'logisticsFromLocation') { const t = document.getElementById('logisticsToLocation'); if (t) t.value = ''; }
}

// Logistics "Send to Plant" popup — shows/hides the Transporter block
// (Transporter/Vehicle No/Dispatch Date/Freight Amount) based on what was
// picked for "Vehicle Send to". Only "Logistic Carrier" needs those —
// any other named Vehicle Dropping Person is self-carrying the vehicle,
// nothing to ask. Called on pick (pickMasterSearchValue above) and on
// blur (in case someone typed the exact value without clicking a
// suggestion) — see logisticsSendModal, Modals-General.html.
function handleLogisticsVehicleSendTo(value) {
  const m = (value || '').trim();
  const vis = {
    logisticsTransporterField: m === 'Logistic Carrier',
    logisticsCraneField: m === 'Crane',
    logisticsDriverField: m === 'Driver',
    logisticsDriverPhoneField: m === 'Driver',
    logisticsFromLocationField: !!m,
    logisticsToLocationField: !!m,
    logisticsVehicleNoField: ['Logistic Carrier', 'Towing'].includes(m),
    logisticsDispatchDateField: !!m,
    logisticsOtherDetailsField: ['Logistic Carrier', 'Towing'].includes(m),
    logisticsCraneRatesField: m === 'Crane',
  };
  Object.keys(vis).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = vis[id] ? '' : 'none';
  });
  if (m === 'Driver') {
    const dl = document.getElementById('logisticsDriverList');
    if (dl) dl.innerHTML = getMasterListValues('vehicle_dropping_person').filter(x => /^driver/i.test(x)).map(x => '<option value="' + x.replace(/^driver[\s\-:]*/i, '').replace(/"/g, '&quot;') + '">').join('');
  }
  if (m === 'Crane' && typeof renderLogisticsCraneRates === 'function') renderLogisticsCraneRates();
}
document.addEventListener('click', function (e) {
  document.querySelectorAll('.ps-dropdown[id^="msd_"]').forEach(d => {
    if (d.parentElement && !d.parentElement.contains(e.target)) d.classList.remove('open');
  });

// Compact HTML-string version of the same widget, for use inside
// dynamically-built table rows (e.g. Crane Charges) where each row
// needs its own uniquely-id'd instance. `width` is a CSS width string.

// ------------------------------------------------------------
// NOTIFY — SweetAlert2 wrapper used everywhere instead of notify()
// ------------------------------------------------------------
function notify(message, opts) {
  opts = opts || {};
  const isError = /error|failed|fail/i.test(message);
  Swal.fire({
    icon: opts.icon || (isError ? 'error' : 'success'),
    title: opts.title || (isError ? 'Something went wrong' : 'Done'),
    text: message,
    confirmButtonColor: '#1d4ed8',
    timer: opts.icon === 'error' || isError ? undefined : 2200,
    timerProgressBar: !isError,
  });
}
function toProperCase(str) {
  if (!str) return str;
  return str.replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.substr(1).toLowerCase());
}

function confirmDialog(message) {
  return Swal.fire({
    icon: 'question',
    title: 'Are you sure?',
    text: message,
    showCancelButton: true,
    confirmButtonColor: '#1d4ed8',
    cancelButtonColor: '#94a3b8',
    confirmButtonText: 'Yes',
  }).then(r => r.isConfirmed);
}

// Single-text-field prompt, SweetAlert-styled to match confirmDialog rather
// than falling back to the browser's plain window.prompt(). Returns the
// trimmed new value, or null if cancelled/left blank/unchanged.
function promptDialog(title, defaultValue) {
  return Swal.fire({
    title: title,
    input: 'text',
    inputValue: defaultValue || '',
    showCancelButton: true,
    confirmButtonColor: '#1d4ed8',
    cancelButtonColor: '#94a3b8',
    confirmButtonText: 'Save',
  }).then(r => (r.isConfirmed && r.value ? r.value.trim() : null));
}

// Generic "Mark Lost" usable from any stage form — prompts for a reason,
// records which stage the lead was lost at, then closes the lead out.
async function markLeadLost(stageName) {
  if (!activeLeadId) { notify('No lead selected', { icon: 'error' }); return; }
  const { value: reason } = await Swal.fire({
    icon: 'warning',
    title: `Mark lost at ${stageName}?`,
    input: 'text',
    inputPlaceholder: 'Reason for losing this lead…',
    showCancelButton: true,
    confirmButtonText: 'Mark Lost',
    confirmButtonColor: '#dc2626',
    inputValidator: (v) => !v || !v.trim() ? 'A reason is required' : undefined,
  });
  const trimmedReason = (reason || '').trim();
  if (!trimmedReason) return;

  const { error } = await sb.from('rewire_master_data').update({
    overall_status: 'Closed Lost',
    lead_status: 'Closed Lost with Reason',
    lost_at_stage: stageName,
    lost_reason: trimmedReason,
    last_updated_by: currentProfile.id,
  }).eq('id', activeLeadId);
  if (error) { notify('Error marking lost: ' + error.message, { icon: 'error' }); return; }

  notify(`Lead marked Lost at ${stageName}.`);
  document.querySelectorAll('.modal-backdrop').forEach(m => m.style.display = 'none');
  await refreshLeadsTable();
}
